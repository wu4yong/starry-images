<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGCHAIN 1.x · 内置中间件</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="108" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">官方预置件，按「怕什么」分成四组</text><rect x="56" y="150" width="276" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="150" width="4" height="300" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="78" y="186" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">怕崩</text><text x="78" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· Tool error</text><text x="78" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· Tool retry</text><text x="78" y="284" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· Model retry</text><text x="78" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· Model fallback</text><text x="78" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· Model refusal</text><rect x="352" y="150" width="276" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="352" y="150" width="4" height="300" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="374" y="186" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#4a9dff" font-weight="600" text-anchor="start" letter-spacing="0">怕撑爆上下文</text><text x="374" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· Summarization</text><text x="374" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· LLM tool selector</text><text x="374" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">只压文本，不压图片/音视频</text><rect x="648" y="150" width="276" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="150" width="4" height="300" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="670" y="186" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">怕出事</text><text x="670" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· Human-in-the-loop</text><text x="670" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· PII detection</text><text x="670" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">HITL 需要 checkpointer</text><rect x="944" y="150" width="276" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="944" y="150" width="4" height="300" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="966" y="186" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">怕花钱</text><text x="966" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· Model call limit</text><text x="966" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· Tool call limit</text><text x="966" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">命中即中止，不是自动继续</text><rect x="56" y="480" width="1168" height="110" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="480" width="4" height="110" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="80" y="514" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">三件最常装的参数</text><text x="80" y="542" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">SummarizationMiddleware(model=..., trigger=("tokens", 4000), keep=("messages", 20))</text><text x="80" y="568" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">HumanInTheLoopMiddleware(interrupt_on={"send_email": True})   # 键是工具名，配 checkpointer</text><rect x="56" y="606" width="1168" height="54" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="606" width="4" height="54" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="80" y="638" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">PII 策略：block / redact / mask / hash；默认只处理输入，输出与工具结果要显式开</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Prebuilt middleware 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC09 · BUILT-IN</text></svg>