"0">langchain-openai</text><text x="424" y="194" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">provider="openai" → api.openai.com</text><rect x="400" y="240" width="300" height="86" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="400" y="240" width="4" height="86" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="424" y="272" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">langchain-deepseek</text><text x="424" y="298" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">provider="deepseek" → api.deepseek.com</text><path d="M362 210 L392 180 M385 177 L392 180 L389 173" stroke="#4a9dff" stroke-width="2" fill="none"/><path d="M362 254 L392 284 M385 281 L392 284 L389 277" stroke="#b388ff" stroke-width="2" fill="none"/><rect x="740" y="136" width="324" height="190" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="740" y="136" width="4" height="190" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="764" y="168" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">交回来的都一样</text><text x="764" y="200" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· invoke / stream / batch</text><text x="764" y="227" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· bind_tools / with_structured_output</text><text x="764" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· content_blocks 结构一致</text><text x="764" y="281" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· usage_metadata 都有</text><text x="764" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">官方：换 provider 不重写业务逻辑</text><rect x="56" y="352" width="1008" height="112" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="352" width="4" height="112" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="80" y="384" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">真正要改的只有三处</text><text x="80" y="414" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">① 包</text><text x="80" y="436" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">langchain[openai]</text><text x="80" y="454" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">→ langchain-deepseek</text><text x="416" y="414" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">② 凭证</text><text x="416" y="436" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">OPENAI_API_KEY</text><text x="416" y="454" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">→ DEEPSEEK_API_KEY</text><text x="752" y="414" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">③ 两个字符串</text><text x="752" y="436" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">gpt-5-nano / openai</text><text x="752" y="454" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">→ deepseek-chat / deepseek</text><rect x="56" y="484" width="1008" height="58" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="484" width="4" height="58" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="80" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">边界：deepseek-reasoner 不支持工具调用与结构化输出；DeepSeek 不吃图像输入（官方集成页能力表）</text><text x="80" y="532" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">做 Agent / 结构化输出 / RAG 一律用 deepseek-chat</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Models 与 ChatDeepSeek 集成页自绘</text><text x="1064" y="598" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC02 · PROVIDER</text></svg>