<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1120" height="620" fill="url(#g1)"/><rect width="1120" height="620" fill="url(#grid)"/>
<rect width="1120" height="620" fill="url(#glow)"/><rect width="1120" height="620" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGCHAIN 1.x · 两种取结果方式</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="104" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">invoke 与 stream 的终点是同一条 AIMessage</text><rect x="56" y="150" width="460" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="150" width="4" height="96" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="80" y="186" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">invoke</text><text x="80" y="212" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">攒完再给：一次返回 AIMessage</text><rect x="56" y="274" width="460" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="274" width="4" height="96" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="310" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">stream</text><text x="80" y="336" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">给一块算一块：逐块返回 AIMessageChunk</text><path d="M524 198 L584 198 M578 193 L584 198 L578 203" stroke="#ffc861" stroke-width="2" fill="none"/><path d="M524 322 L584 322 M578 317 L584 322 L578 327" stroke="#3ddcff" stroke-width="2" fill="none"/><rect x="604" y="150" width="460" height="220" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="604" y="150" width="4" height="220" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="628" y="186" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">accumulate</text><text x="628" y="216" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">acc = chunk if acc is None else acc + chunk</text><text x="628" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">chunk1 + chunk2 + … = 同一条 AIMessage</text><text x="628" y="286" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">差别只在「你什么时候能看到」</text><text x="628" y="320" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">块没有完整 usage_metadata，末尾块才带</text><rect x="56" y="392" width="1008" height="124" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="392" width="4" height="124" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="80" y="424" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">三种流的边界</text><text x="80" y="452" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 模型层：只有 token 级 chunk，不区分「步骤」</text><text x="80" y="476" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· Agent 层：updates 给步骤、messages 给 token、custom 给你自己写的进度</text><text x="80" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· tool call：tool_call_chunk 是增量 JSON，解析完的调用要从 updates 拿</text><rect x="56" y="526" width="1008" height="44" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="526" width="4" height="44" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="80" y="554" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">实践顺序</text><text x="170" y="554" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">先用 invoke 确认逻辑，再换 stream 做交互 —— 流式不改变结果。</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Models / Streaming 自绘</text><text x="1064" y="598" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC04 · INVOKE VS STREAM</text></svg>