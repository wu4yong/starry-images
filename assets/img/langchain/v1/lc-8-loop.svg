<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="108" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">create_agent = 装好的图：model 与 tools 互调，直到没有 tool_call</text><rect x="420" y="140" width="440" height="110" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="420" y="140" width="4" height="110" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="444" y="176" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">request</text><text x="444" y="204" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">{"messages": [...]} + config(thread_id) + context</text><path d="M640 252 L640 286 M635 280 L640 286 L645 280" stroke="#ffc861" stroke-width="2" fill="none"/><rect x="420" y="290" width="440" height="110" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="420" y="290" width="4" height="110" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="444" y="326" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">model 节点</text><text x="444" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">输入 messages → 输出 AIMessage</text><text x="444" y="378" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">看 tool_calls 是否为空</text><path d="M640 402 L640 432 M635 426 L640 432 L645 426" stroke="#3ddcff" stroke-width="2" fill="none"/><rect x="420" y="436" width="440" height="110" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="420" y="436" width="4" height="110" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="444" y="472" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">tools 节点</text><text x="444" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">按每个 tool_call 执行 → ToolMessage</text><text x="444" y="524" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">带 tool_call_id 追加进 messages</text><path d="M416 372 C 300 372, 300 520, 416 492" fill="none" stroke="#3ee6a2" stroke-width="2"/><text x="300" y="440" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="middle" letter-spacing="0">有 tool_call</text><path d="M864 520 C 980 520, 980 372, 864 372" fill="none" stroke="#3ddcff" stroke-width="2"/><text x="980" y="452" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ddcff" font-weight="400" text-anchor="middle" letter-spacing="0">回灌后再问</text><text x="890" y="350" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0">无 tool_call → 结束</text><rect x="56" y="560" width="1168" height="66" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="560" width="4" height="66" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="80" y="596" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">记忆</text><text x="140" y="596" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">checkpointer + 稳定 thread_id = 多轮；context_schema + context = 不可伪造的身份；state_schema = 自定义字段</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Agents 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC08 · LOOP</text></svg>