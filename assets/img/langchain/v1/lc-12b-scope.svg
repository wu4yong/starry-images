<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="104" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">三个键决定「记谁的、记多久、记什么」</text><rect x="56" y="132" width="1008" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="132" width="4" height="96" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="168" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">thread_id</text><text x="80" y="196" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">configurable 里的会话主键</text><text x="80" y="218" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">换 id = 换一段对话</text><text x="600" y="188" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">短期记忆靠它隔离</text><rect x="56" y="244" width="1008" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="244" width="4" height="96" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="80" y="280" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">namespace</text><text x="80" y="308" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">store 的「目录」，元组</text><text x="80" y="330" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">常放 user_id / org_id</text><text x="600" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">决定这份记忆属于谁</text><rect x="56" y="356" width="1008" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="356" width="4" height="96" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="80" y="392" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">key</text><text x="80" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">store 的「文件名」</text><text x="80" y="442" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">如 "u_001"、"prefs"</text><text x="600" y="412" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">同名 put 是覆盖语义</text><rect x="56" y="466" width="1008" height="76" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="466" width="4" height="76" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="80" y="498" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">一个判据</text><text x="180" y="498" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">换个 thread_id 还能查到 → 那是 store；查不到 → 那是 checkpointer。</text><text x="180" y="524" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">多租户至少两级 namespace：(org_id, user_id) 与 (org_id, "shared")。</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Long-term memory 自绘</text><text x="1064" y="598" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC12 · SCOPE</text></svg>