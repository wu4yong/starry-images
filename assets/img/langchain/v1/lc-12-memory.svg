<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGCHAIN 1.x · 两层记忆</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="108" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">两层记忆：thread 内 vs 跨 thread</text><rect x="56" y="146" width="560" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="146" width="4" height="300" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="182" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">短期记忆 · checkpointer</text><text x="80" y="210" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">scope：单个 thread（一段会话）</text><line x1="80" y1="226" x2="592" y2="226" stroke="rgba(120,170,255,0.22)"/><text x="80" y="256" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">InMemorySaver()   # 开发用</text><text x="80" y="284" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">PostgresSaver.from_conn_string(uri)</text><text x="80" y="312" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">config={"configurable":{"thread_id":"1"}}</text><text x="80" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 存整份图状态（含 messages）</text><text x="80" y="374" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 步骤开始时读、完成时写</text><text x="80" y="400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· state_schema 可加自定义字段</text><text x="80" y="426" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0">· 能被裁剪与摘要改写</text><rect x="664" y="146" width="560" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="664" y="146" width="4" height="300" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="688" y="182" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">长期记忆 · store</text><text x="688" y="210" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">scope：跨 thread / 跨会话</text><line x1="688" y1="226" x2="1200" y2="226" stroke="rgba(120,170,255,0.22)"/><text x="688" y="256" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">InMemoryStore()  →  PostgresStore(uri)</text><text x="688" y="284" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">store.put(("users",), "u_001", {...})</text><text x="688" y="312" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">store.get(namespace, key) → StoreValue</text><text x="688" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 数据是 namespace + key 的 JSON 文档</text><text x="688" y="374" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· namespace 常带 user_id / org_id</text><text x="688" y="400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· search 支持 filter + 向量相似</text><text x="688" y="426" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">· 中间件裁剪动不到它</text><rect x="56" y="470" width="1168" height="84" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="470" width="4" height="84" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="80" y="502" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">工具的读写入口</text><text x="80" y="530" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">def f(runtime: ToolRuntime[Context])  →  runtime.store.get / put / search，且 create_agent(store=store) 必须传</text><rect x="56" y="570" width="1168" height="40" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="570" width="4" height="40" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="80" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">生产替换：InMemorySaver / InMemoryStore 只用于开发，进程重启即失。</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Short-term / Long-term memory 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC12 · MEMORY</text></svg>