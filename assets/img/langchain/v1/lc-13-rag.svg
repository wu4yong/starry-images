<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGCHAIN 1.x · 检索链</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="108" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">五段链路，每段都能换</text><rect x="56" y="150" width="200" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#8ba3c7" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="150" width="4" height="132" rx="2" fill="#8ba3c7" fill-opacity="0.85"/><text x="76" y="184" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="600" text-anchor="start" letter-spacing="0">1. 来源</text><text x="76" y="216" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">PDF / MD / 网页</text><text x="76" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">SQL / CRM / IM</text><path d="M260 216 L288 216 M282 211 L288 216 L282 221" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="296" y="150" width="200" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="296" y="150" width="4" height="132" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="316" y="184" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">2. 加载</text><text x="316" y="216" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Document</text><text x="316" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">page_content + metadata</text><path d="M500 216 L528 216 M522 211 L528 216 L522 221" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="536" y="150" width="200" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="536" y="150" width="4" height="132" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="556" y="184" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#4a9dff" font-weight="600" text-anchor="start" letter-spacing="0">3. 切分</text><text x="556" y="216" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">RecursiveCharacter</text><text x="556" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">chunk 1000 / overlap 200</text><path d="M740 216 L768 216 M762 211 L768 216 L762 221" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="776" y="150" width="200" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="776" y="150" width="4" height="132" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="796" y="184" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">4. 向量化</text><text x="796" y="216" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Embeddings</text><text x="796" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">text-embedding-3-small</text><path d="M980 216 L1008 216 M1002 211 L1008 216 L1002 221" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="1016" y="150" width="200" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="1016" y="150" width="4" height="132" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="1036" y="184" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">5. 向量库</text><text x="1036" y="216" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">InMemory / Chroma</text><text x="1036" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">Qdrant / PGVector</text><rect x="56" y="306" width="1008" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="306" width="4" height="96" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="80" y="340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">查询侧</text><text x="80" y="368" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Problem → query embedding → similarity_search(k=3) → as_retriever(search_type=...) → 交给 LLM</text><text x="80" y="392" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">三种 search_type：similarity（默认）/ mmr（去重保多样）/ similarity_score_threshold（按分过滤）</text><rect x="56" y="420" width="570" height="210" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="420" width="4" height="210" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="80" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">有出处靠 metadata</text><text x="80" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· source：文件名或 URL</text><text x="80" y="514" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· page：PDF 页码</text><text x="80" y="542" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· start_index：字符偏移</text><text x="80" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· 工具返回里带上这三项</text><text x="80" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">→ 用户能核对，模型不敢脱离片段作答</text><rect x="654" y="420" width="570" height="210" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="654" y="420" width="4" height="210" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="678" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">三条架构怎么选</text><text x="678" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 2-Step：可控、延迟可预期 → FAQ</text><text x="678" y="514" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· Agentic：按需检索、多源 → 调研</text><text x="678" y="542" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· Hybrid：改写 + 校验 + 重试</text><text x="678" y="574" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0">官方：各 provider 分数语义不同，别跨库比阈值</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Retrieval / Semantic search 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC13 · RAG</text></svg>