ang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 护栏（HITL / PII）</text><text x="872" y="308" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 日志与限流</text><rect x="56" y="420" width="1168" height="130" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="420" width="4" height="130" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="80" y="454" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#4a9dff" font-weight="600" text-anchor="start" letter-spacing="0">三个数据源：越靠里越「活」，越靠外越「稳」</text><text x="80" y="486" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">Runtime Context</text><text x="80" y="510" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">会话级 · 静态配置</text><text x="80" y="534" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">user_id / 权限 / 环境 / 密钥</text><text x="460" y="486" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">State</text><text x="460" y="510" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">会话级 · 短期记忆</text><text x="460" y="534" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">消息、上传文件、工具结果</text><text x="840" y="486" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcf