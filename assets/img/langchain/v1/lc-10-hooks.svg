<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGCHAIN 1.x · 六个钩子</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="108" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">六个钩子：四进四出，两次包裹</text><rect x="56" y="140" width="260" height="90" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="140" width="4" height="90" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="78" y="174" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">before_agent</text><text x="78" y="202" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">每次调用一次</text><rect x="56" y="250" width="260" height="90" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="250" width="4" height="90" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="78" y="284" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">before_model</text><text x="78" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">每次模型调用前</text><rect x="56" y="360" width="260" height="90" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="360" width="4" height="90" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="78" y="394" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">after_model</text><text x="78" y="422" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">每次模型响应后</text><rect x="56" y="470" width="260" height="90" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="470" width="4" height="90" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="78" y="504" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">after_agent</text><text x="78" y="532" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">每次调用结束一次</text><path d="M186 230 L186 248 M181 242 L186 248 L191 242" stroke="#ffc861" stroke-width="2" fill="none"/><path d="M186 340 L186 358 M181 352 L186 358 L191 352" stroke="#3ddcff" stroke-width="2" fill="none"/><path d="M186 450 L186 468 M181 462 L186 468 L191 462" stroke="#3ee6a2" stroke-width="2" fill="none"/><rect x="392" y="150" width="420" height="200" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="392" y="150" width="4" height="200" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="416" y="186" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#4a9dff" font-weight="600" text-anchor="start" letter-spacing="0">wrap_model_call</text><text x="416" y="214" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">(request, handler) → 调几次你定</text><text x="416" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">重试 · 缓存 · request.override 改提示</text><text x="416" y="270" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">零次 = 短路；多次 = 重试</text><text x="416" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0">要改状态：ExtendedModelResponse + Command</text><rect x="392" y="372" width="420" height="200" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="392" y="372" width="4" height="200" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="416" y="408" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">wrap_tool_call</text><text x="416" y="436" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">(request, handler) → ToolMessage</text><text x="416" y="464" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">异常兜底 · 参数清洗 · 工具重试</text><text x="416" y="492" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">要改状态：直接返回 Command</text><rect x="868" y="150" width="356" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="868" y="150" width="4" height="300" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="892" y="186" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ff6b8a" font-weight="600" text-anchor="start" letter-spacing="0">执行顺序</text><text x="892" y="218" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">before_*：正序</text><text x="892" y="246" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">after_*：逆序</text><text x="892" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">wrap_*：嵌套（第一个包住所有）</text><line x1="892" y1="296" x2="1200" y2="296" stroke="rgba(120,170,255,0.22)"/><text x="892" y="324" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">jump_to 目标</text><text x="892" y="350" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">end / tools / model</text><text x="892" y="378" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">必须先声明 can_jump_to</text><text x="892" y="406" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">快捷修饰符：@dynamic_prompt</text><rect x="868" y="470" width="356" height="90" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="868" y="470" width="4" height="90" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="892" y="502" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">记法</text><text x="892" y="530" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">进时排队进，出时倒着出</text><rect x="56" y="590" width="1168" height="60" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="590" width="4" height="60" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="624" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">node 型返回 dict 即改状态；wrap 型改状态绕，能不用就不用 —— 判断依据是「要不要控制 handler 调几次」。</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Custom middleware 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC10 · HOOKS</text></svg>