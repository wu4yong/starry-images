<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGCHAIN 1.x · 工具协议</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="108" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">工具的三层：函数 → schema → 运行时注入</text><rect x="56" y="140" width="640" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="140" width="4" height="150" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="80" y="176" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">@tool 装饰的函数</text><text x="80" y="206" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">def get_order(order_id: str, with_logistics: bool = False) -&gt; str</text><text x="80" y="232" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">"""查询订单状态。 Args: order_id / with_logistics"""</text><text x="80" y="260" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">类型标注必需；docstring 就是给模型看的描述</text><rect x="736" y="140" width="488" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="736" y="140" width="4" height="150" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="760" y="176" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">模型看到的 schema</text><rect x="760" y="196" width="286" height="26" rx="13" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="771" y="212" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">name: get_order_status</text><rect x="760" y="226" width="214" height="26" rx="13" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="771" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">order_id: string</text><rect x="760" y="256" width="394" height="26" rx="13" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="771" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">with_logistics: bool (默认 false)</text><path d="M704 215 L732 215 M726 210 L732 215 L726 220" stroke="#3ee6a2" stroke-width="2" fill="none"/><rect x="56" y="320" width="1168" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="320" width="4" height="150" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="80" y="356" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">args_schema：复杂入参才需要</text><text x="80" y="386" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Pydantic：Literal 枚举、Field(ge/le) 范围、description 字段说明</text><text x="80" y="412" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">JSON Schema：字典形式，需顶层 title / description</text><text x="80" y="440" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">判断线：字段少类型简单 → 签名；有枚举范围说明 → args_schema</text><rect x="56" y="494" width="1168" height="108" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="494" width="4" height="108" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="80" y="530" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">ToolRuntime：模型看不见的注入参数</text><text x="80" y="558" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">state（消息历史）· context（调用时传入的身份）· store（跨会话）· stream writer · execution info · tool_call_id</text><text x="80" y="584" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">官方：该参数不进发给模型的 schema；要改状态返回 Command，update 里必须带 ToolMessage</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Tools 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC05 · TOOL</text></svg>