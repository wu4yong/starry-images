<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="104" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">同一个模型对象，三种调用方式</text><rect x="392" y="140" width="336" height="76" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="392" y="140" width="4" height="76" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="560" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="middle" letter-spacing="0">model（BaseChatModel 实例）</text><text x="560" y="196" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">init_chat_model(...) 的返回值</text><rect x="56" y="268" width="336" height="160" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="268" width="4" height="160" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="80" y="302" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#4a9dff" font-weight="600" text-anchor="start" letter-spacing="0">invoke</text><text x="368" y="302" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">本文用这个</text><text x="80" y="336" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 一次输入，一次完整回复</text><text x="80" y="362" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 返回 AIMessage</text><text x="80" y="388" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 最简单的同步调用</text><path d="M560 216 L560 242 L224 242 L224 262" stroke="#4a9dff" stroke-width="1.6" fill="none" opacity="0.8"/><rect x="392" y="268" width="336" height="160" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="392" y="268" width="4" height="160" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="416" y="302" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">stream</text><text x="704" y="302" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC04 细讲</text><text x="416" y="336" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 边生成边返回</text><text x="416" y="362" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 每次产 AIMessageChunk</text><text x="416" y="388" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 可累加成完整消息</text><path d="M560 216 L560 242 L560 242 L560 262" stroke="#3ee6a2" stroke-width="1.6" fill="none" opacity="0.8"/><rect x="728" y="268" width="336" height="160" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="728" y="268" width="4" height="160" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="752" y="302" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">batch</text><text x="1040" y="302" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">批量任务</text><text x="752" y="336" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 多个请求打包并发</text><text x="752" y="362" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 比自己 for 循环高效</text><text x="752" y="388" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 输入是列表</text><path d="M560 216 L560 242 L896 242 L896 262" stroke="#b388ff" stroke-width="1.6" fill="none" opacity="0.8"/><rect x="56" y="456" width="1008" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="456" width="4" height="92" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="80" y="488" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">为什么必须区分</text><text x="80" y="516" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">invoke 适合「要结果」；stream 适合「要打字机效果」；batch 适合「一次跑几十条」。三者共用同一模型与同一套消息结构。</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 Models 页 Key methods 自绘</text><text x="1064" y="598" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC02 · INVOKE</text></svg>