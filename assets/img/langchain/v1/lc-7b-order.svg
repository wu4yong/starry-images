<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="104" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">异常沿栈上走：谁先接住，谁定规则</text><rect x="56" y="150" width="480" height="90" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="150" width="4" height="90" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="184" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">模型</text><text x="80" y="212" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">model 节点，产生 tool_calls</text><rect x="576" y="150" width="480" height="90" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="576" y="150" width="4" height="90" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="600" y="184" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#4a9dff" font-weight="600" text-anchor="start" letter-spacing="0">wrap_model_call</text><text x="600" y="212" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">包住整次模型调用：重试 / 降级 / 改提示</text><rect x="56" y="260" width="480" height="90" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="260" width="4" height="90" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="80" y="294" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">tools 节点</text><text x="80" y="322" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">执行 handler(request)，异常从这里冒出</text><rect x="576" y="260" width="480" height="90" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="576" y="260" width="4" height="90" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="600" y="294" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">wrap_tool_call</text><text x="600" y="322" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">包住单次工具：catch → ToolMessage 回灌</text><rect x="56" y="370" width="480" height="90" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="370" width="4" height="90" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="80" y="404" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">handle_errors</text><text x="80" y="432" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">只在校验结构化输出时介入</text><rect x="56" y="480" width="1008" height="90" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="480" width="4" height="90" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="80" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" fill="#ff6b8a" font-weight="600" text-anchor="start" letter-spacing="0">执行顺序（官方）</text><text x="80" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">before_* 正序 → wrap_* 嵌套（第一个包住所有）→ after_* 逆序</text><text x="80" y="562" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">所以「清洗参数」的中间件要排在「重试」外层，否则重试会带着脏参数反复打</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Custom middleware 自绘</text><text x="1064" y="598" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC07 · ORDER</text></svg>