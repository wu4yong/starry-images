etter-spacing="0">04 流式输出</text><text x="341" y="313" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">›</text><rect x="351" y="138" width="275" height="350" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="351" y="138" width="4" height="350" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="375" y="180" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#4a9dff" font-weight="600" text-anchor="start" letter-spacing="0">M2 工具与结构化输出</text><text x="602" y="180" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">3 讲</text><line x1="375" y1="200" x2="602" y2="200" stroke="rgba(120,170,255,0.22)"/><circle cx="381" cy="234" r="4" fill="#4a9dff" fill-opacity="0.85"/><text x="395" y="239" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">05 工具定义与调用协议</text><circle cx="381" cy="288" r="4" fill="#4a9dff" fill-opacity="0.85"/><text x="395" y="293" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">06 结构化输出</text><circle cx="381" cy="342" r="4" fill="#4a9dff" fill-opacity="0.85"/><text x="395" y="347" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">07 工具失败处理</text><text x="636" y="313" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">›</text><rect x="646" y="138" width="275" height="350" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="646" y="138" width="4" height="350" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="670" y="180" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">M3 Agent 与中间件</text><text x="897" y="180" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">3 讲</text><line x1="670" y1="200" x2="897" y2="200" stroke="rgba(120,170,255,0.22)"/><circle cx="676" cy="234" r="4" fill="#3ee6a2" fill-opacity="0.85"/><text x="690" y="239" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">08 create_agent 循环</text><circle cx="676" cy="288" r="4" fill="#3ee6a2" fill-opacity="0.85"/><text x="690" y="293" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">09 内置中间件</text><circle cx="676" cy="342" r="4" fill="#3ee6a2" fill-opacity="0.85"/><text x="690" y="347" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">10 自定义中间件</text><text x="931" y="313" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">›</text><rect x="941" y="138" width="275" height="350" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="941" y="138" width="4" height="350" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="965" y="180" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">M4 上下文、记忆与检索</text><text x="1192" y="180" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">4 讲</text><line x1="965" y1="200" x2="1192" y2="200" stroke="rgba(120,170,255,0.22)"/><circle cx="971" cy="234" r="4" fill="#b388ff" fill-opacity="0.85"/><text x="985" y="239" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">11 上下文工程</text><circle cx="971" cy="288" r="4" fill="#b388ff" fill-opacity="0.85"/><text x="985" y="293" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">12 短期与长期记忆</text><circle cx="971" cy="342" r="4" fill="#b388ff" fill-opacity="0.85"/><text x="985" y="347" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">13 RAG 检索增强</text><circle cx="971" cy="396" r="4" fill="#b388ff" fill-opacity="0.85"/><text x="985" y="401" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">14 文档问答 Agent 实战</text><rect x="56" y="552" width="1168" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="552" width="4" height="92" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="84" y="588" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">读法</text><text x="140" y="588" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">先让每讲的六步代码跑通，再回头读原理；参数表的「v1 变化」列用来排雷，不背 API。</text><text x="84" y="618" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">边界</text><text x="140" y="618" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">LangGraph 图机制、LangSmith 评测只做一句话引入，深入内容属于独立系列。</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com（LangChain v1）自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC · SERIES MAP</text></svg>