e-opacity="0.45"/><text x="531" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">messages</text><rect x="668" y="288" width="92" height="28" rx="14" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="679" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">tools</text><rect x="774" y="288" width="176" height="28" rx="14" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="785" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">chat_models</text><rect x="964" y="288" width="162" height="28" rx="14" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="975" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">embeddings</text><text x="400" y="350" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">create_agent ｜ 消息与 content_blocks ｜ @tool ｜ init_chat_model ｜ init_embeddings</text><rect x="56" y="396" width="812" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="396" width="4" height="118" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="80" y="430" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">provider 包（驱动层，必须单独装）</text><rect x="80" y="458" width="94" height="26" rx="13" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="91" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">openai</text><rect x="184" y="458" width="130" height="26" rx="13" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="195" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">anthropic</text><rect x="324" y="458" width="166" height="26" rx="13" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="335" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">google-genai</text><rect x="500" y="458" width="58" height="26" rx="13" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="511" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">aws</text><rect x="568" y="458" width="142" height="26" rx="13" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="579" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">openrouter</text><rect x="720" y="458" width="94" height="26" rx="13" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="731" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">ollama</text><rect x="892" y="396" width="332" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="892" y="396" width="4" height="118" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="916" y="430" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#ff6b8a" font-weight="600" text-anchor="start" letter-spacing="0">langchain-classic</text><text x="916" y="458" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">旧 Chain / Retriever / hub /</text><text x="916" y="482" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">indexing 都收在这里，按需安装</text><path d="M640 366 L640 392 M635 386 L640 392 L645 386" stroke="#3ddcff" stroke-width="2" fill="none"/><rect x="56" y="578" width="1168" height="66" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="578" width="4" height="66" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="84" y="610" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">结论</text><text x="140" y="610" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">装完 langchain 不等于能调模型：provider 包缺一个，init_chat_model 就报「provider not supported」。</text><text x="140" y="636" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">Python 最低 3.10（官方迁移指南 Dropped Python 3.9 support）。</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 LangChain v1 migration guide · Simplified package 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC01 · PACKAGES</text></svg>