<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGCHAIN 1.x · 结构化输出</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="108" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">同一个 schema，两条策略，一个出口</text><rect x="56" y="140" width="420" height="190" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="140" width="4" height="190" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="176" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">response_format</text><text x="80" y="206" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· ToolStrategy(Schema)</text><text x="80" y="236" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· ProviderStrategy(Schema, strict)</text><text x="80" y="266" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· Schema（自动选）</text><text x="80" y="296" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· None（默认）</text><rect x="56" y="356" width="420" height="180" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="356" width="4" height="180" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="80" y="392" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">自动选择规则</text><text x="80" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">支持原生结构化输出 → Provider</text><text x="80" y="444" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">OpenAI / Anthropic / Gemini / xAI</text><text x="80" y="472" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">其余模型 → ToolStrategy</text><text x="80" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">JSON Schema 字典必须显式包策略</text><path d="M484 235 L528 235 M522 230 L528 235 L522 240" stroke="#3ddcff" stroke-width="2" fill="none"/><rect x="548" y="140" width="320" height="180" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="548" y="140" width="4" height="180" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="572" y="176" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">Provider 路径</text><text x="572" y="204" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">API 原生 JSON 约束</text><text x="572" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">通常一轮出结果</text><text x="572" y="256" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">strict 仅部分 provider</text><text x="572" y="280" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">需 langchain&gt;=1.2</text><rect x="548" y="344" width="320" height="192" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="548" y="344" width="4" height="192" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="572" y="380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">Tool 路径</text><text x="572" y="408" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">借一次工具调用提交表单</text><text x="572" y="432" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">通用，支持 Union 类型</text><text x="572" y="460" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">handle_errors 决定重试</text><text x="572" y="484" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">True / str / 异常类型 / 函数 / False</text><path d="M876 235 L916 235 M910 230 L916 235 L910 240" stroke="#3ee6a2" stroke-width="2" fill="none"/><path d="M876 430 L916 430 M910 425 L916 430 L910 435" stroke="#b388ff" stroke-width="2" fill="none"/><rect x="924" y="260" width="300" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="924" y="260" width="4" height="150" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="948" y="296" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">structured_response</text><text x="948" y="324" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">结果在最终状态的该键下</text><text x="948" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Pydantic → 实例</text><text x="948" y="372" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">dataclass / TypedDict / JSON → dict</text><rect x="56" y="560" width="1168" height="66" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="560" width="4" height="66" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="80" y="596" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="600" text-anchor="start" letter-spacing="0">硬条件</text><text x="150" y="596" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">同时传了 tools 时，模型必须支持「工具 + 结构化输出」并用，否则两条约束互相打架。</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Structured output 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC06 · STRUCTURED</text></svg>