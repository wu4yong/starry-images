" stroke-opacity="0.55"/><rect x="56" y="268" width="4" height="66" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">带出处</text><text x="300" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">自定义评估器：来源标识是否出现</text><text x="700" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">答案像真的但无从核对</text><rect x="56" y="346" width="1008" height="66" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="346" width="4" height="66" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="80" y="378" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">该拒答</text><text x="300" y="378" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">自定义评估器：无依据是否说没有</text><text x="700" y="378" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">编造被正确答案淹没</text><rect x="56" y="428" width="1008" height="94" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="428" width="4" height="94" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="80" y="462" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">一次改动的对照实验</text><text x="80" y="490" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">改 chunk_size 200 → 400，重跑同一套用例：带出处通过率下降 → 切分变了，不是模型变差。</text><text x="80" y="514" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">评测集的价值：把「感觉」换成「同一把尺子」。</text><rect x="56" y="532" width="1008" height="38" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="532" width="4" height="38" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="80" y="559" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">本地只留 target 函数，数据集与评估器放 LangSmith 侧，团队共享、可回归。</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · LangSmith Evaluation 自绘</text><text x="1064" y="598" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC14 · EVAL</text></svg>