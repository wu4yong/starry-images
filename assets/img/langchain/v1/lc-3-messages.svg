<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGCHAIN 1.x · 消息结构</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="108" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">一条消息 = 角色 + 内容 + 元数据；四种角色各说一句话</text><rect x="56" y="146" width="260" height="130" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="146" width="4" height="130" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="76" y="180" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#4a9dff" font-weight="600" text-anchor="start" letter-spacing="0">SystemMessage</text><text x="76" y="208" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">role: system</text><text x="76" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">定人设、定规则</text><text x="329" y="211" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">›</text><rect x="342" y="146" width="260" height="130" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="342" y="146" width="4" height="130" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="362" y="180" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">HumanMessage</text><text x="362" y="208" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">role: user</text><text x="362" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">用户输入，可带图/文件</text><text x="615" y="211" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">›</text><rect x="628" y="146" width="260" height="130" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="628" y="146" width="4" height="130" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="648" y="180" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">AIMessage</text><text x="648" y="208" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">role: assistant</text><text x="648" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">模型输出，含 tool_calls</text><text x="901" y="211" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">›</text><rect x="914" y="146" width="260" height="130" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="914" y="146" width="4" height="130" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="934" y="180" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">ToolMessage</text><text x="934" y="208" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">role: tool</text><text x="934" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">工具结果回灌</text><rect x="56" y="306" width="1168" height="260" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="306" width="4" height="260" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="80" y="342" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">消息的三层结构（官方原文：Role / Content / Metadata）</text><rect x="80" y="366" width="284" height="164" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(120,170,255,0.22)"/><text x="100" y="400" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">Role</text><text x="100" y="432" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· system / user</text><text x="100" y="460" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· assistant / tool</text><text x="100" y="488" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· 决定谁在说话</text><rect x="396" y="366" width="284" height="164" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(120,170,255,0.22)"/><text x="416" y="400" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">Content</text><text x="416" y="432" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· text 文本</text><text x="416" y="460" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· image / audio / file</text><text x="416" y="488" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· tool_call 调用请求</text><rect x="712" y="366" width="284" height="164" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(120,170,255,0.22)"/><text x="732" y="400" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">Metadata</text><text x="732" y="432" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· id：追踪标识</text><text x="732" y="460" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· usage_metadata：token</text><text x="732" y="488" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· response_metadata：结束原因</text><rect x="56" y="588" width="1168" height="66" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="588" width="4" height="66" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="84" y="620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">v1 关键</text><text x="180" y="620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">读输出统一用 content_blocks（标准块），不再对着 provider 私有 content 做分支。</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com/oss/python/langchain/messages 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC03 · MESSAGES</text></svg>