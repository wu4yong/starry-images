<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGCHAIN 1.x · 协议往返</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="104" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">一次工具调用是协议往返，不是函数调用</text><rect x="56" y="160" width="180" height="160" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="160" width="4" height="160" rx="2" fill="#3ddcff" fill-opacity="0.85"/><circle cx="80" cy="190" r="13" fill="#3ddcff" fill-opacity="0.16" stroke="#3ddcff" stroke-opacity="0.6"/><text x="80" y="195" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="400" text-anchor="middle" letter-spacing="0">1</text><text x="100" y="195" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">schema 出去</text><line x1="70" y1="212" x2="222" y2="212" stroke="rgba(120,170,255,0.22)"/><text x="70" y="240" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">随请求发给模型</text><text x="70" y="266" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">name/description/args</text><text x="249" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">›</text><rect x="262" y="160" width="180" height="160" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="262" y="160" width="4" height="160" rx="2" fill="#4a9dff" fill-opacity="0.85"/><circle cx="286" cy="190" r="13" fill="#4a9dff" fill-opacity="0.16" stroke="#4a9dff" stroke-opacity="0.6"/><text x="286" y="195" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#4a9dff" font-weight="400" text-anchor="middle" letter-spacing="0">2</text><text x="306" y="195" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#4a9dff" font-weight="600" text-anchor="start" letter-spacing="0">tool_call 回来</text><line x1="276" y1="212" x2="428" y2="212" stroke="rgba(120,170,255,0.22)"/><text x="276" y="240" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">AIMessage.tool_calls</text><text x="276" y="266" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">含 args 与 id</text><text x="455" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">›</text><rect x="468" y="160" width="180" height="160" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="468" y="160" width="4" height="160" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><circle cx="492" cy="190" r="13" fill="#3ee6a2" fill-opacity="0.16" stroke="#3ee6a2" stroke-opacity="0.6"/><text x="492" y="195" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="middle" letter-spacing="0">3</text><text x="512" y="195" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">本地执行</text><line x1="482" y1="212" x2="634" y2="212" stroke="rgba(120,170,255,0.22)"/><text x="482" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">按 args 跑函数</text><text x="482" y="266" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">异常要兜住</text><text x="661" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">›</text><rect x="674" y="160" width="180" height="160" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="674" y="160" width="4" height="160" rx="2" fill="#ffc861" fill-opacity="0.85"/><circle cx="698" cy="190" r="13" fill="#ffc861" fill-opacity="0.16" stroke="#ffc861" stroke-opacity="0.6"/><text x="698" y="195" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#ffc861" font-weight="400" text-anchor="middle" letter-spacing="0">4</text><text x="718" y="195" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">ToolMessage 回灌</text><line x1="688" y1="212" x2="840" y2="212" stroke="rgba(120,170,255,0.22)"/><text x="688" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">必须带 tool_call_id</text><text x="688" y="266" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">模型据此判断结果</text><text x="867" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">›</text><rect x="880" y="160" width="180" height="160" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="880" y="160" width="4" height="160" rx="2" fill="#b388ff" fill-opacity="0.85"/><circle cx="904" cy="190" r="13" fill="#b388ff" fill-opacity="0.16" stroke="#b388ff" stroke-opacity="0.6"/><text x="904" y="195" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#b388ff" font-weight="400" text-anchor="middle" letter-spacing="0">5</text><text x="924" y="195" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">再问模型</text><line x1="894" y1="212" x2="1046" y2="212" stroke="rgba(120,170,255,0.22)"/><text x="894" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">无 tool_call 即收口</text><text x="894" y="266" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">有则下一轮</text><rect x="56" y="350" width="1008" height="146" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="350" width="4" height="146" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="80" y="390" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ff6b8a" font-weight="600" text-anchor="start" letter-spacing="0">三处常见断裂</text><text x="80" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 无类型标注 → 没有 schema，模型无法构造参数</text><text x="80" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 描述太泛 → 模型选错工具或漏填字段</text><text x="80" y="472" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· ToolMessage 缺 tool_call_id → 结果对不上调用，模型重复调用</text><rect x="56" y="496" width="1008" height="56" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="496" width="4" height="56" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="80" y="528" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">判据</text><text x="150" y="528" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">tool_calls 的名字与 args 正确、invoke(call) 返回 ToolMessage —— 协议闭环成立。</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Tools 自绘</text><text x="1064" y="598" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC05 · TOOL LOOP</text></svg>