ng="0">工具定义</text><rect x="884" y="188" width="12" height="12" rx="3" fill="#ff6b8a" fill-opacity="0.7"/><text x="904" y="198" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">预留输出</text><rect x="56" y="236" width="486" height="226" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="236" width="4" height="226" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="80" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">裁剪 Trim</text><text x="80" y="302" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">RemoveMessage + REMOVE_ALL_MESSAGES</text><text x="80" y="330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">零成本、立即生效</text><text x="80" y="356" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">丢掉的旧信息不可恢复</text><text x="80" y="388" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0">前提：历史结构合法（tool_calls 要配对）</text><text x="80" y="416" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">适合：寒暄、重复上下文多，关键事实已落 store</text><rect x="578" y="236" width="486" height="226" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="578" y="236" width="4" height="226" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="602" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">摘要 Summarize</text><text x="602" y="302" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">SummarizationMiddleware(trigger, keep)</text><text x="602" y="330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">多一次模型调用，成本上升</text><text x="602" y="356" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">细节会被压成一段话</text><text x="602" y="388" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">保留「结论/人名/数字」类事实</text><text x="602" y="416" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">适合：长对话且旧信息仍会被追问</text><rect x="56" y="480" width="1008" height="74" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="480" width="4" height="74" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="80" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">换一个思路</text><text x="200" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">临时的给（wrap_model_call + override）不算进预算之外；</text><text x="200" y="538" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">真正要长期留的事实，落 store —— 摘要与裁剪都动不到它。</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Short-term memory / Context engineering 自绘</text><text x="1064" y="598" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC11 · BUDGET</text></svg>