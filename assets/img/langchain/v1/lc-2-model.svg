UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">None</text><text x="470" y="452" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">单独指定 provider</text><text x="760" y="452" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">与冒号写法不一致时行为易误判</text><rect x="72" y="464" width="1136" height="34" fill="rgba(255,255,255,0.03)"/><line x1="72" y1="498" x2="1208" y2="498" stroke="rgba(120,170,255,0.22)"/><text x="80" y="486" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">temperature</text><text x="300" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">provider 决定</text><text x="470" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">输出随机性</text><text x="760" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">取值范围各家不同</text><rect x="72" y="498" width="1136" height="34" fill="transparent"/><line x1="72" y1="532" x2="1208" y2="532" stroke="rgba(120,170,255,0.22)"/><text x="80" y="520" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">max_tokens</text><text x="300" y="520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">provider 决定</text><text x="470" y="520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">限制响应 token</text><text x="760" y="520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">太小会截断且不一定报错</text><rect x="72" y="532" width="1136" height="34" fill="rgba(255,255,255,0.03)"/><line x1="72" y1="566" x2="1208" y2="566" stroke="rgba(120,170,255,0.22)"/><text x="80" y="554" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">timeout / max_retries</text><text x="300" y="554" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">provider / 6</text><text x="470" y="554" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">超时与重试</text><text x="760" y="554" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">401、404 不重试，调大无效</text><rect x="56" y="596" width="1168" height="66" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="596" width="4" height="66" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="84" y="628" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">一句话</text><text x="160" y="628" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">init_chat_model = 「选哪家」与「用哪个型号」的唯一入口，切换成本应当只是一行配置。</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698"