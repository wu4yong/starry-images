,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Prebuilt middleware 自绘</text><text x="1064" y="598" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC09 · WHERE</text></svg>