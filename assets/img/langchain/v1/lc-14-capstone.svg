<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGCHAIN 1.x · 14 文档问答 Agent 实战</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="108" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0">四段交付：装配 → 护栏 → 评测 → 上线</text><rect x="56" y="150" width="280" height="176" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="150" width="4" height="176" rx="2" fill="#3ddcff" fill-opacity="0.85"/><circle cx="82" cy="184" r="12" fill="#3ddcff" fill-opacity="0.16" stroke="#3ddcff" stroke-opacity="0.6"/><text x="82" y="189" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#3ddcff" font-weight="400" text-anchor="middle" letter-spacing="0">1</text><text x="102" y="189" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0">装配</text><text x="78" y="226" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· search_docs + 记忆工具</text><text x="78" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· create_agent + middlewares</text><text x="78" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· 系统提示写死引用要求</text><path d="M340 238 L352 238 M346 233 L352 238 L346 243" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="356" y="150" width="280" height="176" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="356" y="150" width="4" height="176" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><circle cx="382" cy="184" r="12" fill="#3ee6a2" fill-opacity="0.16" stroke="#3ee6a2" stroke-opacity="0.6"/><text x="382" y="189" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="middle" letter-spacing="0">2</text><text x="402" y="189" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0">护栏</text><text x="378" y="226" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· PII 输入脱敏</text><text x="378" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· 写操作 HITL 中断</text><text x="378" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· ModelCallLimit 兜底</text><path d="M640 238 L652 238 M646 233 L652 238 L646 243" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="656" y="150" width="280" height="176" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="656" y="150" width="4" height="176" rx="2" fill="#ffc861" fill-opacity="0.85"/><circle cx="682" cy="184" r="12" fill="#ffc861" fill-opacity="0.16" stroke="#ffc861" stroke-opacity="0.6"/><text x="682" y="189" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#ffc861" font-weight="400" text-anchor="middle" letter-spacing="0">3</text><text x="702" y="189" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0">评测</text><text x="678" y="226" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 数据集 + 评估器</text><text x="678" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· 答对 / 带出处 / 该拒答</text><text x="678" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· 同一套用例横向比</text><path d="M940 238 L952 238 M946 233 L952 238 L946 243" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="956" y="150" width="280" height="176" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="956" y="150" width="4" height="176" rx="2" fill="#b388ff" fill-opacity="0.85"/><circle cx="982" cy="184" r="12" fill="#b388ff" fill-opacity="0.16" stroke="#b388ff" stroke-opacity="0.6"/><text x="982" y="189" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#b388ff" font-weight="400" text-anchor="middle" letter-spacing="0">4</text><text x="1002" y="189" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0">上线</text><text x="978" y="226" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 换 Postgres 持久化</text><text x="978" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· langgraph dev → Server</text><text x="978" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· LANGSMITH_TRACING 常开</text><rect x="56" y="366" width="1168" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="366" width="4" height="132" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="80" y="400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#4a9dff" font-weight="600" text-anchor="start" letter-spacing="0">官方原话的两处落点</text><text x="80" y="432" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· create_agent 返回「编译好的图」→ 可嵌子图、可被 Agent Server 托管（自动配 checkpointer）</text><text x="80" y="460" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· Agent 失败多是「上下文没给到」→ 调提示与检索，比换更大模型更有效</text><text x="80" y="488" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 上线三必补：持久化后端、代码层护栏、可观测轨迹（缺一项就无法定位线上问题）</text><rect x="56" y="516" width="1168" height="54" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="516" width="4" height="54" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="80" y="548" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">上线不等于完成：没有评测集，「又变好了」只是感觉；有了评测，改切分、改提示、换模型才有基线。</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 docs.langchain.com · Agents / Context engineering 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LC14 · CAPSTONE</text></svg>