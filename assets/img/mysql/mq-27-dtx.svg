<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 事务与锁</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">分布式事务的两条路</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">XA 求强一致、怕悬挂；本地消息表求最终一致、怕重复</text><rect x="56" y="210" width="560" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="210" width="4" height="300" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">XA 两阶段提交</text><text x="80" y="288" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">协调者：PREPARE 全部 → COMMIT 全部</text><rect x="80" y="314" width="90.48" height="29" rx="14.5" fill="#4a9dff" fill-opacity="0.13" stroke="#4a9dff" stroke-opacity="0.45"/><text x="125.24000000000001" y="331" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#4a9dff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">XA START</text><rect x="256" y="314" width="74.36" height="29" rx="14.5" fill="#4a9dff" fill-opacity="0.13" stroke="#4a9dff" stroke-opacity="0.45"/><text x="293.18" y="331" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#4a9dff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">业务 SQL</text><rect x="432" y="314" width="74.36" height="29" rx="14.5" fill="#4a9dff" fill-opacity="0.13" stroke="#4a9dff" stroke-opacity="0.45"/><text x="469.18" y="331" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#4a9dff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">XA END</text><rect x="80" y="368" width="106.60000000000001" height="29" rx="14.5" fill="#4a9dff" fill-opacity="0.13" stroke="#4a9dff" stroke-opacity="0.45"/><text x="133.3" y="385" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#4a9dff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">XA PREPARE</text><rect x="256" y="368" width="98.54" height="29" rx="14.5" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="305.27" y="385" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">XA COMMIT</text><text x="80" y="442" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">优点：跨库原子性由数据库保证</text><text x="80" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">风险：prepare 后崩溃 → 悬挂事务，要 XA RECOVER 人工处理</text><text x="80" y="498" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">代价：prepare 到 commit 之间一直持锁，吞吐受限</text><rect x="664" y="210" width="560" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="664" y="210" width="4" height="300" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="688" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">本地消息表（Outbox）</text><text x="688" y="288" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">业务表 + 消息表同库同事务写入</text><rect x="688" y="300" width="512" height="32" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="688" y="300" width="4" height="32" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="704" y="322" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">1. 同一本地事务</text><rect x="688" y="338" width="512" height="32" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="688" y="338" width="4" height="32" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="704" y="360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">2. 写业务行 + 消息行</text><rect x="688" y="376" width="512" height="32" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="688" y="376" width="4" height="32" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="704" y="398" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">3. 定时投递 MQ</text><rect x="688" y="414" width="512" height="32" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="688" y="414" width="4" height="32" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="704" y="436" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">4. 下游幂等消费</text><text x="688" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">优点：无跨库锁，吞吐高</text><text x="56" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">选型：资金类强一致用 XA 或 TCC；通知、积分、日志类用消息表</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 XA Transactions 与本地消息表模式自绘</text></svg>