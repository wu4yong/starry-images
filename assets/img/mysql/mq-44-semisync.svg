<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 高可用与架构</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">从异步到半同步</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">主库提交时要不要等从库确认 —— 决定数据能丢多少</text><rect x="56" y="206" width="366" height="196" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="206" width="4" height="196" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="76" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">异步复制（默认）</text><text x="76" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">主库提交即返回</text><text x="76" y="308" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">不等待任何从库</text><text x="76" y="338" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">主库崩 → 可能丢最后一段</text><rect x="446" y="206" width="366" height="196" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="446" y="206" width="4" height="196" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="466" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">半同步复制</text><text x="466" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">至少一个从库确认收到</text><text x="466" y="308" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">收到即返回，不等回放</text><text x="466" y="338" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">主库崩 → 最多丢未确认段</text><rect x="836" y="206" width="366" height="196" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="836" y="206" width="4" height="196" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="856" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">组复制 MGR</text><text x="856" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">多数派认证后再提交</text><text x="856" y="308" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">基于 Paxos 变体</text><text x="856" y="338" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">几乎不丢，代价是吞吐</text><text x="56" y="448" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">半同步的两条关键参数（8.4）</text><rect x="56" y="466" width="566" height="128" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="466" width="4" height="128" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="76" y="498" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0">rpl_semi_sync_source_enabled</text><text x="76" y="526" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">主库侧开启；插件名 rpl_semi_sync_source（8.0.26+ 改名）</text><text x="76" y="554" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">rpl_semi_sync_source_timeout 默认 10000ms，超时退化为异步</text><rect x="648" y="466" width="576" height="128" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="466" width="4" height="128" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="668" y="498" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">AFTER_SYNC vs AFTER_COMMIT</text><text x="668" y="526" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">AFTER_SYNC：等确认再提交，最常用</text><text x="668" y="554" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0">超时后自动降级为异步，必须监控 Rpl_semi_sync_source_status</text><text x="56" y="622" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">半同步保证「已提交不丢」，不保证「从库已回放」，也不解决延迟</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 Semisynchronous Replication 说明自绘</text></svg>