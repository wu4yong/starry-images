<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 性能与优化</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="100" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">选错索引的六种原因</text><text x="48" y="132" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">每一种都能用一条命令验证，不要凭感觉加 hint</text><rect x="48" y="156" width="1024" height="44" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="200" x2="1072" y2="200" stroke="rgba(120,170,255,0.22)"/><text x="96" y="184" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">原因</text><text x="348" y="184" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">现象</text><text x="688" y="184" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">验证方式</text><text x="948" y="184" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">处理</text><rect x="48" y="200" width="1024" height="44" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="244" x2="1072" y2="244" stroke="rgba(120,170,255,0.22)"/><text x="96" y="228" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">统计信息过期</text><text x="348" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">rows 明显偏离</text><text x="688" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SHOW INDEX 看 Cardinality</text><text x="948" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">ANALYZE TABLE</text><rect x="48" y="244" width="1024" height="44" fill="transparent"/><line x1="48" y1="288" x2="1072" y2="288" stroke="rgba(120,170,255,0.22)"/><text x="96" y="272" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">采样页太少</text><text x="348" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">大表估算抖动</text><text x="688" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">innodb_stats_persistent_sample_pages</text><text x="948" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">调大采样</text><rect x="48" y="288" width="1024" height="44" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="332" x2="1072" y2="332" stroke="rgba(120,170,255,0.22)"/><text x="96" y="316" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">数据分布倾斜</text><text x="348" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">同一 SQL 时快时慢</text><text x="688" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">直方图 / 实际分布</text><text x="948" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">建直方图或改写</text><rect x="48" y="332" width="1024" height="44" fill="transparent"/><line x1="48" y1="376" x2="1072" y2="376" stroke="rgba(120,170,255,0.22)"/><text x="96" y="360" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">索引相关性</text><text x="348" y="360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">两列同时用才有效</text><text x="688" y="360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">EXPLAIN 两次对比</text><text x="948" y="360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">建联合索引</text><rect x="48" y="376" width="1024" height="44" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="420" x2="1072" y2="420" stroke="rgba(120,170,255,0.22)"/><text x="96" y="404" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">隐式转换</text><text x="348" y="404" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">key 命中但 rows 巨大</text><text x="688" y="404" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SHOW WARNINGS</text><text x="948" y="404" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">统一类型</text><rect x="48" y="420" width="1024" height="44" fill="transparent"/><line x1="48" y1="464" x2="1072" y2="464" stroke="rgba(120,170,255,0.22)"/><text x="96" y="448" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">代价模型偏差</text><text x="348" y="448" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">明明更优却没选</text><text x="688" y="448" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">optimizer_trace</text><text x="948" y="448" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">改统计或 hint</text><text x="48" y="498" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">ANALYZE TABLE t UPDATE HISTOGRAM ON user_id, status WITH 64 BUCKETS;</text><text x="48" y="522" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SELECT * FROM information_schema.COLUMN_STATISTICS WHERE TABLE_NAME = 't';</text><text x="48" y="548" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">直方图自 8.0 提供，适合分布倾斜的列；维护有成本，只给关键查询列建</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 Optimizer Statistics / Histograms 说明自绘</text></svg>