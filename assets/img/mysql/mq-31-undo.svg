<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 存储引擎与内部</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">undo 是回滚日志，也是版本链</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">一份日志两用：回滚未提交事务、给 MVCC 提供旧版本</text><rect x="56" y="210" width="368" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="210" width="4" height="132" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="74" y="246" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">INSERT</text><text x="74" y="276" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">记录「插入了什么」，回滚即删除</text><text x="74" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">生命周期：提交后即可丢弃</text><rect x="448" y="210" width="368" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="448" y="210" width="4" height="132" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="466" y="246" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">UPDATE</text><text x="466" y="276" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">记录旧值，回滚即写回</text><text x="466" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">生命周期：要留到无人读旧版本</text><rect x="840" y="210" width="368" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="840" y="210" width="4" height="132" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="858" y="246" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">DELETE</text><text x="858" y="276" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">记录被删行，回滚即恢复</text><text x="858" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">生命周期：删除标记 + 版本保留</text><text x="56" y="384" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">版本链：行头 roll_ptr 指向 undo，undo 里再指向上一个版本</text><rect x="56" y="402" width="248" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="402" width="4" height="92" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="72" y="436" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">最新行</text><text x="72" y="468" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">trx 200</text><path d="M306 448 L344 448 M338 443 L344 448 L338 453" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="348" y="402" width="248" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="348" y="402" width="4" height="92" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="364" y="436" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">旧版本 1</text><text x="364" y="468" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">trx 180</text><path d="M598 448 L636 448 M630 443 L636 448 L630 453" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="640" y="402" width="248" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#8ba3c7" stroke-width="1.4" stroke-opacity="0.55"/><rect x="640" y="402" width="4" height="92" rx="2" fill="#8ba3c7" fill-opacity="0.85"/><text x="656" y="436" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">旧版本 2</text><text x="656" y="468" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">trx 150</text><path d="M890 448 L928 448 M922 443 L928 448 L922 453" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="932" y="402" width="248" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#8ba3c7" stroke-width="1.4" stroke-opacity="0.55"/><rect x="932" y="402" width="4" height="92" rx="2" fill="#8ba3c7" fill-opacity="0.85"/><text x="948" y="436" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">更早（可清理）</text><text x="948" y="468" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">trx 120</text><rect x="56" y="522" width="1168" height="78" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="522" width="4" height="78" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="76" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">purge 线程沿着版本链从最老的可清理版本开始回收；只要还有事务在跑，链就不能断</text><text x="76" y="580" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">undo 膨胀看 History list length 与 undo 表空间大小，根因几乎都是长事务</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB Undo Logs / Purge 说明自绘</text></svg>