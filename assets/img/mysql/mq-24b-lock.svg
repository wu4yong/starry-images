<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1120" height="620" fill="url(#g1)"/><rect width="1120" height="620" fill="url(#grid)"/>
<rect width="1120" height="620" fill="url(#glow)"/><rect width="1120" height="620" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 事务与锁</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">一条 SQL 到底加了什么锁</text><text x="48" y="146" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">RR 下的默认行为，索引类型不同结果完全不同</text><rect x="48" y="180" width="1024" height="36" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="216" x2="1072" y2="216" stroke="rgba(120,170,255,0.22)"/><text x="62" y="204" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SQL</text><text x="368" y="204" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">加锁结果</text><text x="608" y="204" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">备注</text><rect x="48" y="216" width="1024" height="36" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="252" x2="1072" y2="252" stroke="rgba(120,170,255,0.22)"/><text x="62" y="240" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SELECT（普通）</text><text x="368" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不加锁</text><text x="608" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">快照读</text><rect x="48" y="252" width="1024" height="36" fill="transparent"/><line x1="48" y1="288" x2="1072" y2="288" stroke="rgba(120,170,255,0.22)"/><text x="62" y="276" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SELECT ... FOR SHARE</text><text x="368" y="276" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">S 记录锁 / S next-key</text><text x="608" y="276" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">非唯一索引会扩到间隙</text><rect x="48" y="288" width="1024" height="36" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="324" x2="1072" y2="324" stroke="rgba(120,170,255,0.22)"/><text x="62" y="312" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SELECT ... FOR UPDATE</text><text x="368" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">X next-key</text><text x="608" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">唯一索引等值只锁记录</text><rect x="48" y="324" width="1024" height="36" fill="transparent"/><line x1="48" y1="360" x2="1072" y2="360" stroke="rgba(120,170,255,0.22)"/><text x="62" y="348" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">UPDATE ... WHERE 唯一索引 = ?</text><text x="368" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">X 记录锁</text><text x="608" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">最常见的最优形态</text><rect x="48" y="360" width="1024" height="36" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="396" x2="1072" y2="396" stroke="rgba(120,170,255,0.22)"/><text x="62" y="384" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">UPDATE ... WHERE 普通索引 = ?</text><text x="368" y="384" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">X next-key</text><text x="608" y="384" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">锁记录 + 前间隙</text><rect x="48" y="396" width="1024" height="36" fill="transparent"/><line x1="48" y1="432" x2="1072" y2="432" stroke="rgba(120,170,255,0.22)"/><text x="62" y="420" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">UPDATE ... WHERE 无索引列</text><text x="368" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">锁住扫描到的全部记录</text><text x="608" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">近似全表锁</text><rect x="48" y="440" width="500" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="440" width="4" height="96" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="66" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">短事务 + 唯一索引等值</text><text x="66" y="508" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">并发友好：锁一行、持有时间短</text><rect x="572" y="440" width="500" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="572" y="440" width="4" height="96" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="590" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">无索引 + 大范围更新</text><text x="590" y="508" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">锁大量 next-key 区间，易死锁</text><text x="48" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">排查入口：SHOW ENGINE INNODB STATUS 的 TRANSACTIONS 段，或 data_locks 视图</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 Locks Set by Different SQL Statements 自绘</text></svg>