</defs><rect width="1120" height="620" fill="url(#g1)"/><rect width="1120" height="620" fill="url(#grid)"/><rect width="1120" height="620" fill="url(#glow)"/><rect width="1120" height="620" fill="url(#glow2)"/><text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 表设计与索引</text><line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">回表到底多贵，覆盖索引怎么省掉它</text><text x="48" y="146" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">二级索引只存「索引列 + 主键」，取其它列就必须再查一次聚簇索引</text><rect x="48" y="190" width="232" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><line x1="48" y1="190" x2="51" y2="190" stroke="#3ddcff" stroke-width="0"/><rect x="48" y="190" width="4" height="96" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="64" y="226" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">WHERE name = ?</text><text x="64" y="260" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">查二级索引树</text><path d="M284 238 L302 238" stroke="#8ba3c7" stroke-width="2"/><rect x="310" y="190" width="232" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><line x1="310" y1="190" x2="313" y2="190" stroke="#4a9dff" stroke-width="0"/><rect x="310" y="190" width="4" height="96" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="326" y="226" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">得到主键 id</text><text x="326" y="260" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">叶子里的主键值</text><path d="M546 238 L564 238" stroke="#8ba3c7" stroke-width="2"/><rect x="572" y="190" width="232" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><line x1="572" y1="190" x2="575" y2="190" stroke="#ffc861" stroke-width="0"/><rect x="572" y="190" width="4" height="96" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="588" y="226" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">按 id 查聚簇索引</text><text x="588" y="260" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">再走一次 B+Tree</text><path d="M808 238 L826 238" stroke="#8ba3c7" stroke-width="2"/><rect x="834" y="190" width="232" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><line x1="834" y1="190" x2="837" y2="190" stroke="#3ee6a2" stroke-width="0"/><rect x="834" y="190" width="4" height="96" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="850" y="226" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">返回整行</text><text x="850" y="260" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">这次才是真正的行</text><text x="48" y="326" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">EXPLAIN 的三种说法</text><rect x="48" y="344" width="320" height="74" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><line x1="48" y1="344" x2="51" y2="344" stroke="#3ee6a2" stroke-width="0"/><rect x="48" y="344" width="4" height="74" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="64" y="376" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Using index</text><text x="64" y="404" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">覆盖，不回表</text><rect x="396" y="344" width="320" height="74" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><line x1="396" y1="344" x2="399" y2="344" stroke="#ffc861" stroke-width="0"/><rect x="396" y="344" width="4" height="74" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="412" y="376" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Using index condition</text><text x="412" y="404" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">ICP，仍回表但先过滤</text><rect x="744" y="344" width="320" height="74" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><line x1="744" y1="344" x2="747" y2="344" stroke="#ff6b8a" stroke-width="0"/><rect x="744" y="344" width="4" height="74" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="760" y="376" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">（无此两项）</text><text x="760" y="404" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">普通回表，逐行读整行</text><rect x="48" y="428" width="1024" height="34" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="462" x2="1072" y2="462" stroke="rgba(120,170,255,0.22)"/><text x="62" y="450" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">列</text><text x="264" y="450" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">cardinality 占比</text><text x="484" y="450" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">是否适合单独索引</text><text x="714" y="450" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">用法</text><rect x="48" y="462" width="1024" height="34" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="496" x2="1072" y2="496" stroke="rgba(120,170,255,0.22)"/><text x="62" y="484" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">phone</text><text x="264" y="484" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">≈1.0</text><text x="484" y="484" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">适合</text><text x="714" y="484" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">唯一索引</text><rect x="48" y="496" width="1024" height="34" fill="transparent"/><line x1="48" y1="530" x2="1072" y2="530" stroke="rgba(120,170,255,0.22)"/><text x="62" y="518" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">name</text><text x="264" y="518" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">≈0.35</text><text x="484" y="518" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">适合</text><text x="714" y="518" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">联合索引前缀</text><rect x="48" y="530" width="1024" height="34" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="564" x2="1072" y2="564" stroke="rgba(120,170,255,0.22)"/><text x="62" y="552" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">status</text><text x="264" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">≈0.003</text><text x="484" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不适合</text><text x="714" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">联合索引里做过滤</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 覆盖索引、ICP 与索引统计章节自绘</text></svg>