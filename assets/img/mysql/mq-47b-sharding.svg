<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 高可用与架构</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="100" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">分片之后必须面对的四件事</text><text x="48" y="132" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">拆容易，拼起来才是成本</text><rect x="48" y="158" width="1024" height="44" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="202" x2="1072" y2="202" stroke="rgba(120,170,255,0.22)"/><text x="48" y="186" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">问题</text><text x="268" y="186" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">具体表现</text><text x="568" y="186" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">常见解法</text><text x="828" y="186" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">代价</text><rect x="48" y="202" width="1024" height="44" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="246" x2="1072" y2="246" stroke="rgba(120,170,255,0.22)"/><text x="48" y="230" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">跨分片查询</text><text x="268" y="230" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">按非分片键查询要扫全部分片</text><text x="568" y="230" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">基因法冗余、ES 二级索引</text><text x="828" y="230" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">数据冗余与一致性</text><rect x="48" y="246" width="1024" height="44" fill="transparent"/><line x1="48" y1="290" x2="1072" y2="290" stroke="rgba(120,170,255,0.22)"/><text x="48" y="274" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">跨分片分页</text><text x="268" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">LIMIT 要各分片取 N 条再归并</text><text x="568" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">禁止深翻页、只做游标分页</text><text x="828" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">产品可接受度</text><rect x="48" y="290" width="1024" height="44" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="334" x2="1072" y2="334" stroke="rgba(120,170,255,0.22)"/><text x="48" y="318" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">分布式事务</text><text x="268" y="318" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">一次写跨两个分片</text><text x="568" y="318" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">本地消息表 / TCC / 最终一致</text><text x="828" y="318" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">复杂度上升</text><rect x="48" y="334" width="1024" height="44" fill="transparent"/><line x1="48" y1="378" x2="1072" y2="378" stroke="rgba(120,170,255,0.22)"/><text x="48" y="362" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">全局唯一 ID</text><text x="268" y="362" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">自增主键在多分片冲突</text><text x="568" y="362" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">雪花算法、号段模式</text><text x="828" y="362" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">依赖发号服务</text><rect x="48" y="394" width="492" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="394" width="4" height="150" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="68" y="426" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">什么时候该拆</text><text x="68" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">单表 &gt; 5000 万行且年增 &gt; 30%</text><text x="68" y="484" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">单库写入已成瓶颈，加索引无效</text><text x="68" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">备份/DDL 窗口已经不可接受</text><rect x="572" y="394" width="500" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="572" y="394" width="4" height="150" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="592" y="426" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0">什么时候先别拆</text><text x="592" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">慢在 SQL/索引 → 先优化查询</text><text x="592" y="484" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">容量不足 → 先升配或归档冷数据</text><text x="592" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">读写分离能解决的，不必上分片</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据分库分表实践说明自绘</text></svg>