<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 运维与安全</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">故障应急的四步</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">先止血，再定位，后修复，最后写复盘 —— 顺序不能反</text><rect x="56" y="206" width="268" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="206" width="4" height="156" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="74" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0">① 止血</text><text x="74" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">摘流量 / 限流 / 切从库</text><text x="74" y="308" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">别在故障中做复杂变更</text><path d="M328 284 L344 284 M338 279 L344 284 L338 289" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="348" y="206" width="268" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="348" y="206" width="4" height="156" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="366" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">② 定位</text><text x="366" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">看监控四层：可用/性能/资源/正确</text><text x="366" y="308" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">缩小到一个指标或一条 SQL</text><path d="M620 284 L636 284 M630 279 L636 284 L630 289" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="640" y="206" width="268" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="640" y="206" width="4" height="156" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="658" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">③ 修复</text><text x="658" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">最小改动恢复服务</text><text x="658" y="308" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">记录每一步时间点</text><path d="M912 284 L928 284 M922 279 L928 284 L922 289" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="932" y="206" width="268" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="932" y="206" width="4" height="156" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="950" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">④ 复盘</text><text x="950" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">根因 + 改进项 + 责任人</text><text x="950" y="308" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">补监控与预案</text><text x="56" y="404" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">四类高频故障与第一动作</text><rect x="56" y="420" width="1168" height="40" fill="rgba(61,220,255,0.10)"/><line x1="56" y1="460" x2="1224" y2="460" stroke="rgba(120,170,255,0.22)"/><text x="56" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">故障</text><text x="336" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">典型信号</text><text x="656" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">第一动作</text><text x="956" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">别做什么</text><rect x="56" y="460" width="1168" height="40" fill="rgba(255,255,255,0.03)"/><line x1="56" y1="500" x2="1224" y2="500" stroke="rgba(120,170,255,0.22)"/><text x="56" y="486" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">连接打满</text><text x="336" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Too many connections</text><text x="656" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">杀掉空闲连接 / 扩池</text><text x="956" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">盲目调大 max_connections</text><rect x="56" y="500" width="1168" height="40" fill="transparent"/><line x1="56" y1="540" x2="1224" y2="540" stroke="rgba(120,170,255,0.22)"/><text x="56" y="526" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">CPU 打满</text><text x="336" y="526" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Threads_running 飙升</text><text x="656" y="526" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">定位 Top SQL 并限流</text><text x="956" y="526" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">直接重启实例</text><rect x="56" y="540" width="1168" height="40" fill="rgba(255,255,255,0.03)"/><line x1="56" y1="580" x2="1224" y2="580" stroke="rgba(120,170,255,0.22)"/><text x="56" y="566" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">复制中断</text><text x="336" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Replica_SQL_Running=No</text><text x="656" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">看 Last_SQL_Error 再跳过/重搭</text><text x="956" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">不看错误就 SET GLOBAL skip</text><rect x="56" y="580" width="1168" height="40" fill="transparent"/><line x1="56" y1="620" x2="1224" y2="620" stroke="rgba(120,170,255,0.22)"/><text x="56" y="606" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">磁盘写满</text><text x="336" y="606" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">binlog / 临时文件暴涨</text><text x="656" y="606" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">清理 binlog、扩容</text><text x="956" y="606" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">直接 rm 正在写的文件</text><text x="56" y="648" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">应急手册要写在 Wiki 里，而不是某个人的脑子里</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 故障排查 / 运维实践自绘</text></svg>