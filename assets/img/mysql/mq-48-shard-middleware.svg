<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 运维与安全</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">分片中间件的四个动作</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">解析 → 路由 → 改写 → 归并，SQL 在中间件里被拆开又拼回</text><rect x="56" y="206" width="268" height="120" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="206" width="4" height="120" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="74" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">1 SQL 解析</text><text x="74" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">词法语法树，识别表与条件</text><path d="M328 266 L344 266 M338 261 L344 266 L338 271" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="348" y="206" width="268" height="120" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="348" y="206" width="4" height="120" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="366" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0">2 路由</text><text x="366" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">按分片键算出目标分片</text><path d="M620 266 L636 266 M630 261 L636 266 L630 271" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="640" y="206" width="268" height="120" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="640" y="206" width="4" height="120" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="658" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">3 改写</text><text x="658" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">表名/分页/聚合改写</text><path d="M912 266 L928 266 M922 261 L928 266 L922 271" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="932" y="206" width="268" height="120" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="932" y="206" width="4" height="120" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="950" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">4 执行与归并</text><text x="950" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">逐片执行后合并结果</text><text x="56" y="366" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">两种形态</text><rect x="56" y="382" width="566" height="120" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="382" width="4" height="120" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="76" y="412" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">ShardingSphere-Proxy（独立进程）</text><text x="76" y="442" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">对应用透明，支持多语言；多一跳网络</text><text x="76" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">适合异构技术栈、需要集中治理的团队</text><rect x="648" y="382" width="576" height="120" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="382" width="4" height="120" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="668" y="412" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">ShardingSphere-JDBC（Jar 包）</text><text x="668" y="442" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">应用内路由，无额外跳数；与 Spring 兼容好</text><text x="668" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">适合 Java 为主、追求低延迟的场景</text><text x="56" y="546" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0">归并是成本所在：排序归并要拉全部分片结果，聚合归并要二次计算</text><text x="56" y="580" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">跨片分页与跨片 JOIN 是中间件最难扛的两类 SQL，设计期就要规避</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 ShardingSphere 路由与归并机制 / MySQL 8.4 复制说明自绘</text></svg>