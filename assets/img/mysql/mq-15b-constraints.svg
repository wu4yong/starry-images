</defs><rect width="1120" height="620" fill="url(#g1)"/><rect width="1120" height="620" fill="url(#grid)"/><rect width="1120" height="620" fill="url(#glow)"/><rect width="1120" height="620" fill="url(#glow2)"/><text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 表设计与索引</text><line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="116" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">约束落到存储层是什么，代价在哪</text><text x="48" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">每个约束都不是「免费校验」，背后是索引、锁或一次全表扫描</text><rect x="48" y="178" width="1024" height="52" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="230" x2="1072" y2="230" stroke="rgba(120,170,255,0.22)"/><text x="62" y="210" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">约束</text><text x="246" y="210" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">存储形态</text><text x="484" y="210" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">检查时机</text><text x="704" y="210" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">主要代价</text><text x="914" y="210" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">能否绕过</text><rect x="48" y="230" width="1024" height="52" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="282" x2="1072" y2="282" stroke="rgba(120,170,255,0.22)"/><text x="62" y="262" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">PRIMARY KEY</text><text x="246" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">聚簇索引</text><text x="484" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">插入 / 更新</text><text x="704" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">键冲突即失败</text><text x="914" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不能</text><rect x="48" y="282" width="1024" height="52" fill="transparent"/><line x1="48" y1="334" x2="1072" y2="334" stroke="rgba(120,170,255,0.22)"/><text x="62" y="314" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">UNIQUE KEY</text><text x="246" y="314" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">二级唯一索引</text><text x="484" y="314" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">插入 / 更新</text><text x="704" y="314" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">多读一次索引</text><text x="914" y="314" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不能</text><rect x="48" y="334" width="1024" height="52" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="386" x2="1072" y2="386" stroke="rgba(120,170,255,0.22)"/><text x="62" y="366" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">FOREIGN KEY</text><text x="246" y="366" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">子表自动索引</text><text x="484" y="366" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">写入 / 删除父行</text><text x="704" y="366" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">共享锁 + 级联</text><text x="914" y="366" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">foreign_key_checks</text><rect x="48" y="386" width="1024" height="52" fill="transparent"/><line x1="48" y1="438" x2="1072" y2="438" stroke="rgba(120,170,255,0.22)"/><text x="62" y="418" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">CHECK</text><text x="246" y="418" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">元数据 + 表达式</text><text x="484" y="418" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">INSERT / UPDATE / REPLACE</text><text x="704" y="418" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">逐行计算表达式</text><text x="914" y="418" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">NOT ENFORCED</text><rect x="48" y="438" width="1024" height="52" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="490" x2="1072" y2="490" stroke="rgba(120,170,255,0.22)"/><text x="62" y="470" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">DEFAULT</text><text x="246" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">列元数据</text><text x="484" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">缺列时填充</text><text x="704" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">几乎无</text><text x="914" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">显式给值</text><text x="48" y="520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">CHECK 8.0.16 起真正校验；5.7 只解析不执行 → 迁移后存量脏数据会让写入失败</text><text x="48" y="550" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">默认值表达式 8.0.13 起可用：JSON / TEXT 列只能写成 DEFAULT ('{}')</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 CREATE TABLE / Foreign Keys / CHECK Constraints 章节自绘</text></svg>