<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 事务与锁</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">ACID 是四套机制，不是四句口号</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">原子靠 undo、持久靠 redo、隔离靠锁与 MVCC、一致靠约束与业务</text><rect x="56" y="222" width="276" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="222" width="4" height="132" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="74" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">A 原子性</text><text x="74" y="298" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">undo log</text><text x="74" y="332" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">失败全回滚</text><rect x="356" y="222" width="276" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="356" y="222" width="4" height="132" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="374" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">C 一致性</text><text x="374" y="298" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">约束 + 业务</text><text x="374" y="332" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">转账两边守恒</text><rect x="656" y="222" width="276" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="656" y="222" width="4" height="132" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="674" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">I 隔离性</text><text x="674" y="298" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">锁 + MVCC</text><text x="674" y="332" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">并发互不干扰</text><rect x="956" y="222" width="276" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="956" y="222" width="4" height="132" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="974" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">D 持久性</text><text x="974" y="298" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">redo log</text><text x="974" y="332" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">提交即落盘</text><text x="56" y="398" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">四种隔离级别与三类现象</text><rect x="56" y="418" width="1168" height="44" fill="rgba(61,220,255,0.10)"/><line x1="56" y1="462" x2="1224" y2="462" stroke="rgba(120,170,255,0.22)"/><text x="70" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">级别</text><text x="306" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">脏读</text><text x="486" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不可重复读</text><text x="676" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">幻读</text><text x="866" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">MySQL</text><rect x="56" y="462" width="1168" height="44" fill="rgba(255,255,255,0.03)"/><line x1="56" y1="506" x2="1224" y2="506" stroke="rgba(120,170,255,0.22)"/><text x="70" y="490" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">READ UNCOMMITTED</text><text x="306" y="490" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">可能</text><text x="486" y="490" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">可能</text><text x="676" y="490" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">可能</text><text x="866" y="490" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">少用</text><rect x="56" y="506" width="1168" height="44" fill="transparent"/><line x1="56" y1="550" x2="1224" y2="550" stroke="rgba(120,170,255,0.22)"/><text x="70" y="534" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">READ COMMITTED</text><text x="306" y="534" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不可能</text><text x="486" y="534" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">可能</text><text x="676" y="534" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">可能</text><text x="866" y="534" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">常改为此</text><rect x="56" y="550" width="1168" height="44" fill="rgba(255,255,255,0.03)"/><line x1="56" y1="594" x2="1224" y2="594" stroke="rgba(120,170,255,0.22)"/><text x="70" y="578" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">REPEATABLE READ</text><text x="306" y="578" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不可能</text><text x="486" y="578" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不可能</text><text x="676" y="578" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">间隙锁兜住</text><text x="866" y="578" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">默认</text><rect x="56" y="594" width="1168" height="44" fill="transparent"/><line x1="56" y1="638" x2="1224" y2="638" stroke="rgba(120,170,255,0.22)"/><text x="70" y="622" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SERIALIZABLE</text><text x="306" y="622" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不可能</text><text x="486" y="622" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不可能</text><text x="676" y="622" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不可能</text><text x="866" y="622" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">几乎不用</text><text x="56" y="668" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">默认 RR：SELECT @@transaction_isolation 查看；8.0 起变量名从 tx_isolation 改为 transaction_isolation</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB Transaction Model 章节自绘</text></svg>