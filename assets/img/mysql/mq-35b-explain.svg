ng SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">含义</text><text x="900" y="216" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">要不要处理</text><rect x="520" y="234" width="552" height="48" fill="rgba(255,255,255,0.03)"/><line x1="520" y1="282" x2="1072" y2="282" stroke="rgba(120,170,255,0.22)"/><text x="520" y="264" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Using index</text><text x="685" y="264" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">覆盖索引，无需回表</text><text x="900" y="264" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">理想</text><rect x="520" y="282" width="552" height="48" fill="transparent"/><line x1="520" y1="330" x2="1072" y2="330" stroke="rgba(120,170,255,0.22)"/><text x="520" y="312" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Using index condition</text><text x="685" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">ICP 下推</text><text x="900" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">正常</text><rect x="520" y="330" width="552" height="48" fill="rgba(255,255,255,0.03)"/><line x1="520" y1="378" x2="1072" y2="378" stroke="rgba(120,170,255,0.22)"/><text x="520" y="360" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Using where</text><text x="685" y="360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">server 层再过滤</text><text x="900" y="360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">看 rows 大小</text><rect x="520" y="378" width="552" height="48" fill="transparent"/><line x1="520" y1="426" x2="1072" y2="426" stroke="rgba(120,170,255,0.22)"/><text x="520" y="408" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Using filesort</text><text x="685" y="408" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">额外排序</text><text x="900" y="408" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">尽量消掉</text><rect x="520" y="426" width="552" height="48" fill="rgba(255,255,255,0.03)"/><line x1="520" y1="474" x2="1072" y2="474" stroke="rgba(120,170,255,0.22)"/><text x="520" y="456" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Using temporary</text><text x="685" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">建临时表</text><text x="900" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">优先消掉</text><text x="48" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">key_len 能反推用了联合索引的几列；ref 显示与常量还是与另一张表比较</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 EXPLAIN 输出说明自绘</text></svg>