<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 事务与锁</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">可见性判断只有四步</text><text x="48" y="146" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">拿到行的 DB_TRX_ID，跟 ReadView 的三个边界比一比</text><rect x="48" y="182" width="240" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="182" width="4" height="96" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="62" y="216" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">① 等于 creator</text><text x="62" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">自己改的 → 可见</text><path d="M290 230 L312 230 M306 225 L312 230 L306 235" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="316" y="182" width="240" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="316" y="182" width="4" height="96" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="330" y="216" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">② &lt; min_trx_id</text><text x="330" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">早于所有活跃 → 可见</text><path d="M558 230 L580 230 M574 225 L580 230 L574 235" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="584" y="182" width="240" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="584" y="182" width="4" height="96" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="598" y="216" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">③ &gt;= max_trx_id</text><text x="598" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">快照后开启 → 不可见</text><path d="M826 230 L848 230 M842 225 L848 230 L842 235" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="852" y="182" width="240" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="852" y="182" width="4" height="96" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="866" y="216" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">④ 区间内看 m_ids</text><text x="866" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">在列表里 → 不可见</text><text x="48" y="322" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">例子：ReadView 为 m_ids=[150,180]，min=150，max=201，creator=200</text><rect x="48" y="340" width="1024" height="34" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="374" x2="1072" y2="374" stroke="rgba(120,170,255,0.22)"/><text x="62" y="363" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">行的 trx_id</text><text x="218" y="363" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">判断</text><text x="348" y="363" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">可见吗</text><text x="568" y="363" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">原因</text><rect x="48" y="374" width="1024" height="34" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="408" x2="1072" y2="408" stroke="rgba(120,170,255,0.22)"/><text x="62" y="397" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">120</text><text x="218" y="397" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">120 &lt; 150</text><text x="348" y="397" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">可见</text><text x="568" y="397" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">早于所有活跃事务</text><rect x="48" y="408" width="1024" height="34" fill="transparent"/><line x1="48" y1="442" x2="1072" y2="442" stroke="rgba(120,170,255,0.22)"/><text x="62" y="431" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">150</text><text x="218" y="431" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">在 m_ids 中</text><text x="348" y="431" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不可见</text><text x="568" y="431" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">当时还活跃，沿链回退</text><rect x="48" y="442" width="1024" height="34" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="476" x2="1072" y2="476" stroke="rgba(120,170,255,0.22)"/><text x="62" y="465" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">175</text><text x="218" y="465" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">150 ≤ 175 &lt; 201</text><text x="348" y="465" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">可见</text><text x="568" y="465" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">已提交</text><rect x="48" y="476" width="1024" height="34" fill="transparent"/><line x1="48" y1="510" x2="1072" y2="510" stroke="rgba(120,170,255,0.22)"/><text x="62" y="499" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">210</text><text x="218" y="499" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">210 ≥ 201</text><text x="348" y="499" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不可见</text><text x="568" y="499" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">快照之后才开启</text><rect x="48" y="522" width="500" height="40" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="522" width="4" height="40" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="64" y="548" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">MVCC 只管快照读，写写仍要行锁</text><rect x="572" y="522" width="500" height="40" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="572" y="522" width="4" height="40" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="588" y="548" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">长事务拖住 purge，版本链越拉越长</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 事务与 undo 章节自绘</text></svg>