<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 事务与锁</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">快照读不幻，当前读要锁</text><text x="48" y="146" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">RR 解决幻读的两条腿：MVCC 管快照读，间隙锁管当前读</text><rect x="48" y="180" width="500" height="130" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="180" width="4" height="130" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="66" y="214" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">快照读（普通 SELECT）</text><text x="66" y="248" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">读的是事务开始时的 ReadView</text><text x="66" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">→ 新插入的行本来就不可见</text><rect x="572" y="180" width="500" height="130" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="572" y="180" width="4" height="130" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="590" y="214" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">当前读（FOR UPDATE / UPDATE）</text><text x="590" y="248" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">读最新已提交版本 + 加 next-key 锁</text><text x="590" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">→ 锁住间隙，插入被阻塞</text><text x="48" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">performance_schema.data_locks 的 LOCK_MODE 速查</text><rect x="48" y="366" width="1024" height="36" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="402" x2="1072" y2="402" stroke="rgba(120,170,255,0.22)"/><text x="62" y="390" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">LOCK_MODE</text><text x="298" y="390" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">类型</text><text x="468" y="390" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">锁住什么</text><text x="688" y="390" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">什么时候出现</text><rect x="48" y="402" width="1024" height="36" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="438" x2="1072" y2="438" stroke="rgba(120,170,255,0.22)"/><text x="62" y="426" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">X</text><text x="298" y="426" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">next-key</text><text x="468" y="426" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">记录 + 前面的间隙</text><text x="688" y="426" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">RR 下范围/非唯一索引</text><rect x="48" y="438" width="1024" height="36" fill="transparent"/><line x1="48" y1="474" x2="1072" y2="474" stroke="rgba(120,170,255,0.22)"/><text x="62" y="462" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">X,REC_NOT_GAP</text><text x="298" y="462" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">记录锁</text><text x="468" y="462" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">仅该记录</text><text x="688" y="462" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">唯一索引等值命中</text><rect x="48" y="474" width="1024" height="36" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="510" x2="1072" y2="510" stroke="rgba(120,170,255,0.22)"/><text x="62" y="498" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">X,GAP</text><text x="298" y="498" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">间隙锁</text><text x="468" y="498" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">记录之间的空隙</text><text x="688" y="498" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">范围边界</text><rect x="48" y="510" width="1024" height="36" fill="transparent"/><line x1="48" y1="546" x2="1072" y2="546" stroke="rgba(120,170,255,0.22)"/><text x="62" y="534" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">X,INSERT_INTENTION</text><text x="298" y="534" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">插入意向</text><text x="468" y="534" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">目标间隙</text><text x="688" y="534" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">INSERT 等待时</text><text x="48" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">RC 下间隙锁关闭：能减少死锁，但防重必须靠唯一约束</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 锁视图与幻行章节自绘</text></svg>