<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 性能与优化</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">深翻页的两种改写</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">LIMIT 500000, 20 要把前 50 万行都读出来再丢掉</text><rect x="56" y="208" width="568" height="210" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="208" width="4" height="210" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="76" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">原始写法（越翻越慢）</text><text x="76" y="276" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SELECT * FROM t_order</text><text x="76" y="300" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">ORDER BY id LIMIT 500000, 20;</text><text x="76" y="334" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">扫描 50 万 + 20 行，丢弃 50 万</text><text x="76" y="366" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">耗时随页码线性增长</text><text x="76" y="396" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">ORDER BY 非索引列时还要 filesort</text><rect x="656" y="208" width="568" height="210" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="656" y="208" width="4" height="210" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="676" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">游标法（keyset）</text><text x="676" y="276" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SELECT * FROM t_order</text><text x="676" y="300" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">WHERE id &gt; 500000 ORDER BY id LIMIT 20;</text><text x="676" y="334" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">直接从上一页最后一条之后开始</text><text x="676" y="366" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">每页成本恒定，不随页码增长</text><text x="676" y="396" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">代价：只能顺序翻，不能跳页</text><rect x="56" y="446" width="1168" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="446" width="4" height="96" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="76" y="476" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">折中：延迟关联（deferred join）</text><text x="76" y="504" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SELECT * FROM t_order o JOIN (SELECT id FROM t_order ORDER BY id LIMIT 500000, 20) t USING (id);</text><text x="76" y="530" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">子查询里只走覆盖索引取 id，外层按 20 个 id 回表，扫描量仍在但 IO 少很多</text><text x="56" y="588" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">能改游标就改游标；前端必须跳页时用延迟关联，并把页码上限设死</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 LIMIT 优化与延迟关联实践自绘</text></svg>