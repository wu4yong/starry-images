<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1120" height="620" fill="url(#g1)"/><rect width="1120" height="620" fill="url(#grid)"/>
<rect width="1120" height="620" fill="url(#glow)"/><rect width="1120" height="620" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 性能与优化</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">四类改写的对照</text><text x="48" y="146" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">改写的目标只有一个：让每一段都能走索引，且不做多余的去重</text><rect x="48" y="172" width="1024" height="44" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="216" x2="1072" y2="216" stroke="rgba(120,170,255,0.22)"/><text x="96" y="200" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">原写法</text><text x="348" y="200" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">问题</text><text x="668" y="200" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">改写成</text><text x="948" y="200" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">注意</text><rect x="48" y="216" width="1024" height="44" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="260" x2="1072" y2="260" stroke="rgba(120,170,255,0.22)"/><text x="96" y="244" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">a = 1 OR b = 2</text><text x="348" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">可能走 index_merge</text><text x="668" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">UNION ALL 两段</text><text x="948" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">各自能走索引</text><rect x="48" y="260" width="1024" height="44" fill="transparent"/><line x1="48" y1="304" x2="1072" y2="304" stroke="rgba(120,170,255,0.22)"/><text x="96" y="288" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">NOT IN (子查询)</text><text x="348" y="288" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">NULL 导致结果为空</text><text x="668" y="288" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">NOT EXISTS / LEFT JOIN</text><text x="948" y="288" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">确认列 NOT NULL</text><rect x="48" y="304" width="1024" height="44" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="348" x2="1072" y2="348" stroke="rgba(120,170,255,0.22)"/><text x="96" y="332" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">IN (子查询)</text><text x="348" y="332" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">旧版物化临时表</text><text x="668" y="332" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">EXISTS 或 JOIN</text><text x="948" y="332" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">8.0 有 semijoin</text><rect x="48" y="348" width="1024" height="44" fill="transparent"/><line x1="48" y1="392" x2="1072" y2="392" stroke="rgba(120,170,255,0.22)"/><text x="96" y="376" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">UNION</text><text x="348" y="376" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">强制去重建临时表</text><text x="668" y="376" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">UNION ALL</text><text x="948" y="376" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">确认无重复语义</text><rect x="48" y="392" width="1024" height="44" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="436" x2="1072" y2="436" stroke="rgba(120,170,255,0.22)"/><text x="96" y="420" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">COUNT(DISTINCT)</text><text x="348" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">大表全扫去重</text><text x="668" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">近似统计或预聚合</text><text x="948" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">业务能否接受误差</text><text x="48" y="468" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">OR 改写示例</text><text x="48" y="500" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SELECT ... WHERE status = 1 UNION ALL SELECT ... WHERE status = 2 AND type = 3;</text><text x="48" y="530" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">子查询优先考虑 EXISTS：相关子查询一旦命中就短路，且不受 NULL 语义影响</text><text x="48" y="556" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">改写后必须用 EXPLAIN 逐段验证，别凭经验替换</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 子查询优化 / UNION 说明自绘</text></svg>