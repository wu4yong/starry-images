<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 存储引擎与内部</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">数据到底存在哪些文件里</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">系统表空间、独立表空间、undo、临时、redo——各管一段</text><rect x="456" y="206" width="368" height="64" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="456" y="206" width="4" height="64" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="640" y="246" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3ddcff" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1">InnoDB 存储</text><path d="M640 270 L166 300" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><rect x="56" y="300" width="220" height="160" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="300" width="4" height="160" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="72" y="334" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">系统表空间</text><text x="72" y="362" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">ibdata1</text><text x="72" y="396" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">数据字典 + change buffer</text><path d="M640 270 L402 300" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><rect x="292" y="300" width="220" height="160" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="292" y="300" width="4" height="160" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="308" y="334" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">独立表空间</text><text x="308" y="362" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">表名.ibd</text><text x="308" y="396" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">每表一文件，可单表迁移</text><path d="M640 270 L638 300" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><rect x="528" y="300" width="220" height="160" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="528" y="300" width="4" height="160" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="544" y="334" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">undo 表空间</text><text x="544" y="362" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">undo_001/002</text><text x="544" y="396" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">回滚与 MVCC 旧版本</text><path d="M640 270 L874 300" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><rect x="764" y="300" width="220" height="160" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="764" y="300" width="4" height="160" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="780" y="334" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">临时表空间</text><text x="780" y="362" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">ibtmp1 / temp_*.ibt</text><text x="780" y="396" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">排序、临时结果</text><path d="M640 270 L1110 300" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><rect x="1000" y="300" width="220" height="160" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="1000" y="300" width="4" height="160" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="1016" y="334" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">redo 日志</text><text x="1016" y="362" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">#innodb_redo</text><text x="1016" y="396" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">崩溃恢复前滚日志</text><rect x="56" y="492" width="1168" height="100" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="492" width="4" height="100" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="76" y="524" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">双写缓冲（doublewrite）：脏页先写一份连续副本，防止页断裂；8.0.20 起可放独立文件</text><text x="76" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">表空间可以单独加密、单独迁移；系统表空间一旦建库就不能轻易缩容</text><text x="76" y="574" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">容量排查顺序：表 .ibd 大小 → undo 表空间 → binlog 目录 → redo 目录</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB Tablespaces / Doublewrite 说明自绘</text></svg>