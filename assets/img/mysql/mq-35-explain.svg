<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 性能与优化</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">EXPLAIN 只回答一个问题</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">优化器准备怎么执行这条 SQL：走哪个索引、扫多少行、还要不要再过滤</text><rect x="56" y="200" width="1168" height="44" fill="rgba(61,220,255,0.10)"/><line x1="56" y1="244" x2="1224" y2="244" stroke="rgba(120,170,255,0.22)"/><text x="76" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">id</text><text x="176" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">select_type</text><text x="306" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">table</text><text x="428" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">type</text><text x="546" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">key</text><text x="666" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">rows</text><text x="786" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">filtered</text><text x="906" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Extra</text><rect x="56" y="244" width="1168" height="44" fill="rgba(255,255,255,0.03)"/><line x1="56" y1="288" x2="1224" y2="288" stroke="rgba(120,170,255,0.22)"/><text x="76" y="272" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">1</text><text x="176" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SIMPLE</text><text x="306" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">o</text><text x="428" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">ref</text><text x="546" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">idx_user_status</text><text x="666" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">1200</text><text x="786" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">100.00</text><text x="906" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Using where</text><rect x="56" y="288" width="1168" height="44" fill="transparent"/><line x1="56" y1="332" x2="1224" y2="332" stroke="rgba(120,170,255,0.22)"/><text x="76" y="316" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">1</text><text x="176" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SIMPLE</text><text x="306" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">i</text><text x="428" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">eq_ref</text><text x="546" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">PRIMARY</text><text x="666" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">1</text><text x="786" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">100.00</text><text x="906" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Using index</text><text x="56" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">读法：先看 type 判断访问方式，再看 key 是否命中预期索引，最后看 rows × filtered 估实际处理行数</text><rect x="56" y="386" width="272" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="386" width="4" height="150" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="72" y="422" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">type</text><text x="72" y="454" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">访问类型，决定快慢</text><text x="72" y="484" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">const / eq_ref / ref</text><text x="72" y="506" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">range / index / ALL</text><rect x="352" y="386" width="272" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="352" y="386" width="4" height="150" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="368" y="422" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">key</text><text x="368" y="454" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">实际用上的索引</text><text x="368" y="484" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">NULL 表示没走索引</text><rect x="648" y="386" width="272" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="386" width="4" height="150" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="664" y="422" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">rows × filtered</text><text x="664" y="454" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">预估扫描行数</text><text x="664" y="484" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">相乘才是真实代价量级</text><rect x="944" y="386" width="272" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="944" y="386" width="4" height="150" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="960" y="422" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Extra</text><text x="960" y="454" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">额外动作信号</text><text x="960" y="484" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">filesort / temporary 要警惕</text><text x="56" y="578" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">EXPLAIN 是估算，不是实测；要看真实耗时用 EXPLAIN ANALYZE</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 EXPLAIN Output Format 章节自绘</text></svg>