<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 运维与安全</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">安全加固的三条主线</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">链路加密、注入防护、账号隔离 —— 一条断了两条白搭</text><rect x="56" y="206" width="366" height="190" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="206" width="4" height="190" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="76" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">① 链路加密 TLS</text><text x="76" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">require_secure_transport=ON</text><text x="76" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">服务端证书 + CA 校验</text><text x="76" y="342" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">客户端 sslMode=VERIFY_CA</text><rect x="446" y="206" width="366" height="190" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="446" y="206" width="4" height="190" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="466" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">② 注入防护</text><text x="466" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">预编译参数化，永不拼串</text><text x="466" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">最小权限兜底</text><text x="466" y="342" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">审计可疑 SQL 模式</text><rect x="836" y="206" width="366" height="190" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="836" y="206" width="4" height="190" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="856" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">③ 账号隔离</text><text x="856" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">读写/只读/运维分账号</text><text x="856" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">网络层只放应用网段</text><text x="856" y="342" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">高危操作走审批流水线</text><text x="56" y="424" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">加固清单（摘）</text><text x="56" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">新实例默认按清单上线，而不是出事后再补</text><rect x="56" y="464" width="1168" height="40" fill="rgba(61,220,255,0.10)"/><line x1="56" y1="504" x2="1224" y2="504" stroke="rgba(120,170,255,0.22)"/><text x="56" y="490" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">项</text><text x="356" y="490" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">做法</text><text x="676" y="490" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">验证</text><text x="956" y="490" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">风险</text><rect x="56" y="504" width="1168" height="40" fill="rgba(255,255,255,0.03)"/><line x1="56" y1="544" x2="1224" y2="544" stroke="rgba(120,170,255,0.22)"/><text x="56" y="530" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">TLS 强制</text><text x="356" y="530" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">require_secure_transport=ON</text><text x="676" y="530" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">SHOW VARIABLES</text><text x="956" y="530" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">明文抓包</text><rect x="56" y="544" width="1168" height="40" fill="transparent"/><line x1="56" y1="584" x2="1224" y2="584" stroke="rgba(120,170,255,0.22)"/><text x="56" y="570" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">账号口令</text><text x="356" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">caching_sha2_password + 轮换</text><text x="676" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">mysql.user 插件列</text><text x="956" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">弱口令爆破</text><rect x="56" y="584" width="1168" height="40" fill="rgba(255,255,255,0.03)"/><line x1="56" y1="624" x2="1224" y2="624" stroke="rgba(120,170,255,0.22)"/><text x="56" y="610" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">网络边界</text><text x="356" y="610" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">bind-address + 安全组</text><text x="676" y="610" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">nmap 外网扫描</text><text x="956" y="610" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">公网暴露</text><rect x="56" y="624" width="1168" height="40" fill="transparent"/><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(120,170,255,0.22)"/><text x="56" y="650" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">审计日志</text><text x="356" y="650" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">audit_log 插件或代理审计</text><text x="676" y="650" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">抽查高危语句</text><text x="956" y="650" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">内鬼操作无痕</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 Security / TLS 说明自绘</text></svg>