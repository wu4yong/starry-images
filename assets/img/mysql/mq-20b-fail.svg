<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 事务与锁</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">从「列值被改写」到「区间无法定位」</text><text x="48" y="146" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">优化器只认 col op const 这种形状，其余一律退回扫描</text><rect x="48" y="182" width="316" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="182" width="4" height="96" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="64" y="218" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">SQL 写法</text><text x="64" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">列上套函数 / 类型不匹配</text><path d="M366 230 L392 230 M386 225 L392 230 L386 235" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="396" y="182" width="316" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="396" y="182" width="4" height="96" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="412" y="218" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">索引键被破坏</text><text x="412" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">有序性丢失</text><path d="M714 230 L740 230 M734 225 L740 230 L734 235" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="744" y="182" width="316" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="744" y="182" width="4" height="96" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="760" y="218" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">只能全扫</text><text x="760" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">type=ALL / index</text><text x="48" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">八条改写路径</text><rect x="48" y="332" width="1024" height="32" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="364" x2="1072" y2="364" stroke="rgba(120,170,255,0.22)"/><text x="62" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">原写法</text><text x="258" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">改写</text><text x="518" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据</text><rect x="48" y="364" width="1024" height="32" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="396" x2="1072" y2="396" stroke="rgba(120,170,255,0.22)"/><text x="62" y="386" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">DATE(col) = d</text><text x="258" y="386" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">col &gt;= d AND col &lt; d+1</text><text x="518" y="386" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">半开区间</text><rect x="48" y="396" width="1024" height="32" fill="transparent"/><line x1="48" y1="428" x2="1072" y2="428" stroke="rgba(120,170,255,0.22)"/><text x="62" y="418" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">col = 数字</text><text x="258" y="418" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">col = '字符串'</text><text x="518" y="418" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">类型对齐</text><rect x="48" y="428" width="1024" height="32" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="460" x2="1072" y2="460" stroke="rgba(120,170,255,0.22)"/><text x="62" y="450" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">LIKE '%x%'</text><text x="258" y="450" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">LIKE 'x%' / FULLTEXT</text><text x="518" y="450" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">前缀有序</text><rect x="48" y="460" width="1024" height="32" fill="transparent"/><line x1="48" y1="492" x2="1072" y2="492" stroke="rgba(120,170,255,0.22)"/><text x="62" y="482" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">a=1 OR b=2</text><text x="258" y="482" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">UNION ALL 两条</text><text x="518" y="482" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">各自走索引</text><rect x="48" y="492" width="1024" height="32" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="524" x2="1072" y2="524" stroke="rgba(120,170,255,0.22)"/><text x="62" y="514" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">只查 b（idx a,b）</text><text x="258" y="514" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">a=1 AND b=?</text><text x="518" y="514" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">最左前缀</text><rect x="48" y="524" width="1024" height="32" fill="transparent"/><line x1="48" y1="556" x2="1072" y2="556" stroke="rgba(120,170,255,0.22)"/><text x="62" y="546" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">a &gt; 10 AND b = 2</text><text x="258" y="546" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">把等值列放前</text><text x="518" y="546" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">范围后列失效</text><text x="48" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">8.0.13 起可建函数索引兜住 DATE()/LOWER() 这类写法，表达式必须完全一致</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 优化器与函数索引章节自绘</text></svg>