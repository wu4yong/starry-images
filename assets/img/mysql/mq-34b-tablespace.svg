" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不能</text><text x="910" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">只能扩容，不可缩容</text><rect x="48" y="272" width="1024" height="48" fill="transparent"/><line x1="48" y1="320" x2="1072" y2="320" stroke="rgba(120,170,255,0.22)"/><text x="96" y="302" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">t_order.ibd</text><text x="348" y="302" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">独立表空间</text><text x="668" y="302" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">随表删</text><text x="910" y="302" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">可单表迁移、压缩</text><rect x="48" y="320" width="1024" height="48" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="368" x2="1072" y2="368" stroke="rgba(120,170,255,0.22)"/><text x="96" y="350" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">undo_001/002</text><text x="348" y="350" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">undo 表空间</text><text x="668" y="350" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不能</text><text x="910" y="350" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SET INACTIVE 后自动截断</text><rect x="48" y="368" width="1024" height="48" fill="transparent"/><line x1="48" y1="416" x2="1072" y2="416" stroke="rgba(120,170,255,0.22)"/><text x="96" y="398" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">ibtmp1</text><text x="348" y="398" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">全局临时</text><text x="668" y="398" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">重启重建</text><text x="910" y="398" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">异常膨胀时重启回收</text><rect x="48" y="416" width="1024" height="48" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="464" x2="1072" y2="464" stroke="rgba(120,170,255,0.22)"/><text x="96" y="446" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">binlog.000xxx</text><text x="348" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Server 层</text><text x="668" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">可按策略清</text><text x="910" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">PURGE BINARY LOGS</text><text x="48" y="496" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">独立表空间迁移（同版本、同页大小）</text><text x="48" y="528" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">FLUSH TABLES t_order FOR EXPORT;  拷贝 .ibd 与 .cfg → UNLOCK TABLES → 目标库 IMPORT TABLESPACE</text><text x="48" y="560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">注意：源表在导出期间只读；目标表结构必须完全一致，否则导入失败</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 Tablespace Management 说明自绘</text></svg>