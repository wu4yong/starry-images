ngFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">延迟的三个常见来源</text><rect x="48" y="396" width="320" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="396" width="4" height="118" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="68" y="426" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">① 大事务</text><text x="68" y="454" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">一次更新 50 万行，回放只能整段等</text><text x="68" y="482" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">拆批 + 控制单事务行数</text><rect x="388" y="396" width="320" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="388" y="396" width="4" height="118" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="408" y="426" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0">② DDL 与元数据锁</text><text x="408" y="454" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">从库 DDL 期间后续事件全排队</text><text x="408" y="482" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">用 INSTANT / gh-ost 缩短窗口</text><rect x="728" y="396" width="344" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="728" y="396" width="4" height="118" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="748" y="426" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0">③ 从库资源不足</text><text x="748" y="454" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">buffer pool 小、磁盘慢、CPU 被抢占</text><text x="748" y="482" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">从库规格不低于主库</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 Replication Threads / WRITESET 说明自绘</text></svg>