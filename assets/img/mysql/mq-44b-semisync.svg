ff" font-weight="400" text-anchor="start" letter-spacing="0">按库（database）</text><text x="438" y="224" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">多库分写</text><text x="628" y="224" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">单库无法并行</text><text x="808" y="224" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">slave_parallel_workers</text><rect x="48" y="238" width="1024" height="40" fill="transparent"/><line x1="48" y1="278" x2="1072" y2="278" stroke="rgba(120,170,255,0.22)"/><text x="48" y="264" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">5.7</text><text x="228" y="264" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">LOGICAL_CLOCK</text><text x="438" y="264" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">单库高并发写入</text><text x="628" y="264" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">依赖组提交</text><text x="808" y="264" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">slave_parallel_type</text><rect x="48" y="278" width="1024" height="40" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="318" x2="1072" y2="318" stroke="rgba(120,170,255,0.22)"/><text x="48" y="304" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" 