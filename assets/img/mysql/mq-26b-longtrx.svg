<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 事务与锁</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">一个长事务如何把 undo 拖成历史</text><text x="48" y="146" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">purge 只能清「早于所有活跃事务」的版本，最老那个决定水位</text><rect x="48" y="180" width="238" height="104" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="180" width="4" height="104" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="64" y="218" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">T1 开启</text><text x="64" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">拿到 trx_id</text><path d="M288 232 L308 232 M302 227 L308 232 L302 237" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="310" y="180" width="238" height="104" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="310" y="180" width="4" height="104" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="326" y="218" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">别人反复更新</text><text x="326" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">每改一次加一条 undo</text><path d="M550 232 L570 232 M564 227 L570 232 L564 237" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="572" y="180" width="238" height="104" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="572" y="180" width="4" height="104" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="588" y="218" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">purge 停在水位下</text><text x="588" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">历史版本越堆越长</text><path d="M812 232 L832 232 M826 227 L832 232 L826 237" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="834" y="180" width="238" height="104" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="834" y="180" width="4" height="104" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="850" y="218" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">水位终于前移</text><text x="850" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">批量清理，IO 抖动</text><rect x="48" y="320" width="1024" height="46" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="366" x2="1072" y2="366" stroke="rgba(120,170,255,0.22)"/><text x="96" y="349" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">做法</text><text x="348" y="349" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SQL 侧</text><text x="748" y="349" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">优点</text><text x="988" y="349" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">注意</text><rect x="48" y="366" width="1024" height="46" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="412" x2="1072" y2="412" stroke="rgba(120,170,255,0.22)"/><text x="96" y="395" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">分批提交</text><text x="348" y="395" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">WHERE id &gt; ? LIMIT 500</text><text x="748" y="395" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">undo 可控</text><text x="988" y="395" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">需可重入</text><rect x="48" y="412" width="1024" height="46" fill="transparent"/><line x1="48" y1="458" x2="1072" y2="458" stroke="rgba(120,170,255,0.22)"/><text x="96" y="441" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">按主键区间</text><text x="348" y="441" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">id BETWEEN a AND b</text><text x="748" y="441" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">范围可预估</text><text x="988" y="441" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">区间要均匀</text><rect x="48" y="458" width="1024" height="46" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="504" x2="1072" y2="504" stroke="rgba(120,170,255,0.22)"/><text x="96" y="487" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">异步化</text><text x="348" y="487" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">写队列，后台消费</text><text x="748" y="487" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">前台事务短</text><text x="988" y="487" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">要保证最终一致</text><rect x="48" y="504" width="1024" height="46" fill="transparent"/><line x1="48" y1="550" x2="1072" y2="550" stroke="rgba(120,170,255,0.22)"/><text x="96" y="533" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">只读分开</text><text x="348" y="533" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">REPEATABLE READ 只读事务</text><text x="748" y="533" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不占写锁</text><text x="988" y="533" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">仍持有快照</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB Multi-Versioning / purge 说明自绘</text></svg>