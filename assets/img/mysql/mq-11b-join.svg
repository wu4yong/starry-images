="#cfe4ff" opacity="0.26"/><circle cx="302.2" cy="310.1" r="0.74" fill="#cfe4ff" opacity="0.17"/><circle cx="909.4" cy="176.5" r="0.94" fill="#cfe4ff" opacity="0.39"/><circle cx="377.1" cy="516.0" r="1.11" fill="#cfe4ff" opacity="0.38"/><circle cx="141.7" cy="578.0" r="0.54" fill="#cfe4ff" opacity="0.46"/><circle cx="210.7" cy="150.5" r="0.56" fill="#cfe4ff" opacity="0.22"/><circle cx="483.7" cy="567.5" r="1.21" fill="#cfe4ff" opacity="0.51"/><circle cx="126.0" cy="345.9" r="0.73" fill="#cfe4ff" opacity="0.48"/><circle cx="219.2" cy="193.9" r="1.30" fill="#cfe4ff" opacity="0.47"/><circle cx="656.1" cy="90.0" r="0.47" fill="#cfe4ff" opacity="0.18"/><circle cx="392.8" cy="494.4" r="0.57" fill="#cfe4ff" opacity="0.14"/><circle cx="979.3" cy="393.8" r="0.96" fill="#cfe4ff" opacity="0.59"/><circle cx="991.1" cy="203.0" r="0.60" fill="#cfe4ff" opacity="0.43"/><circle cx="72.8" cy="344.4" r="1.07" fill="#cfe4ff" opacity="0.31"/><circle cx="210.2" cy="353.0" r="0.92" fill="#cfe4ff" opacity="0.44"/><circle cx="577.5" cy="226.4" r="1.48" fill="#cfe4ff" opacity="0.18"/><circle cx="842.6" cy="510.3" r="1.12" fill="#cfe4ff" opacity="0.40"/><circle cx="38.3" cy="57.0" r="0.62" fill="#cfe4ff" opacity="0.27"/><circle cx="574.5" cy="459.4" r="1.11" fill="#cfe4ff" opacity="0.13"/><circle cx="953.6" cy="210.8" r="1.48" fill="#cfe4ff" opacity="0.48"/><circle cx="991.4" cy="347.6" r="0.41" fill="#cfe4ff" opacity="0.29"/><circle cx="637.2" cy="93.9" r="0.69" fill="#cfe4ff" opacity="0.31"/><circle cx="1097.4" cy="126.1" r="0.75" fill="#cfe4ff" opacity="0.44"/><circle cx="404.5" cy="211.9" r="0.71" fill="#cfe4ff" opacity="0.36"/>
<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">三种连接算法与被驱动表索引</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">有索引走嵌套循环，没索引可能走 hash join</text><rect x="48" y="112" width="1024" height="66" rx="11" fill="#5eead410" stroke="#5eead4" stroke-width="1.3"/><text x="70" y="136" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">Nested Loop</text><text x="70" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">被驱动表连接列有索引</text><text x="420" y="136" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">ref / eq_ref，逐行取</text><text x="760" y="136" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">最常见，代价最低</text><rect x="48" y="188" width="1024" height="66" rx="11" fill="#38bdf810" stroke="#38bdf8" stroke-width="1.3"/><text x="70" y="212" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">Hash Join</text><text x="70" y="238" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">等值连接且无可用索引</text><text x="420" y="212" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">建哈希表再探测</text><text x="760" y="212" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">8.0.18 起，吃内存</text><rect x="48" y="264" width="1024" height="66" rx="11" fill="#f8717110" stroke="#f87171" stroke-width="1.3"/><text x="70" y="288" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">Block Nested Loop</text><text x="70" y="314" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">无索引、无哈希条件</text><text x="420" y="288" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">块缓冲逐块扫</text><text x="760" y="288" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">8.0 前的老路径，慢</text><rect x="48" y="352" width="496" height="156" rx="12" fill="rgba(251,191,36,0.05)" stroke="#fbbf24" stroke-width="1.5"/><text x="66" y="380" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">ON 与 WHERE 的分界</text><text x="66" y="414" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">ON 是连接条件，未匹配仍保留</text><text x="66" y="441" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">WHERE 过滤结果，NULL 行被丢弃</text><text x="66" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">LEFT JOIN + WHERE 右表 = INNER</text><rect x="576" y="352" width="496" height="156" rx="12" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.5"/><text x="594" y="380" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">连接列必须同型同规则</text><text x="594" y="414" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">VARCHAR 连 INT → 隐式转换，索引失效</text><text x="594" y="441" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">字符集/排序规则不同 → 报错或失效</text><text x="594" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">深分页先分页主表再关联</text><text x="48" y="534" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">EXPLAIN FORMAT=TREE 直接给连接树与算法，比看表格快。</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">依据 MySQL 8.4 JOIN / Hash Join / Optimizer 章节自绘</text></svg>