<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 存储引擎与内部</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">为什么生产只剩 InnoDB</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">事务、行锁、崩溃恢复、MVCC——四件事只有一个引擎全给</text><rect x="56" y="214" width="568" height="168" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="214" width="4" height="168" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="76" y="256" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">InnoDB</text><line x1="76" y1="274" x2="604" y2="274" stroke="rgba(120,170,255,0.22)"/><text x="76" y="310" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">事务 + 行锁 + MVCC + 崩溃恢复</text><text x="76" y="336" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">默认引擎，绝大多数业务</text><text x="76" y="362" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">适用：核心交易、订单、账务</text><rect x="648" y="214" width="568" height="168" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="214" width="4" height="168" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="668" y="256" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">MyISAM</text><line x1="668" y1="274" x2="1196" y2="274" stroke="rgba(120,170,255,0.22)"/><text x="668" y="310" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">表锁、无事务、崩溃易损坏</text><text x="668" y="336" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">只读历史表</text><text x="668" y="362" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">适用：只读日志、历史报表</text><rect x="56" y="404" width="568" height="168" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="404" width="4" height="168" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="76" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Memory</text><line x1="76" y1="464" x2="604" y2="464" stroke="rgba(120,170,255,0.22)"/><text x="76" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">全内存、表锁、重启丢数据</text><text x="76" y="526" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">临时缓存、会话表</text><text x="76" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">适用：临时表、计数器</text><rect x="648" y="404" width="568" height="168" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="404" width="4" height="168" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="668" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Archive</text><line x1="668" y1="464" x2="1196" y2="464" stroke="rgba(120,170,255,0.22)"/><text x="668" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">只插不改、高压缩、仅自增索引</text><text x="668" y="526" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">归档日志</text><text x="668" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">适用：冷数据归档</text><text x="56" y="616" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">判断口诀：要事务就要 InnoDB；要压缩归档选 Archive；Memory 只当缓存用</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 Storage Engines 章节自绘</text></svg>