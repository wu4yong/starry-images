<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1120" height="620" fill="url(#g1)"/><rect width="1120" height="620" fill="url(#grid)"/>
<rect width="1120" height="620" fill="url(#glow)"/><rect width="1120" height="620" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 高可用与架构</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="100" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">主从延迟的度量与处置</text><text x="48" y="132" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">Seconds_Behind_Source 不是唯一指标，也不是最准的</text><rect x="48" y="158" width="1024" height="42" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="200" x2="1072" y2="200" stroke="rgba(120,170,255,0.22)"/><text x="48" y="185" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">指标</text><text x="368" y="185" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">含义</text><text x="668" y="185" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">局限</text><text x="908" y="185" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">建议</text><rect x="48" y="200" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="242" x2="1072" y2="242" stroke="rgba(120,170,255,0.22)"/><text x="48" y="227" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Seconds_Behind_Source</text><text x="368" y="227" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">回放落后主库多少秒</text><text x="668" y="227" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">只看 applier，忽略 IO 段</text><text x="908" y="227" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">配合 Relay_Log_Space</text><rect x="48" y="242" width="1024" height="42" fill="transparent"/><line x1="48" y1="284" x2="1072" y2="284" stroke="rgba(120,170,255,0.22)"/><text x="48" y="269" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Relay_Log_Space</text><text x="368" y="269" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">尚未回放的 relay log 体积</text><text x="668" y="269" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">不含网络在途</text><text x="908" y="269" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">GB 级增长要查拉取</text><rect x="48" y="284" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="326" x2="1072" y2="326" stroke="rgba(120,170,255,0.22)"/><text x="48" y="311" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">GTID 差值</text><text x="368" y="311" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">主库 executed - 从库 executed</text><text x="668" y="311" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">需解析集合</text><text x="908" y="311" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">最可靠的一致性判断</text><rect x="48" y="326" width="1024" height="42" fill="transparent"/><line x1="48" y1="368" x2="1072" y2="368" stroke="rgba(120,170,255,0.22)"/><text x="48" y="353" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">心跳表时间差</text><text x="368" y="353" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">业务表写入时间戳对比</text><text x="668" y="353" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">需额外表</text><text x="908" y="353" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">端到端延迟最直观</text><rect x="48" y="384" width="500" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="384" width="4" height="150" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="68" y="416" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0">延迟飙升时的三步止血</text><text x="68" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">1. 先确认是哪一段落后（拉取/回放/DDL）</text><text x="68" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">2. 停掉大事务与批量任务，避免继续放大</text><text x="68" y="502" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">3. 只读流量切回主库或摘除该从库</text><rect x="572" y="384" width="500" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="572" y="384" width="4" height="150" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="592" y="416" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">长期治理</text><text x="592" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">并行度调到与 CPU 匹配（WRITESET）</text><text x="592" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">单事务行数 &lt; 1 万，批量提交</text><text x="592" y="502" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">从库规格不低于主库，延迟阈值进告警</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 复制延迟监控说明自绘</text></svg>