<text x="64" y="96" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="40" font-weight="700" fill="#f4f8ff" text-anchor="start" dominant-baseline="middle">内置函数：字符串、日期与 JSON</text><text x="64" y="146" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">函数本身不慢，包住索引列才慢</text><rect x="64" y="190" width="214.4" height="82" rx="10" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="1.4"/><text x="171.2" y="216" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">字符串</text><text x="171.2" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">CONCAT / SUBSTRING</text><rect x="298.4" y="190" width="214.4" height="82" rx="10" fill="rgba(56,189,248,0.08)" stroke="#5eead4" stroke-width="1.4"/><text x="405.59999999999997" y="216" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">日期</text><text x="405.59999999999997" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">区间优于函数</text><rect x="532.8" y="190" width="214.4" height="82" rx="10" fill="rgba(56,189,248,0.08)" stroke="#fbbf24" stroke-width="1.4"/><text x="640" y="216" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">JSON</text><text x="640" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">-&gt;&gt; / JSON_TABLE</text><rect x="767.2" y="190" width="214.4" height="82" rx="10" fill="rgba(56,189,248,0.08)" stroke="#a78bfa" stroke-width="1.4"/><text x="874.4000000000001" y="216" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">函数索引</text><text x="874.4000000000001" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">8.0.13 起</text><rect x="1001.6" y="190" width="214.4" height="82" rx="10" fill="rgba(56,189,248,0.08)" stroke="#f87171" stroke-width="1.4"/><text x="1108.8" y="216" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#f87171" text-anchor="middle" dominant-baseline="middle">隐式转换</text><text x="1108.8" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">索引杀手</text><rect x="64" y="306" width="564" height="240" rx="14" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.6" opacity="0.95"/><text x="84" y="338" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">字符串与日期的要点</text><text x="84" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">LENGTH 是字节，CHAR_LENGTH 是字符</text><text x="84" y="398" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">CONCAT 遇 NULL 返回 NULL</text><text x="84" y="426" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">GROUP_CONCAT 默认 1024 字节上限</text><text x="84" y="454" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">日期过滤改写为半开区间</text><text x="84" y="482" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">NOW() 与 UTC_TIMESTAMP() 别混用</text><rect x="652" y="306" width="564" height="240" rx="14" fill="rgba(167,139,250,0.05)" stroke="#a78bfa" stroke-width="1.6" opacity="0.95"/><text x="672" y="338" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">JSON 的读写与索引</text><text x="672" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">-&gt; 取文档，-&gt;&gt; 取值并去引号</text><text x="672" y="398" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">JSON_SET / INSERT / REPLACE 语义不同</text><text x="672" y="426" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">JSON_TABLE 把数组展开成行</text><text x="672" y="454" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">JSON_CONTAINS / OVERLAPS 判包含</text><text x="672" y="482" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">要索引就抽 STORED 生成列</text><line x1="64" y1="660" x2="1216" y2="660" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="64" y="686" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">依据 MySQL 8.4 Functions / JSON Functions / CREATE INDEX 章节自绘</text></svg>