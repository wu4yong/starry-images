<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="100" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">关键参数与推荐口径</text><text x="48" y="132" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">默认值是按「最小可用」设的，生产必须按容量重算</text><rect x="48" y="158" width="1024" height="42" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="200" x2="1072" y2="200" stroke="rgba(120,170,255,0.22)"/><text x="48" y="185" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">参数</text><text x="348" y="185" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">默认</text><text x="568" y="185" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">生产口径</text><text x="728" y="185" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">看什么指标</text><text x="908" y="185" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">风险</text><rect x="48" y="200" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="242" x2="1072" y2="242" stroke="rgba(120,170,255,0.22)"/><text x="48" y="227" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">innodb_buffer_pool_size</text><text x="348" y="227" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">128MB</text><text x="568" y="227" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">物理内存 50%~70%</text><text x="728" y="227" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">缓冲池命中率</text><text x="908" y="227" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">过大导致系统换页</text><rect x="48" y="242" width="1024" height="42" fill="transparent"/><line x1="48" y1="284" x2="1072" y2="284" stroke="rgba(120,170,255,0.22)"/><text x="48" y="269" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">innodb_buffer_pool_instances</text><text x="348" y="269" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">8</text><text x="568" y="269" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">&lt;1GB 时设 1</text><text x="728" y="269" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">实例内锁竞争</text><text x="908" y="269" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">过多反而碎片化</text><rect x="48" y="284" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="326" x2="1072" y2="326" stroke="rgba(120,170,255,0.22)"/><text x="48" y="311" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">innodb_flush_log_at_trx_commit</text><text x="348" y="311" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">1</text><text x="568" y="311" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">1（不变）</text><text x="728" y="311" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">提交延迟</text><text x="908" y="311" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">改 0/2 会丢事务</text><rect x="48" y="326" width="1024" height="42" fill="transparent"/><line x1="48" y1="368" x2="1072" y2="368" stroke="rgba(120,170,255,0.22)"/><text x="48" y="353" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">sync_binlog</text><text x="348" y="353" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">1</text><text x="568" y="353" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">1</text><text x="728" y="353" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">写入吞吐</text><text x="908" y="353" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">改 0 会丢 binlog</text><rect x="48" y="368" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="410" x2="1072" y2="410" stroke="rgba(120,170,255,0.22)"/><text x="48" y="395" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">innodb_redo_log_capacity</text><text x="348" y="395" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">约 100MB</text><text x="568" y="395" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">按写入量 × 1 小时</text><text x="728" y="395" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">LSN 间隔</text><text x="908" y="395" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">过小频繁刷盘</text><rect x="48" y="410" width="1024" height="42" fill="transparent"/><line x1="48" y1="452" x2="1072" y2="452" stroke="rgba(120,170,255,0.22)"/><text x="48" y="437" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">max_connections</text><text x="348" y="437" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">151</text><text x="568" y="437" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">按峰值连接 × 1.2</text><text x="728" y="437" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Threads_running</text><text x="908" y="437" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">过大放大内存占用</text><text x="48" y="478" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0">buffer pool 估算：热点数据总量 × 1.2 ≤ 池大小；剩余留给 OS 与连接内存</text><text x="48" y="508" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">验证 SQL：SELECT ... FROM performance_schema.global_status WHERE VARIABLE_NAME LIKE 'Innodb_buffer_pool%'</text><text x="48" y="544" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">所有参数写进 my.cnf 的 [mysqld]，随镜像发布；不要在生产 SET GLOBAL 长期生效</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 Server System Variables 说明自绘</text></svg>