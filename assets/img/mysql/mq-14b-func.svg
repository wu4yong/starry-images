<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">三类常用函数与索引影响</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">同一个函数，用在 SELECT 还是 WHERE 结果不同</text><rect x="48" y="112" width="1024" height="46" rx="9" fill="#38bdf810" stroke="#38bdf8" stroke-width="1.1"/><text x="68" y="136" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">CONCAT / CONCAT_WS</text><text x="400" y="136" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.8" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">拼接，WS 跳过 NULL</text><text x="740" y="136" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">拼接列不影响索引</text><rect x="48" y="166" width="1024" height="46" rx="9" fill="#5eead410" stroke="#5eead4" stroke-width="1.1"/><text x="68" y="190" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">LENGTH / CHAR_LENGTH</text><text x="400" y="190" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.8" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">字节 vs 字符（中文 6 vs 2）</text><text x="740" y="190" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">别用来做长度过滤</text><rect x="48" y="220" width="1024" height="46" rx="9" fill="#5eead410" stroke="#5eead4" stroke-width="1.1"/><text x="68" y="244" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">SUBSTRING_INDEX</text><text x="400" y="244" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.8" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">按分隔符取第 N 段</text><text x="740" y="244" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">解析 URL、标签常用</text><rect x="48" y="274" width="1024" height="46" rx="9" fill="#fbbf2410" stroke="#fbbf24" stroke-width="1.1"/><text x="68" y="298" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">DATE_FORMAT</text><text x="400" y="298" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.8" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">格式化展示</text><text x="740" y="298" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">过滤改区间，别包列</text><rect x="48" y="328" width="1024" height="46" rx="9" fill="#fbbf2410" stroke="#fbbf24" stroke-width="1.1"/><text x="68" y="352" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">DATE_ADD / SUB</text><text x="400" y="352" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.8" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">日期加减</text><text x="740" y="352" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">WHERE 里可用于常量</text><rect x="48" y="382" width="1024" height="46" rx="9" fill="#a78bfa10" stroke="#a78bfa" stroke-width="1.1"/><text x="68" y="406" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">JSON_EXTRACT / -&gt;&gt;</text><text x="400" y="406" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.8" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">取 JSON 值</text><text x="740" y="406" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">要索引就落生成列</text><rect x="48" y="436" width="1024" height="46" rx="9" fill="#a78bfa10" stroke="#a78bfa" stroke-width="1.1"/><text x="68" y="460" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">JSON_TABLE</text><text x="400" y="460" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.8" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">数组展开成行</text><text x="740" y="460" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">比应用层循环解析省事</text><text x="48" y="512" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#f87171" text-anchor="start" dominant-baseline="middle">索引影响：函数作用在索引列上 → 有序性失效；解药是生成列或 8.0.13 起的函数索引。</text><text x="48" y="540" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">时区：NOW() 按会话时区，UTC_TIMESTAMP() 取 UTC；跨时区统计先统一再比。</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">依据 MySQL 8.4 String / Date and Time / JSON Functions 章节自绘</text></svg>