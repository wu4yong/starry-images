<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 性能与优化</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">回表是二级索引的固定成本</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">二级索引只存索引列 + 主键，要其它列就得再回聚簇索引查一次</text><text x="56" y="216" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">要回表：SELECT * 或查未进索引的列</text><rect x="56" y="240" width="276" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="240" width="4" height="92" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="72" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">二级索引</text><text x="72" y="308" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">user_id → 主键</text><path d="M334 286 L354 286 M348 281 L354 286 L348 291" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="356" y="240" width="276" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="356" y="240" width="4" height="92" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="372" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">聚簇索引</text><text x="372" y="308" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">按主键取整行</text><path d="M634 286 L654 286 M648 281 L654 286 L648 291" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="656" y="240" width="276" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="656" y="240" width="4" height="92" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="672" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">返回结果</text><text x="672" y="308" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">拼装投影列</text><text x="56" y="380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不回表：覆盖索引，查询列全在索引里</text><rect x="56" y="404" width="276" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="404" width="4" height="92" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="72" y="438" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">二级索引</text><text x="72" y="472" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">含 user_id, status, created_at</text><path d="M334 450 L354 450 M348 445 L354 450 L348 455" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="356" y="404" width="276" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="356" y="404" width="4" height="92" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="372" y="438" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">直接返回</text><text x="372" y="472" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Extra: Using index</text><rect x="704" y="380" width="520" height="116" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="704" y="380" width="4" height="116" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="724" y="412" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">覆盖索引的代价</text><text x="724" y="444" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">索引变宽、写入变慢、占用更多内存</text><text x="724" y="472" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">只给高频查询做覆盖，别给每张表都堆</text><text x="56" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">判断标准：EXPLAIN 的 Extra 出现 Using index 才是真覆盖；Using index condition 只是 ICP</text><text x="56" y="578" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">优化顺序：消 filesort → 消临时表 → 减少回表 → 收敛扫描行数</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 Covering Index / ICP 说明自绘</text></svg>