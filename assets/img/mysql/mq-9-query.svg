<text x="64" y="96" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="40" font-weight="700" fill="#f4f8ff" text-anchor="start" dominant-baseline="middle">单表查询：WHERE、排序、分页</text><text x="64" y="146" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">语法简单，索引容易悄悄失效</text><rect x="64" y="190" width="214.4" height="82" rx="10" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="1.4"/><text x="171.2" y="216" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">WHERE</text><text x="171.2" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">能走索引</text><rect x="298.4" y="190" width="214.4" height="82" rx="10" fill="rgba(56,189,248,0.08)" stroke="#5eead4" stroke-width="1.4"/><text x="405.59999999999997" y="216" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">NULL</text><text x="405.59999999999997" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">三值逻辑</text><rect x="532.8" y="190" width="214.4" height="82" rx="10" fill="rgba(56,189,248,0.08)" stroke="#fbbf24" stroke-width="1.4"/><text x="640" y="216" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">ORDER BY</text><text x="640" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">索引顺序一致</text><rect x="767.2" y="190" width="214.4" height="82" rx="10" fill="rgba(56,189,248,0.08)" stroke="#a78bfa" stroke-width="1.4"/><text x="874.4000000000001" y="216" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">LIMIT</text><text x="874.4000000000001" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">游标优于 offset</text><rect x="1001.6" y="190" width="214.4" height="82" rx="10" fill="rgba(56,189,248,0.08)" stroke="#f87171" stroke-width="1.4"/><text x="1108.8" y="216" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#f87171" text-anchor="middle" dominant-baseline="middle">隐式转换</text><text x="1108.8" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">索引杀手</text><rect x="64" y="306" width="564" height="240" rx="14" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.6" opacity="0.95"/><text x="84" y="338" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">五种索引失效写法</text><text x="84" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">函数包住列：DATE(created_at)</text><text x="84" y="398" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">字符串列与数字比较</text><text x="84" y="426" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">前导通配符 LIKE %x%</text><text x="84" y="454" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">两侧排序规则不一致</text><text x="84" y="482" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">OR 连接不同列</text><rect x="652" y="306" width="564" height="240" rx="14" fill="rgba(251,191,36,0.05)" stroke="#fbbf24" stroke-width="1.6" opacity="0.95"/><text x="672" y="338" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">排序与分页的三条结论</text><text x="672" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">ORDER BY 顺序与索引一致 → 免 filesort</text><text x="672" y="398" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">混合升降序：8.0 起可建 DESC 索引</text><text x="672" y="426" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">深翻页：延迟关联或游标分页</text><text x="672" y="454" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">EXPLAIN 只看 type / key / Extra</text><text x="672" y="482" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">COUNT(*) 与 COUNT(col) 口径不同</text><line x1="64" y1="660" x2="1216" y2="660" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="64" y="686" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">依据 MySQL 8.4 SELECT / Optimizer / EXPLAIN Output 章节自绘</text></svg>