<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 存储引擎与内部</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">一个页就是 16KB 的集装箱</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">B+Tree 的节点是页，不是行；一次 IO 至少读一页</text><rect x="56" y="222" width="96" height="96" fill="#4a9dff" fill-opacity="0.14" stroke="#4a9dff" stroke-opacity="0.55"/><text x="104" y="264" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#4a9dff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">File Header</text><text x="104" y="292" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">38B</text><rect x="152" y="222" width="130" height="96" fill="#3ddcff" fill-opacity="0.14" stroke="#3ddcff" stroke-opacity="0.55"/><text x="217" y="264" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ddcff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">Page Header</text><text x="217" y="292" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">56B</text><rect x="282" y="222" width="180" height="96" fill="#8ba3c7" fill-opacity="0.14" stroke="#8ba3c7" stroke-opacity="0.55"/><text x="372" y="264" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">Infimum + Supremum</text><text x="372" y="292" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">26B</text><rect x="462" y="222" width="330" height="96" fill="#3ee6a2" fill-opacity="0.14" stroke="#3ee6a2" stroke-opacity="0.55"/><text x="627" y="264" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">User Records</text><text x="627" y="292" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">数据行</text><rect x="792" y="222" width="210" height="96" fill="#ffc861" fill-opacity="0.14" stroke="#ffc861" stroke-opacity="0.55"/><text x="897" y="264" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ffc861" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">Free Space</text><text x="897" y="292" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">空闲</text><rect x="1002" y="222" width="160" height="96" fill="#b388ff" fill-opacity="0.14" stroke="#b388ff" stroke-opacity="0.55"/><text x="1082" y="264" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#b388ff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">Page Directory</text><text x="1082" y="292" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">槽位</text><rect x="1162" y="222" width="62" height="96" fill="#ff6b8a" fill-opacity="0.14" stroke="#ff6b8a" stroke-opacity="0.55"/><text x="1193" y="264" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ff6b8a" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">File Trailer</text><text x="1193" y="292" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">8B</text><text x="56" y="352" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">实际使用：User Records 为一串按主键有序的单向链表，Page Directory 存每 6 条的槽位</text><rect x="56" y="390" width="360" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="390" width="4" height="150" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="76" y="424" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">页内寻址</text><text x="76" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">记录头 5 字节：变长长度、NULL 位图、</text><text x="76" y="480" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">delete_flag、heap_no、next_record</text><text x="76" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">→ 页内是链表，跨页靠 B+Tree 指针</text><rect x="448" y="390" width="360" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="448" y="390" width="4" height="150" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="468" y="424" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">页大小不可改</text><text x="468" y="456" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">innodb_page_size：4K / 8K / 16K / 32K / 64K</text><text x="468" y="484" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">只能在初始化实例时指定</text><text x="468" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">16K 是默认，也是绝大多数生产的选择</text><rect x="840" y="390" width="384" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="840" y="390" width="4" height="150" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="860" y="424" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">为什么是 16KB</text><text x="860" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SSD 页 4K，16K 一次顺序读仍划算；</text><text x="860" y="480" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">页太大：读放大、刷脏慢；</text><text x="860" y="504" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">页太小：B+Tree 层数增加、IO 次数上升。</text><text x="56" y="588" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">估算：一行 100B，一页约 150 行；三层 B+Tree 能撑千万级</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB Page Structure / innodb_page_size 说明自绘</text></svg>