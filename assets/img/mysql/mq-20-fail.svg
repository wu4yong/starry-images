<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 事务与锁</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">八种让索引失效的写法</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">索引失效只有一种原因：让 B+Tree 的有序性用不上</text><rect x="56" y="226" width="276" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="226" width="4" height="156" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="72" y="260" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.8">01</text><text x="104" y="260" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">列上函数</text><text x="72" y="298" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">DATE(created_at) = ?</text><line x1="72" y1="318" x2="316" y2="318" stroke="rgba(120,170,255,0.22)"/><text x="72" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">改写：改半开区间</text><rect x="352" y="226" width="276" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="352" y="226" width="4" height="156" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="368" y="260" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.8">02</text><text x="400" y="260" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">隐式转换</text><text x="368" y="298" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">phone = 13800000000</text><line x1="368" y1="318" x2="612" y2="318" stroke="rgba(120,170,255,0.22)"/><text x="368" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">改写：常量转成字符串</text><rect x="648" y="226" width="276" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="226" width="4" height="156" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="664" y="260" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.8">03</text><text x="696" y="260" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">前导通配</text><text x="664" y="298" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">LIKE '%手机%'</text><line x1="664" y1="318" x2="908" y2="318" stroke="rgba(120,170,255,0.22)"/><text x="664" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">改写：改 '手机%' 或全文索引</text><rect x="944" y="226" width="276" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="944" y="226" width="4" height="156" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="960" y="260" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.8">04</text><text x="992" y="260" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">OR 接无索引列</text><text x="960" y="298" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">a = 1 OR b = 2</text><line x1="960" y1="318" x2="1204" y2="318" stroke="rgba(120,170,255,0.22)"/><text x="960" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">改写：拆 UNION ALL</text><rect x="56" y="402" width="276" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="402" width="4" height="156" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="72" y="436" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.8">05</text><text x="104" y="436" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">跳过最左前缀</text><text x="72" y="474" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">idx(a,b) 只查 b</text><line x1="72" y1="494" x2="316" y2="494" stroke="rgba(120,170,255,0.22)"/><text x="72" y="524" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">改写：补前缀或 Skip Scan</text><rect x="352" y="402" width="276" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="352" y="402" width="4" height="156" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="368" y="436" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.8">06</text><text x="400" y="436" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">字符集不一致</text><text x="368" y="474" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">general_ci 连 0900_ai_ci</text><line x1="368" y1="494" x2="612" y2="494" stroke="rgba(120,170,255,0.22)"/><text x="368" y="524" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">改写：统一排序规则</text><rect x="648" y="402" width="276" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="402" width="4" height="156" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="664" y="436" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.8">07</text><text x="696" y="436" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">否定条件</text><text x="664" y="474" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">status &lt;&gt; 2</text><line x1="664" y1="494" x2="908" y2="494" stroke="rgba(120,170,255,0.22)"/><text x="664" y="524" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">改写：转肯定枚举</text><rect x="944" y="402" width="276" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="944" y="402" width="4" height="156" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="960" y="436" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.8">08</text><text x="992" y="436" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">范围后列失效</text><text x="960" y="474" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">a &gt; 10 AND b = 2</text><line x1="960" y1="494" x2="1204" y2="494" stroke="rgba(120,170,255,0.22)"/><text x="960" y="524" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">改写：等值列前置</text><text x="56" y="596" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">判断依据只看 EXPLAIN：type 退了、rows 暴涨、key 为 NULL，就是失效</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 Range Optimization / Index Merge 章节自绘</text></svg>