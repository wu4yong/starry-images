e x1="356" y1="226" x2="359" y2="226" stroke="#4a9dff" stroke-width="0"/><rect x="356" y="226" width="4" height="150" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="376" y="272" font-family="Consolas,'Courier New',monospace" font-size="24" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">2NF</text><text x="376" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">无部分依赖</text><text x="376" y="344" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">联合主键里不单独依赖某一列</text><path d="M636 302 L650 302 L644 297 M650 302 L644 307" stroke="#3ddcff" stroke-width="2" fill="none"/><rect x="656" y="226" width="276" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><line x1="656" y1="226" x2="659" y2="226" stroke="#3ee6a2" stroke-width="0"/><rect x="656" y="226" width="4" height="150" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="676" y="272" font-family="Consolas,'Courier New',monospace" font-size="24" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">3NF</text><text x="676" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">无传递依赖</text><text x="676" y="344" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">A→B→C 时 C 不该留在 A 的边</text><path d="M936 302 L950 302 L944 297 M950 302 L944 307" stroke="#3ddcff" stroke-width="2" fill="none"/><rect x="956" y="226" width="276" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><line x1="956" y1="226" x2="959" y2="226" stroke="#b388ff" stroke-width="0"/><rect x="956" y="226" width="4" height="150" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="976" y="272" font-family="Consolas,'Courier New',monospace" font-size="24" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">BCNF</text><text x="976" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">决定因素即候选键</text><text x="976" y="344" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">3NF 的加强版</text><text x="56" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">不范式会带来三类异常</text><rect x="56" y="440" width="372" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><line x1="56" y1="440" x2="59" y2="440" stroke="#ff6b8a" stroke-width="0"/><rect x="56" y="440" width="4" height="92" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="74" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">更新异常</text><text x="74" y="504" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">用户改城市，100 条订单都要改，漏一条就不一致</text><rect x="452" y="440" width="372" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><line x1="452" y1="440" x2="455" y2="440" stroke="#ff6b8a" stroke-width="0"/><rect x="452" y="440" width="4" height="92" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="470" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">插入异常</text><text x="470" y="504" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">想登记新用户，没有订单就没地方放</text><rect x="848" y="440" width="372" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><line x1="848" y1="440" x2="851" y2="440" stroke="#ff6b8a" stroke-width="0"/><rect x="848" y="440" width="4" height="92" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="866" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">删除异常</text><text x="866" y="504" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">删掉最后一条订单，用户信息跟着消失</text><text x="56" y="590" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">反范式的三种合法形态：展示字段冗余 / 下单快照 / 预聚合宽表</text><text x="56" y="622" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">三问：读远多于写吗？业务允许过期吗？失败有对账吗？</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据关系模型范式理论与 MySQL 8.4 索引实践自绘</text></svg>