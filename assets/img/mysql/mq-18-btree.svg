<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs><rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/><rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/><text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 表设计与索引</text><line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">一棵 B+Tree，两类索引</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">聚簇索引叶子存整行，二级索引叶子存主键，回表就是再查一次树</text><rect x="360" y="236" width="150" height="46" rx="8" fill="rgba(61,220,255,0.14)" stroke="#3ddcff"/><text x="435" y="266" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">根页</text><rect x="200" y="328" width="180" height="40" rx="8" fill="rgba(74,157,255,0.12)" stroke="#4a9dff" stroke-opacity="0.7"/><text x="290" y="356" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#4a9dff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">分支页 1</text><path d="M435 282 L290 328" stroke="rgba(120,170,255,0.22)" stroke-width="1.6"/><rect x="460" y="328" width="180" height="40" rx="8" fill="rgba(74,157,255,0.12)" stroke="#4a9dff" stroke-opacity="0.7"/><text x="550" y="356" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#4a9dff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">分支页 2</text><path d="M435 282 L550 328" stroke="rgba(120,170,255,0.22)" stroke-width="1.6"/><rect x="186" y="420" width="112" height="56" rx="7" fill="rgba(62,230,162,0.10)" stroke="#3ee6a2" stroke-opacity="0.55"/><text x="242" y="442" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">叶子页</text><rect x="194" y="450" width="96" height="16" rx="3" fill="#3ee6a2" fill-opacity="0.18"/><path d="M290 368 L242 420" stroke="rgba(120,170,255,0.22)" stroke-width="1.4"/><rect x="314" y="420" width="112" height="56" rx="7" fill="rgba(62,230,162,0.10)" stroke="#3ee6a2" stroke-opacity="0.55"/><text x="370" y="442" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">叶子页</text><rect x="322" y="450" width="96" height="16" rx="3" fill="#3ee6a2" fill-opacity="0.18"/><path d="M290 368 L370 420" stroke="rgba(120,170,255,0.22)" stroke-width="1.4"/><rect x="466" y="420" width="112" height="56" rx="7" fill="rgba(62,230,162,0.10)" stroke="#3ee6a2" stroke-opacity="0.55"/><text x="522" y="442" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">叶子页</text><rect x="474" y="450" width="96" height="16" rx="3" fill="#3ee6a2" fill-opacity="0.18"/><path d="M550 368 L522 420" stroke="rgba(120,170,255,0.22)" stroke-width="1.4"/><rect x="594" y="420" width="112" height="56" rx="7" fill="rgba(62,230,162,0.10)" stroke="#3ee6a2" stroke-opacity="0.55"/><text x="650" y="442" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">叶子页</text><rect x="602" y="450" width="96" height="16" rx="3" fill="#3ee6a2" fill-opacity="0.18"/><path d="M550 368 L650 420" stroke="rgba(120,170,255,0.22)" stroke-width="1.4"/><text x="240" y="516" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">叶子之间双向链表，范围查询靠它扫区间</text><rect x="720" y="236" width="504" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><line x1="720" y1="236" x2="723" y2="236" stroke="#3ddcff" stroke-width="0"/><rect x="720" y="236" width="4" height="118" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="740" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">16 KB 页 · 3 层能撑亿级行</text><text x="740" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">分支页约 1170 指针，叶子页约 160 行</text><text x="740" y="332" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">1170 × 1170 × 160 ≈ 2.1 亿行</text><rect x="720" y="370" width="504" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><line x1="720" y1="370" x2="723" y2="370" stroke="#3ee6a2" stroke-width="0"/><rect x="720" y="370" width="4" height="118" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="740" y="406" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">一次等值查询 = ≤3 次页访问</text><text x="740" y="440" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">根页常驻 Buffer Pool，实际 IO 更少</text><text x="740" y="466" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">回表 = 二级索引 1 次 + 聚簇索引 1 次</text><rect x="720" y="504" width="504" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><line x1="720" y1="504" x2="723" y2="504" stroke="#ffc861" stroke-width="0"/><rect x="720" y="504" width="4" height="96" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="740" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">选择性 = cardinality / 行数</text><text x="740" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">低于 0.1 的列单独建索引基本无效</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB Index Types 与 B+Tree 组织方式自绘</text></svg>