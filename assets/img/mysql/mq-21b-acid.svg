<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1120" height="620" fill="url(#g1)"/><rect width="1120" height="620" fill="url(#grid)"/>
<rect width="1120" height="620" fill="url(#glow)"/><rect width="1120" height="620" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 事务与锁</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">RR 与 RC 的差别只有一句话</text><text x="48" y="146" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">快照什么时候建：RR 建一次用到底，RC 每次读都重建</text><text x="48" y="196" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">时间轴：同一事务内的两次读</text><rect x="48" y="212" width="1024" height="4" fill="rgba(120,170,255,0.22)"/><circle cx="150" cy="214" r="6" fill="#3ddcff"/><text x="110" y="246" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">T1 第一次读</text><circle cx="470" cy="214" r="6" fill="#3ddcff"/><text x="430" y="246" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">别人提交</text><circle cx="760" cy="214" r="6" fill="#3ddcff"/><text x="720" y="246" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">T2 第二次读</text><rect x="48" y="268" width="500" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="268" width="4" height="150" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="66" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">REPEATABLE READ（默认）</text><text x="66" y="336" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">ReadView 在 T1 建立，T2 复用</text><text x="66" y="366" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">→ 两次读到同一快照</text><text x="66" y="396" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">→ 不可重复读与幻读都看不到</text><rect x="572" y="268" width="500" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="572" y="268" width="4" height="150" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="590" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">READ COMMITTED</text><text x="590" y="336" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">T2 重新建 ReadView</text><text x="590" y="366" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">→ 能看到别人刚提交的修改</text><text x="590" y="396" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">→ 间隙锁关闭，可能幻读</text><rect x="48" y="440" width="1024" height="36" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="476" x2="1072" y2="476" stroke="rgba(120,170,255,0.22)"/><text x="62" y="464" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">读法</text><text x="298" y="464" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">语句</text><text x="518" y="464" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">RR 下读什么</text><text x="738" y="464" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">RC 下读什么</text><rect x="48" y="476" width="1024" height="36" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="512" x2="1072" y2="512" stroke="rgba(120,170,255,0.22)"/><text x="62" y="500" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">快照读</text><text x="298" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SELECT</text><text x="518" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">事务首个快照</text><text x="738" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">每次新建快照</text><rect x="48" y="512" width="1024" height="36" fill="transparent"/><line x1="48" y1="548" x2="1072" y2="548" stroke="rgba(120,170,255,0.22)"/><text x="62" y="536" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">当前读</text><text x="298" y="536" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">FOR UPDATE</text><text x="518" y="536" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">最新版本 + 锁</text><text x="738" y="536" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">最新版本 + 锁</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 Consistent Nonlocking Reads / 隔离级别自绘</text></svg>