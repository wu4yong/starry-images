<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs><rect width="1120" height="620" fill="url(#g1)"/><rect width="1120" height="620" fill="url(#grid)"/><rect width="1120" height="620" fill="url(#glow)"/><rect width="1120" height="620" fill="url(#glow2)"/><text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 表设计与索引</text><line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">少回表的三种手段：覆盖、下推、跳过扫描</text><text x="48" y="146" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">它们解决的不是同一个问题：覆盖是不回表，ICP 是少回表，Skip Scan 是能走索引</text><text x="48" y="200" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">ICP：把能判断的条件推到引擎层</text><rect x="48" y="220" width="268" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><line x1="48" y1="220" x2="51" y2="220" stroke="#ffc861" stroke-width="0"/><rect x="48" y="220" width="4" height="92" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="64" y="256" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">读索引项</text><text x="64" y="288" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">zipcode=95054</text><path d="M320 266 L340 266" stroke="#8ba3c7" stroke-width="2"/><rect x="348" y="220" width="268" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><line x1="348" y1="220" x2="351" y2="220" stroke="#ffc861" stroke-width="0"/><rect x="348" y="220" width="4" height="92" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="364" y="256" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">引擎内过滤</text><text x="364" y="288" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">lastname LIKE</text><path d="M620 266 L640 266" stroke="#8ba3c7" stroke-width="2"/><rect x="648" y="220" width="268" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><line x1="648" y1="220" x2="651" y2="220" stroke="#3ee6a2" stroke-width="0"/><rect x="648" y="220" width="4" height="92" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="664" y="256" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">通过才回表</text><text x="664" y="288" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">读 address</text><rect x="48" y="344" width="320" height="144" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><line x1="48" y1="344" x2="51" y2="344" stroke="#3ee6a2" stroke-width="0"/><rect x="48" y="344" width="4" height="144" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="66" y="382" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">覆盖索引</text><text x="66" y="416" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SELECT 只取索引里的列</text><text x="66" y="446" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Extra: Using index</text><text x="66" y="472" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.9">代价：索引变宽</text><rect x="388" y="344" width="320" height="144" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><line x1="388" y1="344" x2="391" y2="344" stroke="#ffc861" stroke-width="0"/><rect x="388" y="344" width="4" height="144" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="406" y="382" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">索引下推 ICP</text><text x="406" y="416" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">范围后列仍能在引擎层过滤</text><text x="406" y="446" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Extra: Using index condition</text><text x="406" y="472" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.9">只对二级索引有效</text><rect x="728" y="344" width="320" height="144" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><line x1="728" y1="344" x2="731" y2="344" stroke="#3ddcff" stroke-width="0"/><rect x="728" y="344" width="4" height="144" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="746" y="382" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Skip Scan</text><text x="746" y="416" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">前缀列基数低时可跳过</text><text x="746" y="446" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Extra: Using index for skip scan</text><text x="746" y="472" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.9">8.0.13 起，条件苛刻</text><text x="48" y="528" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">索引不是越多越好：每个索引都在为写入付代价，定期用 sys.schema_redundant_indexes 清理</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 ICP、Skip Scan 与 Index Merge 章节自绘</text></svg>