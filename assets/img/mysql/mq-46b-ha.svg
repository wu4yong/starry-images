<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 高可用与架构</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="100" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">MGR 的三节点与两种模式</text><text x="48" y="132" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">多数派是硬约束：三节点才能容忍一台故障</text><rect x="80" y="176" width="260" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="80" y="176" width="4" height="96" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="104" y="212" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">Node A</text><text x="104" y="242" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">PRIMARY</text><rect x="410" y="176" width="260" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="410" y="176" width="4" height="96" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="434" y="212" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">Node B</text><text x="434" y="242" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">SECONDARY</text><rect x="740" y="176" width="260" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="740" y="176" width="4" height="96" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="764" y="212" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">Node C</text><text x="764" y="242" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">SECONDARY</text><path d="M340 224 L410 224" stroke="rgba(120,170,255,0.22)" stroke-width="1.5"/><path d="M670 224 L740 224" stroke="rgba(120,170,255,0.22)" stroke-width="1.5"/><text x="48" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">一份事务在三个节点各自认证（certify），多数派通过才提交；单主模式下只有 PRIMARY 接受写</text><rect x="48" y="322" width="1024" height="38" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="360" x2="1072" y2="360" stroke="rgba(120,170,255,0.22)"/><text x="48" y="347" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">对比项</text><text x="288" y="347" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">单主模式</text><text x="528" y="347" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">多主模式</text><text x="748" y="347" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">注意</text><rect x="48" y="360" width="1024" height="38" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="398" x2="1072" y2="398" stroke="rgba(120,170,255,0.22)"/><text x="48" y="385" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">写入入口</text><text x="288" y="385" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">仅 PRIMARY</text><text x="528" y="385" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">任一节点</text><text x="748" y="385" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">多主易冲突，慎用</text><rect x="48" y="398" width="1024" height="38" fill="transparent"/><line x1="48" y1="436" x2="1072" y2="436" stroke="rgba(120,170,255,0.22)"/><text x="48" y="423" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">冲突处理</text><text x="288" y="423" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">无需</text><text x="528" y="423" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">靠 certify 与回滚</text><text x="748" y="423" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">自增主键/唯一键易冲突</text><rect x="48" y="436" width="1024" height="38" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="474" x2="1072" y2="474" stroke="rgba(120,170,255,0.22)"/><text x="48" y="461" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">读扩展</text><text x="288" y="461" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">SECONDARY 可读</text><text x="528" y="461" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">各节点都可读</text><text x="748" y="461" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">读一致性需自行控制</text><rect x="48" y="474" width="1024" height="38" fill="transparent"/><line x1="48" y1="512" x2="1072" y2="512" stroke="rgba(120,170,255,0.22)"/><text x="48" y="499" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">故障容忍</text><text x="288" y="499" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">N-1 / 2 台</text><text x="528" y="499" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">N-1 / 2 台</text><text x="748" y="499" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">三节点最多容忍 1 台</text><text x="48" y="542" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">group_replication_group_name 必须唯一；节点需一致的 server_id 与 GTID 模式</text><text x="48" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0">网络要求：节点间延迟 &lt; 数毫秒，跨机房部署需评估认证耗时对写入的影响</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 Group Replication 说明自绘</text></svg>