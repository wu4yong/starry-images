<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 性能与优化</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="100" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">连接顺序怎么排</text><text x="48" y="132" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">小结果集在前，被驱动表连接列有索引</text><rect x="48" y="158" width="500" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="158" width="4" height="132" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="68" y="190" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0">差：大表驱动</text><text x="68" y="220" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">t_order 1000 万行驱动 t_user</text><text x="68" y="248" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">→ 探测 1000 万次，回表 1000 万次</text><text x="68" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">EXPLAIN：t_order 在前，rows 巨大</text><rect x="572" y="158" width="500" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="572" y="158" width="4" height="132" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="592" y="190" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">好：小表驱动</text><text x="592" y="220" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">t_user 2 万行驱动 t_order</text><text x="592" y="248" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">→ 探测 2 万次，走 idx_user_id</text><text x="592" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0">LEFT JOIN 例外：外表固定为驱动表</text><text x="48" y="320" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">四个能立刻动手的改写</text><rect x="48" y="332" width="1024" height="42" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="374" x2="1072" y2="374" stroke="rgba(120,170,255,0.22)"/><text x="48" y="359" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">问题</text><text x="348" y="359" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">现象（EXPLAIN）</text><text x="668" y="359" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">改写</text><text x="908" y="359" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">收益</text><rect x="48" y="374" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="416" x2="1072" y2="416" stroke="rgba(120,170,255,0.22)"/><text x="48" y="401" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">被驱动表没索引</text><text x="348" y="401" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Extra: Using join buffer</text><text x="668" y="401" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">给连接列加索引</text><text x="908" y="401" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">BNL → NLJ</text><rect x="48" y="416" width="1024" height="42" fill="transparent"/><line x1="48" y1="458" x2="1072" y2="458" stroke="rgba(120,170,255,0.22)"/><text x="48" y="443" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">驱动表过大</text><text x="348" y="443" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">第一张表 rows 很高</text><text x="668" y="443" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">先聚合/先过滤再 JOIN</text><text x="908" y="443" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">探测次数降一个量级</text><rect x="48" y="458" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="500" x2="1072" y2="500" stroke="rgba(120,170,255,0.22)"/><text x="48" y="485" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">多表串联</text><text x="348" y="485" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">靠后表的 rows 爆涨</text><text x="668" y="485" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">调整 JOIN 顺序或拆两段</text><text x="908" y="485" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">中间结果集变小</text><rect x="48" y="500" width="1024" height="42" fill="transparent"/><line x1="48" y1="542" x2="1072" y2="542" stroke="rgba(120,170,255,0.22)"/><text x="48" y="527" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">大表 JOIN 大表</text><text x="348" y="527" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">type 均为 ALL</text><text x="668" y="527" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">改用 Hash Join 或预聚合宽表</text><text x="908" y="527" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">避免逐行探测</text><text x="48" y="562" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0">验证：改完必须重跑 EXPLAIN，确认第一张表变了、join buffer 消失</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 Nested Loop / Hash Join 说明自绘</text></svg>