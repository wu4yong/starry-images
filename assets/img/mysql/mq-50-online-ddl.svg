<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 运维与安全</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">在线 DDL 的三档算法</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">INSTANT 只改元数据，COPY 要重建整表 —— 差的是几小时</text><rect x="56" y="206" width="366" height="190" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="206" width="4" height="190" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="76" y="244" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">INSTANT</text><text x="76" y="280" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">只改数据字典</text><text x="76" y="310" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">秒级完成，几乎不锁表</text><text x="76" y="340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">8.0.12+ 支持加列等场景</text><rect x="446" y="206" width="366" height="190" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="446" y="206" width="4" height="190" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="466" y="244" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">INPLACE</text><text x="466" y="280" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">原地重建，不拷贝到临时表</text><text x="466" y="310" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">允许并发 DML，需 rebuild</text><text x="466" y="340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">加索引/改列顺序常用</text><rect x="836" y="206" width="366" height="190" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="836" y="206" width="4" height="190" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="856" y="244" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">COPY</text><text x="856" y="280" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">建临时表 → 拷贝 → 改名</text><text x="856" y="310" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">全程锁写，最慢</text><text x="856" y="340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">改列类型/字符集常走这档</text><text x="56" y="436" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">大表还想更平滑：用工具代替原生 DDL</text><rect x="56" y="454" width="566" height="120" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="454" width="4" height="120" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="76" y="484" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0">gh-ost</text><text x="76" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">影子表 + binlog 追平，可暂停、可限速，对主库压力可控</text><text x="76" y="542" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">需要 binlog，且不能与触发器的表混用</text><rect x="648" y="454" width="576" height="120" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="454" width="4" height="120" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="668" y="484" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">pt-online-schema-change</text><text x="668" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">触发器同步新表，分块拷贝，支持限速与检查</text><text x="668" y="542" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">触发器会带来额外开销，高写入表需评估</text><text x="56" y="612" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">上线前必做：在同等数据量的预发库跑一遍，记录耗时与锁等待</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 Online DDL / INSTANT 说明自绘</text></svg>