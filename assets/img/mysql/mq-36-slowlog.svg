<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 性能与优化</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">先抓到那条慢 SQL</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">慢日志负责发现，聚合工具负责排序，EXPLAIN 负责归因</text><rect x="56" y="206" width="272" height="112" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="206" width="4" height="112" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="72" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">① 开启慢日志</text><text x="72" y="280" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">slow_query_log = ON</text><path d="M330 262 L350 262 M344 257 L350 262 L344 267" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="352" y="206" width="272" height="112" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="352" y="206" width="4" height="112" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="368" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">② 定阈值</text><text x="368" y="280" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">long_query_time = 0.2</text><path d="M626 262 L646 262 M640 257 L646 262 L640 267" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="648" y="206" width="272" height="112" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="206" width="4" height="112" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="664" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">③ 聚合排序</text><text x="664" y="280" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">pt-query-digest 按总耗时排</text><path d="M922 262 L942 262 M936 257 L942 262 L936 267" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="944" y="206" width="272" height="112" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="944" y="206" width="4" height="112" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="960" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">④ 复盘归因</text><text x="960" y="280" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">EXPLAIN ANALYZE 看真实耗时</text><rect x="56" y="352" width="1168" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="352" width="4" height="96" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="76" y="380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">一条慢日志长这样</text><text x="76" y="410" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1"># Query_time: 3.812  Lock_time: 0.001  Rows_sent: 20  Rows_examined: 480000</text><text x="76" y="434" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SET timestamp=1670000000; SELECT * FROM t_order WHERE user_id = 100 ORDER BY created_at DESC LIMIT 20;</text><rect x="56" y="472" width="272" height="112" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="472" width="4" height="112" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="72" y="506" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">long_query_time</text><text x="72" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">默认 10 秒，线上按 P95 定</text><rect x="352" y="472" width="272" height="112" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="352" y="472" width="4" height="112" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="368" y="506" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">log_queries_not_using_indexes</text><text x="368" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">记录未走索引的语句</text><rect x="648" y="472" width="272" height="112" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="472" width="4" height="112" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="664" y="506" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">min_examined_row_limit</text><text x="664" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">扫描行数下限，过滤噪音</text><rect x="944" y="472" width="272" height="112" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="944" y="472" width="4" height="112" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="960" y="506" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">log_slow_extra</text><text x="960" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">8.0.14+ 输出更多字段</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 Slow Query Log 说明自绘</text></svg>