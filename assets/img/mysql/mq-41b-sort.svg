<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1120" height="620" fill="url(#g1)"/><rect width="1120" height="620" fill="url(#grid)"/>
<rect width="1120" height="620" fill="url(#glow)"/><rect width="1120" height="620" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 性能与优化</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="100" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">GROUP BY 的三种走法</text><text x="48" y="132" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">能用索引就別用临时表，能给常量就别让优化器猜</text><rect x="48" y="158" width="320" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="158" width="4" height="150" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="68" y="190" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">① 索引有序扫描</text><text x="68" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">分组列是索引最左前缀</text><text x="68" y="248" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">逐段聚合，无临时表</text><text x="68" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">Extra 无 Using temporary</text><rect x="388" y="158" width="320" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="388" y="158" width="4" height="150" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="408" y="190" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">② 临时表 + 排序</text><text x="408" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">分组列无索引可用</text><text x="408" y="248" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">建内部临时表再聚合</text><text x="408" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">Extra: Using temporary</text><rect x="728" y="158" width="344" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="728" y="158" width="4" height="150" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="748" y="190" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0">③ 磁盘临时表</text><text x="748" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">临时表超 tmp_table_size</text><text x="748" y="248" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">落盘 + 内部临时表引擎转换</text><text x="748" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">Created_tmp_disk_tables 上升</text><rect x="48" y="332" width="1024" height="40" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="372" x2="1072" y2="372" stroke="rgba(120,170,255,0.22)"/><text x="48" y="358" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">优化手段</text><text x="348" y="358" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">做法</text><text x="668" y="358" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">生效条件</text><text x="908" y="358" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">注意</text><rect x="48" y="372" width="1024" height="40" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="412" x2="1072" y2="412" stroke="rgba(120,170,255,0.22)"/><text x="48" y="398" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">给分组列建索引</text><text x="348" y="398" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">INDEX (status, created_at)</text><text x="668" y="398" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">分组列在索引最左</text><text x="908" y="398" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">索引列顺序要匹配</text><rect x="48" y="412" width="1024" height="40" fill="transparent"/><line x1="48" y1="452" x2="1072" y2="452" stroke="rgba(120,170,255,0.22)"/><text x="48" y="438" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">WHERE 先收敛</text><text x="348" y="438" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">把范围条件写在 WHERE</text><text x="668" y="438" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">别写在 HAVING</text><text x="908" y="438" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">HAVING 只能事后过滤</text><rect x="48" y="452" width="1024" height="40" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="492" x2="1072" y2="492" stroke="rgba(120,170,255,0.22)"/><text x="48" y="478" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">临时表调大</text><text x="348" y="478" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">tmp_table_size / max_heap_table_size</text><text x="668" y="478" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">分组结果多但行窄</text><text x="908" y="478" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">内存换 IO，注意并发</text><rect x="48" y="492" width="1024" height="40" fill="transparent"/><line x1="48" y1="532" x2="1072" y2="532" stroke="rgba(120,170,255,0.22)"/><text x="48" y="518" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">改写为窗口/预聚合</text><text x="348" y="518" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">ROW_NUMBER 或结果表</text><text x="668" y="518" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">报表类高频查询</text><text x="908" y="518" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">牺牲实时性</text><text x="48" y="554" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0">排查顺序：先看 Extra 有无 temporary/filesort，再看 Created_tmp_disk_tables 增速</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 GROUP BY 优化 / 内部临时表说明自绘</text></svg>