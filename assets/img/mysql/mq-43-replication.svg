<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 高可用与架构</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">一条 binlog 的三段旅程</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">主库写 binlog → 从库拉 relay log → 从库回放，三段各有自己的延迟</text><rect x="56" y="206" width="366" height="180" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="206" width="4" height="180" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="76" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">① 主库：dump 线程</text><text x="76" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">binlog 写入后通知 dump 线程</text><text x="76" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">按位点或 GTID 推送事件</text><text x="76" y="334" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">binlog_format=ROW 为默认</text><path d="M428 296 L442 296 M436 291 L442 296 L436 301" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="446" y="206" width="366" height="180" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="446" y="206" width="4" height="180" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="466" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">② 从库：IO 线程</text><text x="466" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">连接主库拉取事件</text><text x="466" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">写入 relay log（中继日志）</text><text x="466" y="334" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">网络慢 → 这里先积压</text><path d="M818 296 L832 296 M826 291 L832 296 L826 301" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="836" y="206" width="366" height="180" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="836" y="206" width="4" height="180" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="856" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">③ 从库：applier 线程</text><text x="856" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">读 relay log 并回放</text><text x="856" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">4 个 worker 并行（默认）</text><text x="856" y="334" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">回放慢 → Seconds_Behind_Source</text><rect x="56" y="412" width="1168" height="46" fill="rgba(61,220,255,0.10)"/><line x1="56" y1="458" x2="1224" y2="458" stroke="rgba(120,170,255,0.22)"/><text x="56" y="441" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">对象</text><text x="306" y="441" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">落在哪</text><text x="576" y="441" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">关键参数 / 命令</text><text x="816" y="441" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">异常信号</text><rect x="56" y="458" width="1168" height="46" fill="rgba(255,255,255,0.03)"/><line x1="56" y1="504" x2="1224" y2="504" stroke="rgba(120,170,255,0.22)"/><text x="56" y="487" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">binlog</text><text x="306" y="487" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">主库 datadir</text><text x="576" y="487" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">binlog_format / max_binlog_size</text><text x="816" y="487" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">主库磁盘增长过快</text><rect x="56" y="504" width="1168" height="46" fill="transparent"/><line x1="56" y1="550" x2="1224" y2="550" stroke="rgba(120,170,255,0.22)"/><text x="56" y="533" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">relay log</text><text x="306" y="533" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">从库 datadir</text><text x="576" y="533" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">relay_log / sync_relay_log</text><text x="816" y="533" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Relay_Log_Space 持续增大</text><rect x="56" y="550" width="1168" height="46" fill="rgba(255,255,255,0.03)"/><line x1="56" y1="596" x2="1224" y2="596" stroke="rgba(120,170,255,0.22)"/><text x="56" y="579" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">位点 / GTID</text><text x="306" y="579" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">从库元数据</text><text x="576" y="579" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">SHOW REPLICA STATUS</text><text x="816" y="579" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Seconds_Behind_Source 上升</text><text x="56" y="618" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">8.0.22 起 SHOW REPLICA STATUS 取代 SHOW SLAVE STATUS，主从术语统一为 source/replica</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 Replication 说明自绘</text></svg>