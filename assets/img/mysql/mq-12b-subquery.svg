<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">IN、EXISTS、LATERAL 三条执行路径</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">能改写成半连接就和 JOIN 一样快</text><rect x="48" y="116" width="242.5" height="80" rx="10" fill="#5eead412" stroke="#5eead4" stroke-width="1.5"/><text x="169.25" y="146" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">IN</text><text x="169.25" y="172" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">半连接 / 物化</text><line x1="290.5" y1="156" x2="306.5" y2="156" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/><rect x="308.5" y="116" width="242.5" height="80" rx="10" fill="#fbbf2412" stroke="#fbbf24" stroke-width="1.5"/><text x="429.75" y="146" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">EXISTS</text><text x="429.75" y="172" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">命中即停</text><line x1="551" y1="156" x2="567" y2="156" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/><rect x="569" y="116" width="242.5" height="80" rx="10" fill="#f8717112" stroke="#f87171" stroke-width="1.5"/><text x="690.25" y="146" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="middle" dominant-baseline="middle">NOT IN</text><text x="690.25" y="172" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">NULL 即空集</text><line x1="811.5" y1="156" x2="827.5" y2="156" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/><rect x="829.5" y="116" width="242.5" height="80" rx="10" fill="#a78bfa12" stroke="#a78bfa" stroke-width="1.5"/><text x="950.75" y="146" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">LATERAL</text><text x="950.75" y="172" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">逐行派生</text><rect x="48" y="232" width="496" height="274" rx="12" fill="rgba(94,234,212,0.05)" stroke="#5eead4" stroke-width="1.5"/><text x="66" y="260" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">可改写：半连接</text><text x="66" y="294" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">IN / EXISTS 常被改写成 semijoin</text><text x="66" y="321" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">NOT EXISTS → anti-join，无 NULL 陷阱</text><text x="66" y="348" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">执行计划与 JOIN 基本同构</text><text x="66" y="375" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">EXPLAIN FORMAT=TREE 能直接看到</text><text x="66" y="402" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">子查询结果集越小越好</text><text x="66" y="429" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">相关子查询注意相关性列有索引</text><rect x="576" y="232" width="496" height="274" rx="12" fill="rgba(248,113,113,0.05)" stroke="#f87171" stroke-width="1.5"/><text x="594" y="260" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">不可改写：物化或逐行</text><text x="594" y="294" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">标量子查询放 SELECT 列表 → 每行一次</text><text x="594" y="321" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">派生表带聚合/窗口/LIMIT → 物化</text><text x="594" y="348" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">物化后外层过滤无法下推</text><text x="594" y="375" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">LATERAL 每行一次子查询</text><text x="594" y="402" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">层数越多越难 merge</text><text x="594" y="429" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">救法：压平层数 / 应用层合并</text><text x="48" y="532" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">结论：子查询写法的好坏，取决于优化器能否把它改写成连接。</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">依据 MySQL 8.4 Subquery Optimization / Derived Tables 章节自绘</text></svg>