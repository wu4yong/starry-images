<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 运维与安全</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">监控的四层指标</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">先看能不能连上，再看快不快，最后看数据对不对</text><rect x="56" y="206" width="568" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="206" width="4" height="132" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="76" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">可用性</text><text x="76" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Threads_connected / 主从状态 / 复制延迟</text><text x="76" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">阈值：连接数 &gt; 80% 告警</text><rect x="656" y="206" width="568" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="656" y="206" width="4" height="132" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="676" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">性能</text><text x="676" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">QPS、P99 延迟、慢 SQL 数、Innodb 行操作</text><text x="676" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">阈值：P99 &gt; 200ms 或慢 SQL 增速异常</text><rect x="56" y="356" width="568" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="356" width="4" height="132" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="76" y="390" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">资源</text><text x="76" y="422" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">buffer pool 命中率、磁盘 IO、连接数、临时表落盘</text><text x="76" y="450" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">阈值：命中率 &lt; 95%、临时表落盘 &gt; 30%</text><rect x="656" y="356" width="568" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="656" y="356" width="4" height="132" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="676" y="390" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0">正确性</text><text x="676" y="422" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">主从 GTID 差值、备份校验、复制错误计数</text><text x="676" y="450" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">阈值：GTID 差值 &gt; 0 持续 1 分钟</text><text x="56" y="528" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">告警分级：P0 不可用 / P1 性能劣化 / P2 容量趋势</text><text x="56" y="562" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0">P0 电话 + 值班；P1 群消息；P2 日报 —— 分级不清，告警就会被忽略</text><text x="56" y="600" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">指标采集优先用 performance_schema 与 global_status，别用高频 SELECT 打自己</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 Performance Schema / 监控实践自绘</text></svg>