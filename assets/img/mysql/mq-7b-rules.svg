<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">四条原则的判定顺序</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">从值域到演进，一步错就反复改表</text><rect x="48" y="120" width="242.5" height="84" rx="10" fill="#38bdf812" stroke="#38bdf8" stroke-width="1.5"/><text x="169.25" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">1 够用</text><text x="169.25" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">峰值×增速×3年</text><line x1="290.5" y1="162" x2="306.5" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/><rect x="308.5" y="120" width="242.5" height="84" rx="10" fill="#5eead412" stroke="#5eead4" stroke-width="1.5"/><text x="429.75" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">2 精确</text><text x="429.75" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">累计就用定点</text><line x1="551" y1="162" x2="567" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/><rect x="569" y="120" width="242.5" height="84" rx="10" fill="#fbbf2412" stroke="#fbbf24" stroke-width="1.5"/><text x="690.25" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">3 可索引</text><text x="690.25" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">长度可控</text><line x1="811.5" y1="162" x2="827.5" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/><rect x="829.5" y="120" width="242.5" height="84" rx="10" fill="#a78bfa12" stroke="#a78bfa" stroke-width="1.5"/><text x="950.75" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">4 可演进</text><text x="950.75" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">字典表 / JSON</text><rect x="48" y="240" width="496" height="268" rx="12" fill="rgba(94,234,212,0.05)" stroke="#5eead4" stroke-width="1.5"/><text x="66" y="268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">典型结论（左：反例 → 右：改法）</text><text x="66" y="302" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">主键 INT → BIGINT UNSIGNED</text><text x="66" y="329" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">数量 BIGINT → INT / MEDIUMINT</text><text x="66" y="356" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">状态 VARCHAR → TINYINT + 字典表</text><text x="66" y="383" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">金额 DOUBLE → DECIMAL(12,2)</text><text x="66" y="410" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">标题 TEXT → VARCHAR(128)</text><text x="66" y="437" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">标签 ENUM → JSON / 关联表</text><rect x="576" y="240" width="496" height="268" rx="12" fill="rgba(248,113,113,0.05)" stroke="#f87171" stroke-width="1.5"/><text x="594" y="268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">改造成本分级</text><text x="594" y="302" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">低：普通列改类型（重建表，可低峰做）</text><text x="594" y="329" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">中：加索引 / 拆分 JSON 生成列</text><text x="594" y="356" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">高：主键类型变更（全表 + 外部契约）</text><text x="594" y="383" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">极高：字符集整体迁移（全库转换）</text><text x="594" y="410" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">原则：能新增列双写，就别原地改</text><text x="594" y="437" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">上线前用 EXPLAIN 验证索引仍可用</text><text x="48" y="528" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">结论：先定值域再定精度，最后才想索引与演进，顺序反了必然反复重建表。</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">依据 8.4 类型文档与工程实践自绘</text></svg>