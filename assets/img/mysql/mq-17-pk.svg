<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs><rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/><rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/><text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 表设计与索引</text><line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">主键决定写入形态</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">InnoDB 的表就是按主键排序的 B+Tree，插入位置由主键值决定</text><rect x="56" y="222" width="380" height="250" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><line x1="56" y1="222" x2="59" y2="222" stroke="#3ee6a2" stroke-width="0"/><rect x="56" y="222" width="4" height="250" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="76" y="266" font-family="Consolas,'Courier New',monospace" font-size="21" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">AUTO_INCREMENT</text><text x="76" y="298" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">类型 BIGINT</text><line x1="76" y1="318" x2="416" y2="318" stroke="rgba(120,170,255,0.22)"/><text x="76" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">追加到最右页</text><text x="76" y="388" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">几乎不分裂</text><text x="76" y="428" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">最稳，单体首选</text><rect x="460" y="222" width="380" height="250" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><line x1="460" y1="222" x2="463" y2="222" stroke="#3ddcff" stroke-width="0"/><rect x="460" y="222" width="4" height="250" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="480" y="266" font-family="Consolas,'Courier New',monospace" font-size="21" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">雪花 ID</text><text x="480" y="298" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">类型 BIGINT</text><line x1="480" y1="318" x2="820" y2="318" stroke="rgba(120,170,255,0.22)"/><text x="480" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">时间在高位，近似有序</text><text x="480" y="388" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">局部乱序</text><text x="480" y="428" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">分库分表常用</text><rect x="864" y="222" width="380" height="250" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><line x1="864" y1="222" x2="867" y2="222" stroke="#ff6b8a" stroke-width="0"/><rect x="864" y="222" width="4" height="250" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="884" y="266" font-family="Consolas,'Courier New',monospace" font-size="21" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">UUID</text><text x="884" y="298" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">类型 CHAR(36)</text><line x1="884" y1="318" x2="1224" y2="318" stroke="rgba(120,170,255,0.22)"/><text x="884" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">随机落点</text><text x="884" y="388" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">页分裂 + 索引膨胀</text><text x="884" y="428" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">对外 ID，需转 BINARY(16)</text><text x="56" y="530" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">UUID 的正确存法：BINARY(16) + swap_flag=1，把随机插入变成近似顺序插入</text><rect x="56" y="556" width="416.6" height="31" rx="15.5" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="264.3" y="575" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">INSERT ... VALUES (UUID_TO_BIN(UUID(), 1))</text><rect x="600" y="556" width="239.9" height="31" rx="15.5" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="719.95" y="575" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">BIN_TO_UUID(id, 1) 反解查询</text><text x="56" y="626" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">8.0 起自增值持久化（redo log），重启不再回退到 MAX(id)+1</text><text x="56" y="654" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">innodb_autoinc_lock_mode 自 8.0 起默认 2（interleaved）</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB Index Types / AUTO_INCREMENT Handling 章节自绘</text></svg>