<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 事务与锁</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">一行数据，一条版本链</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">写时留旧值进 undo，读时靠 ReadView 选择看哪个版本</text><rect x="56" y="230" width="240" height="76" rx="10" fill="rgba(14,24,44,0.95)" stroke="#3ddcff" stroke-opacity="0.6"/><text x="76" y="262" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">当前行 trx=100</text><text x="76" y="288" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">DB_TRX_ID / DB_ROLL_PTR</text><path d="M298 268 L354 268 M348 263 L354 268 L348 273" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="356" y="230" width="240" height="76" rx="10" fill="rgba(14,24,44,0.95)" stroke="#4a9dff" stroke-opacity="0.6"/><text x="376" y="262" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">undo trx=90</text><text x="376" y="288" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">DB_TRX_ID / DB_ROLL_PTR</text><path d="M598 268 L654 268 M648 263 L654 268 L648 273" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="656" y="230" width="240" height="76" rx="10" fill="rgba(14,24,44,0.95)" stroke="#3ee6a2" stroke-opacity="0.6"/><text x="676" y="262" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">undo trx=80</text><text x="676" y="288" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">DB_TRX_ID / DB_ROLL_PTR</text><text x="56" y="336" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">每次 UPDATE 都把旧值写进 undo，新行的 DB_ROLL_PTR 指向上一个版本</text><text x="56" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">ReadView 四要素</text><rect x="56" y="440" width="276" height="112" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="440" width="4" height="112" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="74" y="478" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">m_ids</text><text x="74" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">生成时活跃事务 ID 列表</text><rect x="356" y="440" width="276" height="112" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="356" y="440" width="4" height="112" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="374" y="478" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">min_trx_id</text><text x="374" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">列表中的最小值</text><rect x="656" y="440" width="276" height="112" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="656" y="440" width="4" height="112" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="674" y="478" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">max_trx_id</text><text x="674" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">下一个将分配的 ID</text><rect x="956" y="440" width="276" height="112" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="956" y="440" width="4" height="112" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="974" y="478" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">creator_trx_id</text><text x="974" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">当前事务自己的 ID</text><text x="56" y="596" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">RR 一次快照用到底；RC 每次读都新建 ReadView —— 这是两者唯一差别</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 Consistent Nonlocking Reads 与 undo log 章节自绘</text></svg>