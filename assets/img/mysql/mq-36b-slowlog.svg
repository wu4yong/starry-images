<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 性能与优化</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">聚合之后看什么</text><text x="48" y="146" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">按总耗时排序，比按单次耗时排序更容易找到真正的瓶颈</text><rect x="48" y="176" width="1024" height="40" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="216" x2="1072" y2="216" stroke="rgba(120,170,255,0.22)"/><text x="48" y="202" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">#</text><text x="388" y="202" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">查询指纹（摘要）</text><text x="548" y="202" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">次数</text><text x="688" y="202" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">总耗时</text><text x="828" y="202" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">平均</text><text x="958" y="202" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">占峰值</text><rect x="48" y="216" width="1024" height="40" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="256" x2="1072" y2="256" stroke="rgba(120,170,255,0.22)"/><text x="48" y="242" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">1</text><text x="388" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">按 user_id 查订单</text><text x="548" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">182 万</text><text x="688" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">2461 s</text><text x="828" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">1.3 ms</text><text x="958" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">38%</text><rect x="48" y="256" width="1024" height="40" fill="transparent"/><line x1="48" y1="296" x2="1072" y2="296" stroke="rgba(120,170,255,0.22)"/><text x="48" y="282" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">2</text><text x="388" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">订单列表按时间排序</text><text x="548" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">3.2 万</text><text x="688" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">1180 s</text><text x="828" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">36 ms</text><text x="958" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">18%</text><rect x="48" y="296" width="1024" height="40" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="336" x2="1072" y2="336" stroke="rgba(120,170,255,0.22)"/><text x="48" y="322" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">3</text><text x="388" y="322" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">按 sku 扣减库存</text><text x="548" y="322" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">96 万</text><text x="688" y="322" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">540 s</text><text x="828" y="322" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">0.5 ms</text><text x="958" y="322" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">9%</text><text x="48" y="352" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">为什么按总耗时排：单次 1.3ms 的 SQL 被调用 182 万次，比偶尔 3 秒的 SQL 更值得优化</text><rect x="48" y="378" width="1024" height="38" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="416" x2="1072" y2="416" stroke="rgba(120,170,255,0.22)"/><text x="48" y="403" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Performance Schema 表</text><text x="438" y="403" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">用途</text><text x="688" y="403" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">关键列</text><text x="848" y="403" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">说明</text><rect x="48" y="416" width="1024" height="38" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="454" x2="1072" y2="454" stroke="rgba(120,170,255,0.22)"/><text x="48" y="441" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">summary_by_digest</text><text x="438" y="441" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">按指纹聚合</text><text x="688" y="441" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SUM_TIMER_WAIT</text><text x="848" y="441" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">无需开慢日志</text><rect x="48" y="454" width="1024" height="38" fill="transparent"/><line x1="48" y1="492" x2="1072" y2="492" stroke="rgba(120,170,255,0.22)"/><text x="48" y="479" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">events_statements_current</text><text x="438" y="479" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">看正在跑什么</text><text x="688" y="479" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SQL_TEXT</text><text x="848" y="479" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">实时诊断</text><rect x="48" y="492" width="1024" height="38" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="530" x2="1072" y2="530" stroke="rgba(120,170,255,0.22)"/><text x="48" y="517" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">events_stages_*</text><text x="438" y="517" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">看阶段耗时</text><text x="688" y="517" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">STAGE</text><text x="848" y="517" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">替代 SHOW PROFILE</text><text x="48" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SHOW PROFILE 在 8.x 已弃用，阶段耗时统一走 Performance Schema</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 Performance Schema / 慢日志说明自绘</text></svg>