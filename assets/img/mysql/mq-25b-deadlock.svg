ans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">怎么做</text><text x="668" y="351" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">解决哪种成因</text><text x="908" y="351" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">代价</text><rect x="48" y="364" width="1024" height="38" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="402" x2="1072" y2="402" stroke="rgba(120,170,255,0.22)"/><text x="96" y="389" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">统一顺序</text><text x="408" y="389" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">按主键升序批量改</text><text x="668" y="389" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">交叉加锁（最常见）</text><text x="908" y="389" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">需在应用层改造</text><rect x="48" y="402" width="1024" height="38" fill="transparent"/><line x1="48" y1="440" x2="1072" y2="440" stroke="rgba(120,170,255,0.22)"/><text x="96" y="427" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">缩短事务</text><text x="408" y="427" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">锁内不做 RPC</text><text x="668" y="427" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">持有并等待</text><text x="908" y="427" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">业务拆分成本</text><rect x="48" y="440" width="1024" height="38" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="478" x2="1072" y2="478" stroke="rgba(120,170,255,0.22)"/><text x="96" y="465" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">降为 RC</text><text x="408" y="465" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">SET TRANSACTION ISOLATION</text><text x="668" y="465" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">间隙锁 + 插入意向</text><text x="908" y="465" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">失去 RR 语义</text><rect x="48" y="478" width="1024" height="38" fill="transparent"/><line x1="48" y1="516" x2="1072" y2="516" stroke="rgba(120,170,255,0.22)"/><text x="96" y="503" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">超时退避</text><text x="408" y="503" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">捕捉 1213 / 1205 重试</text><text x="668" y="503" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7