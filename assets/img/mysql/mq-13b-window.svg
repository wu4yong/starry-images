x="627" y="148" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">row 5</text><rect x="698" y="120" width="118" height="56" rx="9" fill="rgba(251,191,36,0.16)" stroke="#fbbf24" stroke-width="1.4"/><text x="757" y="148" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">row 6</text><rect x="828" y="120" width="118" height="56" rx="9" fill="rgba(251,191,36,0.16)" stroke="#fbbf24" stroke-width="1.4"/><text x="887" y="148" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">row 7</text><text x="48" y="206" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">ROWS BETWEEN 2 PRECEDING AND CURRENT ROW：只有最近 3 行进窗口（黄色）</text><text x="48" y="232" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">默认帧 = UNBOUNDED PRECEDING → CURRENT ROW，所以 SUM() OVER (ORDER BY x) 是累计</text><rect x="48" y="268" width="496" height="244" rx="12" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.5"/><text x="66" y="296" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">排名三兄弟</text><text x="66" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">ROW_NUMBER：1,2,3，强制唯一</text><text x="66" y="357" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">RANK：1,1,3，并列跳号</text><text x="66" y="384" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">DENSE_RANK：1,1,2，并列不跳号</text><text x="66" y="411" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">取 Top N 用 ROW_NUMBER 更稳</text><text x="66" y="438" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">ORDER BY 里加主键兜底防随机</text><text x="66" y="465" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">窗口函数不能出现在 WHERE</text><rect x="576" y="268" width="496" height="244" rx="12" fill="rgba(251,191,36,0.05)" stroke="#fbbf24" stroke-width="1.5"/><text x="594" y="296" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">CTE 与递归</text><text x="594" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">WITH a AS (...), b AS (...) 拆步骤</text><text x="594" y="357" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">可读 + 可复用，但不是缓存</text><text x="594" y="384" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">RECURSIVE：锚点 + 递归成员</text><text x="594" y="411" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">必须有终止条件（层级或 NULL）</text><text x="594" y="438" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">cte_max_recursion_depth 默认 1000</text><text x="594" y="465" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">嵌套 3 层以内可读性最好</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">依据 MySQL 8.4 Window Functions / WITH 章节自绘</text></svg>