<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 存储引擎与内部</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">一条提交要过三道关</text><text x="48" y="146" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">redo 与 binlog 靠两阶段提交对齐，崩溃恢复只认「两边都在」</text><rect x="48" y="182" width="316" height="104" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="182" width="4" height="104" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="64" y="218" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">redo prepare</text><text x="64" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">InnoDB 写 redo，标记未提交</text><path d="M366 234 L390 234 M384 229 L390 234 L384 239" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="396" y="182" width="316" height="104" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="396" y="182" width="4" height="104" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="412" y="218" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">binlog 落盘</text><text x="412" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Server 层写 binlog 并 fsync</text><path d="M714 234 L738 234 M732 229 L738 234 L732 239" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="744" y="182" width="316" height="104" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="744" y="182" width="4" height="104" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="760" y="218" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">redo commit</text><text x="760" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">标记已提交，事务生效</text><text x="48" y="310" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">崩溃发生在哪一步，恢复结果就不同</text><rect x="48" y="326" width="1024" height="42" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="368" x2="1072" y2="368" stroke="rgba(120,170,255,0.22)"/><text x="96" y="353" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">崩溃点</text><text x="348" y="353" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">redo 状态</text><text x="608" y="353" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">binlog 状态</text><text x="848" y="353" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">恢复动作</text><rect x="48" y="368" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="410" x2="1072" y2="410" stroke="rgba(120,170,255,0.22)"/><text x="96" y="395" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">prepare 之前</text><text x="348" y="395" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">无记录</text><text x="608" y="395" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">无</text><text x="848" y="395" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">事务不存在，无需处理</text><rect x="48" y="410" width="1024" height="42" fill="transparent"/><line x1="48" y1="452" x2="1072" y2="452" stroke="rgba(120,170,255,0.22)"/><text x="96" y="437" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">prepare 之后、binlog 之前</text><text x="348" y="437" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">prepare</text><text x="608" y="437" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">缺失</text><text x="848" y="437" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">回滚（binlog 是提交凭据）</text><rect x="48" y="452" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="494" x2="1072" y2="494" stroke="rgba(120,170,255,0.22)"/><text x="96" y="479" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">binlog 之后、commit 之前</text><text x="348" y="479" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">prepare</text><text x="608" y="479" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">完整</text><text x="848" y="479" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">前滚提交（重放 binlog 一致）</text><rect x="48" y="494" width="1024" height="42" fill="transparent"/><line x1="48" y1="536" x2="1072" y2="536" stroke="rgba(120,170,255,0.22)"/><text x="96" y="521" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">commit 之后</text><text x="348" y="521" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">commit</text><text x="608" y="521" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">完整</text><text x="848" y="521" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">无需处理</text><text x="48" y="556" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">前提：sync_binlog = 1 且 innodb_flush_log_at_trx_commit = 1，双一配置</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB 两阶段提交与崩溃恢复说明自绘</text></svg>