<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">五类关键类型的字节、范围与用途</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">字节数就是缓冲池的钱</text><rect x="48" y="112" width="1024" height="48" rx="10" fill="#38bdf810" stroke="#38bdf8" stroke-width="1.2"/><text x="70" y="138" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">INT</text><text x="260" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">4</text><text x="360" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">-21.47 亿 ~ 21.47 亿</text><text x="790" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">计数、状态量</text><rect x="48" y="168" width="1024" height="48" rx="10" fill="#38bdf810" stroke="#38bdf8" stroke-width="1.2"/><text x="70" y="194" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">BIGINT</text><text x="260" y="194" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">8</text><text x="360" y="194" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">±9.22×10¹⁸</text><text x="790" y="194" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">主键、雪花 ID</text><rect x="48" y="224" width="1024" height="48" rx="10" fill="#5eead410" stroke="#5eead4" stroke-width="1.2"/><text x="70" y="250" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">DECIMAL(12,2)</text><text x="260" y="250" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">变长</text><text x="360" y="250" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">10 位整数 + 2 位小数</text><text x="790" y="250" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">金额、单价</text><rect x="48" y="280" width="1024" height="48" rx="10" fill="#5eead410" stroke="#5eead4" stroke-width="1.2"/><text x="70" y="306" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">VARCHAR(n)</text><text x="260" y="306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">变长+1~2</text><text x="360" y="306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">上限 65535 字节，受行大小限制</text><text x="790" y="306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">字符串主选</text><rect x="48" y="336" width="1024" height="48" rx="10" fill="#fbbf2410" stroke="#fbbf24" stroke-width="1.2"/><text x="70" y="362" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">DATETIME(3)</text><text x="260" y="362" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">6</text><text x="360" y="362" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">1000-01-01 ~ 9999-12-31</text><text x="790" y="362" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">业务时间，无时区转换</text><rect x="48" y="392" width="1024" height="48" rx="10" fill="#fbbf2410" stroke="#fbbf24" stroke-width="1.2"/><text x="70" y="418" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">TIMESTAMP(3)</text><text x="260" y="418" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">5</text><text x="360" y="418" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">1970-01-01 ~ 2038-01-19</text><text x="790" y="418" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">审计时间，存 UTC</text><rect x="48" y="448" width="1024" height="48" rx="10" fill="#a78bfa10" stroke="#a78bfa" stroke-width="1.2"/><text x="70" y="474" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">JSON</text><text x="260" y="474" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">变长</text><text x="360" y="474" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">受 max_allowed_packet 限制</text><text x="790" y="474" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">扩展字段，需生成列索引</text><text x="48" y="552" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">注意：utf8mb4 下每字符最多 4 字节，CHAR(10) 固定占 40 字节；索引前缀上限 3072 字节。</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">依据 MySQL 8.4 Data Types 章节自绘</text></svg>