<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 高可用与架构</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">高可用方案怎么选</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">能自动切换只是及格线，切换后数据对不对才是重点</text><rect x="56" y="206" width="1168" height="52" fill="rgba(61,220,255,0.10)"/><line x1="56" y1="258" x2="1224" y2="258" stroke="rgba(120,170,255,0.22)"/><text x="56" y="238" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">方案</text><text x="256" y="238" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">切换粒度</text><text x="456" y="238" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">数据风险</text><text x="696" y="238" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">运维复杂度</text><text x="956" y="238" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">适用</text><rect x="56" y="258" width="1168" height="52" fill="rgba(255,255,255,0.03)"/><line x1="56" y1="310" x2="1224" y2="310" stroke="rgba(120,170,255,0.22)"/><text x="56" y="290" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">MHA</text><text x="256" y="290" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">主从组，秒级</text><text x="456" y="290" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">依赖 relay log 补齐，可能丢少量</text><text x="696" y="290" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">中（脚本老，维护成本高）</text><text x="956" y="290" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">传统一主多从</text><rect x="56" y="310" width="1168" height="52" fill="transparent"/><line x1="56" y1="362" x2="1224" y2="362" stroke="rgba(120,170,255,0.22)"/><text x="56" y="342" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Orchestrator</text><text x="256" y="342" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">拓扑感知，自动/半自动</text><text x="456" y="342" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">同 MHA，可配合半同步</text><text x="696" y="342" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">中</text><text x="956" y="342" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">多级复制、大规模</text><rect x="56" y="362" width="1168" height="52" fill="rgba(255,255,255,0.03)"/><line x1="56" y1="414" x2="1224" y2="414" stroke="rgba(120,170,255,0.22)"/><text x="56" y="394" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">MGR 单主</text><text x="256" y="394" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">多数派自动选主</text><text x="456" y="394" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">几乎不丢（认证后提交）</text><text x="696" y="394" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">高（需三节点、网络要求）</text><text x="956" y="394" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">核心交易库</text><rect x="56" y="414" width="1168" height="52" fill="transparent"/><line x1="56" y1="466" x2="1224" y2="466" stroke="rgba(120,170,255,0.22)"/><text x="56" y="446" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">云多可用区</text><text x="256" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">由云平台编排</text><text x="456" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">取决于同步模式</text><text x="696" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">低（托管）</text><text x="956" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">弹性部署</text><text x="56" y="490" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">三个必查项（无论用哪种方案）</text><rect x="56" y="508" width="366" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="508" width="4" height="118" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="76" y="538" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">① 切换后位点对齐</text><text x="76" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">GTID 集合必须完整，否则新主会拒写</text><rect x="446" y="508" width="366" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="446" y="508" width="4" height="118" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="466" y="538" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">② 虚拟 IP / DNS 生效</text><text x="466" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">应用重连策略要比重试更快</text><rect x="836" y="508" width="388" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="836" y="508" width="4" height="118" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="856" y="538" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">③ 回切与演练</text><text x="856" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">每季度至少演练一次，含脑裂场景</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 Group Replication / 高可用实践自绘</text></svg>