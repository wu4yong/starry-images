ght="400" text-anchor="start" letter-spacing="0" opacity="1">sent / failed</text><rect x="48" y="312" width="1024" height="42" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="354" x2="1072" y2="354" stroke="rgba(120,170,255,0.22)"/><text x="96" y="339" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">对比</text><text x="348" y="339" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">XA</text><text x="748" y="339" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">消息表</text><text x="998" y="339" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">TCC</text><rect x="48" y="354" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="396" x2="1072" y2="396" stroke="rgba(120,170,255,0.22)"/><text x="96" y="381" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">一致性</text><text x="348" y="381" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">强一致</text><text x="748" y="381" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">最终一致</text><text x="998" y="381" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">最终一致</text><rect x="48" y="396" width="1024" height="42" fill="transparent"/><line x1="48" y1="438" x2="1072" y2="438" stroke="rgba(120,170,255,0.22)"/><text x="96" y="423" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">锁范围</text><text x="348" y="423" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">跨库锁</text><text x="748" y="423" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">无跨库锁</text><text x="998" y="423" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">业务预留</text><rect x="48" y="438" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="480" x2="1072" y2="480" stroke="rgba(120,170,255,0.22)"/><text x="96" y="465" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">失败处理</text><text x="348" y="465" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">XA RECOVER</text><text x="748" y="465" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">重投 + 对账</text><text x="998" y="465" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">cancel 接口</text><rect x="48" y="480" width="1024" height="42" fill="transparent"/><line x1="48" y1="522" x2="1072" y2="522" stroke="rgba(120,170,255,0.22)"/><text x="96" y="507" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">复杂度</text><text x="348" y="507" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">中（运维重）</text><text x="748" y="507" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">低</text><text x="998" y="507" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">高</text><text x="48" y="556" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">幂等键 = 业务主键 + 操作类型，重复投递只认一次</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 XA Transactions 与事务消息实践自绘</text></svg>