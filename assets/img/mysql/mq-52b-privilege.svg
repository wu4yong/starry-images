<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 运维与安全</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="100" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">授权与审计的实操口径</text><text x="48" y="132" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">能查、能审、能回收，权限才叫受控</text><rect x="48" y="152" width="1024" height="42" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="194" x2="1072" y2="194" stroke="rgba(120,170,255,0.22)"/><text x="48" y="179" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">场景</text><text x="288" y="179" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">授权写法</text><text x="568" y="179" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">禁止</text><text x="808" y="179" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">审计方式</text><rect x="48" y="194" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="236" x2="1072" y2="236" stroke="rgba(120,170,255,0.22)"/><text x="48" y="221" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">应用读写</text><text x="288" y="221" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">SELECT,INSERT,UPDATE,DELETE</text><text x="568" y="221" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">ALL PRIVILEGES</text><text x="808" y="221" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">定期比对账号清单</text><rect x="48" y="236" width="1024" height="42" fill="transparent"/><line x1="48" y1="278" x2="1072" y2="278" stroke="rgba(120,170,255,0.22)"/><text x="48" y="263" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">只读报表</text><text x="288" y="263" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">SELECT ON shop.*</text><text x="568" y="263" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">写权限</text><text x="808" y="263" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">从库 + 慢查询审计</text><rect x="48" y="278" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="320" x2="1072" y2="320" stroke="rgba(120,170,255,0.22)"/><text x="48" y="305" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">运维 DDL</text><text x="288" y="305" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">ALTER,CREATE,DROP ON shop.*</text><text x="568" y="305" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">全局权限</text><text x="808" y="305" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">流水线执行 + 记录</text><rect x="48" y="320" width="1024" height="42" fill="transparent"/><line x1="48" y1="362" x2="1072" y2="362" stroke="rgba(120,170,255,0.22)"/><text x="48" y="347" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">备份</text><text x="288" y="347" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">SELECT,RELOAD,LOCK TABLES</text><text x="568" y="347" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">SUPER</text><text x="808" y="347" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">备份日志核对</text><rect x="48" y="380" width="492" height="146" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="380" width="4" height="146" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="68" y="414" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">角色（ROLE）减少重复授权</text><text x="68" y="444" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">CREATE ROLE app_rw; GRANT ... TO app_rw;</text><text x="68" y="472" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">SET DEFAULT ROLE app_rw TO app@10.%</text><text x="68" y="502" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">角色可复用、可一次性回收</text><rect x="572" y="384" width="500" height="140" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="572" y="384" width="4" height="140" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="592" y="414" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">账号卫生</text><text x="592" y="444" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">主机段限定到网段，禁用 % 全网段</text><text x="592" y="472" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">离职/下线立即 DROP USER 并回收</text><text x="592" y="502" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">口令轮换写入运维日历</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 Roles / GRANT 说明自绘</text></svg>