<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 事务与锁</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">间隙锁锁的是「缝」</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">索引记录把数轴切开，锁一段就是「谁都不许插进来」</text><line x1="56" y1="300" x2="1224" y2="300" stroke="rgba(120,170,255,0.22)" stroke-width="3"/><rect x="186" y="274" width="68" height="52" rx="8" fill="rgba(61,220,255,0.14)" stroke="#3ddcff" stroke-opacity="0.7"/><text x="220" y="307" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#3ddcff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">10</text><rect x="406" y="274" width="68" height="52" rx="8" fill="rgba(61,220,255,0.14)" stroke="#3ddcff" stroke-opacity="0.7"/><text x="440" y="307" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#3ddcff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">11</text><rect x="626" y="274" width="68" height="52" rx="8" fill="rgba(61,220,255,0.14)" stroke="#3ddcff" stroke-opacity="0.7"/><text x="660" y="307" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#3ddcff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">13</text><rect x="846" y="274" width="68" height="52" rx="8" fill="rgba(61,220,255,0.14)" stroke="#3ddcff" stroke-opacity="0.7"/><text x="880" y="307" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#3ddcff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">20</text><rect x="56" y="360" width="130" height="40" rx="6" fill="rgba(255,107,138,0.10)" stroke="#ff6b8a" stroke-opacity="0.45"/><text x="121" y="386" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#ff6b8a" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">(-∞,10]</text><rect x="254" y="360" width="152" height="40" rx="6" fill="rgba(255,107,138,0.10)" stroke="#ff6b8a" stroke-opacity="0.45"/><text x="330" y="386" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#ff6b8a" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">(10,11]</text><rect x="474" y="360" width="152" height="40" rx="6" fill="rgba(255,107,138,0.10)" stroke="#ff6b8a" stroke-opacity="0.45"/><text x="550" y="386" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#ff6b8a" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">(11,13]</text><rect x="694" y="360" width="152" height="40" rx="6" fill="rgba(255,107,138,0.10)" stroke="#ff6b8a" stroke-opacity="0.45"/><text x="770" y="386" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#ff6b8a" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">(13,20]</text><rect x="914" y="360" width="310" height="40" rx="6" fill="rgba(255,107,138,0.10)" stroke="#ff6b8a" stroke-opacity="0.45"/><text x="1069" y="386" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#ff6b8a" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">(20,+∞)</text><text x="56" y="432" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">RR 下的 next-key lock = 记录锁 + 它前面的间隙，最后一段还锁住 supremum</text><rect x="56" y="470" width="372" height="108" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="470" width="4" height="108" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="74" y="506" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">纯粹抑制</text><text x="74" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">只阻止插入，S/X 间隙锁互不冲突</text><rect x="452" y="470" width="372" height="108" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="452" y="470" width="4" height="108" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="470" y="506" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">唯一索引例外</text><text x="470" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">等值命中唯一行 → 只加记录锁</text><rect x="848" y="470" width="372" height="108" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="848" y="470" width="4" height="108" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="866" y="506" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">RC 关闭间隙锁</text><text x="866" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">只保留外键与唯一性检查所需</text><text x="56" y="626" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">锁加在索引上：没索引的加锁读会锁住扫描到的所有记录</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB Locking 章节自绘</text></svg>