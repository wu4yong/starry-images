ize="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">COMPRESSED</text><text x="288" y="521" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">否</text><text x="588" y="521" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">同 DYNAMIC + 页压缩</text><text x="808" y="521" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">3072B</text><text x="984" y="521" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">省空间</text><text x="48" y="560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">选型：默认 DYNAMIC 即可；确需压缩再用 COMPRESSED，注意写放大</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB Row Formats 与 DYNAMIC 溢出说明自绘</text></svg>