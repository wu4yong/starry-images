<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 事务与锁</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">长事务的四笔账</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">事务越长，undo 越难回收，快照越老，锁越久，日志越大</text><rect x="56" y="222" width="568" height="168" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="222" width="4" height="168" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="76" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">undo 无法回收</text><line x1="76" y1="280" x2="604" y2="280" stroke="rgba(120,170,255,0.22)"/><text x="76" y="314" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">purge 追不上，History list 持续增长</text><text x="76" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">→ 磁盘与回滚成本上升</text><text x="76" y="374" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">监控：History list length</text><rect x="648" y="222" width="568" height="168" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="222" width="4" height="168" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="668" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">快照被拖老</text><line x1="668" y1="280" x2="1196" y2="280" stroke="rgba(120,170,255,0.22)"/><text x="668" y="314" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">最早的活跃事务决定 ReadView 下界</text><text x="668" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">→ 所有快照读都要穿越更长的版本链</text><text x="668" y="374" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">监控：innodb_trx.trx_started</text><rect x="56" y="412" width="568" height="168" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="412" width="4" height="168" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="76" y="452" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">锁持有时长拉长</text><line x1="76" y1="470" x2="604" y2="470" stroke="rgba(120,170,255,0.22)"/><text x="76" y="504" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">行锁、间隙锁、MDL 都跟着变久</text><text x="76" y="538" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">→ 并发吞吐下降，DDL 被卡</text><text x="76" y="564" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">监控：data_lock_waits</text><rect x="648" y="412" width="568" height="168" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="412" width="4" height="168" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="668" y="452" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">redo 与 binlog 变大</text><line x1="668" y1="470" x2="1196" y2="470" stroke="rgba(120,170,255,0.22)"/><text x="668" y="504" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">一个事务一个提交点</text><text x="668" y="538" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">→ 崩溃恢复变慢，复制延迟变大</text><text x="668" y="564" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">监控：redo 容量 / binlog 大小</text><text x="56" y="620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">判据不是「跑多久」，而是「占用多少资源」：行数、锁数、undo 量、日志量</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB 事务与 purge 章节自绘</text></svg>