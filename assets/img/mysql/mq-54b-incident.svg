ll="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">分级：P0/P1/P2</text><text x="878" y="216" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">—</text><rect x="48" y="230" width="1024" height="40" fill="transparent"/><line x1="48" y1="270" x2="1072" y2="270" stroke="rgba(120,170,255,0.22)"/><text x="48" y="256" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">T+2min</text><text x="348" y="256" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">限流 / 摘从库 / 切主</text><text x="648" y="256" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">错误率下降</text><text x="878" y="256" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">恢复开关</text><rect x="48" y="270" width="1024" height="40" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="310" x2="1072" y2="310" stroke="rgba(120,170,255,0.22)"/><text x="48" y="296" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">T+10min</text><text x="348" y="296" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">定位到具体 SQL 或实例</text><text x="648" y="296" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">有明确假设</text><text x="878" y="296" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">—</text><rect x="48" y="310" width="1024" height="40" fill="transparent"/><line x1="48" y1="350" x2="1072" y2="350" stroke="rgba(120,170,255,0.22)"/><text x="48" y="336" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">T+30min</text><text x="348" y="336" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">最小改动修复</text><text x="648" y="336" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">服务恢复</text><text x="878" y="336" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">回滚脚本</text><rect x="48" y="350" width="1024" height="40" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="390" x2="1072" y2="390" stroke="rgba(120,170,255,0.22)"/><text x="48" y="376" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">T+1d</text><text x="348" y="376" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">复盘与改进项落地</text><text x="648" y="376" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">同类故障不再发生</text><text x="878" y="376" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">—</text><rect x="48" y="404" width="492" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="404" width="4" height="150" rx="2