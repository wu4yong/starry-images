<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs><rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/><rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/><text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 表设计与索引</text><line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">联合索引只按字典序生效</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">设计不是「多建几个索引」，而是让高频查询恰好落在前缀上</text><text x="56" y="226" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">idx (a, b, c) 的键序列</text><rect x="56" y="246" width="136" height="44" rx="8" fill="rgba(74,157,255,0.10)" stroke="#4a9dff" stroke-opacity="0.45"/><text x="124" y="274" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">(1,x,10)</text><rect x="208" y="246" width="136" height="44" rx="8" fill="rgba(74,157,255,0.10)" stroke="#4a9dff" stroke-opacity="0.45"/><text x="276" y="274" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">(1,x,20)</text><rect x="360" y="246" width="136" height="44" rx="8" fill="rgba(74,157,255,0.10)" stroke="#4a9dff" stroke-opacity="0.45"/><text x="428" y="274" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">(1,y,10)</text><rect x="512" y="246" width="136" height="44" rx="8" fill="rgba(74,157,255,0.10)" stroke="#4a9dff" stroke-opacity="0.45"/><text x="580" y="274" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">(2,x,10)</text><rect x="56" y="330" width="1168" height="52" fill="rgba(61,220,255,0.10)"/><line x1="56" y1="382" x2="1224" y2="382" stroke="rgba(120,170,255,0.22)"/><text x="70" y="362" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">WHERE 条件</text><text x="314" y="362" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">能否用索引</text><text x="574" y="362" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">扫描范围</text><text x="914" y="362" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">备注</text><rect x="56" y="382" width="1168" height="52" fill="rgba(255,255,255,0.03)"/><line x1="56" y1="434" x2="1224" y2="434" stroke="rgba(120,170,255,0.22)"/><text x="70" y="414" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">a=1</text><text x="314" y="414" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">能</text><text x="574" y="414" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">连续区间</text><text x="914" y="414" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">最左前缀</text><rect x="56" y="434" width="1168" height="52" fill="transparent"/><line x1="56" y1="486" x2="1224" y2="486" stroke="rgba(120,170,255,0.22)"/><text x="70" y="466" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">a=1 AND b='x'</text><text x="314" y="466" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">能</text><text x="574" y="466" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">区间更窄</text><text x="914" y="466" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">两列都定位</text><rect x="56" y="486" width="1168" height="52" fill="rgba(255,255,255,0.03)"/><line x1="56" y1="538" x2="1224" y2="538" stroke="rgba(120,170,255,0.22)"/><text x="70" y="518" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">b='x'</text><text x="314" y="518" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不能（除非 Skip Scan）</text><text x="574" y="518" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">整索引或全表</text><text x="914" y="518" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">跳过了前缀 a</text><rect x="56" y="538" width="1168" height="52" fill="transparent"/><line x1="56" y1="590" x2="1224" y2="590" stroke="rgba(120,170,255,0.22)"/><text x="70" y="570" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">a=1 AND c=10</text><text x="314" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">只能用 a</text><text x="574" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">c 靠 ICP 过滤</text><text x="914" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">范围后列不缩小扫描</text><text x="56" y="610" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">列顺序三优先：等值在前 → 选择性高的靠左 → 范围与排序列放最后</text><text x="56" y="644" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">跳过的前缀列基数越低，Skip Scan 越可能生效（8.0.13 起）</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 Multiple-Column Indexes 与 Range Optimization 章节自绘</text></svg>