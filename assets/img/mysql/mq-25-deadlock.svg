<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 事务与锁</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">死锁：各方持有别人要的锁</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">InnoDB 按行加锁，交叉等待就成环；四条件缺一不可</text><rect x="56" y="202" width="44.6" height="31" rx="15.5" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="78.3" y="221" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">互斥</text><rect x="118.6" y="202" width="72.5" height="31" rx="15.5" fill="#4a9dff" fill-opacity="0.13" stroke="#4a9dff" stroke-opacity="0.45"/><text x="154.85" y="221" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#4a9dff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">持有并等待</text><rect x="209.1" y="202" width="63.2" height="31" rx="15.5" fill="#ffc861" fill-opacity="0.13" stroke="#ffc861" stroke-opacity="0.45"/><text x="240.7" y="221" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ffc861" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">不可剥夺</text><rect x="290.3" y="202" width="63.2" height="31" rx="15.5" fill="#ff6b8a" fill-opacity="0.13" stroke="#ff6b8a" stroke-opacity="0.45"/><text x="321.90000000000003" y="221" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ff6b8a" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">循环等待</text><rect x="56" y="288" width="400" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="288" width="4" height="150" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="324" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">TRX 1</text><text x="80" y="358" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">UPDATE t SET v = 1 WHERE id = 100</text><text x="80" y="388" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">持有 id=100 的 X 记录锁</text><text x="80" y="418" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">再去改 id=200 → 等待</text><rect x="824" y="288" width="400" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="824" y="288" width="4" height="150" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="848" y="324" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">TRX 2</text><text x="848" y="358" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">UPDATE t SET v = 2 WHERE id = 200</text><text x="848" y="388" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">持有 id=200 的 X 记录锁</text><text x="848" y="418" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">再去改 id=100 → 等待</text><path d="M462 340 L802 340 M796 335 L802 340 L796 345" stroke="#ffc861" stroke-width="2" fill="none"/><text x="632" y="330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">等待 id=200</text><path d="M824 404 L462 404" stroke="#b388ff" stroke-width="2"/><path d="M470 399 L462 404 L470 409" fill="none" stroke="#b388ff" stroke-width="2"/><text x="632" y="424" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#b388ff" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">等待 id=100</text><text x="56" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">检测：等待图上发现环 → 选代价小的一方回滚，报 1213</text><text x="56" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">规避：统一加锁顺序 · 缩短事务 · 必要时降 RC 关间隙锁 · 捕获后整事务重试</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB 死锁与 innodb_deadlock_detect 说明自绘</text></svg>