<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1120" height="620" fill="url(#g1)"/><rect width="1120" height="620" fill="url(#grid)"/>
<rect width="1120" height="620" fill="url(#glow)"/><rect width="1120" height="620" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 运维与安全</text>
<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="100" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">算法选择与限制</text><text x="48" y="132" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">指定 ALGORITHM 与 LOCK，让 DDL 在预期模式下执行</text><rect x="48" y="154" width="1024" height="40" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="194" x2="1072" y2="194" stroke="rgba(120,170,255,0.22)"/><text x="48" y="180" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">操作</text><text x="298" y="180" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">可用算法</text><text x="518" y="180" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">锁</text><text x="748" y="180" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">注意</text><rect x="48" y="194" width="1024" height="40" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="234" x2="1072" y2="234" stroke="rgba(120,170,255,0.22)"/><text x="48" y="220" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">ADD COLUMN（尾部）</text><text x="298" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">INSTANT</text><text x="518" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">NONE</text><text x="748" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">8.4 默认，秒级</text><rect x="48" y="234" width="1024" height="40" fill="transparent"/><line x1="48" y1="274" x2="1072" y2="274" stroke="rgba(120,170,255,0.22)"/><text x="48" y="260" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">ADD INDEX</text><text x="298" y="260" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">INPLACE</text><text x="518" y="260" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">NONE</text><text x="748" y="260" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">需 rebuild，占额外磁盘</text><rect x="48" y="274" width="1024" height="40" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="314" x2="1072" y2="314" stroke="rgba(120,170,255,0.22)"/><text x="48" y="300" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">DROP INDEX</text><text x="298" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">INPLACE</text><text x="518" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">NONE</text><text x="748" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">元数据为主，较快</text><rect x="48" y="314" width="1024" height="40" fill="transparent"/><line x1="48" y1="354" x2="1072" y2="354" stroke="rgba(120,170,255,0.22)"/><text x="48" y="340" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">MODIFY COLUMN 类型</text><text x="298" y="340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">COPY</text><text x="518" y="340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">SHARED</text><text x="748" y="340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">整表重建，时间随数据量</text><rect x="48" y="354" width="1024" height="40" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="394" x2="1072" y2="394" stroke="rgba(120,170,255,0.22)"/><text x="48" y="380" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">CHANGE 字符集</text><text x="298" y="380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">COPY</text><text x="518" y="380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">SHARED</text><text x="748" y="380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">索引全部重建</text><rect x="48" y="404" width="492" height="140" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="404" width="4" height="140" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="68" y="434" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">正确写法</text><text x="68" y="464" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">ALTER TABLE t ADD COLUMN c INT, ALGORITHM=INSTANT, LOCK=NONE;</text><text x="68" y="492" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">若指定算法不可用，语句直接失败而不是降级</text><text x="68" y="520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">这样能在预发暴露问题，而不是生产上悄悄锁表</text><rect x="572" y="404" width="500" height="140" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="572" y="404" width="4" height="140" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="592" y="434" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">INSTANT 的限制</text><text x="592" y="464" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">列只能加在末尾；不支持全文索引列</text><text x="592" y="492" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">行格式需 DYNAMIC/COMPRESSED</text><text x="592" y="520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">频繁 INSTANT 会累积行版本，需重建表回收</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 Online DDL Operations 说明自绘</text></svg>