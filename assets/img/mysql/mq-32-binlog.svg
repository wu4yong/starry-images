<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 存储引擎与内部</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">binlog 记的是「发生了什么」</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Server 层日志，与引擎无关；复制、闪回、审计都靠它</text><rect x="56" y="210" width="368" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="210" width="4" height="132" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="74" y="246" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">STATEMENT</text><text x="74" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">记 SQL 原文</text><text x="74" y="314" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">日志小，但函数/时间函数会漂移</text><rect x="448" y="210" width="368" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="448" y="210" width="4" height="132" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="466" y="246" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">ROW</text><text x="466" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">记每行的前后镜像</text><text x="466" y="314" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">最准，日志大；8.x 默认</text><rect x="840" y="210" width="368" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="840" y="210" width="4" height="132" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="858" y="246" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">MIXED</text><text x="858" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">按语句自动选</text><text x="858" y="314" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">折中，判断逻辑不透明</text><text x="56" y="386" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">ROW 格式下一次 UPDATE 产生的事件序列</text><rect x="56" y="404" width="300" height="76" rx="12" fill="rgba(14,24,44,0.92)" stroke="#8ba3c7" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="404" width="4" height="76" rx="2" fill="#8ba3c7" fill-opacity="0.85"/><text x="74" y="436" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#8ba3c7" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Table_map</text><text x="74" y="462" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">表 id 与列结构</text><rect x="436" y="404" width="300" height="76" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="436" y="404" width="4" height="76" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="454" y="436" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Update_rows</text><text x="454" y="462" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">before / after 镜像</text><rect x="816" y="404" width="300" height="76" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="816" y="404" width="4" height="76" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="834" y="436" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Xid</text><text x="834" y="462" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">事务提交标记</text><rect x="56" y="500" width="568" height="88" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="500" width="4" height="88" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="76" y="530" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">sync_binlog = 1（默认）</text><text x="76" y="558" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">每次提交都 fsync binlog，崩溃不丢已提交</text><rect x="656" y="500" width="568" height="88" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="656" y="500" width="4" height="88" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="676" y="530" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">binlog_row_image = FULL</text><text x="676" y="558" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">前后镜像都记；MINIMAL 只记变更列，省空间但易踩坑</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 Binary Log / binlog_format 说明自绘</text></svg>