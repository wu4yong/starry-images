<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 事务与锁</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="40" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">锁的层级：表级管意图，行级管记录</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">多粒度靠意向锁衔接，行锁实际加在索引记录上</text><rect x="56" y="220" width="520" height="70" rx="10" fill="rgba(61,220,255,0.12)" stroke="#3ddcff" stroke-opacity="0.6"/><text x="76" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">表级：S / X 表锁 + IS / IX 意向锁</text><path d="M300 290 L300 330" stroke="rgba(120,170,255,0.22)" stroke-width="2"/><rect x="56" y="346" width="520" height="50" rx="8" fill="rgba(14,24,44,0.9)" stroke="#4a9dff" stroke-opacity="0.45"/><text x="76" y="378" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">记录锁 REC_NOT_GAP</text><text x="330" y="378" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">锁某条索引记录</text><rect x="56" y="408" width="520" height="50" rx="8" fill="rgba(14,24,44,0.9)" stroke="#ffc861" stroke-opacity="0.45"/><text x="76" y="440" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">间隙锁 GAP</text><text x="330" y="440" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">锁记录之间的空隙</text><rect x="56" y="470" width="520" height="50" rx="8" fill="rgba(14,24,44,0.9)" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="76" y="502" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">next-key lock</text><text x="330" y="502" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">记录 + 前面的间隙</text><rect x="56" y="532" width="520" height="50" rx="8" fill="rgba(14,24,44,0.9)" stroke="#b388ff" stroke-opacity="0.45"/><text x="76" y="564" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">插入意向锁</text><text x="330" y="564" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">插入前的目标间隙</text><rect x="56" y="594" width="520" height="50" rx="8" fill="rgba(14,24,44,0.9)" stroke="#ff6b8a" stroke-opacity="0.45"/><text x="76" y="626" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">AUTO-INC 锁</text><text x="330" y="626" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">自增分配（表级）</text><rect x="620" y="220" width="604" height="176" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="620" y="220" width="4" height="176" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="640" y="256" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">兼容矩阵：读一遍就够</text><text x="640" y="290" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">IS ↔ IX 兼容；只与整表 S/X 冲突</text><text x="640" y="318" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">S ↔ S 兼容，X 与任何锁都不兼容</text><text x="640" y="346" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">行锁冲突看记录，不看意向锁</text><rect x="620" y="414" width="604" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="620" y="414" width="4" height="156" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="640" y="450" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">加锁范围由索引决定</text><text x="640" y="484" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">唯一索引等值 → 只锁一行</text><text x="640" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">普通索引等值 → next-key 一段</text><text x="640" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">无索引 → 锁住扫描到的所有记录</text><text x="620" y="626" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">MDL：DDL 与长查询的另一战场，看 metadata_locks</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB Locking / Locks Set by SQL 自绘</text></svg>