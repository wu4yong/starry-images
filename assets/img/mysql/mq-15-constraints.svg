<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs><rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/><rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/><text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 表设计与索引</text><line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">五类约束：谁在守护数据</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">主键 / 唯一 / 外键 / CHECK / 默认值 —— 各管一段，不能互相替代</text><rect x="56" y="226" width="224" height="216" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><line x1="56" y1="226" x2="59" y2="226" stroke="#3ddcff" stroke-width="0"/><rect x="56" y="226" width="4" height="216" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="74" y="270" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">PRIMARY KEY</text><text x="74" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">唯一 + 非空，聚簇索引的键</text><text x="74" y="346" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">一张表只能有一个</text><line x1="74" y1="372" x2="262" y2="372" stroke="rgba(120,170,255,0.22)"/><text x="74" y="402" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.9">代价：一次检查</text><rect x="294" y="226" width="224" height="216" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><line x1="294" y1="226" x2="297" y2="226" stroke="#4a9dff" stroke-width="0"/><rect x="294" y="226" width="4" height="216" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="312" y="270" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">UNIQUE</text><text x="312" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">唯一索引，允许多行 NULL</text><text x="312" y="346" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">可多列、可多个</text><line x1="312" y1="372" x2="500" y2="372" stroke="rgba(120,170,255,0.22)"/><text x="312" y="402" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.9">代价：一次检查</text><rect x="532" y="226" width="224" height="216" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><line x1="532" y1="226" x2="535" y2="226" stroke="#b388ff" stroke-width="0"/><rect x="532" y="226" width="4" height="216" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="550" y="270" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">FOREIGN KEY</text><text x="550" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">引用完整性，仅 InnoDB 生效</text><text x="550" y="346" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">带索引、锁与级联代价</text><line x1="550" y1="372" x2="738" y2="372" stroke="rgba(120,170,255,0.22)"/><text x="550" y="402" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.9">代价：锁 + 索引</text><rect x="770" y="226" width="224" height="216" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><line x1="770" y1="226" x2="773" y2="226" stroke="#3ee6a2" stroke-width="0"/><rect x="770" y="226" width="4" height="216" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="788" y="270" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">CHECK</text><text x="788" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">8.0.16 起真正校验表达式</text><text x="788" y="346" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">不能含子查询与 NOW()</text><line x1="788" y1="372" x2="976" y2="372" stroke="rgba(120,170,255,0.22)"/><text x="788" y="402" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.9">代价：一次检查</text><rect x="1008" y="226" width="224" height="216" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><line x1="1008" y1="226" x2="1011" y2="226" stroke="#ffc861" stroke-width="0"/><rect x="1008" y="226" width="4" height="216" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="1026" y="270" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">DEFAULT</text><text x="1026" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">8.0.13 起支持表达式</text><text x="1026" y="346" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">JSON/TEXT 只能这样给默认</text><line x1="1026" y1="372" x2="1214" y2="372" stroke="rgba(120,170,255,0.22)"/><text x="1026" y="402" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.9">代价：一次检查</text><text x="56" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">CHECK 表达式写错等于没写：结果必须是 TRUE 或 UNKNOWN，FALSE 才拦</text><rect x="56" y="528" width="388.70000000000005" height="31" rx="15.5" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="250.35000000000002" y="547" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">CONSTRAINT ck_amount CHECK (amount &gt; 0)</text><rect x="56" y="566" width="305" height="31" rx="15.5" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="208.5" y="585" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">CHECK (status BETWEEN 0 AND 9)</text><text x="760" y="528" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">约束名在整个 schema 内唯一</text><text x="760" y="556" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">外键列没索引时 InnoDB 会自动补一个</text><text x="760" y="584" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">INSERT IGNORE 遇 CHECK 失败只警告并跳过该行</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 CREATE TABLE / CHECK Constraints 章节自绘</text></svg>