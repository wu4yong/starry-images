<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 存储引擎与内部</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">InnoDB 的内存三层</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">改数据先改内存，落盘靠日志追平——Buffer Pool 是主战场</text><rect x="56" y="208" width="1168" height="74" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="208" width="4" height="74" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="80" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">SQL 层</text><text x="80" y="266" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">解析 · 优化器 · 执行器（Server 层，与引擎无关）</text><text x="900" y="250" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">binlog 在这一层写</text><path d="M640 284 L640 310" stroke="#8ba3c7" stroke-width="2"/><path d="M634 304 L640 312 L646 304" fill="none" stroke="#8ba3c7" stroke-width="2"/><rect x="56" y="316" width="272" height="140" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="316" width="4" height="140" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="72" y="350" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Buffer Pool</text><text x="72" y="382" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">缓存 16KB 数据页与索引页</text><text x="72" y="414" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">innodb_buffer_pool_size</text><text x="72" y="438" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">实例数：instances</text><rect x="352" y="316" width="272" height="140" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="352" y="316" width="4" height="140" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="368" y="350" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Change Buffer</text><text x="368" y="382" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">缓存非唯一二级索引的写</text><text x="368" y="414" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">innodb_change_buffering</text><text x="368" y="438" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1"> </text><rect x="648" y="316" width="272" height="140" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="316" width="4" height="140" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="664" y="350" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Log Buffer</text><text x="664" y="382" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">暂存 redo，按需刷盘</text><text x="664" y="414" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">innodb_log_buffer_size</text><text x="664" y="438" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1"> </text><rect x="944" y="316" width="272" height="140" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="944" y="316" width="4" height="140" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="960" y="350" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">Adaptive Hash</text><text x="960" y="382" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">热点页的哈希目录</text><text x="960" y="414" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">innodb_adaptive_hash_index</text><text x="960" y="438" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1"> </text><path d="M640 460 L640 486" stroke="#8ba3c7" stroke-width="2"/><path d="M634 480 L640 488 L646 480" fill="none" stroke="#8ba3c7" stroke-width="2"/><rect x="56" y="492" width="1168" height="108" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="492" width="4" height="108" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="80" y="524" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">磁盘</text><text x="80" y="556" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">表空间 .ibd · 系统表空间 ibdata1 · undo 表空间 · redo（#innodb_redo）· binlog</text><text x="80" y="584" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">刷脏由 page cleaner 线程完成，日志先行（WAL），崩溃后按 redo 前滚、undo 回滚</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB Architecture / Memory Structure 章节自绘</text></svg>