l="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">表空间只涨不缩</text><text x="48" y="536" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">处理顺序：先找出最老的事务 → 再谈扩容 undo 表空间，否则只是把问题推迟</text><text x="48" y="562" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">在线截断：ALTER UNDO TABLESPACE undo_002 SET INACTIVE; 之后由后台自动回收</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 Undo Tablespaces / Purge 配置说明自绘</text></svg>