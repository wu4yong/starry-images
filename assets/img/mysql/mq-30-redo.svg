<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 存储引擎与内部</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">先写日志，再慢慢刷盘</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">WAL 把随机写变成顺序写；崩溃后靠 redo 把内存里没落盘的改动补回来</text><rect x="56" y="208" width="272" height="108" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="208" width="4" height="108" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="72" y="246" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">① 改内存页</text><text x="72" y="280" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Buffer Pool 中的页变脏</text><path d="M330 262 L350 262 M344 257 L350 262 L344 267" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="352" y="208" width="272" height="108" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="352" y="208" width="4" height="108" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="368" y="246" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">② 写 redo</text><text x="368" y="280" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">顺序追加，立即持久</text><path d="M626 262 L646 262 M640 257 L646 262 L640 267" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="648" y="208" width="272" height="108" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="208" width="4" height="108" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="664" y="246" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">③ 提交返回</text><text x="664" y="280" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">客户端拿到成功</text><path d="M922 262 L942 262 M936 257 L942 262 L936 267" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="944" y="208" width="272" height="108" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="944" y="208" width="4" height="108" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="960" y="246" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">④ 异步刷脏</text><text x="960" y="280" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">page cleaner 慢慢落盘</text><text x="56" y="366" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">redo 是一个环形空间，写满就覆盖最老的日志——所以必须保证脏页刷得比覆盖快</text><rect x="56" y="396" width="1168" height="56" rx="8" fill="rgba(62,230,162,0.10)" stroke="#3ee6a2" stroke-opacity="0.5"/><rect x="114.4" y="396" width="642.4000000000001" height="56" fill="rgba(62,230,162,0.28)"/><text x="80" y="430" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">已写入（有效）</text><text x="780.16" y="430" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">可覆盖空间</text><path d="M114.4 468 L114.4 456" stroke="#3ddcff" stroke-width="2"/><text x="122.4" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">checkpoint：最老的脏页 LSN</text><path d="M756.8 468 L756.8 456" stroke="#ffc861" stroke-width="2"/><text x="764.8" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">write pos：当前写入位置</text><rect x="56" y="508" width="568" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="508" width="4" height="96" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="76" y="540" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">innodb_redo_log_capacity</text><text x="76" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">8.0.30 起统一管理，可在线扩容；文件在 #innodb_redo 目录</text><rect x="656" y="508" width="568" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="656" y="508" width="4" height="96" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="676" y="540" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" opacity="1">innodb_flush_log_at_trx_commit</text><text x="676" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">默认 1：每次提交 fsync，宕机不丢已提交事务</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">依据 MySQL 8.4 InnoDB Redo Log / WAL 说明自绘</text></svg>