<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">Docker 安装的四个关键参数</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">端口、密码、数据卷、字符集</text><rect x="48" y="120" width="190.4" height="84" rx="10" fill="#5eead412" stroke="#5eead4" stroke-width="1.5"/><text x="143.2" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">拉镜像</text><text x="143.2" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">mysql:8.4</text><line x1="238.4" y1="162" x2="254.39999999999998" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/><rect x="256.4" y="120" width="190.4" height="84" rx="10" fill="#5eead412" stroke="#5eead4" stroke-width="1.5"/><text x="351.59999999999997" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">定密码</text><text x="351.59999999999997" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">MYSQL_ROOT_PASSWORD</text><line x1="446.79999999999995" y1="162" x2="462.79999999999995" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/><rect x="464.8" y="120" width="190.4" height="84" rx="10" fill="#38bdf812" stroke="#38bdf8" stroke-width="1.5"/><text x="560" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">挂数据卷</text><text x="560" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">named volume</text><line x1="655.2" y1="162" x2="671.2" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/><rect x="673.2" y="120" width="190.4" height="84" rx="10" fill="#38bdf812" stroke="#38bdf8" stroke-width="1.5"/><text x="768.4000000000001" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">放配置</text><text x="768.4000000000001" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">my.cnf 挂载</text><line x1="863.6" y1="162" x2="879.6" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/><rect x="881.6" y="120" width="190.4" height="84" rx="10" fill="#fbbf2412" stroke="#fbbf24" stroke-width="1.5"/><text x="976.8000000000001" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">验证</text><text x="976.8000000000001" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">mysqladmin ping</text><rect x="48" y="240" width="496" height="268" rx="12" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.5"/><text x="66" y="268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">run 命令里必须有的</text><text x="66" y="302" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">-p 3306:3306  端口映射，别忘绑定地址</text><text x="66" y="329" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">-e MYSQL_ROOT_PASSWORD  首次初始化才生效</text><text x="66" y="356" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">-v mysql84-data:/var/lib/mysql  数据卷</text><text x="66" y="383" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">-v ./conf:/etc/mysql/conf.d  配 utf8mb4</text><text x="66" y="410" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">--restart unless-stopped  跟随宿主重启</text><text x="66" y="437" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">-e TZ=Asia/Shanghai  时间一致性</text><rect x="576" y="240" width="496" height="268" rx="12" fill="rgba(248,113,113,0.05)" stroke="#f87171" stroke-width="1.5"/><text x="594" y="268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">容器化的三个坑</text><text x="594" y="302" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">密码变量只在空数据目录时生效，改不了</text><text x="594" y="329" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">数据卷不挂，容器删了库就没了</text><text x="594" y="356" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">容器内 3306 监听 0.0.0.0，宿主要防火墙</text><text x="594" y="383" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">内存限制过低 → OOM 杀进程、崩溃重启</text><text x="594" y="410" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">本地开发别用 root 业务账号</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">依据 MySQL 8.4 Installation 与官方镜像文档自绘</text></svg>