<line x1="56" y1="66" x2="1064" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="48" y="100" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">路由算法与归并类型</text><text x="48" y="132" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">选哪种算法取决于分片键形态与扩容方式</text><rect x="48" y="158" width="1024" height="42" fill="rgba(61,220,255,0.10)"/><line x1="48" y1="200" x2="1072" y2="200" stroke="rgba(120,170,255,0.22)"/><text x="48" y="185" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">路由算法</text><text x="298" y="185" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">规则</text><text x="568" y="185" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">优点</text><text x="808" y="185" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">代价</text><rect x="48" y="200" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="242" x2="1072" y2="242" stroke="rgba(120,170,255,0.22)"/><text x="48" y="227" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">取模 MOD</text><text x="298" y="227" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">hash(key) % N</text><text x="568" y="227" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">分布均匀</text><text x="808" y="227" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">扩容要重分布，需迁移</text><rect x="48" y="242" width="1024" height="42" fill="transparent"/><line x1="48" y1="284" x2="1072" y2="284" stroke="rgba(120,170,255,0.22)"/><text x="48" y="269" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">范围 RANGE</text><text x="298" y="269" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">按区间映射</text><text x="568" y="269" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">范围查询友好</text><text x="808" y="269" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">易热点（新数据集中在末片）</text><rect x="48" y="284" width="1024" height="42" fill="rgba(255,255,255,0.03)"/><line x1="48" y1="326" x2="1072" y2="326" stroke="rgba(120,170,255,0.22)"/><text x="48" y="311" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">一致性哈希</text><text x="298" y="311" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">环上顺时针找节点</text><text x="568" y="311" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">扩容只迁移部分数据</text><text x="808" y="311" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">实现复杂，需虚拟节点</text><rect x="48" y="326" width="1024" height="42" fill="transparent"/><line x1="48" y1="368" x2="1072" y2="368" stroke="rgba(120,170,255,0.22)"/><text x="48" y="353" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">双写/映射表</text><text x="298" y="353" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">查表得到分片</text><text x="568" y="353" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">灵活，可在线扩缩容</text><text x="808" y="353" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">多一次查询或缓存</text><text x="48" y="396" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">归并的三种类型</text><rect x="48" y="410" width="320" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="48" y="410" width="4" height="118" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="68" y="442" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">遍历归并</text><text x="68" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">各片结果直接拼接</text><text x="68" y="496" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">用于无排序无聚合的查询</text><rect x="388" y="410" width="320" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="388" y="410" width="4" height="118" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="408" y="442" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0">排序归并</text><text x="408" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">各片先排序，再流式合并</text><text x="408" y="496" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">ORDER BY + LIMIT 必走这类</text><rect x="728" y="410" width="344" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="728" y="410" width="4" height="118" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="748" y="442" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">聚合归并</text><text x="748" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">SUM/AVG/COUNT 二次计算</text><text x="748" y="496" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">AVG 需拆成 SUM + COUNT</text><line x1="56" y1="574" x2="1064" y2="574" stroke="rgba(120,170,255,0.22)"/><text x="56" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 ShardingSphere 分片算法 / 归并说明自绘</text></svg>