<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">MYSQL 8.4 · 运维与安全</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="128" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">权限体系的四层</text><text x="56" y="172" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">账号 → 库 → 表 → 列，越往下越细，也越难维护</text><rect x="56" y="206" width="700" height="78" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="206" width="4" height="78" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="76" y="236" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0">全局</text><text x="150" y="236" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">ON *.*</text><text x="420" y="236" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">给管理账号，慎用</text><rect x="56" y="298" width="700" height="78" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="298" width="4" height="78" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="76" y="328" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">库级</text><text x="150" y="328" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">ON shop.*</text><text x="420" y="328" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">按业务库授权</text><rect x="56" y="390" width="700" height="78" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="390" width="4" height="78" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="76" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">表级</text><text x="150" y="420" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">ON shop.t_order</text><text x="420" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">临时排查时用</text><rect x="56" y="482" width="700" height="78" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="482" width="4" height="78" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="76" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">列级</text><text x="150" y="512" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">SELECT (col)</text><text x="420" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">合规场景（如脱敏）</text><rect x="800" y="206" width="424" height="262" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="800" y="206" width="4" height="262" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="820" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0">最小权限模板</text><text x="820" y="272" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">GRANT SELECT, INSERT, UPDATE,</text><text x="820" y="296" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">      DELETE ON shop.* TO app@10.%</text><text x="820" y="330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">不给 DROP / ALTER / GRANT</text><text x="820" y="358" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">DDL 由发布流水线用专用账号执行</text><text x="820" y="390" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">报表账号只读 + 独立从库</text><text x="820" y="430" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0">账号名带「用途 + 环境」，便于审计</text><text x="56" y="600" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">8.4 默认关闭 mysql_native_password，新账号统一用 caching_sha2_password</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据 MySQL 8.4 Privileges / 账号管理说明自绘</text></svg>