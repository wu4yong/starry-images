<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">批量写入的五个参数</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">同一条 INSERT，吞吐能差一个数量级</text><rect x="48" y="120" width="190.4" height="84" rx="10" fill="#38bdf812" stroke="#38bdf8" stroke-width="1.5"/><text x="143.2" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">批量大小</text><text x="143.2" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">500~1000 行</text><line x1="238.4" y1="162" x2="254.39999999999998" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/><rect x="256.4" y="120" width="190.4" height="84" rx="10" fill="#5eead412" stroke="#5eead4" stroke-width="1.5"/><text x="351.59999999999997" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">事务边界</text><text x="351.59999999999997" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">每批独立提交</text><line x1="446.79999999999995" y1="162" x2="462.79999999999995" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/><rect x="464.8" y="120" width="190.4" height="84" rx="10" fill="#fbbf2412" stroke="#fbbf24" stroke-width="1.5"/><text x="560" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">自增锁</text><text x="560" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">mode=2 交错</text><line x1="655.2" y1="162" x2="671.2" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/><rect x="673.2" y="120" width="190.4" height="84" rx="10" fill="#a78bfa12" stroke="#a78bfa" stroke-width="1.5"/><text x="768.4000000000001" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">连接参数</text><text x="768.4000000000001" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">rewriteBatched</text><line x1="863.6" y1="162" x2="879.6" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/><rect x="881.6" y="120" width="190.4" height="84" rx="10" fill="#86efac12" stroke="#86efac" stroke-width="1.5"/><text x="976.8000000000001" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#86efac" text-anchor="middle" dominant-baseline="middle">重试幂等</text><text x="976.8000000000001" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">唯一键 + 退避</text><rect x="48" y="240" width="496" height="268" rx="12" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.5"/><text x="66" y="268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">SQL 侧怎么写</text><text x="66" y="302" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">多值 INSERT：一次往返，最快</text><text x="66" y="329" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">ON DUPLICATE KEY UPDATE：幂等兜底</text><text x="66" y="356" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">UPDATE 分批：WHERE 主键区间 + LIMIT</text><text x="66" y="383" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">DELETE 用分区 / 归档代替大批量删</text><text x="66" y="410" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">导入优先 LOAD DATA，其次多值 INSERT</text><text x="66" y="437" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">批量前按主键排序，减少页分裂</text><rect x="576" y="240" width="496" height="268" rx="12" fill="rgba(248,113,113,0.05)" stroke="#f87171" stroke-width="1.5"/><text x="594" y="268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">Java 侧三个开关</text><text x="594" y="302" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">rewriteBatchedStatements=true</text><text x="594" y="329" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">useServerPrepStmts=true + 预编译缓存</text><text x="594" y="356" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">batchUpdate(sql, batch, 500, setter)</text><text x="594" y="383" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">REQUIRES_NEW：每批一个事务</text><text x="594" y="410" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">死锁重试：50ms 起指数退避 3 次</text><text x="594" y="437" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">观测每批行数、耗时、主从延迟</text><text x="48" y="528" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">结论：批量写入的瓶颈在事务与锁，不在 SQL 写法。</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">依据 MySQL 8.4 DML / Auto-Increment Handling 与 Connector/J 文档自绘</text></svg>