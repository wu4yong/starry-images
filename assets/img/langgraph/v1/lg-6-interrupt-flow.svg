<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGGRAPH 1.x · INTERRUPT</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="120" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">运行 → 暂停 → 恢复</text><text x="56" y="152" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">interrupt() 抛值并落检查点；Command(resume=x) 把 x 交回同一个 thread</text><rect x="56" y="250" width="250" height="84" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="181" y="297" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">draft 起草</text><path d="M312 292 L408 292 M402 287 L408 292 L402 297" stroke="#3ddcff" stroke-width="2" fill="none" /><rect x="412" y="250" width="300" height="84" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ffc861" stroke-opacity="0.6" stroke-width="1.3"/><text x="562" y="297" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">interrupt(审批问题)</text><path d="M718 292 L814 292 M808 287 L814 292 L808 297" stroke="#3ddcff" stroke-width="2" fill="none" /><rect x="818" y="250" width="200" height="84" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ee6a2" stroke-opacity="0.6" stroke-width="1.3"/><text x="918" y="297" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">publish</text><rect x="1038" y="250" width="190" height="84" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ff6b8a" stroke-opacity="0.6" stroke-width="1.3"/><text x="1133" y="297" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">cancel</text><path d="M716 262 L812 286 M716 322 L812 302" stroke="rgba(120,170,255,0.22)" stroke-width="1.4" fill="none"/><text x="462" y="360" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0">图停在这里，等多久都行</text><rect x="56" y="400" width="540" height="200" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="400" width="4" height="200" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="86" y="438" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">第一次 invoke</text><text x="86" y="470" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">result.interrupts → 待办问题 + 当前状态</text><text x="86" y="500" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">result.value.status = "pending"</text><text x="86" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">checkpointer 存下：values / next / interrupt 载荷</text><text x="86" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">durability 决定这帧写得有多稳（LG07）</text><rect x="620" y="400" width="604" height="200" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="620" y="400" width="4" height="200" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="650" y="438" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">恢复时在发生什么</text><text x="650" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">① 必须同一个 thread_id</text><text x="650" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">② 节点从前一行开始整段重跑，不是断点续行</text><text x="650" y="530" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">③ interrupt() 之前的副作用要幂等</text><text x="650" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">恢复值 = interrupt() 的返回值 → 决定 goto</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">一个节点只调一次 interrupt；多次恢复按调用下标匹配，顺序不能变</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG · 06 / 16</text></svg>