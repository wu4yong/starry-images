<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGGRAPH 1.x · 两种动态路由</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="116" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="28" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">Command 把「改状态 + 选下一步」合成一步；Send 把同一节点按条目拆开并行</text><text x="56" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">前者解决路由依赖本节点结果的问题，后者解决「条目数只有运行时才知道」的问题</text><rect x="56" y="176" width="556" height="392" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="176" width="4" height="392" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="80" y="210" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">Command(update=..., goto=...)</text><rect x="80" y="250" width="200" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="180" y="283" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">node_a</text><path d="M280 278 L352 278" stroke="#ffc861" stroke-width="2" fill="none" stroke-dasharray="6 5"/><rect x="356" y="250" width="210" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="461" y="283" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">node_b</text><text x="80" y="336" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">return Command(</text><text x="96" y="360" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">update={"route": "refund"},</text><text x="96" y="384" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">goto="refund_node",</text><text x="80" y="408" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">)</text><text x="80" y="448" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· 一个函数里既写状态又决定去哪</text><text x="80" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0">· 与同一节点的 add_edge 不能混用（两路都会跑）</text><text x="80" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· 还能带 graph= 跨子图、resume= 恢复中断</text><text x="80" y="526" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· 返回类型写 Command[Literal["refund_node"]] 才有边</text><rect x="636" y="176" width="588" height="392" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="636" y="176" width="4" height="392" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="660" y="210" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0">Send(node, arg) × N</text><rect x="660" y="248" width="170" height="52" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="745" y="279" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">split</text><path d="M830 274 L884 226 M830 274 L884 274 M830 274 L884 322" stroke="#b388ff" stroke-opacity="0.7" stroke-width="2" fill="none"/><rect x="888" y="200" width="150" height="48" rx="9" fill="rgba(18,30,54,0.95)" stroke="#b388ff" stroke-opacity="0.6" stroke-width="1.3"/><text x="963" y="229" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">worker 1</text><rect x="888" y="250" width="150" height="48" rx="9" fill="rgba(18,30,54,0.95)" stroke="#b388ff" stroke-opacity="0.6" stroke-width="1.3"/><text x="963" y="279" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">worker 2</text><rect x="888" y="300" width="150" height="48" rx="9" fill="rgba(18,30,54,0.95)" stroke="#b388ff" stroke-opacity="0.6" stroke-width="1.3"/><text x="963" y="329" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">worker 3</text><path d="M1038 224 L1090 268 M1038 274 L1090 274 M1038 324 L1090 280" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none"/><rect x="1094" y="246" width="104" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ee6a2" stroke-opacity="0.6" stroke-width="1.3"/><text x="1146" y="279" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">merge</text><text x="660" y="372" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">def split(state):</text><text x="660" y="396" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">    return [Send("worker", {"item": x})</text><text x="660" y="420" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">            for x in state["items"]]</text><text x="660" y="458" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· 每个 worker 收到自己那份输入，不是整份 state</text><text x="660" y="484" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">· 并行写同一个 key 时靠 reducer 合并（本篇的 LG02）</text><text x="660" y="510" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">· 条目数在运行时才知道，普通边做不到</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据官方 Graph API · Command / Send 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG03b · COMMAND &amp; SEND</text></svg>