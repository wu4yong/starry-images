YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">tool_node</text><text x="672" y="212" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">ToolNode([...]) 并发执行</text><path d="M777 304 C 777 360, 300 360, 232 336" stroke="#3ee6a2" stroke-width="1.8" fill="none"/><path d="M232 336 L246 330 M232 336 L246 342" stroke="#3ee6a2" stroke-width="1.8" fill="none"/><text x="470" y="382" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="middle" letter-spacing="0">工具结果回灌 messages，再问一次模型</text><text x="900" y="246" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">无 tool_calls</text><text x="900" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">→ END</text><rect x="56" y="418" width="566" height="210" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="418" width="4" height="210" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="86" y="454" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">ToolNode 帮你做了三件事</text><text x="86" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">① 并发执行同一轮的全部 tool_calls</text><text x="86" y="514" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">② 默认捕获异常并回成 ToolMessage（handle_tool_errors）</text><text x="86" y="542" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">③ 支持工具里读图状态 / 上下文</text><text x="86" y="578" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">写法：ToolNode([search, calc]) + tools_condition</text><rect x="644" y="418" width="580" height="210" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="644" y="418" width="4" height="210" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="674" y="454" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0">四个容易踩的点</text><text x="674" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 工具返回值必须是 JSON 可序列化</text><text x="674" y="514" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 永远循环：给 recursion_limit 与终止条件</text><text x="674" y="542" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 工具副作用不幂等：重试前想清楚</text><text x="674" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">· 工具里拿不到 state：用注入参数而不是闭包</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">官方 Workflows and agents · ToolNode / Quickstart · should_continue</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG · 13 / 16</text></svg>