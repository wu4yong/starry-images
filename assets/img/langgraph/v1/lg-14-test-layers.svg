<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="118" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="29" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">测试四层：越往下越贵</text><text x="56" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">官方给的三个抓手：整图断言、单节点直调、update_state 做局部执行</text><rect x="56" y="200" width="520" height="80" rx="10" fill="rgba(14,24,44,0.8)" stroke="#3ddcff" stroke-opacity="0.5"/><text x="84" y="232" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">① 节点单测</text><text x="84" y="258" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">graph.nodes["n1"].invoke(state)</text><text x="600" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">快、稳，绕开 checkpointer</text><text x="600" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">单位：毫秒｜无外部依赖</text><rect x="56" y="296" width="500" height="80" rx="10" fill="rgba(14,24,44,0.8)" stroke="#4a9dff" stroke-opacity="0.5"/><text x="84" y="328" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0">② 局部路径</text><text x="84" y="354" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">update_state(as_node=...) + interrupt_after</text><text x="600" y="324" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">只跑中间一段，不碰前后</text><text x="600" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">单位：秒｜仍不花钱</text><rect x="56" y="392" width="480" height="80" rx="10" fill="rgba(14,24,44,0.8)" stroke="#3ee6a2" stroke-opacity="0.5"/><text x="84" y="424" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">③ 整图断言</text><text x="84" y="450" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">invoke(...) 后断言最终 state</text><text x="600" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">覆盖路由与 reducer</text><text x="600" y="444" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">单位：秒级｜会调模型</text><rect x="56" y="488" width="460" height="80" rx="10" fill="rgba(14,24,44,0.8)" stroke="#ffc861" stroke-opacity="0.5"/><text x="84" y="520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">④ 轨迹评测</text><text x="84" y="546" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">数据集 + evaluator 打分</text><text x="600" y="516" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">看过程，不只看结果</text><text x="600" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">单位：分钟｜要数据集</text><rect x="880" y="200" width="344" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="880" y="200" width="4" height="300" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="908" y="236" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">一个整图断言长这样</text><text x="908" y="272" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">def create_graph(): ...</text><text x="908" y="296" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">def test_flow():</text><text x="908" y="320" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">    g = create_graph()</text><text x="908" y="344" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">    g = g.compile(cp)</text><text x="908" y="368" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">    r = g.invoke(inp, cfg)</text><text x="908" y="392" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">    assert r["stage"] == "done"</text><text x="908" y="430" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">关键：每次新建图 + 新 checkpointer</text><text x="908" y="454" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">线程 ID 每测独立，避免互相污染</text><rect x="56" y="600" width="1168" height="64" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="600" width="4" height="64" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="84" y="628" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">评测看三层：最终答案对不对 / 路径对不对（用了哪些节点、几次工具）/ 成本与延迟是否超预算</text><text x="84" y="652" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">别只断言「字符串相等」，模型输出要按字段与规则断言</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">官方 Test · Unit tests / Testing nodes / Partial execution</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG · 14 / 16</text></svg>