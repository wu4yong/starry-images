<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="120" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">一个 thread = 一串检查点</text><text x="56" y="152" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">每个 super-step 存一帧；get_state 看最后一帧，get_state_history 倒着放整段</text><rect x="56" y="190" width="760" height="420" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="190" width="4" height="420" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="88" y="232" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="2">THREADS</text><text x="212" y="273" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">thread A</text><circle cx="230" cy="268" r="11" fill="rgba(14,24,44,0.95)" stroke="#3ddcff" stroke-width="1.6"/><line x1="242" y1="268" x2="314" y2="268" stroke="#3ddcff" stroke-opacity="0.5" stroke-width="1.4"/><circle cx="326" cy="268" r="11" fill="rgba(14,24,44,0.95)" stroke="#3ddcff" stroke-width="1.6"/><line x1="338" y1="268" x2="410" y2="268" stroke="#3ddcff" stroke-opacity="0.5" stroke-width="1.4"/><circle cx="422" cy="268" r="11" fill="rgba(14,24,44,0.95)" stroke="#3ddcff" stroke-width="1.6"/><line x1="434" y1="268" x2="506" y2="268" stroke="#3ddcff" stroke-opacity="0.5" stroke-width="1.4"/><circle cx="518" cy="268" r="11" fill="rgba(14,24,44,0.95)" stroke="#3ddcff" stroke-width="1.6"/><line x1="530" y1="268" x2="602" y2="268" stroke="#3ddcff" stroke-opacity="0.5" stroke-width="1.4"/><circle cx="614" cy="268" r="11" fill="rgba(14,24,44,0.95)" stroke="#3ddcff" stroke-width="1.6"/><line x1="626" y1="268" x2="698" y2="268" stroke="#3ddcff" stroke-opacity="0.5" stroke-width="1.4"/><circle cx="710" cy="268" r="11" fill="rgba(14,24,44,0.95)" stroke="#3ddcff" stroke-width="1.6"/><text x="790" y="273" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">跑完两轮</text><text x="212" y="351" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">thread B</text><circle cx="230" cy="346" r="11" fill="rgba(14,24,44,0.95)" stroke="#4a9dff" stroke-width="1.6"/><line x1="242" y1="346" x2="314" y2="346" stroke="#4a9dff" stroke-opacity="0.5" stroke-width="1.4"/><circle cx="326" cy="346" r="11" fill="rgba(14,24,44,0.95)" stroke="#4a9dff" stroke-width="1.6"/><line x1="338" y1="346" x2="410" y2="346" stroke="#4a9dff" stroke-opacity="0.5" stroke-width="1.4"/><circle cx="422" cy="346" r="11" fill="rgba(14,24,44,0.95)" stroke="#4a9dff" stroke-width="1.6"/><text x="790" y="351" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">跑完一轮</text><text x="212" y="429" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">thread C</text><circle cx="230" cy="424" r="11" fill="rgba(14,24,44,0.95)" stroke="#b388ff" stroke-width="1.6"/><text x="790" y="429" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">刚开始</text><text x="88" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">每一帧带 values / next / checkpoint_id / metadata</text><text x="88" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">并行的写：同轮已完成的节点先落到 checkpoint_writes</text><text x="88" y="568" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">命名空间：根图为空串，子图为「节点名:uuid」</text><rect x="848" y="190" width="376" height="420" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="848" y="190" width="4" height="420" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="876" y="232" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">四种入口，别用错</text><rect x="876" y="270" width="320" height="64" rx="8" fill="rgba(18,30,54,0.9)" stroke="rgba(120,170,255,0.22)"/><text x="890" y="296" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">invoke(input, cfg)</text><text x="890" y="318" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">新输入，从入口点开跑</text><rect x="876" y="352" width="320" height="64" rx="8" fill="rgba(18,30,54,0.9)" stroke="rgba(120,170,255,0.22)"/><text x="890" y="378" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">invoke(None, cfg)</text><text x="890" y="400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">补未完成的活（续跑）</text><rect x="876" y="434" width="320" height="64" rx="8" fill="rgba(18,30,54,0.9)" stroke="rgba(120,170,255,0.22)"/><text x="890" y="460" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">Command(resume=x)</text><text x="890" y="482" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">回答 interrupt</text><rect x="876" y="516" width="320" height="64" rx="8" fill="rgba(18,30,54,0.9)" stroke="rgba(120,170,255,0.22)"/><text x="890" y="542" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">invoke(None, snapshot.config)</text><text x="890" y="564" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">从旧检查点回放</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">没有 checkpointer 就没有 thread：传 thread_id 会直接报错</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG · 05 / 16</text></svg>