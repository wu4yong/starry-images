<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGGRAPH 1.x · 状态与通道</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="116" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">节点只返回增量，合并规则写在 channel 自己的 reducer 上</text><text x="56" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">默认 reducer 是「覆盖」；要累积、去重、清空，都得显式声明</text><rect x="56" y="172" width="392" height="400" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="172" width="4" height="400" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="206" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">① 声明 schema</text><text x="80" y="232" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">class State(TypedDict):</text><text x="94" y="268" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">question</text><text x="94" y="292" font-family="Consolas,'Courier New',monospace" font-size="11.2" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0">str</text><text x="94" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">普通 key，覆盖</text><text x="94" y="342" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">notes</text><text x="94" y="366" font-family="Consolas,'Courier New',monospace" font-size="11.2" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0">Annotated[list, operator.add]</text><text x="94" y="386" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">追加</text><text x="94" y="416" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">tags</text><text x="94" y="440" font-family="Consolas,'Courier New',monospace" font-size="11.2" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0">Annotated[list, unique]</text><text x="94" y="460" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">自定义去重</text><text x="94" y="490" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">visits</text><text x="94" y="514" font-family="Consolas,'Courier New',monospace" font-size="11.2" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0">int</text><text x="94" y="534" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">普通 key，覆盖</text><rect x="488" y="172" width="340" height="400" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="488" y="172" width="4" height="400" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="512" y="206" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0">② channel 存什么</text><rect x="512" y="250" width="292" height="56" rx="7" fill="rgba(74,157,255,0.07)" stroke="rgba(120,170,255,0.22)"/><text x="524" y="268" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">question</text><text x="524" y="294" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">「什么是状态机」</text><rect x="512" y="324" width="292" height="56" rx="7" fill="rgba(74,157,255,0.07)" stroke="rgba(120,170,255,0.22)"/><text x="524" y="342" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">notes</text><text x="524" y="368" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">["定义", "例子"]</text><rect x="512" y="398" width="292" height="56" rx="7" fill="rgba(74,157,255,0.07)" stroke="rgba(120,170,255,0.22)"/><text x="524" y="416" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">tags</text><text x="524" y="442" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">["graph"]</text><rect x="512" y="472" width="292" height="56" rx="7" fill="rgba(74,157,255,0.07)" stroke="rgba(120,170,255,0.22)"/><text x="524" y="490" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">visits</text><text x="524" y="516" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">3</text><rect x="864" y="172" width="360" height="400" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="864" y="172" width="4" height="400" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="888" y="206" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">③ 合并怎么写回</text><text x="888" y="258" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">notes + ["新条目"]</text><text x="888" y="282" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">→ ["定义","例子","新条目"]</text><text x="888" y="302" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">operator.add：左 + 右</text><text x="888" y="336" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">tags + ["graph"]</text><text x="888" y="360" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">→ ["graph"]</text><text x="888" y="380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">自定义函数：先判重</text><text x="888" y="414" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">visits 3 → 4</text><text x="888" y="438" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">→ 4</text><text x="888" y="458" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">默认：右覆盖左</text><text x="888" y="492" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">返回整份 state</text><text x="888" y="516" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0">→ 覆盖所有 key</text><text x="888" y="536" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">这是最常见的错</text><rect x="56" y="600" width="1168" height="56" rx="9" fill="rgba(255,200,97,0.07)" stroke="#ffc861" stroke-opacity="0.4"/><text x="80" y="634" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">一句话：节点返回的是「要改的 key」，LangGraph 拿它去喂每个 key 的 reducer；key 上没有 reducer 就是覆盖。</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据官方 Graph API · State / Reducers / MessagesState 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG02 · STATE &amp; CHANNELS</text></svg>