ight="400" text-anchor="middle" letter-spacing="0">step 2</text><circle cx="810" cy="320" r="14" fill="rgba(14,24,44,0.95)" stroke="#3ddcff" stroke-width="1.6"/><path d="M828 320 L978 320 M972 315 L978 320 L972 325" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none" /><text x="810" y="360" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">step 3</text><circle cx="980" cy="320" r="14" fill="rgba(14,24,44,0.95)" stroke="#3ddcff" stroke-width="1.6"/><text x="980" y="360" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">END</text><text x="640" y="286" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="middle" letter-spacing="0">从这里岔开</text><text x="300" y="290" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">入口</text><text x="980" y="290" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">最新</text><text x="86" y="462" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="2">分叉</text><path d="M640 340 L640 420 L700 420" stroke="#3ee6a2" stroke-width="2" fill="none"/><circle cx="700" cy="420" r="12" fill="rgba(14,24,44,0.95)" stroke="#3ee6a2" stroke-width="1.6"/><path d="M716 420 L854 420 M848 415 L854 420 L848 425" stroke="#3ee6a2" stroke-width="2" fill="none" /><text x="700" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">改了 topic</text><circle cx="870" cy="420" r="12" fill="rgba(14,24,44,0.95)" stroke="#3ee6a2" stroke-width="1.6"/><path d="M886 420 L1024 420 M1018 415 L1024 420 L1018 425" stroke="#3ee6a2" stroke-width="2" fill="none" /><text x="870" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">write_post 重跑</text><circle cx="1040" cy="420" r="12" fill="rgba(14,24,44,0.95)" stroke="#3ee6a2" stroke-width="1.6"/><text x="1040" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">新结果</text><rect x="56" y="520" width="566" height="110" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="520" width="4" height="110" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="84" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">回放</text><text x="84" y="582" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">invoke(None, snap.config) — 不提供新输入</text><text x="84" y="610" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">之前的节点不重算，之后的节点整段重跑</text><rect x="650" y="520" width="574" height="110" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="650" y="520" width="4" height="110" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="678" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">分叉</text><text x="678" y="582" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">update_state(