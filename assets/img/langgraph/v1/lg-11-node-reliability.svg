<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="120" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">一个失败节点要走的三道关</text><text x="56" y="152" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">顺序固定：先按异常类型决定重试，再掐超时，最后才跑补偿</text><rect x="56" y="215" width="190" height="78" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="151" y="259" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">attempt 1</text><path d="M252 254 L308 254 M302 249 L308 254 L302 259" stroke="#ff6b8a" stroke-width="2" fill="none" /><rect x="314" y="215" width="170" height="78" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ff6b8a" stroke-opacity="0.6" stroke-width="1.3"/><text x="399" y="259" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">失败</text><path d="M490 254 L546 254 M540 249 L546 254 L540 259" stroke="#ffc861" stroke-width="2" fill="none" /><rect x="552" y="215" width="220" height="78" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ffc861" stroke-opacity="0.6" stroke-width="1.3"/><text x="662" y="259" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">RetryPolicy</text><text x="562" y="315" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">max_attempts=3 / 指数退避 / retry_on</text><path d="M778 254 L834 254 M828 249 L834 254 L828 259" stroke="#ffc861" stroke-width="2" fill="none" /><rect x="840" y="215" width="190" height="78" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ffc861" stroke-opacity="0.6" stroke-width="1.3"/><text x="935" y="259" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">第 2/3 次尝试</text><path d="M1036 254 L1082 254 M1076 249 L1082 254 L1076 259" stroke="#b388ff" stroke-width="2" fill="none" /><rect x="1088" y="215" width="136" height="78" rx="9" fill="rgba(18,30,54,0.95)" stroke="#b388ff" stroke-opacity="0.6" stroke-width="1.3"/><text x="1156" y="259" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">补偿 handler</text><text x="1156" y="315" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">重试耗尽后才触发</text><rect x="56" y="350" width="560" height="230" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="350" width="4" height="230" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="86" y="388" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0">超时只管 async</text><text x="86" y="422" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">idle_timeout：多久没动静就掐</text><text x="86" y="452" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">run_timeout：整次最多跑多久</text><text x="86" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">抛 NodeTimeoutError（默认可重试）</text><text x="86" y="514" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0">同步节点挂 timeout：compile() 直接报错</text><text x="86" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">重试时计时器归零，失败那次的写入被清掉</text><rect x="644" y="350" width="580" height="230" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="644" y="350" width="4" height="230" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="674" y="388" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">error_handler 是收场的人</text><text x="674" y="422" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">def compensate(state, error: NodeError)</text><text x="674" y="452" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">→ Command(update={...}, goto="finalize")</text><text x="674" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">只在重试耗尽或异常不在名单时触发</text><text x="674" y="514" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">handler 自己不会再被 handler 兜住</text><text x="674" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0">补偿 = Saga：退款、释放库存、置失败态</text><rect x="56" y="606" width="1168" height="58" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="606" width="4" height="58" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="84" y="642" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">RunControl.request_drain("sigterm") → GraphDrained → 检查点已存，重启 invoke(None, cfg) 续跑</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">官方 Fault tolerance / Configure nodes；timeout 与 error_handler 需 langgraph ≥ 1.2</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG · 11 / 16</text></svg>