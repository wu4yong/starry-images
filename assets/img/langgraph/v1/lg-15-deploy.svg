<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="118" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="29" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">上线清单：从仓库到可调用 API</text><text x="56" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">LangSmith Cloud 托底，也可以自托管；核心是 graph 入口 + 持久化 + 凭证</text><rect x="56" y="210" width="200" height="84" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="156" y="257" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">1 repo</text><text x="56" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">代码进 GitHub</text><path d="M262 252 L286 252 M280 247 L286 252 L280 257" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none" /><rect x="292" y="210" width="200" height="84" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="392" y="257" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">2 langgraph.json</text><text x="292" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">声明 graph 入口</text><path d="M498 252 L522 252 M516 247 L522 252 L516 257" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none" /><rect x="528" y="210" width="200" height="84" rx="9" fill="rgba(18,30,54,0.95)" stroke="#b388ff" stroke-opacity="0.6" stroke-width="1.3"/><text x="628" y="257" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">3 build</text><text x="528" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">构建镜像 / 本地起服务</text><path d="M734 252 L758 252 M752 247 L758 252 L752 257" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none" /><rect x="764" y="210" width="200" height="84" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ee6a2" stroke-opacity="0.6" stroke-width="1.3"/><text x="864" y="257" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">4 API + SDK</text><text x="764" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">/runs/stream 或 SDK</text><path d="M970 252 L994 252 M988 247 L994 252 L988 257" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none" /><rect x="1000" y="210" width="200" height="84" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ffc861" stroke-opacity="0.6" stroke-width="1.3"/><text x="1100" y="257" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">5 运维</text><text x="1000" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">PG / 追踪 / drain</text><rect x="56" y="366" width="566" height="250" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="366" width="4" height="250" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="86" y="402" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">langgraph.json 只干一件事</text><text x="86" y="436" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">{ "graphs": {"agent": "./agent.py:graph"},</text><text x="86" y="460" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">  "dependencies": ["."], "env": ".env" }</text><text x="86" y="496" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">agent 这个名字就是 SDK 里的 assistant_id</text><text x="86" y="524" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">本地先跑通：uv add langgraph-cli[inmem] → langgraph dev</text><text x="86" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">Studio 打开就能手动点每一步</text><rect x="644" y="366" width="580" height="250" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="644" y="366" width="4" height="250" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="674" y="402" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">上线前必须回答的五题</text><text x="674" y="440" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">1. 持久化选 Postgres 了吗？（checkpointer + store）</text><text x="674" y="472" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">2. thread_id 从哪来？长度 ≤255 吗？</text><text x="674" y="504" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">3. 凭证走环境变量，没写进代码吗？</text><text x="674" y="536" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">4. 长任务在 SIGTERM 时 drain 了吗？</text><text x="674" y="568" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">5. 有没有修剪检查点 / 成本上限？</text><rect x="56" y="634" width="1168" height="44" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="634" width="4" height="44" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="84" y="662" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">调用方视角：client.runs.stream(thread_id, "agent", input=..., stream_mode="updates")</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">官方 Deployment · LangSmith Cloud / langgraph.json / SDK</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG · 15 / 16</text></svg>