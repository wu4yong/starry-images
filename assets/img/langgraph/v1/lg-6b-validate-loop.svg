<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="120" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="28" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">校验输入：两种写法，一个结论</text><text x="56" y="152" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">官方推荐「一节点一次 interrupt + 条件边回环」，不要 while True</text><rect x="56" y="190" width="566" height="430" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="190" width="4" height="430" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="86" y="230" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">✅ 推荐写法</text><rect x="96" y="296" width="220" height="76" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ee6a2" stroke-opacity="0.6" stroke-width="1.3"/><text x="206" y="339" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0"></text><text x="206" y="328" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">collect_age 节点</text><text x="206" y="354" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">answer = interrupt(q)</text><rect x="376" y="296" width="210" height="76" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="481" y="339" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0"></text><text x="481" y="328" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">route 条件边</text><text x="481" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">合格 → END / 不合格 → 回环</text><path d="M322 334 L368 334 M362 329 L368 334 L362 339" stroke="#3ddcff" stroke-width="2" fill="none" /><path d="M481 376 C 481 436, 300 442, 248 442 C 210 442, 206 418, 206 394" stroke="#3ee6a2" stroke-width="1.8" fill="none" stroke-dasharray="6 5"/><path d="M200 394 L206 380 L212 394" stroke="#3ee6a2" stroke-width="1.8" fill="none"/><text x="300" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="middle" letter-spacing="0">不合格 → 回环重问</text><text x="96" y="520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">每次进节点只问一次：恢复只重放这一轮</text><text x="96" y="550" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">问题存在 state 里（pending_question）</text><text x="96" y="580" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">exit 用 END；回环用节点名，图自己会收敛</text><rect x="650" y="190" width="574" height="430" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="650" y="190" width="4" height="430" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="680" y="230" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0">❌ while True + interrupt</text><rect x="690" y="275" width="494" height="76" rx="8" fill="rgba(38,18,30,0.85)" stroke="rgba(255,107,138,0.45)"/><text x="706" y="305" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">第 1 次恢复：重放 1 轮提问</text><text x="706" y="329" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">1 次</text><rect x="690" y="371" width="494" height="76" rx="8" fill="rgba(38,18,30,0.85)" stroke="rgba(255,107,138,0.45)"/><text x="706" y="401" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">第 2 次恢复：重放 2 轮提问</text><text x="706" y="425" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">2 次（前一轮又来一遍）</text><rect x="690" y="467" width="494" height="76" rx="8" fill="rgba(38,18,30,0.85)" stroke="rgba(255,107,138,0.45)"/><text x="706" y="497" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">第 3 次恢复：重放 3 轮提问</text><text x="706" y="521" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">3 次，越用越慢</text><text x="690" y="580" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0">恢复按 interrupt 调用下标匹配：个数一变就串味</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">规则来源：官方 Interrupts · Rules of interrupts / Validating human input</text><text 