<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGGRAPH 1.x · 合并规则</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="116" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">同一 super-step 里两个节点写同一个 key：谁赢取决于 reducer</text><text x="56" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">并行分支的两次写入不会「一人一半」，没有 reducer 就是后写的盖掉先写的</text><text x="56" y="196" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0">没有 reducer：default = 右覆盖左</text><rect x="56" y="218" width="196" height="62" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="72" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">node_a</text><text x="72" y="264" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">{"notes": ["A"]}</text><rect x="56" y="288" width="196" height="62" rx="9" fill="rgba(18,30,54,0.95)" stroke="#b388ff" stroke-opacity="0.6" stroke-width="1.3"/><text x="72" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">node_b</text><text x="72" y="334" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0">{"notes": ["B"]}</text><path d="M252 249 L330 270 M252 319 L330 296" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none"/><rect x="334" y="236" width="240" height="100" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="454" y="291" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">notes channel</text><rect x="660" y="242" width="300" height="88" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ff6b8a" stroke-opacity="0.6" stroke-width="1.3"/><text x="810" y="291" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">["B"]</text><path d="M574 286 L652 286" stroke="#ff6b8a" stroke-width="2" fill="none"/><text x="980" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0">A 丢了</text><text x="980" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">并行写的典型事故</text><line x1="56" y1="382" x2="1216" y2="382" stroke="rgba(120,170,255,0.22)"/><text x="56" y="412" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">operator.add：左 + 右</text><rect x="56" y="434" width="196" height="62" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="72" y="458" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">node_a</text><text x="72" y="480" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">{"notes": ["A"]}</text><rect x="56" y="504" width="196" height="62" rx="9" fill="rgba(18,30,54,0.95)" stroke="#b388ff" stroke-opacity="0.6" stroke-width="1.3"/><text x="72" y="528" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">node_b</text><text x="72" y="550" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0">{"notes": ["B"]}</text><path d="M252 465 L330 486 M252 535 L330 512" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none"/><rect x="334" y="452" width="240" height="100" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="454" y="507" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">notes channel</text><rect x="660" y="458" width="300" height="88" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ee6a2" stroke-opacity="0.6" stroke-width="1.3"/><text x="810" y="507" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">["A", "B"]</text><path d="M574 502 L652 502" stroke="#3ee6a2" stroke-width="2" fill="none"/><text x="980" y="494" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">两条都在</text><text x="980" y="516" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">顺序按合入先后，不保证</text><rect x="56" y="600" width="1168" height="56" rx="9" fill="rgba(61,220,255,0.06)" stroke="#3ddcff" stroke-opacity="0.35"/><text x="80" y="634" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">提示：合并发生在 super-step 结束时，节点里读到的仍是本轮开始时的值——这就是并行分支彼此看不见的原因。</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据官方 Graph API · Reducers / 并行分支 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG02b · REDUCER MERGE</text></svg>