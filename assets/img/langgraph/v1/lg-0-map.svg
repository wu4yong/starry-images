ng SC','Microsoft YaHei',sans-serif" font-size="12.8" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">03 节点 · 边 · Command</text><circle cx="78" cy="387" r="3.5" fill="#3ddcff" fill-opacity="0.9"/><text x="92" y="392" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.8" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">04 编译与 super-step</text><line x1="76" y1="468" x2="258" y2="468" stroke="rgba(120,170,255,0.22)"/><text x="76" y="494" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">产出：一张能跑的图</text><rect x="291" y="176" width="220" height="336" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="291" y="176" width="4" height="336" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="311" y="218" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0">M2</text><text x="347" y="218" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">持久化与人机</text><text x="493" y="218" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">4 讲</text><line x1="311" y1="238" x2="493" y2="238" stroke="rgba(120,170,255,0.22)"/><circle cx="313" cy="267" r="3.5" fill="#4a9dff" fill-opacity="0.9"/><text x="327" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.8" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">05 checkpointer 与线程</text><circle cx="313" cy="307" r="3.5" fill="#4a9dff" fill-opacity="0.9"/><text x="327" y="312" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.8" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">06 interrupt 人工介入</text><circle cx="313" cy="347" r="3.5" fill="#4a9dff" fill-opacity="0.9"/><text x="327" y="352" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.8" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">07 时间旅行与分叉</text><circle cx="313" cy="387" r="3.5" fill="#4a9dff" fill-opacity="0.9"/><text x="327" y="392" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.8" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">08 Store 长期记忆</text><line x1="311" y1="468" x2="493" y2="468" stroke="rgba(120,170,255,0.22)"/><text x="311" y="494" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0">产出：可暂停可恢复</text><rect x="526" y="176" width="220" height="336" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="526" y="176" width="4" height="336" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="546" y="218" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">M3</text><text x="582" y="218" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">运行时能力</text><text x="728" y="218" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">3 讲</text><line x1="546" y1="238" x2="728" y2="238" stroke="rgba(120,170,255,0.22)"/><circle cx="548" cy="267" r="3.5" fill="#3ee6a2" fill-opacity="0.9"/><text x="562" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.8" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">09 五种流式模式</text><circle cx="548" cy="307" r="3.5" fill="#3ee6a2" fil