t-size="12.8" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">13 图内工具循环</text><circle cx="783" cy="347" r="3.5" fill="#b388ff" fill-opacity="0.9"/><text x="797" y="352" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.8" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">14 测试与评测</text><circle cx="783" cy="387" r="3.5" fill="#b388ff" fill-opacity="0.9"/><text x="797" y="392" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.8" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">15 部署清单</text><circle cx="783" cy="427" r="3.5" fill="#b388ff" fill-opacity="0.9"/><text x="797" y="432" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.8" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">16 综合实战</text><line x1="781" y1="468" x2="963" y2="468" stroke="rgba(120,170,255,0.22)"/><text x="781" y="494" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0">产出：可上线的最小链路</text><rect x="56" y="556" width="1168" height="82" rx="10" fill="rgba(255,200,97,0.07)" stroke="#ffc861" stroke-opacity="0.45"/><rect x="72" y="570" width="48.480000000000004" height="26" rx="13" fill="#ffc861" fill-opacity="0.13" stroke="#ffc861" stroke-opacity="0.45"/><text x="84" y="585" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0">读法</text><text x="150" y="584" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">先按 M1 手搭一张图跑通，再依次加持久化、人工介入与流式；每讲代码都能 uv run 单独跑。</text><rect x="72" y="606" width="48.480000000000004" height="26" rx="13" fill="#ffc861" fill-opacity="0.13" stroke="#ffc861" stroke-opacity="0.45"/><text x="84" 