<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGGRAPH 1.x · 执行模型</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="116" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">一轮 super-step：并行分支同一轮里互相看不见对方的写入</text><text x="56" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">recursion_limit 数的是轮次，不是节点调用次数；一轮里两个节点同时跑只算一轮</text><line x1="300" y1="190" x2="300" y2="560" stroke="rgba(120,170,255,0.22)" stroke-width="2"/><text x="238" y="186" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">时间</text><circle cx="300" cy="228" r="7" fill="#4a9dff"/><text x="56" y="225" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0">super-step 1</text><text x="56" y="245" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">一次「执行 + 合并」</text><rect x="380" y="200" width="160" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="460" y="233" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">load</text><text x="760" y="232" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">state 快照</text><text x="760" y="254" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">{ "q": "订单 SO-1" }</text><circle cx="300" cy="328" r="7" fill="#4a9dff"/><text x="56" y="325" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0">super-step 2</text><text x="56" y="345" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">一次「执行 + 合并」</text><rect x="380" y="300" width="160" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ee6a2" stroke-opacity="0.6" stroke-width="1.3"/><text x="460" y="333" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">faq_lookup</text><rect x="560" y="300" width="160" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="640" y="333" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">llm_answer</text><text x="760" y="332" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">state 快照</text><text x="760" y="354" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">{ "q", "faq", "answer" }</text><circle cx="300" cy="428" r="7" fill="#4a9dff"/><text x="56" y="425" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0">super-step 3</text><text x="56" y="445" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">一次「执行 + 合并」</text><rect x="380" y="400" width="160" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ffc861" stroke-opacity="0.6" stroke-width="1.3"/><text x="460" y="433" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">merge</text><text x="760" y="432" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">state 快照</text><text x="760" y="454" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">{ ..., "merged": true }</text><path d="M300 228 L370 228" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none"/><path d="M300 328 L370 328" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none"/><path d="M300 428 L370 428" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none"/><path d="M300 300 L330 300 L330 328 L370 328 M330 328 L330 356 L370 356" stroke="#b388ff" stroke-opacity="0.6" stroke-width="2" fill="none"/><text x="340" y="288" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0">同一轮并行</text><rect x="940" y="196" width="276" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="940" y="196" width="4" height="300" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="960" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0">三个常见误判</text><text x="960" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.2" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">• 节点按添加顺序串行</text><text x="960" y="290" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.2" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">• 并行写同 key 没 reducer</text><text x="960" y="318" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.2" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">• v1 / v2 返回结构混用</text><text x="960" y="356" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">recursion_limit 示例：</text><text x="960" y="380" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">config={"recursion_limit": 5}</text><text x="960" y="404" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">超过就报 GraphRecursionError</text><text x="960" y="440" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">默认 25；调大前先想清楚</text><text x="960" y="460" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">循环为什么停不下来。</text><text x="960" y="492" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">本系列统一传 version="v2"</text><rect x="56" y="590" width="1168" height="60" rx="9" fill="rgba(255,200,97,0.07)" stroke="#ffc861" stroke-opacity="0.4"/><text x="80" y="614" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.8" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">同一轮里 faq_lookup 读不到 llm_answer 写的 answer——合并发生在轮末，两个分支都只看得到上一轮的值。</text><text x="80" y="638" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.8" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">所以并行分支要么各写各的 key，要么给同一个 key 配好 reducer；指望「写进去立刻能读」一定出错。</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据官方 Graph API · 执行模型 / 运行配置 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG04 · SUPER-STEP</text></svg>