<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGGRAPH 1.x · 图是什么</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="116" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">一张图的最小构成：状态、节点、边，编译之后才能跑</text><text x="56" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">StateGraph 只是图纸；compile() 才是把图纸变成可执行对象的那一步</text><rect x="56" y="176" width="500" height="420" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="176" width="4" height="420" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="210" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">图纸上的三件套</text><rect x="80" y="242" width="452" height="58" rx="9" fill="rgba(61,220,255,0.06)" stroke="#3ddcff" stroke-opacity="0.22"/><text x="98" y="266" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">State · 状态</text><text x="98" y="288" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">一张共享快照。用 TypedDict 声明 key，每个 key 就是一个 channel。</text><rect x="80" y="312" width="452" height="58" rx="9" fill="rgba(61,220,255,0.06)" stroke="#3ddcff" stroke-opacity="0.22"/><text x="98" y="336" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">Node · 节点</text><text x="98" y="358" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">普通函数：读 state → 做事 → 返回「部分更新」，不是整份 state。</text><rect x="80" y="382" width="452" height="58" rx="9" fill="rgba(61,220,255,0.06)" stroke="#3ddcff" stroke-opacity="0.22"/><text x="98" y="406" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">Edge · 边</text><text x="98" y="428" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">决定下一步。START / END 是虚拟节点，不是真函数。</text><rect x="96" y="470" width="104" height="44" rx="9" fill="rgba(18,30,54,0.95)" stroke="#8ba3c7" stroke-opacity="0.6" stroke-width="1.3"/><text x="148" y="497" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">START</text><path d="M204 492 L248 492 M242 487 L248 492 L242 497" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none" /><rect x="252" y="470" width="142" height="44" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="323" y="497" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">answer</text><path d="M398 492 L442 492 M436 487 L442 492 L436 497" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none" /><rect x="446" y="470" width="84" height="44" rx="9" fill="rgba(18,30,54,0.95)" stroke="#8ba3c7" stroke-opacity="0.6" stroke-width="1.3"/><text x="488" y="497" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">END</text><text x="96" y="542" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">一张只有单节点的图，也是这三样东西。</text><rect x="592" y="176" width="632" height="62" rx="9" fill="rgba(18,30,54,0.94)" stroke="#4a9dff" stroke-opacity="0.5"/><text x="612" y="202" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">StateGraph(State)</text><text x="612" y="224" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">把 schema 交给图，声明有哪些 channel</text><line x1="908" y1="238" x2="908" y2="248" stroke="#4a9dff" stroke-opacity="0.55" stroke-width="2"/><rect x="592" y="248" width="632" height="62" rx="9" fill="rgba(18,30,54,0.94)" stroke="#4a9dff" stroke-opacity="0.5"/><text x="612" y="274" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">add_node("answer", fn)</text><text x="612" y="296" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">注册节点；省略名字就用函数名</text><line x1="908" y1="310" x2="908" y2="320" stroke="#4a9dff" stroke-opacity="0.55" stroke-width="2"/><rect x="592" y="320" width="632" height="62" rx="9" fill="rgba(18,30,54,0.94)" stroke="#4a9dff" stroke-opacity="0.5"/><text x="612" y="346" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">add_edge(START, "answer")</text><text x="612" y="368" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">从虚拟起点接进来，再接到 END</text><line x1="908" y1="382" x2="908" y2="392" stroke="#4a9dff" stroke-opacity="0.55" stroke-width="2"/><rect x="592" y="392" width="632" height="62" rx="9" fill="rgba(18,30,54,0.94)" stroke="#4a9dff" stroke-opacity="0.5"/><text x="612" y="418" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">compile()</text><text x="612" y="440" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">校验结构，挂上 checkpointer 等运行时选项</text><line x1="908" y1="454" x2="908" y2="464" stroke="#4a9dff" stroke-opacity="0.55" stroke-width="2"/><rect x="592" y="464" width="632" height="62" rx="9" fill="rgba(18,30,54,0.94)" stroke="#4a9dff" stroke-opacity="0.5"/><text x="612" y="490" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">invoke({...}, version="v2")</text><text x="612" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">传输入 dict，拿回 GraphOutput（.value / .interrupts）</text><rect x="592" y="546" width="632" height="66" rx="9" fill="rgba(255,107,138,0.07)" stroke="#ff6b8a" stroke-opacity="0.45"/><rect x="606" y="558" width="85.2" height="26" rx="13" fill="#ff6b8a" fill-opacity="0.13" stroke="#ff6b8a" stroke-opacity="0.45"/><text x="618" y="573" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0">只能这么用</text><text x="730" y="572" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">没 compile 就 invoke：报"Graph must be compiled"；节点返回整份 state 会覆盖别人的写入。</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据官方 Graph API overview / Quickstart 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG01 · MINIMAL GRAPH</text></svg>