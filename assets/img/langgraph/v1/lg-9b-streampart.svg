<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGGRAPH 1.x · STREAMPART</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="120" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">一块 StreamPart 长什么样</text><text x="56" y="152" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">传了 version="v2"：不管几种模式、有没有子图，形状只有这一种</text><rect x="56" y="195" width="620" height="400" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="195" width="4" height="400" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="86" y="236" font-family="Consolas,'Courier New',monospace" font-size="30" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">{</text><text x="116" y="270" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">"type"</text><text x="116" y="298" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">"updates" | "values" | …</text><text x="116" y="322" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">可辨识联合，先用它分流</text><text x="116" y="366" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">"ns"</text><text x="116" y="394" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">() 或 ("node:task_id",)</text><text x="116" y="418" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">子图坐标，嵌套继续往后拼</text><text x="116" y="462" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">"data"</text><text x="116" y="490" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">各模式自己的负载</text><text x="116" y="514" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">updates 里还带节点名</text><text x="86" y="570" font-family="Consolas,'Courier New',monospace" font-size="30" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">}</text><rect x="706" y="195" width="518" height="400" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="706" y="195" width="4" height="400" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="736" y="236" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">不传 v2 的四种形状</text><text x="736" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">单模式</text><text x="960" y="272" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">data</text><text x="736" y="346" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">多模式</text><text x="960" y="346" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">(mode, data)</text><text x="736" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">带子图</text><text x="960" y="420" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">(ns, data)</text><text x="736" y="494" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">多模式 + 子图</text><text x="960" y="494" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0">(ns, mode, data)</text><text x="736" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">这就是必须显式传 v2 的理由：判断逻辑收敛成一条</text><rect x="56" y="610" width="1168" height="56" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="610" width="4" height="56" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="84" y="646" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">invoke(input, stream_mode="updates", version="v2") 会返回 list[StreamPart]，不再是 GraphOutput</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">官方 Streaming · Stream output format (v2)</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG · 09b</text></svg>