<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="118" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="29" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">三种多 Agent 拓扑，选一个就够用</text><text x="56" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">差别只在「谁决定下一步」：主管、交接人、还是任意互转</text><rect x="56" y="186" width="376" height="400" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="186" width="4" height="400" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="84" y="224" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">Supervisor 主管</text><text x="84" y="250" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">主管选人，专家干完回主管</text><rect x="452" y="186" width="376" height="400" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="452" y="186" width="4" height="400" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="480" y="224" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">Handoff 交接</text><text x="480" y="250" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">专家把会话交给下一个专家</text><rect x="848" y="186" width="376" height="400" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="848" y="186" width="4" height="400" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="876" y="224" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0">Network 自由转</text><text x="876" y="250" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">任意 Agent 之间都能互转</text><rect x="96" y="300" width="150" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="171" y="333" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">supervisor</text><rect x="96" y="400" width="150" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="171" y="433" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">专家 A</text><rect x="96" y="470" width="150" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="171" y="503" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">专家 B</text><path d="M171 356 L171 400 M171 456 L171 470" stroke="#3ddcff" stroke-width="1.6" fill="none"/><text x="276" y="330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">主管决定去哪个专家</text><text x="276" y="430" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">干完回主管</text><text x="276" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">再决定下一步</text><text x="96" y="560" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">实现：subagents-as-tools / 子图节点</text><rect x="492" y="300" width="140" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ffc861" stroke-opacity="0.6" stroke-width="1.3"/><text x="562" y="333" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">triage</text><rect x="672" y="300" width="140" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="742" y="333" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">sales</text><rect x="672" y="420" width="140" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="742" y="453" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">billing</text><path d="M634 328 L666 328 M660 323 L666 328 L660 333" stroke="#ffc861" stroke-width="2" fill="none" /><path d="M742 358 L742 420" stroke="#ffc861" stroke-width="1.6" fill="none" stroke-dasharray="6 5"/><text x="492" y="380" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">工具返回 Command(goto=...)</text><text x="492" y="404" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">父图节点之间直接跳</text><text x="492" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0">要点：交接时显式挑消息</text><text x="492" y="560" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">Command.PARENT / active_agent</text><path d="M1000 331 L1009 346 L991 346 Z" fill="#b388ff" fill-opacity="0.85"/><text x="1000" y="372" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">Agent 1</text><path d="M1136 331 L1145 346 L1127 346 Z" fill="#b388ff" fill-opacity="0.85"/><text x="1136" y="372" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">Agent 2</text><path d="M1068 461 L1077 476 L1059 476 Z" fill="#b388ff" fill-opacity="0.85"/><text x="1068" y="502" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0">Agent 3</text><path d="M1012 332 L1120 332 M1004 350 L1058 454 M1132 350 L1078 454" stroke="#b388ff" stroke-opacity="0.6" stroke-width="1.4" fill="none"/><text x="888" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">任意两个都能互转，最灵活也最难控</text><text x="888" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0">需要 active_agent 字段 + 递归上限</text><rect x="56" y="604" width="1168" height="62" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="604" width="4" height="62" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="84" y="632" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">官方已停止维护 langgraph-supervisor 包：主管模式改用「subagents 当工具」或子图节点自己接</text><text x="84" y="654" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">不管哪种拓扑：上下文别整份往下传，超出预算就摘要（LG16 会用到）</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">官方 Multi-agent · Subagents / Handoffs / migrate-from-langgraph-supervisor</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG · 12 / 16</text></svg>