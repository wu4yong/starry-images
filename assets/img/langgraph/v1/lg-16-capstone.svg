goe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">messages 追加；steps 计数；risk 覆盖</text><rect x="452" y="360" width="376" height="100" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="452" y="360" width="4" height="100" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="476" y="390" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0">② 工具循环</text><text x="476" y="422" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">ToolNode + 条件边，最多 3 轮</text><rect x="848" y="360" width="376" height="100" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="848" y="360" width="4" height="100" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="872" y="390" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">③ interrupt</text><text x="872" y="422" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">approve 一节点一次，resume 带审批人</text><rect x="56" y="478" width="376" height="100" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="478" width="4" height="100" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="80" y="508" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0">④ 持久化</text><text x="80" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">PostgresSaver + Store 记住客户偏好</text><rect x="452" y="478" width="376" height="100" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="452" y="478" width="4" height="100" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="476" y="508" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0">⑤ 流式</text><text x="476" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">updates 给前端进度，custom 给百分比</text><rect x="848" y="478" width="376" height="100" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="848" y="478" width="4" height="100" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="872" y="508" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0">⑥ 可靠性</text><text x="872" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">RetryPolicy + error_handler 补偿工单</text><rect x="56" y="610" width="1168" height="56" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="610" width="4" height="56" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="84" y="642" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">交付物：一张图 + 一份测试（节点/局部/整图）+ 一份部署清单 + 一段 SOP（谁能批、批完怎么撤回）</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">把 01–15 讲的零件装成一台能交付的机器</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG · 16 / 16</text></svg>