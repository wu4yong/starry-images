<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="118" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="29" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">综合实战：工单审批 Agent 七件套</text><text x="56" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">把前 15 讲用到的能力拼进一张图：状态、工具、中断、记忆、流式、测试、部署</text><rect x="56" y="210" width="170" height="72" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="141" y="251" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">intake</text><path d="M232 246 L252 246 M246 241 L252 246 L246 251" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none" /><rect x="252" y="210" width="170" height="72" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="337" y="251" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">classify</text><path d="M428 246 L448 246 M442 241 L448 246 L442 251" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none" /><rect x="448" y="210" width="170" height="72" rx="9" fill="rgba(18,30,54,0.95)" stroke="#b388ff" stroke-opacity="0.6" stroke-width="1.3"/><text x="533" y="251" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">investigate</text><path d="M624 246 L644 246 M638 241 L644 246 L638 251" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none" /><rect x="644" y="210" width="170" height="72" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ffc861" stroke-opacity="0.6" stroke-width="1.3"/><t