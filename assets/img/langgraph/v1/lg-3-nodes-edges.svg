</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGGRAPH 1.x · 边的三种形态</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="116" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0">三种边：固定走向、条件分支、条件入口</text><text x="56" y="150" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">边只决定「下一步是谁」；要同时改状态，才轮得到 Command</text><rect x="56" y="176" width="1168" height="136" rx="10" fill="rgba(61,220,255,0.04)" stroke="rgba(120,170,255,0.22)"/><text x="56" y="206" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0">① 固定边</text><text x="56" y="230" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">add_edge("node_a", "node_b")</text><text x="56" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">A 做完必然去 B，没有选择</text><rect x="330" y="206" width="180" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="420" y="239" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">node_a</text><path d="M510 234 L600 234 M594 229 L600 234 L594 239" stroke="rgba(120,170,255,0.22)" stroke-width="2" fill="none" /><rect x="606" y="206" width="180" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="696" y="239" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">node_b</text><text x="820" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">同一个节点可以有多条出边</text><text x="820" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">→ 它们在下一轮并行跑</text><rect x="56" y="326" width="1168" height="150" rx="10" fill="rgba(255,200,97,0.04)" stroke="rgba(120,170,255,0.22)"/><text x="56" y="356" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0">② 条件边</text><text x="56" y="380" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">add_conditional_edges("node_a", routing_fn)</text><text x="56" y="402" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">路由函数读 state，返回下一个节点名</text><rect x="340" y="388" width="150" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ffc861" stroke-opacity="0.6" stroke-width="1.3"/><text x="415" y="421" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">router</text><path d="M490 416 L514 372 M490 416 L514 416 M490 416 L514 462" stroke="#ffc861" stroke-opacity="0.7" stroke-width="2" fill="none"/><rect x="518" y="344" width="150" height="52" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="593" y="375" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">node_b</text><rect x="518" y="394" width="150" height="52" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="593" y="425" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">node_c</text><rect x="518" y="444" width="150" height="52" rx="9" fill="rgba(18,30,54,0.95)" stroke="#8ba3c7" stroke-opacity="0.6" stroke-width="1.3"/><text x="593" y="475" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">END</text><text x="700" y="386" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">返回节点名 / END / 名称列表（扇出）</text><text x="700" y="414" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">也可以给「返回值 → 节点名」的映射字典</text><text x="700" y="442" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0">路由函数只读 state，不要在里面干活</text><rect x="56" y="490" width="1168" height="118" rx="10" fill="rgba(179,136,255,0.05)" stroke="rgba(120,170,255,0.22)"/><text x="56" y="520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0">③ 条件入口</text><text x="56" y="544" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0">add_conditional_edges(START, routing_fn)</text><text x="56" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">入口不固定：先判再决定第一个节点</text><rect x="360" y="514" width="130" height="52" rx="9" fill="rgba(18,30,54,0.95)" stroke="#b388ff" stroke-opacity="0.6" stroke-width="1.3"/><text x="425" y="545" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">START</text><path d="M490 540 L546 516 M490 540 L546 564" stroke="#b388ff" stroke-opacity="0.7" stroke-width="2" fill="none"/><rect x="550" y="492" width="170" height="48" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="635" y="521" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">fast_path</text><rect x="550" y="548" width="170" height="48" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="635" y="577" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0">slow_path</text><text x="760" y="526" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">适合「有缓存就走缓存」这类前置判断</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0">依据官方 Graph API · Edges / Conditional edges 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0">LG03 · EDGES</text></svg>