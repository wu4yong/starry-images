<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">别名与 data stream：把「换索引」变成日常操作</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">别名是稳定名字；data stream 是自动滚动的写入入口</text><text x="56" y="146" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#5eead4" text-anchor="start" dominant-baseline="middle">别名：一个稳定名字，指向真实索引</text><rect x="56" y="210" width="216" height="96" rx="12" fill="rgba(94,234,212,0.09)" stroke="#5eead4" stroke-width="1.6"/><text x="164" y="246" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="19" font-weight="600" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">goods</text><text x="164" y="273" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">alias（应用只认它）</text><line x1="272" y1="234" x2="356" y2="200" stroke="#5eead4" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><line x1="272" y1="272" x2="356" y2="316" stroke="#5eead4" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="356" y="156" width="300" height="88" rx="12" fill="rgba(148,163,184,0.07)" stroke="rgba(148,163,184,0.5)" stroke-width="1.6"/><text x="506" y="188" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">goods_v1</text><text x="506" y="215" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">只读（历史数据）</text><rect x="356" y="274" width="300" height="96" rx="12" fill="rgba(94,234,212,0.07)" stroke="#5eead4" stroke-width="1.6"/><text x="506" y="310" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">goods_v2</text><text x="506" y="337" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">is_write_index: true</text><text x="356" y="392" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写入落到 v2，读取同时覆盖 v1 + v2</text><line x1="700" y1="146" x2="700" y2="600" stroke="rgba(148,163,184,0.3)" stroke-width="1" stroke-dasharray="10 8"/><text x="736" y="146" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">data stream：写入即追加，自动滚动</text><rect x="736" y="178" width="240" height="82" rx="12" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="1.6"/><text x="856" y="207" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="18" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">logs</text><text x="856" y="234" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">data stream（写入入口）</text><line x1="856" y1="260" x2="856" y2="292" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="736" y="296" width="400" height="54" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(148,163,184,0.45)" stroke-width="1.6"/><text x="936" y="323" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">.ds-logs-2023.10.30-000001</text><line x1="1136" y1="350" x2="1136" y2="362" stroke="#9fb3d1" stroke-width="1.5" opacity="0.95" marker-end="url(#arrow)"/><rect x="736" y="362" width="400" height="54" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(148,163,184,0.45)" stroke-width="1.6"/><text x="936" y="389" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">.ds-logs-2023.10.30-000002</text><line x1="1136" y1="416" x2="1136" y2="428" stroke="#9fb3d1" stroke-width="1.5" opacity="0.95" marker-end="url(#arrow)"/><rect x="736" y="428" width="400" height="54" rx="12" fill="rgba(94,234,212,0.08)" stroke="#5eead4" stroke-width="1.6"/><text x="936" y="443" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">.ds-logs-2023.10.30-000003</text><text x="936" y="470" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">正在写入</text><text x="736" y="526" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">写满 max_age / max_docs / max_primary_shard_size 后自动 rollover</text><text x="56" y="470" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">别名做「读扩散 + 写单点」，切换零停机；data stream 在别名之上再加一层</text><text x="56" y="496" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">自动滚动 + ILM，后备索引不暴露给应用。</text><rect x="56" y="540" width="1168" height="62" rx="10" fill="rgba(56,189,248,0.06)" stroke="rgba(56,189,248,0.35)"/><text x="76" y="578" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">共同点：应用只认一个名字，物理索引在后头随便换。改 mapping、换分片数，都不用动代码。</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Elasticsearch Guide 8.17 · Aliases · Data streams · Rollover</text></svg>