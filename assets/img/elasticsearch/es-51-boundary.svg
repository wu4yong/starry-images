<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">与业务侧的边界：ES 不做主库</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">唯一真相源在主库，ES 只是可重建的副本</text><rect x="56" y="176" width="220" height="330" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.6"/><text x="166" y="210" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">主库</text><text x="166" y="238" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">PostgreSQL / MySQL</text><rect x="76" y="262" width="180" height="36" rx="12" fill="rgba(56,189,248,0.06)" stroke="rgba(56,189,248,0.45)" stroke-width="1.6"/><text x="166" y="280" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">orders 表</text><rect x="76" y="308" width="180" height="36" rx="12" fill="rgba(56,189,248,0.06)" stroke="rgba(56,189,248,0.45)" stroke-width="1.6"/><text x="166" y="326" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">users 表</text><rect x="76" y="354" width="180" height="36" rx="12" fill="rgba(56,189,248,0.06)" stroke="rgba(56,189,248,0.45)" stroke-width="1.6"/><text x="166" y="372" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">inventory 表</text><text x="76" y="410" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">行级事务、外键约束</text><text x="76" y="434" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">UPDATE 与 INSERT 的唯一入口</text><text x="76" y="470" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">唯一真相源</text><text x="76" y="494" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">事务、约束、强一致</text><rect x="996" y="176" width="220" height="330" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="1106" y="210" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">检索引擎</text><text x="1106" y="238" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">Elasticsearch</text><rect x="1016" y="262" width="180" height="36" rx="12" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.45)" stroke-width="1.6"/><text x="1106" y="280" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">orders-search</text><rect x="1016" y="308" width="180" height="36" rx="12" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.45)" stroke-width="1.6"/><text x="1106" y="326" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">users-search</text><rect x="1016" y="354" width="180" height="36" rx="12" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.45)" stroke-width="1.6"/><text x="1106" y="372" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">商品检索索引</text><text x="1016" y="410" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">近实时、可分片、可重建</text><text x="1016" y="434" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">不做唯一写入来源</text><text x="1016" y="470" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">数据可从主库重建</text><text x="1016" y="494" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">随时可删、可全量重灌</text><rect x="310" y="186" width="656" height="104" rx="12" fill="rgba(10,16,32,0.55)" stroke="#f87171" stroke-width="1.6"/><text x="330" y="214" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">双写</text><text x="330" y="242" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">应用在一次事务里写两处</text><text x="330" y="266" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">任一侧失败就出现长期不一致</text><line x1="276" y1="238" x2="306" y2="238" stroke="#f87171" stroke-width="1.3" opacity="0.95" marker-end="url(#arrow)"/><line x1="970" y1="238" x2="992" y2="238" stroke="#f87171" stroke-width="1.3" opacity="0.95" marker-end="url(#arrowRed)"/><rect x="310" y="312" width="656" height="104" rx="12" fill="rgba(10,16,32,0.55)" stroke="#5eead4" stroke-width="1.6"/><text x="330" y="340" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">发件箱 / CDC</text><text x="330" y="368" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">outbox 表或抓 binlog 变更</text><text x="330" y="392" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">有序、可重放、可补历史</text><line x1="276" y1="364" x2="306" y2="364" stroke="#5eead4" stroke-width="1.3" opacity="0.95" marker-end="url(#arrow)"/><line x1="970" y1="364" x2="992" y2="364" stroke="#5eead4" stroke-width="1.3" opacity="0.95" marker-end="url(#arrow)"/><rect x="310" y="438" width="656" height="104" rx="12" fill="rgba(10,16,32,0.55)" stroke="#a78bfa" stroke-width="1.6"/><text x="330" y="466" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">异步补偿 + 对账</text><text x="330" y="494" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">定时比对差异并回灌</text><text x="330" y="518" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">兜底手段，不是主方案</text><line x1="276" y1="490" x2="306" y2="490" stroke="#a78bfa" stroke-width="1.3" opacity="0.95" marker-end="url(#arrow)"/><line x1="970" y1="490" x2="992" y2="490" stroke="#a78bfa" stroke-width="1.3" opacity="0.95" marker-end="url(#arrow)"/><text x="56" y="570" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">判断标准：如果 ES 全丢了，能否从主库把索引重建出来？不能，就说明边界画错了。</text><text x="56" y="596" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">ES 能做的是「查得快」，不是「存得准」；把强一致需求压在它身上，迟早要还。</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Elasticsearch Guide 8.17 · Near real-time · Indexing · Best practices</text></svg>