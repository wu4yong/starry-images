6" y1="518" x2="396" y2="470" stroke="#9fb3d1" stroke-width="1.5" opacity="0.95" marker-end="url(#arrow)"/><rect x="516" y="336" width="200" height="132" rx="12" fill="rgba(94,234,212,0.06)" stroke="#a78bfa" stroke-width="1.6"/><text x="616" y="366" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">brand = LiNing</text><text x="616" y="388" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">bucket：按 brand 分组</text><line x1="616" y1="518" x2="616" y2="470" stroke="#9fb3d1" stroke-width="1.5" opacity="0.95" marker-end="url(#arrow)"/><rect x="796" y="336" width="420" height="132" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="1006" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">metric：在每个桶内算数值</text><rect x="812" y="396" width="124" height="46" rx="8" fill="rgba(94,234,212,0.09)" stroke="rgba(251,191,36,0.5)" stroke-width="1.3"/><text x="874" y="419" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">avg(price)</text><rect x="946" y="396" width="124" height="46" rx="8" fill="rgba(94,234,212,0.09)" stroke="rgba(251,191,36,0.5)" stroke-width="1.3"/><text x="1008" y="419" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">sum(sales)</text><rect x="1080" y="396" width="124" height="46" rx="8" fill="rgba(94,234,212,0.09)" stroke="rgba(251,191,36,0.5)" stroke-width="1.3"/><text x="1142" y="419" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">cardinality(user)</text><line x1="716" y1="402" x2="792" y2="402" stroke="#fbbf24" stroke-width="2" opacity="0.95" marker-end="url(#arrowAmber)"/><rect x="300" y="152" width="340" height="92" rx="12" fill="rgba(167,139,250,0.07)" stroke="#a78bfa" stroke-width="1.6"/><text x="470" y="182" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">bucket_script</text><text x="470" y="204" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">拿桶的产出做四则运算</text><rect x="672" y="152" width="380" height="92" rx="12" fill="rgba(167,139,250,0.07)" stroke="#a78bfa" stroke-width="1.6"/><text x="862" y="182" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">bucket_sort / bucket_selector</text><text x="862" y="204" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">排序截断、过滤掉小桶</text><line x1="400" y1="330" x2="400" y2="248" stroke="#a78bfa" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><line x1="860" y1="330" x2="860" y2="248" stroke="#a78bfa" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><text x="672" y="282" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">父级必须是 multi-bucket 聚合</text><text x="56" y="286" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">pipeline 引用路径：by_brand&gt;avg_price</text><text x="56" y="312" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">不能直接引用原始文档字段</text><text x="56" y="610" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">自下而上：文档 → 分桶 → 桶内指标 → 桶间运算。写错层级是聚合报错的第一大原因。</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Elasticsearch Guide 8.17 · Aggregations · Pipeline aggregations</text></svg>