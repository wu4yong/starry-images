<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">检索侧性能开关：从 _source 裁剪到 profile</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">先量再砍，砍的是传输与解析，不是算法</text><rect x="56" y="150" width="1168" height="176" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(148,163,184,0.4)" stroke-width="1.6"/><text x="76" y="182" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">一次查询请求的四块开销</text><rect x="76" y="200" width="200" height="46" rx="8" fill="rgba(94,234,212,0.09)" stroke="rgba(56,189,248,0.5)" stroke-width="1.3"/><text x="176" y="223" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">query 匹配</text><rect x="76" y="262" width="176" height="16" rx="8" fill="rgba(251,191,36,0.55)"/><text x="76" y="302" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">相对耗时 ≈ 55%</text><rect x="364" y="200" width="200" height="46" rx="8" fill="rgba(94,234,212,0.09)" stroke="rgba(56,189,248,0.5)" stroke-width="1.3"/><text x="464" y="223" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">sort 排序</text><rect x="364" y="262" width="64" height="16" rx="8" fill="rgba(251,191,36,0.55)"/><text x="364" y="302" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">相对耗时 ≈ 20%</text><rect x="652" y="200" width="200" height="46" rx="8" fill="rgba(94,234,212,0.09)" stroke="rgba(56,189,248,0.5)" stroke-width="1.3"/><text x="752" y="223" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">_source 返回</text><rect x="652" y="262" width="128" height="16" rx="8" fill="rgba(251,191,36,0.55)"/><text x="652" y="302" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">相对耗时 ≈ 40%</text><rect x="940" y="200" width="200" height="46" rx="8" fill="rgba(94,234,212,0.09)" stroke="rgba(56,189,248,0.5)" stroke-width="1.3"/><text x="1040" y="223" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">highlight 高亮</text><rect x="940" y="262" width="96" height="16" rx="8" fill="rgba(251,191,36,0.55)"/><text x="940" y="302" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">相对耗时 ≈ 30%</text><text x="76" y="320" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">条形仅为量级示意，真实耗时用 profile 逐阶段看</text><rect x="56" y="348" width="276" height="110" rx="12" fill="rgba(56,189,248,0.04)" stroke="rgba(56,189,248,0.45)" stroke-width="1.6"/><text x="194" y="378" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">_source: false</text><text x="194" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">不返回原文，最省带宽，但拿不到字段值</text><rect x="352" y="348" width="276" height="110" rx="12" fill="rgba(56,189,248,0.04)" stroke="rgba(56,189,248,0.45)" stroke-width="1.6"/><text x="490" y="378" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">includes / excludes</text><text x="490" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">只取需要字段，比整条 _source 便宜</text><rect x="648" y="348" width="276" height="110" rx="12" fill="rgba(56,189,248,0.04)" stroke="rgba(56,189,248,0.45)" stroke-width="1.6"/><text x="786" y="378" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">fields / docvalue_fields</text><text x="786" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">从 doc_values 取值，免解析 _source</text><rect x="944" y="348" width="276" height="110" rx="12" fill="rgba(56,189,248,0.04)" stroke="rgba(56,189,248,0.45)" stroke-width="1.6"/><text x="1082" y="378" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">track_total_hits</text><text x="1082" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">默认 10000 封顶，精确计数代价高</text><rect x="56" y="474" width="276" height="110" rx="12" fill="rgba(56,189,248,0.04)" stroke="rgba(56,189,248,0.45)" stroke-width="1.6"/><text x="194" y="504" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">request_cache</text><text x="194" y="526" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">同请求可缓存，仅 size=0 时有效</text><rect x="352" y="474" width="276" height="110" rx="12" fill="rgba(56,189,248,0.04)" stroke="rgba(56,189,248,0.45)" stroke-width="1.6"/><text x="490" y="504" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">terminate_after</text><text x="490" y="526" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">够数就停，适合探路不适合统计</text><rect x="648" y="474" width="276" height="110" rx="12" fill="rgba(56,189,248,0.04)" stroke="rgba(56,189,248,0.45)" stroke-width="1.6"/><text x="786" y="504" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">profile</text><text x="786" y="526" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">逐阶段耗时，只在调优时开</text><rect x="944" y="474" width="276" height="110" rx="12" fill="rgba(56,189,248,0.04)" stroke="rgba(56,189,248,0.45)" stroke-width="1.6"/><text x="1082" y="504" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">search.max_buckets</text><text x="1082" y="526" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">聚合桶上限，超了直接失败</text><text x="56" y="616" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">顺序建议：先 profile 定位阶段，再动 _source / fields，最后才考虑改召回策略。</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Elasticsearch Guide 8.17 · Search API · Profile API · Request cache</text></svg>