<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">_bulk：请求是一个，结果是每行一个</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">顶层 200 且 errors:false，仍可能有个别文档失败</text><text x="56" y="146" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">NDJSON：一行动作 + 一行数据，成对出现</text><rect x="56" y="158" width="340" height="126" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(148,163,184,0.3)"/><rect x="72" y="170" width="308" height="40" rx="8" fill="rgba(94,234,212,0.09)" stroke="rgba(56,189,248,0.55)" stroke-width="1.3"/><text x="226" y="190" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">{"index":{"_id":"1"}}</text><rect x="72" y="216" width="308" height="40" rx="8" fill="rgba(94,234,212,0.09)" stroke="rgba(251,191,36,0.55)" stroke-width="1.3"/><text x="226" y="236" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">{"title":"跑鞋","price":299}</text><text x="72" y="276" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">动作行 + 数据行 → 一条文档</text><rect x="56" y="318" width="340" height="126" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(148,163,184,0.3)"/><rect x="72" y="330" width="308" height="40" rx="8" fill="rgba(94,234,212,0.09)" stroke="rgba(56,189,248,0.55)" stroke-width="1.3"/><text x="226" y="350" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">{"index":{"_id":"2"}}</text><rect x="72" y="376" width="308" height="40" rx="8" fill="rgba(94,234,212,0.09)" stroke="rgba(251,191,36,0.55)" stroke-width="1.3"/><text x="226" y="396" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">{"title":null,"price":"abc"}</text><text x="72" y="436" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">数据不合法 → 该条失败，其余照常</text><line x1="396" y1="330" x2="452" y2="320" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="452" y="240" width="240" height="180" rx="12" fill="rgba(167,139,250,0.09)" stroke="#a78bfa" stroke-width="1.6"/><text x="572" y="270" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="22" font-weight="600" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">_bulk</text><text x="572" y="292" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">逐条处理，互不影响</text><line x1="692" y1="300" x2="748" y2="240" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><line x1="692" y1="330" x2="748" y2="396" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="748" y="176" width="480" height="118" rx="12" fill="rgba(94,234,212,0.08)" stroke="#5eead4" stroke-width="1.6"/><text x="988" y="206" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">items: status 201</text><text x="988" y="228" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">这条成功，返回 _id 与 result: created</text><rect x="748" y="342" width="480" height="130" rx="12" fill="rgba(248,113,113,0.08)" stroke="#f87171" stroke-width="1.6"/><text x="988" y="372" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#f87171" text-anchor="middle" dominant-baseline="middle">items: status 400 + error</text><text x="988" y="394" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">这条失败：mapper_parsing_exception</text><rect x="56" y="470" width="1172" height="96" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="642" y="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">所以：判断成功不能只看 HTTP 状态码</text><text x="642" y="522" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">正确姿势是解析 items，用 filter_path=errors,items.*.error 只取失败项后重试</text><text x="56" y="602" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">另一条硬规则：单条超过 _bulk 的 size 上限会被拒；请求体建议 5–15MB，别把 MB 数当吞吐指标。</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Elasticsearch Guide 8.17 · Bulk API · NDJSON</text></svg>