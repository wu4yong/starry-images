ingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">交接给：值班</text><path d="M1148 342 L1148 356 L234 356 L234 368" stroke="#8ba3c7" stroke-width="2" fill="none"/><path d="M228 362 L234 368 L240 362" stroke="#8ba3c7" stroke-width="2" fill="none"/><rect x="56" y="520" width="620" height="106" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="520" width="4" height="106" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="80" y="554" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">门禁三件套</text><text x="80" y="584" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">退出码 1 / 退化清单 / 通知渠道</text><text x="80" y="610" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">少任何一个，门禁就退化成「看一眼分数」</text><rect x="700" y="520" width="524" height="106" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="700" y="520" width="4" height="106" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="724" y="554" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">上线顺序</text><text x="724" y="584" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">格式校验全量 → judge 采样 10% → 告警 → 月度复盘</text><text x="724" y="610" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">先题库稳定，再加高频 judge</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">闭环最易断在「做了但没留产物」：抽了单没进队列、修了没补 example</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">ls-16-closed-loop</text></svg>