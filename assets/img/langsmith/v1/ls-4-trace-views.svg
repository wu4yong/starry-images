<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="124" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">一条出错的 trace，三种读法</text><text x="56" y="158" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">Messages 看对话，Turns 看时序，Details 看单 run 的输入输出与报错</text><rect x="56" y="186" width="336" height="356" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="186" width="4" height="356" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="76" y="214" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">MESSAGES</text><rect x="76" y="244" width="296" height="52" rx="8" fill="rgba(46,90,150,0.16)" stroke="#4a9dff" stroke-opacity="0.25"/><text x="88" y="264" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">human</text><text x="88" y="284" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">订单 A1024 到哪了</text><rect x="76" y="316" width="296" height="52" rx="8" fill="rgba(46,90,150,0.16)" stroke="#3ee6a2" stroke-opacity="0.25"/><text x="88" y="336" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">ai</text><text x="88" y="356" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">query_order("A1024")</text><rect x="76" y="388" width="296" height="52" rx="8" fill="rgba(46,90,150,0.16)" stroke="#ff6b8a" stroke-opacity="0.25"/><text x="88" y="408" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">tool</text><text x="88" y="428" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">HTTP 502 · 超时</text><rect x="76" y="460" width="296" height="52" rx="8" fill="rgba(46,90,150,0.16)" stroke="#e8f1ff" stroke-opacity="0.25"/><text x="88" y="480" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">ai</text><text x="88" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">查不到，稍后再试</text><rect x="406" y="186" width="380" height="356" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="406" y="186" width="4" height="356" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="426" y="214" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">TURNS</text><text x="426" y="244" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">第 1 轮 · 2.30 s</text><text x="426" y="287" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">model</text><rect x="498" y="272" width="90" height="20" rx="4" fill="#3ee6a2" fill-opacity="0.30" stroke="#3ee6a2" stroke-opacity="0.55"/><text x="594" y="287" font-family="Consolas,'Courier New',monospace" font-size="10.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">0.90 s</text><text x="426" y="329" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">tool</text><rect x="588" y="314" width="50" height="20" rx="4" fill="#ff6b8a" fill-opacity="0.30" stroke="#ff6b8a" stroke-opacity="0.55"/><text x="644" y="329" font-family="Consolas,'Courier New',monospace" font-size="10.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">0.50 s</text><text x="426" y="371" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">retry</text><rect x="638" y="356" width="40" height="20" rx="4" fill="#ff6b8a" fill-opacity="0.30" stroke="#ff6b8a" stroke-opacity="0.55"/><text x="684" y="371" font-family="Consolas,'Courier New',monospace" font-size="10.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">0.40 s</text><text x="426" y="413" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">model</text><rect x="678" y="398" width="50" height="20" rx="4" fill="#3ee6a2" fill-opacity="0.30" stroke="#3ee6a2" stroke-opacity="0.55"/><text x="734" y="413" font-family="Consolas,'Courier New',monospace" font-size="10.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">0.50 s</text><line x1="498" y1="440" x2="748" y2="440" stroke="rgba(120,170,255,0.22)"/><text x="426" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">横向是时间轴：tool 失败后重试多花 0.4 s</text><text x="426" y="502" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">第 2 轮 · 0.7 s（重试成功）</text><rect x="806" y="186" width="418" height="356" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="806" y="186" width="4" height="356" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="826" y="214" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">DETAILS · run</text><text x="826" y="244" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">run_type</text><text x="946" y="244" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">tool</text><text x="826" y="274" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">name</text><text x="946" y="274" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">query_order</text><text x="826" y="304" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">trace_id</text><text x="946" y="304" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">8f2a1c</text><text x="826" y="334" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">latency</text><text x="946" y="334" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">890 ms</text><text x="826" y="364" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">status</text><text x="946" y="364" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">error</text><text x="826" y="394" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">error</text><text x="946" y="394" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">HTTP 502</text><text x="826" y="424" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">outputs</text><text x="946" y="424" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">(empty)</text><text x="826" y="468" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">错误栈就在这里，别在 Messages 里找</text><text x="826" y="496" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">点 run id 可跳到该 run 的完整输入输出</text><text x="56" y="588" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">顺序：Turns 找慢 → Details 找错 → Messages 看对话是否被错误带偏</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">export 导出的字段与 UI 展示不完全一致，比对前先看 schema</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">LS 04 / 15</text></svg>