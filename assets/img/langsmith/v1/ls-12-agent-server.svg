 UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">Enterprise</text><text x="80" y="502" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">控制面：客户 K8s</text><text x="80" y="528" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">数据面：客户</text><text x="80" y="564" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">全在内网；升级自己排期</text><rect x="654" y="424" width="570" height="190" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="654" y="424" width="4" height="190" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="678" y="464" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">Standalone</text><rect x="923.6" y="444" width="276.4" height="26" rx="13" fill="#b388ff" fill-opacity="0.13" stroke="#b388ff" stroke-opacity="0.45"/><text x="934.6" y="459" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">Enterprise + license</text><text x="678" y="502" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">控制面：客户自管</text><text x="678" y="528" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spaci