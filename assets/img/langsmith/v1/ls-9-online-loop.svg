<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGSMITH · M2 评测闭环</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="130" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">线上闭环：发现 → 定性 → 变成考题</text><text x="56" y="162" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">在线评测负责「发现」，标注队列负责「定性」，dataset 负责「不再犯」</text><rect x="56" y="240" width="176" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="240" width="4" height="132" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="74" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">生产 trace</text><text x="74" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">Production 环境</text><path d="M234 306 L250 306 M244 301 L250 306 L244 311" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="254" y="240" width="176" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="254" y="240" width="4" height="132" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="272" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#4a9dff" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">Rules + filter</text><text x="272" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">只看目标人群</text><path d="M432 306 L448 306 M442 301 L448 306 L442 311" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="452" y="240" width="176" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="452" y="240" width="4" height="132" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="470" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">采样 5%–10%</text><text x="470" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">控 judge 成本</text><path d="M630 306 L646 306 M640 301 L646 306 L640 311" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="650" y="240" width="176" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="650" y="240" width="4" height="132" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="668" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">在线评测</text><text x="668" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">格式 / 合规 / 无参考 judge</text><path d="M828 306 L844 306 M838 301 L844 306 L838 311" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="848" y="240" width="176" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="848" y="240" width="4" height="132" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="866" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">标注队列</text><text x="866" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">人审 + rubric</text><path d="M1026 306 L1042 306 M1036 301 L1042 306 L1036 311" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="1046" y="240" width="176" height="132" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="1046" y="240" width="4" height="132" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="1064" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ff6b8a" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">dataset example</text><text x="1064" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">参考输出人工补</text><rect x="56" y="430" width="380" height="120" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="430" width="4" height="120" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="78" y="466" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">离线验证</text><text x="78" y="498" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">同一批题跑实验：修好了吗？退步了吗？</text><path d="M444 490 L484 490 M478 485 L484 490 L478 495" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="492" y="430" width="340" height="120" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="492" y="430" width="4" height="120" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="514" y="466" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">上线 / 灰度</text><text x="514" y="498" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">同一 Rule 继续监控，水位不降</text><text x="56" y="600" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">闭环：线上偶发 → 永久考题 → 下次实验必跑</text><text x="1064" y="404" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">↓ 回流成题库</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">不把问题样本落成 example，前面所有分数都是消耗品</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">ls-9-online-loop</text></svg>