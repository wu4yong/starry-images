<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGSMITH · 02 CONCEPTS</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="124" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="29" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">同一份数据，四种粒度：run / trace / thread / trajectory</text><text x="56" y="158" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">调试看 trace，看多轮行为看 thread，看「说了什么」看 trajectory</text><rect x="56" y="186" width="300" height="330" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="186" width="4" height="330" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="76" y="216" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">THREAD</text><text x="76" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">一次多轮会话</text><rect x="258" y="212" width="80.3" height="25" rx="12.5" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="269" y="226" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">T-9d2</text><rect x="76" y="262" width="260" height="60" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="90" y="287" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">trace 1</text><text x="90" y="307" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">user: 退款怎么走</text><text x="322" y="287" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">3 runs</text><rect x="76" y="338" width="260" height="60" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="90" y="363" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">trace 2</text><text x="90" y="383" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">user: 那多久到账</text><text x="322" y="363" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">2 runs</text><rect x="76" y="414" width="260" height="60" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="90" y="439" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">trace 3</text><text x="90" y="459" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">user: 帮我催一下</text><text x="322" y="439" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">2 runs</text><text x="76" y="494" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">metadata.thread_id 把三条 trace 串起来</text><path d="M368 330 L392 330 M386 325 L392 330 L386 335" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="400" y="186" width="366" height="330" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="400" y="186" width="4" height="330" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="420" y="216" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">TRACE</text><text x="420" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">一次操作的 run 树（≤ 25,000 run）</text><rect x="540" y="262" width="120" height="40" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ee6a2" stroke-opacity="0.6" stroke-width="1.3"/><text x="600" y="287" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">agent</text><path d="M600 302 L600 322" stroke="rgba(120,170,255,0.22)" stroke-width="1.6"/><path d="M470 322 L730 322" stroke="rgba(120,170,255,0.22)" stroke-width="1.6"/><path d="M470 322 L470 346 M730 322 L730 346" stroke="rgba(120,170,255,0.22)" stroke-width="1.6"/><rect x="420" y="346" width="100" height="36" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="470" y="369" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">model</text><rect x="680" y="346" width="100" height="36" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ffc861" stroke-opacity="0.6" stroke-width="1.3"/><text x="730" y="369" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">tool</text><path d="M730 382 L730 404" stroke="rgba(120,170,255,0.22)" stroke-width="1.6"/><rect x="680" y="404" width="100" height="36" rx="9" fill="rgba(18,30,54,0.95)" stroke="#8ba3c7" stroke-opacity="0.6" stroke-width="1.3"/><text x="730" y="427" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">retrieve</text><text x="420" y="478" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">每个方块是一个 run，带 input / output / 耗时</text><path d="M778 330 L802 330 M796 325 L802 330 L796 335" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="812" y="186" width="412" height="330" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="812" y="186" width="4" height="330" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="832" y="216" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">TRAJECTORY</text><text x="832" y="242" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">thread 拍平成有序消息（去嵌套）</text><rect x="832" y="246" width="374" height="30" rx="6" fill="rgba(46,90,150,0.15)"/><text x="842" y="266" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">human</text><text x="892" y="266" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">退款怎么走</text><rect x="832" y="284" width="374" height="30" rx="6" fill="rgba(46,90,150,0.15)"/><text x="842" y="304" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">ai</text><text x="892" y="304" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">调用 query_order</text><rect x="832" y="322" width="374" height="30" rx="6" fill="rgba(46,90,150,0.15)"/><text x="842" y="342" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">tool</text><text x="892" y="342" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">{status: shipped}</text><rect x="832" y="360" width="374" height="30" rx="6" fill="rgba(46,90,150,0.15)"/><text x="842" y="380" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">ai</text><text x="892" y="380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">已发货，3 天到</text><rect x="832" y="398" width="374" height="30" rx="6" fill="rgba(46,90,150,0.15)"/><text x="842" y="418" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">human</text><text x="892" y="418" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">帮我催一下</text><rect x="832" y="436" width="374" height="30" rx="6" fill="rgba(46,90,150,0.15)"/><text x="842" y="456" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">ai</text><text x="892" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">已催办</text><text x="832" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">同一份数据，只是把嵌套去掉、按顺序摊开</text><text x="56" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">选哪一个</text><text x="56" y="584" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">trace：这一步为什么慢 / 为什么错　｜　thread：跨轮到底发生了什么　｜　trajectory：把会话当一段对话读</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">trajectory 只是投影，不替代 trace 的执行细节</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">LS 02 / 15</text></svg>