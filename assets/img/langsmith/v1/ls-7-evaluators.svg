<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGSMITH · M2 评测闭环</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="130" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">四类评测器：判据、成本、最怕什么</text><text x="56" y="162" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">不是「谁更好」，而是「谁适合判什么」——同一份题库常常四类一起上</text><rect x="56" y="208" width="540" height="158" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="208" width="4" height="158" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">code（heuristic）</text><rect x="442" y="222" width="98.32000000000001" height="26" rx="13" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="453" y="237" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">成本 ≈ 0</text><text x="80" y="284" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">精确匹配 / 正则 / JSON schema / 断言</text><text x="80" y="314" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">最怕：用「包含」代替结构比对</text><text x="80" y="342" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">必跑：硬门槛，零成本</text><rect x="684" y="208" width="540" height="158" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="684" y="208" width="4" height="158" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="708" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">LLM-as-judge</text><rect x="1070" y="222" width="149.2" height="26" rx="13" fill="#ffc861" fill-opacity="0.13" stroke="#ffc861" stroke-opacity="0.45"/><text x="1081" y="237" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">成本：按 token</text><text x="708" y="284" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">按 rubric 打分，判「意思对不对」</text><text x="708" y="314" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">最怕：抄参考答案、与线上模型同源</text><text x="708" y="342" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">用 0 / 0.5 / 1，别用 0–100</text><rect x="56" y="396" width="540" height="158" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="396" width="4" height="158" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="80" y="432" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">pairwise</text><rect x="442" y="410" width="123.76" height="26" rx="13" fill="#b388ff" fill-opacity="0.13" stroke="#b388ff" stroke-opacity="0.45"/><text x="453" y="425" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">成本：两次调用起</text><text x="80" y="472" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">同一题比两次输出，判「哪个更好」</text><text x="80" y="502" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">最怕：位置偏见，A 总赢</text><text x="80" y="530" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">记得换序，抵消位置偏见</text><rect x="684" y="396" width="540" height="158" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="684" y="396" width="4" height="158" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="708" y="432" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">human</text><rect x="1070" y="410" width="85.6" height="26" rx="13" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="1081" y="425" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">成本：最高</text><text x="708" y="472" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">人读人打分，标准随人漂移</text><text x="708" y="502" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">用法：抽检与校准，不是全量</text><text x="708" y="530" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">一致率做人判校准基准</text><text x="56" y="604" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">组合口诀：code 卡硬门槛 → judge 判语义 → human 做校准 → pairwise 只用来比版本</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">judge 必须与人判算一次一致率；低于 80% 先改 rubric，别急着信分数</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">ls-7-evaluators</text></svg>