xt><rect x="512" y="392" width="260" height="38" rx="8" fill="rgba(255,200,97,0.08)" stroke="#ffc861" stroke-opacity="0.3"/><text x="524" y="416" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">sample = 20%</text><text x="512" y="496" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">先筛再采样，避免全量拉取</text><path d="M800 330 L822 330 M816 325 L822 330 L816 335" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="828" y="186" width="396" height="336" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="828" y="186" width="4" height="336" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="848" y="214" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="1" xml:space="preserve">DATASET · refund-hard</text><rect x="848" y="240" width="356" height="32" rx="6" fill="rgba(62,230,162,0.08)" stroke="#3ee6a2" stroke-opacity="0.25"/><text x="860" y="261" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">ex-1</text><text x="920" y="261" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">tenant=A · score 0.4</text><rect x="848" y="280" width="356" height="32" rx="6" fill="rgba(62,230,162,0.08)" stroke="#3ee6a2" stroke-opacity="0.25"/><text x="860" y="301" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">ex-2</text><text x="920" y="301" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">tenant=A · score 0.2</text><rect x="848" y="320" width="356" height="32" rx="6" fill="rgba(62,230,162,0.08)" stroke="#3ee6a2" stroke-opacity="0.25"/><text x="860" y="341" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">ex-3</text><text x="920" y="341" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">tenant=A · score 0.3</text><text x="848" y="396" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">每个 example 带 inputs + reference_outputs</text><text x="848" y="432" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">split:</text><rect x="896" y="414" width="85.6" height="26" rx="13" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="907" y="429" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">smoke</text><rect x="1000" y="414" width="149.2" height="26" rx="13" fill="#b388ff" fill-opacity="0.13" stroke="#b388ff" stroke-opacity="0.45"/><text x="1011" y="429" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">regression</text><text x="848" y="476" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">create_example(..., split="regression")</text><text x="56" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">注意：reference_outputs 别直接抄当时的生产输出——它可能正是错的那一次</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">筛完就落 dataset，别下次再重筛一遍</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">LS 05 / 15</text></svg>