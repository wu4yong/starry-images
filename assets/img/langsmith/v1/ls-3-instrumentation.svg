<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGSMITH · 03 INSTRUMENT</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="124" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">埋点四种方式：自动一份，手动三档</text><text x="56" y="158" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">覆盖范围越大越省事，越小越可控；同一应用可以混用</text><rect x="56" y="186" width="400" height="360" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="186" width="4" height="360" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="76" y="216" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="1" xml:space="preserve">AUTO · integrations</text><text x="76" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">自动埋点：零改代码</text><rect x="76" y="266" width="360" height="196" rx="10" fill="rgba(62,230,162,0.06)" stroke="#3ee6a2" stroke-opacity="0.35" stroke-dasharray="6 6"/><text x="92" y="292" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">你的应用</text><rect x="96" y="306" width="140" height="36" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="166" y="329" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">LangGraph</text><rect x="96" y="356" width="140" height="36" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="166" y="379" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">OpenAI SDK</text><rect x="96" y="406" width="140" height="36" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="166" y="429" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">CrewAI</text><path d="M246 324 L276 324 M270 319 L276 324 L270 329" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="286" y="340" width="130" height="52" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ee6a2" stroke-opacity="0.6" stroke-width="1.3"/><text x="351" y="371" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">SDK 自动</text><text x="76" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">整套调用链自动成树，provider 与框架已支持</text><rect x="486" y="186" width="738" height="108" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="486" y="186" width="4" height="108" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="506" y="218" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">@traceable</text><text x="506" y="244" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">函数级：套一个装饰器，这个函数就是一个 run</text><text x="506" y="266" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">@traceable</text><text x="506" y="285" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">def retrieve(q): ...</text><rect x="1074" y="206" width="80.3" height="25" rx="12.5" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="1085" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">覆盖：函数</text><rect x="486" y="310" width="738" height="108" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="486" y="310" width="4" height="108" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="506" y="342" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">trace 上下文</text><text x="506" y="368" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">代码块级：只包住一段逻辑，块内调用成为子 run</text><text x="506" y="390" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">with trace("rank"):</text><text x="506" y="409" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">    rank(docs)</text><rect x="1074" y="330" width="91.96000000000001" height="25" rx="12.5" fill="#ffc861" fill-opacity="0.13" stroke="#ffc861" stroke-opacity="0.45"/><text x="1085" y="344" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">覆盖：代码块</text><rect x="486" y="434" width="738" height="108" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="486" y="434" width="4" height="108" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="506" y="466" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">RunTree</text><text x="506" y="492" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">手工建树：自己决定父子与字段，适合自研框架</text><text x="506" y="514" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">rt = RunTree(name="job")</text><text x="506" y="533" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">rt.post(); rt.end()</text><rect x="1074" y="454" width="91.96000000000001" height="25" rx="12.5" fill="#b388ff" fill-opacity="0.13" stroke="#b388ff" stroke-opacity="0.45"/><text x="1085" y="468" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">覆盖：任意树</text><text x="56" y="590" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">怎么选：默认全自动 → 需要控制粒度时逐层换成手动 → 自研框架才碰 RunTree</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">自动与手动可以混用；同一个函数别套两个装饰器</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">LS 03 / 15</text></svg>