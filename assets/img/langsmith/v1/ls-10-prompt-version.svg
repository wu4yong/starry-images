<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">LANGSMITH · M3 提示词工程</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="130" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">commit 不可变，tag 是指针</text><text x="56" y="162" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">代码只认 name:tag，换 tag 指向就等于换版本，不用改代码</text><rect x="140" y="210" width="300" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#8ba3c7" stroke-width="1.4" stroke-opacity="0.55"/><rect x="140" y="210" width="4" height="150" rx="2" fill="#8ba3c7" fill-opacity="0.85"/><text x="162" y="246" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">commit a1f2</text><text x="162" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">v1 · 简洁版</text><text x="162" y="312" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">commit_tags: v1</text><text x="162" y="338" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">内容哈希固定</text><rect x="470" y="210" width="300" height="150" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="470" y="210" width="4" height="150" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="492" y="246" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">commit b7c4</text><text x="492" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">v2 · 加约束</text><text x="492" y="312" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">commit_tags: v2</text><text x="492" y="338" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">内容哈希固定</text><path d="M444 285 L466 285 M460 280 L466 285 L460 290" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="824" y="200" width="400" height="170" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="824" y="200" width="4" height="170" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="848" y="236" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">TAG POINTERS</text><text x="848" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">prod  →  b7c4（可变，可秒切）</text><text x="848" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">v1    →  a1f2（固定标记）</text><text x="848" y="328" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">staging → b7c4（预发验证）</text><text x="848" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">只写 name = 跟最新 commit</text><rect x="56" y="420" width="700" height="180" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="420" width="4" height="180" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="456" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">pull_prompt("refund-reply:prod")</text><text x="80" y="492" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">启动时拉一次 → 进程内缓存 → 失败降级到 FALLBACK</text><text x="80" y="522" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">不在请求路径里拉；平台故障不阻断线上</text><text x="80" y="556" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">include_model=True 才会带回模型配置</text><rect x="800" y="420" width="424" height="180" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="800" y="420" width="4" height="180" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="824" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">回滚 = 移动指针</text><text x="824" y="490" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">prod → a1f2：秒级回到旧版本</text><text x="824" y="520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">代价：平台不可用会传导到线上</text><text x="824" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">对策：预拉 + 兜底 + webhook 刷新</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">把 key 写进 prompt 变量 = 把凭证交给所有能打开这个 prompt 的人</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">ls-10-prompt-version</text></svg>