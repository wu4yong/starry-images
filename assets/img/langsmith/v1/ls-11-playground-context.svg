<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="130" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="32" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">Playground 定方向，实验定结论</text><text x="56" y="162" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">三个变量必须对齐：prompt 内容、模型连接与参数、运行时上下文</text><rect x="56" y="200" width="360" height="260" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="200" width="4" height="260" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="236" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">PLAYGROUND</text><text x="80" y="276" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">prompt: refund-reply:prod</text><text x="80" y="310" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">model A: gpt-4.1-mini</text><text x="80" y="344" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">model B: deepseek-chat</text><text x="80" y="378" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">variables: question</text><text x="80" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">草稿态：不提交就关页面即丢</text><path d="M430 330 L484 330 M478 325 L484 330 L478 335" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="500" y="200" width="360" height="260" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="500" y="200" width="4" height="260" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="524" y="236" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">EXPERIMENT</text><text x="524" y="276" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">dataset: refund-faq（10 条）</text><text x="524" y="310" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">evaluators: json_ok, has_sla</text><text x="524" y="344" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">experiment: pg-small-vs-large</text><text x="524" y="378" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">结果：两列分数 + 逐条差值</text><text x="524" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">「感觉不错」在这里变成有分母的结论</text><text x="56" y="530" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">CONTEXT HUB：同一套 commit / tag 语义</text><rect x="60" y="556" width="66.52" height="28" rx="14" fill="#8ba3c7" fill-opacity="0.13" stroke="#8ba3c7" stroke-opacity="0.45"/><text x="71" y="573" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">dev</text><text x="66" y="610" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">c-1a</text><rect x="310" y="556" width="125.88" height="28" rx="14" fill="#ffc861" fill-opacity="0.13" stroke="#ffc861" stroke-opacity="0.45"/><text x="321" y="573" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">staging</text><text x="316" y="610" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">c-4d</text><rect x="560" y="556" width="81.36" height="28" rx="14" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="571" y="573" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">prod</text><text x="566" y="610" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">c-4d</text><path d="M230 588 L290 588 M284 583 L290 588 L284 593" stroke="#8ba3c7" stroke-width="2" fill="none" /><text x="236" y="576" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">验证</text><path d="M450 588 L536 588 M530 583 L536 588 L530 593" stroke="#8ba3c7" stroke-width="2" fill="none" /><text x="462" y="576" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">晋升</text><text x="880" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">晋升 = 把指针挪到已验证的 commit</text><text x="880" y="596" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">回滚 = 挪回去；不在代码里按 name 拉最新</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">Playground 与线上模型连接不一致 = 本地好线上差最常见的原因</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">ls-11-playground-context</text></svg>