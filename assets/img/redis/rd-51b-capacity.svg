<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">容量规划：抽样、放大、留余量</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">容量对象永远是峰值，不是平均值</text><rect x="48" y="108" width="328" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="212" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">① MEMORY USAGE 抽样</text><text x="212" y="154" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">100～1000 个典型 key 求平均</text><line x1="376" y1="145" x2="394" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="396" y="108" width="328" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="560" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">② 放大到全量</text><text x="560" y="154" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">平均值 × key 总数 × 1.1</text><line x1="724" y1="145" x2="742" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="744" y="108" width="328" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="908" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">③ 加余量再定规格</text><text x="908" y="154" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">碎片的 1.3～1.5 + fork 放大</text><text x="48" y="208" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">三类最容易漏算的内存</text><rect x="48" y="218" width="330.6666666666667" height="96" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.5"/><text x="62" y="242" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.4" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">复制缓冲区</text><text x="62" y="272" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">repl-backlog-size 默认 1mb</text><text x="62" y="298" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">主从延迟大时要显式调大</text><rect x="394.6666666666667" y="218" width="330.6666666666667" height="96" rx="12" fill="rgba(56,189,248,0.06)" stroke="#fbbf24" stroke-width="1.5"/><text x="408.6666666666667" y="242" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.4" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">客户端缓冲区</text><text x="408.6666666666667" y="272" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">每连接的输入/输出缓冲</text><text x="408.6666666666667" y="298" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">大 value + 慢客户端会放大</text><rect x="741.3333333333334" y="218" width="330.6666666666667" height="96" rx="12" fill="rgba(56,189,248,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="755.3333333333334" y="242" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.4" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">fork 期间 COW</text><text x="755.3333333333334" y="272" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">BGSAVE 时父进程写入复制页</text><text x="755.3333333333334" y="298" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">峰值可达平时的 1.2～2 倍</text><text x="48" y="340" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">压测的三条真实性要求</text><rect x="48" y="350" width="330.6666666666667" height="68" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="60" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">真实 value 大小</text><text x="60" y="388" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">10 字节假数据测不出带宽</text><text x="60" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">与序列化成本</text><line x1="378.6666666666667" y1="384" x2="392.6666666666667" y2="384" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="394.6666666666667" y="350" width="330.6666666666667" height="68" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="406.6666666666667" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">真实读写比例</text><text x="406.6666666666667" y="388" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">只压读会低估淘汰</text><text x="406.6666666666667" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">与 AOF 压力</text><line x1="725.3333333333334" y1="384" x2="739.3333333333334" y2="384" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="741.3333333333334" y="350" width="330.6666666666667" height="68" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="753.3333333333334" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">真实网络路径</text><text x="753.3333333333334" y="388" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">跨机房与本地压测</text><text x="753.3333333333334" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">差一个数量级</text><rect x="48" y="434" width="500" height="106" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="64" y="454" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">红线一：单实例 10～16GB 上限</text><text x="64" y="482" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">fork 的 COW 成本、全量同步传输量、故障恢复时间</text><text x="64" y="510" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">都随内存线性上升——超过就分片，别再堆内存</text><rect x="576" y="434" width="496" height="106" rx="10" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.5"/><text x="592" y="454" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">红线二：余量 ≥ 30%</text><text x="592" y="482" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">要同时覆盖碎片 1.5、fork 写放大、复制缓冲增长</text><text x="592" y="510" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">只留 10% 的实例，高峰期就开始淘汰或写失败</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Memory optimization / MEMORY USAGE / Persistence（fork 与 COW）</text></svg>