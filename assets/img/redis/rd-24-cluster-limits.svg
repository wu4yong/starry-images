<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">Cluster 的硬限制与运维边界</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">限制不是 bug，是「分片」这件事的必然代价</text><text x="56" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">① 五条官方硬限制</text><rect x="56" y="158" width="544" height="66" rx="10" fill="undefined10" stroke="undefined" stroke-width="1.2"/><text x="74" y="182" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">只有 0 号库</text><text x="74" y="206" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">SELECT 非 0 库直接报错；按前缀做命名空间，别靠多库隔离</text><rect x="632" y="158" width="544" height="66" rx="10" fill="undefined10" stroke="undefined" stroke-width="1.2"/><text x="650" y="182" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">多 key 必须同槽</text><text x="650" y="206" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">MSET/MGET/SINTER/事务/Lua 涉及的 key 必须同 slot</text><rect x="56" y="234" width="544" height="66" rx="10" fill="undefined10" stroke="undefined" stroke-width="1.2"/><text x="74" y="258" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">跨槽要自己搬</text><text x="74" y="282" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">用 hash tag {tag} 把相关 key 绑到一槽，或 MIGRATE</text><rect x="632" y="234" width="544" height="66" rx="10" fill="undefined10" stroke="undefined" stroke-width="1.2"/><text x="650" y="258" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">Pub/Sub 受限</text><text x="650" y="282" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">普通 Pub/Sub 全节点广播；7.0 起有 SSUBSCRIBE 分片订阅</text><rect x="56" y="310" width="1140" height="66" rx="10" fill="undefined10" stroke="undefined" stroke-width="1.2"/><text x="74" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">不支持跨节点事务</text><text x="74" y="358" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">MULTI 只在单节点内原子，跨槽要么报错要么拆开业务</text><rect x="56" y="392" width="560" height="180" rx="12" fill="rgba(94,234,212,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="74" y="418" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">hash tag：把相关 key 绑在一起</text><text x="74" y="452" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">规则：只取第一个 { 与 } 之间的内容参与 CRC16</text><text x="74" y="478" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">{order:1001}:info 与 {order:1001}:items → 同槽</text><text x="74" y="504" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">{} 空 tag 视为「整个 key 参与计算」，等于没写</text><text x="74" y="530" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">代价：同一 tag 的 key 全落一个节点，容易变成热点</text><rect x="660" y="392" width="536" height="180" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="678" y="418" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">运维边界</text><text x="678" y="452" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">故障判定靠 cluster-node-timeout，超时太久恢复慢、太快误判</text><text x="678" y="478" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">没有「中心配置」：每个节点配置要手工一致（端口、内存、持久化）</text><text x="678" y="504" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">扩容跨机房会带来时延与脑裂风险，同机房优先</text><text x="678" y="530" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">备份依然要按节点逐个做，没有「整集群一键快照」</text><text x="56" y="602" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">选型提醒：如果业务天然有大量跨 key 操作（多表聚合、批量事务），Cluster 会把这些操作逐个变成「同槽约束」或「客户端聚合」。</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 Documentation · Cluster specification / limitations</text></svg>