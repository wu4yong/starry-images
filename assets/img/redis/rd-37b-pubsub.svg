<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">PUBLISH 的分发路径与「至多一次」</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">返回值是在线订阅者数，不是成功投递数</text><rect x="48" y="176" width="190" height="64" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="143" y="202" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">PUBLISH news</text><text x="143" y="226" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">发布者</text><rect x="300" y="158" width="200" height="100" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="400" y="184" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">频道表</text><text x="400" y="208" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">channel → 订阅连接列表</text><rect x="740" y="110" width="330" height="56" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="905" y="136" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">subscriber A（在线）</text><text x="905" y="160" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">写入输出缓冲</text><rect x="740" y="176" width="330" height="56" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="905" y="202" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">subscriber B（在线）</text><text x="905" y="226" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">写入输出缓冲</text><rect x="740" y="242" width="330" height="56" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="905" y="268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#f87171" text-anchor="middle" dominant-baseline="middle">subscriber C（离线）</text><text x="905" y="292" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">消息直接丢弃，无补发</text><line x1="238" y1="208" x2="296" y2="208" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><line x1="500" y1="190" x2="736" y2="138" stroke="#5eead4" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><line x1="500" y1="208" x2="736" y2="204" stroke="#5eead4" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><line x1="500" y1="226" x2="736" y2="270" stroke="#f87171" stroke-width="2" opacity="0.8" stroke-dasharray="6 6"/><text x="560" y="268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#f87171" text-anchor="start" dominant-baseline="middle">订阅者不在线 = 丢</text><text x="48" y="296" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">PUBLISH 返回「当时在线的订阅者数」；在线但缓冲满会被断连（client-output-buffer-limit pubsub）</text><rect x="48" y="314" width="1024" height="50" rx="10" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.4"/><rect x="48" y="314" width="150" height="50" rx="10" fill="#38bdf8" opacity="0.10"/><text x="64" y="337" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">订阅者不在线</text><text x="220" y="338" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">消息丢失，没有补发</text><text x="220" y="361" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">PUBLISH 返回 0，业务侧完全无感知</text><rect x="48" y="368" width="1024" height="50" rx="10" fill="rgba(248,113,113,0.05)" stroke="#f87171" stroke-width="1.4"/><rect x="48" y="368" width="150" height="50" rx="10" fill="#f87171" opacity="0.10"/><text x="64" y="391" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">缓冲满</text><text x="220" y="392" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">连接被断开，消息一起丢</text><text x="220" y="415" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">client-output-buffer-limit pubsub 触发断连</text><rect x="48" y="422" width="1024" height="50" rx="10" fill="rgba(251,191,36,0.05)" stroke="#fbbf24" stroke-width="1.4"/><rect x="48" y="422" width="150" height="50" rx="10" fill="#fbbf24" opacity="0.10"/><text x="64" y="445" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">业务处理失败</text><text x="220" y="446" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">没有重试机制，不会重投</text><text x="220" y="469" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">要重投得应用自己记录并重发</text><rect x="48" y="476" width="1024" height="50" rx="10" fill="rgba(167,139,250,0.05)" stroke="#a78bfa" stroke-width="1.4"/><rect x="48" y="476" width="150" height="50" rx="10" fill="#a78bfa" opacity="0.10"/><text x="64" y="499" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">应用重启</text><text x="220" y="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">订阅关系不持久，必须重新订阅</text><text x="220" y="523" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">半开连接要靠心跳/超时发现</text><rect x="48" y="534" width="1024" height="30" rx="10" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.5"/><text x="64" y="554" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">要「至少一次」就换 Stream 消费组（RD38）或外部 MQ；PUBLISH 只适合「丢了也不影响」的通知</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Pub/Sub 文档 / client-output-buffer-limit pubsub / SSUBSCRIBE</text></svg>