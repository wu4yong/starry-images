" cy="122.9" r="0.68" fill="#cfe4ff" opacity="0.49"/><circle cx="233.1" cy="416.9" r="1.16" fill="#cfe4ff" opacity="0.33"/><circle cx="710.6" cy="90.7" r="1.30" fill="#cfe4ff" opacity="0.57"/><circle cx="451.7" cy="65.0" r="0.86" fill="#cfe4ff" opacity="0.16"/><circle cx="760.8" cy="12.9" r="0.67" fill="#cfe4ff" opacity="0.12"/>
<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">事件循环的一圈与 io-threads 的边界</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">多路复用让单线程扛多连接，不是多线程让 Redis 快</text><rect x="48" y="108" width="242.5" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="169.25" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">beforeSleep</text><text x="169.25" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">刷 AOF 缓冲 / 唤醒阻塞客户端</text><line x1="290.5" y1="146" x2="306.5" y2="146" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="308.5" y="108" width="242.5" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="429.75" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">aeApiPoll</text><text x="429.75" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">epoll_wait 等可读可写 fd</text><line x1="551" y1="146" x2="567" y2="146" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="569" y="108" width="242.5" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="690.25" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">文件事件</text><text x="690.25" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">读 → 解析 → 执行 → 写回复</text><line x1="811.5" y1="146" x2="827.5" y2="146" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="829.5" y="108" width="242.5" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="950.75" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">时间事件</text><text x="950.75" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">serverCron 每秒一次</text><path d="M 1024 190 L 1024 200 L 60 200 L 60 190" fill="none" stroke="#38bdf8" stroke-width="1.4" opacity="0.7" marker-end="url(#arrow)"/><text x="560" y="218" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle" dominant-baseline="middle">一圈结束，回到 beforeSleep —— 读、执行、写都在同一圈里，没有线程切换与锁</text><rect x="48" y="230" width="496" height="174" rx="12" fill="rgba(94,234,212,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="64" y="256" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">io-threads 能做</text><text x="64" y="286" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">并行读 socket、解析 RESP</text><text x="64" y="314" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">并行组装并写回复</text><text x="64" y="342" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">降低主线程 CPU 占用</text><text x="64" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">改善高带宽、小命令场景</text><rect x="576" y="230" width="496" height="174" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="592" y="256" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">io-threads 不能做</text><text x="592" y="286" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">并行执行命令（执行仍单线程）</text><text x="592" y="314" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">让一条慢命令变快</text><text x="592" y="342" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">突破单实例吞吐上限</text><text x="592" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">改变 Lua / MULTI 的原子性</text><rect x="48" y="420" width="1024" height="74" rx="10" fill="rgba(56,189,248,0.06)" stroke="#fbbf24" stroke-width="1.5"/><text x="64" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">io-threads 4（默认 1 = 关闭，官方建议不超过 8，且不超过 CPU 核数）</text><text x="64" y="466" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">只有当实例确实被网络 IO 的 CPU 占用卡住时才开；盲目开大，线程切换与锁开销反而更慢</text><rect x="48" y="506" width="1024" height="46" rx="10" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.5"/><text x="64" y="526" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">单线程的三条底气：原子性天然成立 · 内存操作极快 · 加线程解决不了「单条命令太慢」</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · ae.c / server.c 事件循环 / redis.conf io-threads 注释</text></svg>