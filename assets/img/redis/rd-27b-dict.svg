14" width="496" height="150" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="64" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">两档阈值</text><text x="64" y="270" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">load factor &gt; 1 且不在 BGSAVE → 扩容</text><text x="64" y="300" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">load factor &gt; 5 → 强制扩容（怕 CoW 也照扩）</text><text x="64" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">load factor &lt; 0.1 → 缩容，避免反复抖动</text><rect x="576" y="214" width="496" height="174" rx="12" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="592" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">迁移期四个行为</text><text x="592" y="270" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">查找：先 ht[0] 再 ht[1]</text><text x="592" y="298" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写入：只写 ht[1]（保证收敛）</text><text x="592" y="326" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">删改：两张表都要试</text><text x="592" y="354" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">SCAN：可能重复，但不会漏</text><rect x="48" y="410" width="1024" height="116" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="64" y="436" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">两个误判</text><text x="64" y="466" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">内存翻倍是中间态：两张表并存，不是泄漏；长期不收敛说明实例没有写入且 cron 被慢命令堵住</text><text x="64" y="492" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">rehash 与 fork、AOF 重写同属「异步大动作」，P99 毛刺多半出在这三件事叠加</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · dict.c 注释（dictExpandIfNeeded / 渐进式 rehash）/ SCAN</text></svg>