<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">TLS 三段校验与五条加固动作</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">protected-mode 只在「无密码 + 无 bind」时才生效</text><rect x="48" y="104" width="244" height="72" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="170" y="128" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">客户端 → 服务端</text><text x="170" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">TLS 握手开始</text><line x1="292" y1="140" x2="306" y2="140" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="308" y="104" width="244" height="72" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="430" y="128" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">① 校验服务端证书</text><text x="430" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">客户端验 CA，防中间人</text><line x1="552" y1="140" x2="566" y2="140" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="568" y="104" width="244" height="72" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="690" y="128" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">② 校验客户端证书</text><text x="690" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">tls-auth-clients yes</text><line x1="812" y1="140" x2="826" y2="140" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="828" y="104" width="244" height="72" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="950" y="128" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">③ RESP 走加密通道</text><text x="950" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">之后所有命令都在 TLS 内</text><rect x="48" y="196" width="496" height="146" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.6"/><text x="64" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">服务端三件套</text><text x="64" y="252" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">port 0 + tls-port 6379（关掉明文端口）</text><text x="64" y="280" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">tls-cert-file / tls-key-file / tls-ca-cert-file</text><text x="64" y="308" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">tls-auth-clients yes 要求客户端证书</text><rect x="576" y="196" width="496" height="146" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="592" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">别漏这两个开关</text><text x="592" y="252" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">tls-replication yes：主从复制也走 TLS</text><text x="592" y="280" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">tls-cluster yes：集群总线也走 TLS</text><text x="592" y="308" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">漏配 → 客户端能连、主从不同步，像网络故障</text><text x="48" y="360" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">加固五条，按有效性排序</text><rect x="48" y="370" width="195.2" height="64" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="60" y="390" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">bind 内网</text><text x="60" y="408" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">只监听指定网卡</text><text x="60" y="424" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">0.0.0.0 = 全网可达</text><line x1="243.2" y1="402" x2="253.2" y2="402" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="255.2" y="370" width="195.2" height="64" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="267.2" y="390" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">ACL / 密码</text><text x="267.2" y="408" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">认证谁能连</text><text x="267.2" y="424" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">弱密码等于没有</text><line x1="450.4" y1="402" x2="460.4" y2="402" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="462.4" y="370" width="195.2" height="64" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="474.4" y="390" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">禁危险命令</text><text x="474.4" y="408" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">keys / flushall</text><text x="474.4" y="424" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">用 ACL 不用改名</text><line x1="657.5999999999999" y1="402" x2="667.5999999999999" y2="402" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="669.5999999999999" y="370" width="195.2" height="64" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="681.5999999999999" y="390" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">安全组</text><text x="681.5999999999999" y="408" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">网络层隔离</text><text x="681.5999999999999" y="424" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">最有效的一条</text><line x1="864.8" y1="402" x2="874.8" y2="402" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="876.8" y="370" width="195.2" height="64" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="888.8" y="390" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">TLS</text><text x="888.8" y="408" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">链路加密</text><text x="888.8" y="424" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">内网也别裸奔</text><rect x="48" y="448" width="500" height="84" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="64" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">证书过期是定时炸弹</text><text x="64" y="496" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">到期前 30 天告警，轮换流程演练过</text><text x="64" y="524" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">只换服务端、不同步 CA → 客户端集体握手失败</text><rect x="576" y="448" width="496" height="84" rx="10" fill="rgba(167,139,250,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="592" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">被入侵的标准配方</text><text x="592" y="496" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">bind 0.0.0.0 + 空密码 + 公网 IP</text><text x="592" y="524" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">此时 protected-mode 已不生效，别再指望它</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · TLS 支持 / 安全总览（protected-mode 生效条件）/ CONFIG SET</text></svg>