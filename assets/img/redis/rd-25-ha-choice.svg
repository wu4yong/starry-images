<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">高可用选型：主从、Sentinel 还是 Cluster</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">先看「要不要写扩展」，再谈「怎么切换」</text><text x="56" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">① 四种形态的定位</text><rect x="56" y="162" width="262" height="222" rx="12" fill="#64748b12" stroke="#64748b" stroke-width="1.5"/><text x="74" y="196" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="start" dominant-baseline="middle">单机</text><text x="74" y="232" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">容量：受单机内存限制</text><text x="74" y="258" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写：不扩展</text><text x="74" y="284" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">故障：无自动切换</text><text x="74" y="310" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">适用：开发、可重算缓存</text><rect x="342" y="162" width="262" height="222" rx="12" fill="#38bdf812" stroke="#38bdf8" stroke-width="1.5"/><text x="360" y="196" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">主从</text><text x="360" y="232" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">容量：读可水平扩</text><text x="360" y="258" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写：仍是单点</text><text x="360" y="284" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">故障：手动切</text><text x="360" y="310" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">适用：读多写少</text><rect x="628" y="162" width="262" height="222" rx="12" fill="#fbbf2412" stroke="#fbbf24" stroke-width="1.5"/><text x="646" y="196" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">Sentinel</text><text x="646" y="232" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">容量：同主从</text><text x="646" y="258" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写：单点</text><text x="646" y="284" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">故障：自动切换</text><text x="646" y="310" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">适用：单主写入的中小规模</text><rect x="914" y="162" width="282" height="222" rx="12" fill="#5eead412" stroke="#5eead4" stroke-width="1.5"/><text x="932" y="196" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">Cluster</text><text x="932" y="232" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">容量：水平扩</text><text x="932" y="258" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写：多主分片</text><text x="932" y="284" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">故障：节点级接管</text><text x="932" y="310" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">适用：大数据量、高写入</text><rect x="56" y="404" width="560" height="190" rx="12" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="1.6"/><text x="74" y="430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">决策顺序（按优先级问三个问题）</text><text x="74" y="464" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">① 数据量能否装进一台机器？装得下 → 主从 / Sentinel</text><text x="74" y="490" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">② 写入是否超过单节点能力？超了 → Cluster</text><text x="74" y="516" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">③ 能否接受分钟级人工切换？能 → 主从就够</text><rect x="660" y="404" width="536" height="190" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="678" y="430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">别被忽略的成本</text><text x="678" y="464" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">Sentinel：多一套进程与配置同步，客户端要支持</text><text x="678" y="490" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">Cluster：跨槽限制、迁移成本、客户端要处理 MOVED/ASK</text><text x="678" y="516" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">任何方案：异步复制都意味着切换时可能丢最后一段写入</text><text x="56" y="622" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">一句话：主从解决「读扩展 + 备份」，Sentinel 解决「自动切换」，Cluster 解决「容量与写入水平扩展」。</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 Documentation · Replication / Sentinel / Cluster overview</text></svg>