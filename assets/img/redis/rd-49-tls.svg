<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">TLS 与安全加固：把 6379 关在门里</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">加密解决「链路上被看见」，加固解决「谁能连进来」</text><text x="56" y="140" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">① TLS 的四项配置</text><rect x="56" y="162" width="560" height="168" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.6"/><text x="74" y="188" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">服务端证书三件套</text><text x="74" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">tls-port 6379（同时保留 port 0 关掉明文）</text><text x="74" y="249" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">tls-cert-file / tls-key-file（服务端证书与私钥）</text><text x="74" y="276" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">tls-ca-cert-file（校验客户端用的 CA）</text><text x="74" y="303" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">tls-auth-clients yes：要求客户端也带证书</text><rect x="660" y="162" width="536" height="168" rx="12" fill="rgba(94,234,212,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="678" y="188" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">客户端要做的两件事</text><text x="678" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">连接换成 TLS（redis-cli --tls --cacert）</text><text x="678" y="249" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">携带客户端证书（若 tls-auth-clients 为 yes）</text><text x="678" y="276" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">注意：集群/哨兵要用 tls-replication yes 才能内部加密</text><text x="678" y="303" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">证书过期是最常见的「突然全站连不上」</text><text x="56" y="388" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">② 五条加固清单</text><rect x="56" y="410" width="210.4" height="92" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="161.2" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">bind 内网地址</text><text x="161.2" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">不要 0.0.0.0</text><line x1="266.4" y1="456" x2="286.4" y2="456" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="288.4" y="410" width="210.4" height="92" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="393.59999999999997" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">protected-mode yes</text><text x="393.59999999999997" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">无密码无 bind 时拒绝外部</text><line x1="498.79999999999995" y1="456" x2="518.8" y2="456" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="520.8" y="410" width="210.4" height="92" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="626" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">requirepass / ACL</text><text x="626" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">强密码或分账号</text><line x1="731.1999999999999" y1="456" x2="751.1999999999999" y2="456" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="753.2" y="410" width="210.4" height="92" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="858.4000000000001" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">禁用危险命令</text><text x="858.4000000000001" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">ACL 收 keys/flushall</text><line x1="963.6" y1="456" x2="983.6" y2="456" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="985.6" y="410" width="210.4" height="92" rx="10" fill="rgba(56,189,248,0.07)" stroke="#f87171" stroke-width="1.5"/><text x="1090.8" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#f87171" text-anchor="middle" dominant-baseline="middle">不暴露公网</text><text x="1090.8" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">安全组只放应用网段</text><rect x="56" y="526" width="1140" height="118" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="74" y="552" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">一条常被忽略的官方说明</text><text x="74" y="586" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">protected-mode 只在「没有 bind 任何地址 + 没有设置密码」时才生效；一旦你 bind 了 0.0.0.0 或设了密码，它就形同虚设——真正的防线是网络层与 ACL</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · TLS 支持文档 / protected-mode 与 bind 配置说明</text></svg>