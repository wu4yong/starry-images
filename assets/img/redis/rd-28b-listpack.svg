<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">intset 与 listpack：小对象为什么省</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">连续内存换内存，代价是插入要搬数据</text><rect x="48" y="106" width="1024" height="92" rx="10" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="64" y="130" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">intset：有序整数数组</text><rect x="64" y="146" width="150" height="38" rx="19" fill="#5eead4" opacity="0.10" stroke="#5eead4" stroke-width="1.4"/><text x="139" y="165" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">encoding 4B</text><rect x="224" y="146" width="120" height="38" rx="19" fill="#5eead4" opacity="0.10" stroke="#5eead4" stroke-width="1.4"/><text x="284" y="165" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">length</text><rect x="352" y="146" width="470" height="38" rx="19" fill="#5eead4" opacity="0.10" stroke="#5eead4" stroke-width="1.4"/><text x="587" y="165" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">contents: 1 | 2 | 3 | 7 | 100 …（有序，二分查找）</text><text x="830" y="165" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">只升不降</text><rect x="48" y="210" width="1024" height="92" rx="10" fill="rgba(251,191,36,0.05)" stroke="#fbbf24" stroke-width="1.4"/><text x="64" y="234" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">listpack：header + 变长 entry + 0xFF 结束标记</text><rect x="64" y="250" width="152" height="38" rx="19" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-width="1.4"/><text x="140" y="269" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">header</text><rect x="228" y="250" width="152" height="38" rx="19" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-width="1.4"/><text x="304" y="269" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">entry 编码</text><rect x="392" y="250" width="152" height="38" rx="19" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-width="1.4"/><text x="468" y="269" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">数据</text><rect x="556" y="250" width="152" height="38" rx="19" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-width="1.4"/><text x="632" y="269" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">回退长度</text><rect x="720" y="250" width="152" height="38" rx="19" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-width="1.4"/><text x="796" y="269" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">entry …</text><rect x="884" y="250" width="152" height="38" rx="19" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-width="1.4"/><text x="960" y="269" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">0xFF</text><rect x="48" y="316" width="500" height="146" rx="12" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="64" y="342" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">四组阈值（任一超标即转换）</text><text x="64" y="372" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">hash-max-listpack-entries 128 / value 64</text><text x="64" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">zset-max-listpack-entries 128 / value 64</text><text x="64" y="428" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">set-max-intset-entries 512</text><rect x="576" y="316" width="496" height="146" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="592" y="342" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">三条不可逆</text><text x="592" y="372" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">编码转换只升不降，删回小也回不去 → 只能重建 key</text><text x="592" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">7.2 起 ziplist 退役，监控按 ziplist 会误判</text><text x="592" y="428" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">改阈值只影响新 key，存量不迁移</text><rect x="48" y="480" width="1024" height="66" rx="10" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.5"/><text x="64" y="502" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">一条容易忽略的判定：</text><text x="200" y="502" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">「任一条件」——一个字段塞 200 字节 JSON，整张 Hash 立刻从 listpack 转 hashtable，内存涨数倍</text><text x="64" y="526" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">代价与省下的内存相比常常是倒挂：先量 OBJECT ENCODING，再决定拆 key 还是改阈值。</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · redis.conf 阈值 / listpack.h / OBJECT ENCODING</text></svg>