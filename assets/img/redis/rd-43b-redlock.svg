#cfe4ff" opacity="0.35"/><circle cx="263.1" cy="206.2" r="1.31" fill="#cfe4ff" opacity="0.34"/><circle cx="805.5" cy="107.4" r="0.96" fill="#cfe4ff" opacity="0.48"/><circle cx="435.8" cy="472.8" r="0.78" fill="#cfe4ff" opacity="0.12"/><circle cx="757.5" cy="380.3" r="0.88" fill="#cfe4ff" opacity="0.13"/><circle cx="431.3" cy="57.4" r="0.97" fill="#cfe4ff" opacity="0.22"/><circle cx="149.6" cy="590.0" r="1.12" fill="#cfe4ff" opacity="0.24"/><circle cx="659.8" cy="307.8" r="0.57" fill="#cfe4ff" opacity="0.16"/><circle cx="985.0" cy="430.1" r="0.54" fill="#cfe4ff" opacity="0.33"/><circle cx="14.2" cy="76.1" r="0.43" fill="#cfe4ff" opacity="0.16"/><circle cx="38.5" cy="27.3" r="0.60" fill="#cfe4ff" opacity="0.14"/><circle cx="334.6" cy="579.8" r="1.26" fill="#cfe4ff" opacity="0.17"/><circle cx="522.1" cy="456.7" r="0.74" fill="#cfe4ff" opacity="0.30"/><circle cx="247.3" cy="297.7" r="1.27" fill="#cfe4ff" opacity="0.19"/><circle cx="78.3" cy="150.6" r="0.66" fill="#cfe4ff" opacity="0.52"/><circle cx="216.5" cy="145.8" r="0.67" fill="#cfe4ff" opacity="0.20"/><circle cx="314.3" cy="78.5" r="0.99" fill="#cfe4ff" opacity="0.40"/><circle cx="970.4" cy="284.9" r="1.31" fill="#cfe4ff" opacity="0.36"/><circle cx="182.9" cy="259.1" r="0.84" fill="#cfe4ff" opacity="0.35"/><circle cx="373.4" cy="353.3" r="0.44" fill="#cfe4ff" opacity="0.28"/><circle cx="320.6" cy="28.9" r="1.01" fill="#cfe4ff" opacity="0.44"/><circle cx="667.5" cy="412.0" r="1.21" fill="#cfe4ff" opacity="0.14"/><circle cx="717.4" cy="444.7" r="1.17" fill="#cfe4ff" opacity="0.39"/><circle cx="588.2" cy="514.8" r="0.75" fill="#cfe4ff" opacity="0.27"/><circle cx="816.7" cy="304.8" r="0.83" fill="#cfe4ff" opacity="0.36"/><circle cx="463.9" cy="102.4" r="1.28" fill="#cfe4ff" opacity="0.38"/><circle cx="626.0" cy="494.8" r="1.19" fill="#cfe4ff" opacity="0.30"/><circle cx="1046.7" cy="452.1" r="0.76" fill="#cfe4ff" opacity="0.18"/><circle cx="866.0" cy="141.3" r="0.77" fill="#cfe4ff" opacity="0.31"/><circle cx="183.4" cy="29.5" r="0.83" fill="#cfe4ff" opacity="0.52"/><circle cx="480.6" cy="501.1" r="1.02" fill="#cfe4ff" opacity="0.24"/><circle cx="129.9" cy="304.9" r="0.97" fill="#cfe4ff" opacity="0.41"/><circle cx="982.6" cy="563.6" r="1.33" fill="#cfe4ff" opacity="0.48"/><circle cx="500.3" cy="35.3" r="1.00" fill="#cfe4ff" opacity="0.50"/>
<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">Redlock 的五个步骤与三条物理事实</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">它降低丢锁概率，不消除；正确性锁别只靠它</text><rect x="48" y="108" width="190.4" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="143.2" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">① 记录 T1</text><text x="143.2" y="154" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">客户端本地单调时钟</text><line x1="238.4" y1="145" x2="254.39999999999998" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="256.4" y="108" width="190.4" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="351.59999999999997" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">② 顺序向 5 节点</text><text x="351.59999999999997" y="154" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">SET NX PX 10s，每个 50ms 超时</text><line x1="446.79999999999995" y1="145" x2="462.79999999999995" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="464.8" y="108" width="190.4" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="560" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">③ ≥3 且未超时</text><text x="560" y="154" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">成功数过半即视为加锁</text><line x1="655.2" y1="145" x2="671.2" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="673.2" y="108" width="190.4" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="768.4000000000001" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">④ 失败向所有节点删</text><text x="768.4000000000001" y="154" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">避免残留锁抬高下次难度</text><line x1="863.6" y1="145" x2="879.6" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="881.6" y="108" width="190.4" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#f87171" stroke-width="1.5"/><text x="976.8000000000001" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#f87171" text-anchor="middle" dominant-baseline="middle">⑤ 有效期待扣减</text><text x="976.8000000000001" y="154" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">10s −（T2−T1）</text><rect x="48" y="200" width="330.6666666666667" height="118" rx="10" fill="rgba(56,189,248,0.05)" stroke="#fbbf24" stroke-width="1.4"/><text x="62" y="224" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">时钟漂移</text><text x="62" y="254" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">NTP 调时或人工改时间</text><text x="62" y="276" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">PX 过期按服务端时间判断</text><text x="62" y="298" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">多节点时间不一致 → 多数语义松动</text><rect x="394.6666666666667" y="200" width="330.6666666666667" height="118" rx="10" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.4"/><text x="408.6666666666667" y="224" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">网络延迟</text><text x="408.6666666666667" y="254" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">客户端到节点 RTT 不定</text><text x="408.6666666666667" y="276" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">加锁/解锁到达时间超预期</text><text x="408.6666666666667" y="298" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">可能「以为锁上了」其实还没到</text><rect x="741.3333333333334" y="200" width="330.6666666666667" height="118" rx="10" fill="rgba(56,189,248,0.05)" stroke="#f87171" stroke-width="1.4"/><text x="755.3333333333334" y="224" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">进程停顿</text><text x="755.3333333333334" y="254" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">GC、虚拟机暂停、CPU 抢占</text><text x="755.3333333333334" y="276" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">停顿可能超过有效期</text><text x="755.3333333333334" y="298" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">醒来锁已易主，你却不知道</text><rect x="48" y="334" width="1024" height="52" rx="10" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.4"/><rect x="48" y="334" width="110" height="52" rx="10" fill="#38bdf8" opacity="0.10"/><text x="64" y="358" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">效率锁</text><text x="180" y="358" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">防重复劳动：多做一次，无数据损坏</text><text x="180" y="381" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">单节点 SET NX PX + 业务幂等就够</text><rect x="48" y="392" width="1024" height="52" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.4"/><rect x="48" y="392" width="110" height="52" rx="10" fill="#f87171" opacity="0.10"/><text x="64" y="416" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">正确性锁</text><text x="180" y="416" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">资金、库存：失效 → 数据错乱与资损</text><text x="180" y="439" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">数据库行锁/事务，或 fencing token</text><rect x="48" y="456" width="1024" height="96" rx="10" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="1.4"/><text x="64" y="478" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">fencing token：锁服务给单调递增编号，存储侧只接受更大的编号</text><rect x="64" y="492" width="200" height="34" rx="17" fill="#5eead4" opacity="0.10" stroke="#5eead4" stroke-width="1.4"/><text x="164" y="509" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">锁授予 #38</text><line x1="268" y1="509" x2="300" y2="509" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="304" y="492" width="210" height="34" rx="17" fill="#5eead4" opacity="0.10" stroke="#5eead4" stroke-width="1.4"/><text x="409" y="509" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">写 #38 → 接受</text><rect x="528" y="492" width="220" height="34" rx="17" fill="#f87171" opacity="0.10" stroke="#f87171" stroke-width="1.4"/><text x="638" y="509" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle" dominant-baseline="middle">锁失效后被授予 #37</text><line x1="752" y1="509" x2="784" y2="509" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="788" y="492" width="284" height="34" rx="17" fill="#f87171" opacity="0.10" stroke="#f87171" stroke-width="1.4"/><text x="930" y="509" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle" dominant-baseline="middle">写 #37 → 拒绝（编号偏小）</text><text x="64" y="540" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">即使两个客户端同时持锁，后到的旧编号写也会被存储挡下 —— 安全性从「锁」转移到「存储的写入校验」</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Distributed Locks 文档 / Redlock 算法说明与 Kleppmann 争论要点</text></svg>