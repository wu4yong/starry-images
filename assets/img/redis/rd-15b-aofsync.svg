<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">一条写命令的四站与三档可靠性</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">write() 成功不等于落盘，差别全在 fsync 时机</text><rect x="48" y="112" width="242.5" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="169.25" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">执行命令</text><text x="169.25" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">改内存 + 追加 aof_buf</text><line x1="290.5" y1="151" x2="306.5" y2="151" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="308.5" y="112" width="242.5" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="429.75" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">aof_buf</text><text x="429.75" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">进程内缓冲，攒批</text><line x1="551" y1="151" x2="567" y2="151" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="569" y="112" width="242.5" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="690.25" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">write()</text><text x="690.25" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">进 page cache：掉电即丢</text><line x1="811.5" y1="151" x2="827.5" y2="151" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="829.5" y="112" width="242.5" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="950.75" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">fsync()</text><text x="950.75" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">刷到磁盘才算落盘</text><rect x="48" y="214" width="1024" height="64" rx="10" fill="rgba(56,189,248,0.05)" stroke="#f87171" stroke-width="1.4"/><rect x="48" y="214" width="150" height="64" rx="10" fill="#f87171" opacity="0.10"/><text x="64" y="246" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">always</text><text x="170" y="236" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">每条写命令都 fsync，落盘后才回复客户端</text><text x="170" y="259" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">最坏丢失：原则上 0 条；代价：吞吐常降一个数量级</text><rect x="48" y="284" width="1024" height="64" rx="10" fill="rgba(56,189,248,0.05)" stroke="#fbbf24" stroke-width="1.4"/><rect x="48" y="284" width="150" height="64" rx="10" fill="#fbbf24" opacity="0.10"/><text x="64" y="316" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">everysec</text><text x="170" y="306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">后台线程每秒 fsync 一次（默认值）</text><text x="170" y="329" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">最坏丢失：约 1 秒的写入；磁盘卡顿时窗口会被拉长</text><rect x="48" y="354" width="1024" height="64" rx="10" fill="rgba(56,189,248,0.05)" stroke="#a78bfa" stroke-width="1.4"/><rect x="48" y="354" width="150" height="64" rx="10" fill="#a78bfa" opacity="0.10"/><text x="64" y="386" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">no</text><text x="170" y="376" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">只 write()，何时落盘交给内核脏页回写</text><text x="170" y="399" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">最坏丢失：通常 30 秒量级，且不可预测——无法承诺任何 RPO</text><rect x="48" y="436" width="1024" height="116" rx="12" fill="rgba(94,234,212,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="64" y="462" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">两个观测口径</text><text x="64" y="492" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">aof_delayed_fsync 持续增长 = 磁盘跟不上，everysec 的「1 秒」已经名存实亡</text><text x="64" y="518" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">appendonly 默认是 no；开了之后启动优先加载 AOF，dump.rdb 不再被读</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Persistence / appendfsync / INFO persistence</text></svg>