<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">复制配置与四类典型故障</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">复制不难配，难在故障时能不能一眼看出是哪一类</text><rect x="56" y="132" width="560" height="246" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.6"/><text x="74" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">必备配置（7.x 官方默认值）</text><text x="74" y="192" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">replicaof &lt;host&gt; &lt;port&gt;：或在运行时 REPLICAOF 命令</text><text x="74" y="218" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">masterauth &lt;password&gt;：主库开了 requirepass 时必须配</text><text x="74" y="244" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">replica-read-only yes：从库默认只读（保护，不是限制）</text><text x="74" y="270" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">repl-backlog-size 1mb：增量复制缓冲区大小</text><text x="74" y="296" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">replica-priority 100：故障转移时的选主权重（越小越优先）</text><text x="74" y="322" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">min-replicas-to-write / min-replicas-max-lag：可用性保护</text><rect x="660" y="132" width="536" height="246" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="678" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">四个观测点（INFO replication）</text><text x="678" y="192" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">role: master / slave</text><text x="678" y="218" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">master_link_status: up / down</text><text x="678" y="244" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">master_repl_offset 与 slave_repl_offset 的差 = 延迟</text><text x="678" y="270" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">master_last_io_seconds_ago：多久没收到主库数据</text><text x="678" y="296" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">sync_full / sync_partial_ok / sync_partial_err：全量与增量次数</text><rect x="56" y="398" width="544" height="84" rx="10" fill="#f8717110" stroke="#f87171" stroke-width="1.2"/><text x="74" y="424" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">全量风暴</text><text x="74" y="448" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">多个从库同时重连，主库反复 fork 与传输</text><text x="74" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">错峰、开 diskless、加大 backlog</text><rect x="632" y="398" width="544" height="84" rx="10" fill="#fbbf2410" stroke="#fbbf24" stroke-width="1.2"/><text x="650" y="424" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">反复全量</text><text x="650" y="448" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">sync_full 持续增长，网络抖动就掉链</text><text x="650" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">排查 backlog 与网络，检查 replid 变化</text><rect x="56" y="494" width="544" height="84" rx="10" fill="#a78bfa10" stroke="#a78bfa" stroke-width="1.2"/><text x="74" y="520" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">从库写失败</text><text x="74" y="544" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">READONLY You can't write against a read only replica</text><text x="74" y="564" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">确认 replica-read-only，写请求不该打到从库</text><rect x="632" y="494" width="544" height="84" rx="10" fill="#5eead410" stroke="#5eead4" stroke-width="1.2"/><text x="650" y="520" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">主从数据漂移</text><text x="650" y="544" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">从库 key 比主库少 / 值更旧，MAXMEMORY 与淘汰</text><text x="650" y="564" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">淘汰策略与内存配额要保持一致</text><text x="56" y="616" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">判定口径：延迟看 offset 差与 master_last_io_seconds_ago；全量看 sync_full 的增速；写失败先看 role 再谈配置。</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 Documentation · Replication / INFO replication / replica-read-only</text></svg>