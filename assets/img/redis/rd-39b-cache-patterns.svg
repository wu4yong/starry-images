1034.4" cy="403.8" r="0.99" fill="#cfe4ff" opacity="0.34"/><circle cx="339.4" cy="191.9" r="0.91" fill="#cfe4ff" opacity="0.44"/><circle cx="762.3" cy="507.3" r="0.66" fill="#cfe4ff" opacity="0.55"/><circle cx="547.3" cy="18.4" r="0.85" fill="#cfe4ff" opacity="0.44"/><circle cx="174.2" cy="212.1" r="0.65" fill="#cfe4ff" opacity="0.39"/>
<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">四种缓存模式的写路径与风险</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">两问定模式：能接受旧值吗、能接受丢写吗</text><rect x="48" y="108" width="1024" height="56" rx="10" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.4"/><rect x="48" y="108" width="120" height="56" rx="10" fill="#38bdf8" opacity="0.10"/><text x="64" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">读路径</text><text x="190" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">GET 命中直接返回；未命中 → 查库 → SET 带 TTL → 返回</text><text x="190" y="155" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">缓存是旁路：Redis 挂了读落到库上，变慢但可用</text><rect x="48" y="172" width="1024" height="56" rx="10" fill="rgba(94,234,212,0.05)" stroke="#5eead4" stroke-width="1.4"/><rect x="48" y="172" width="120" height="56" rx="10" fill="#5eead4" opacity="0.10"/><text x="64" y="198" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">写路径</text><text x="190" y="196" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">UPDATE db → DEL key（不是 SET 新值）</text><text x="190" y="219" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">删缓存让下次读自然回填，避开并发写顺序错乱</text><rect x="48" y="248" width="247" height="176" rx="12" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.5"/><text x="62" y="274" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">Cache-Aside</text><text x="62" y="306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">旁路：先读缓存再读库</text><text x="62" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写：UPDATE db → DEL</text><text x="62" y="362" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">风险：击穿/穿透/雪崩</text><text x="62" y="390" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">适合：绝大多数业务</text><rect x="307" y="248" width="247" height="176" rx="12" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.5"/><text x="321" y="274" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12.5" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">Read-Through</text><text x="321" y="306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">业务只调 cache.get</text><text x="321" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">缓存层自己回源</text><text x="321" y="362" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">风险：缓存层耦合 DB</text><text x="321" y="390" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">适合：Spring @Cacheable</text><rect x="566" y="248" width="247" height="176" rx="12" fill="rgba(56,189,248,0.05)" stroke="#fbbf24" stroke-width="1.5"/><text x="580" y="274" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">Write-Through</text><text x="580" y="306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写：SET cache → db</text><text x="580" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">读写都热，值最新</text><text x="580" y="362" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">风险：写失败放大</text><text x="580" y="390" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">适合：写少读多且要新</text><rect x="825" y="248" width="247" height="176" rx="12" fill="rgba(56,189,248,0.05)" stroke="#f87171" stroke-width="1.5"/><text x="839" y="274" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">Write-Behind</text><text x="839" y="306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写：SET cache 即返回</text><text x="839" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">后台批量刷库</text><text x="839" y="362" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">风险：宕机丢队列里的写</text><text x="839" y="390" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">适合：计数/点赞/点击流</text><rect x="48" y="436" width="500" height="88" rx="10" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="1.5"/><text x="64" y="456" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">两问定模式</text><text x="64" y="482" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">能接受缓存里是旧值 → Cache-Aside / Read-Through</text><text x="64" y="508" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">不能接受丢一批写 → 排除 Write-Behind</text><rect x="576" y="436" width="496" height="88" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="592" y="456" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">两个都「不能」怎么办</text><text x="592" y="482" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">扣库存这类强一致场景不该用「缓存 + 异步」</text><text x="592" y="508" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">走数据库事务 + 分布式锁，或 Lua 原子扣减（RD34/RD42）</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Client-side caching 文档对照 / 常见 Cache-Aside、Write-Through、Write-Behind 模式</text></svg>