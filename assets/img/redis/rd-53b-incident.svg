6666" y="106" width="325.3333333333333" height="70" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="909.3333333333333" y="130" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">③ 复盘</text><text x="909.3333333333333" y="152" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">改配置 + 补监控 + 值班手册</text><rect x="48" y="192" width="195.2" height="118" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="60" y="214" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="700" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">内存满</text><text x="60" y="238" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">OOM command not allowed</text><text x="60" y="262" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">先：扩内存或调淘汰策略</text><text x="60" y="286" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#f87171" text-anchor="start" dominant-baseline="middle">忌：不要 FLUSHALL</text><rect x="255.2" y="192" width="195.2" height="118" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="267.2" y="214" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="700" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">主从断</text><text x="267.2" y="238" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">master_link_status:down</text><text x="267.2" y="262" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">先：查网络与主库负载</text><text x="267.2" y="286" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#f87171" text-anchor="start" dominant-baseline="middle">忌：别急着重启从库</text><rect x="462.4" y="192" width="195.2" height="118" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="474.4" y="214" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="700" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">槽异常</text><text x="474.4" y="238" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">CLUSTERDOWN / MOVED 风暴</text><text x="474.4" y="262" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">先：cluster check 定位</text><text x="474.4" y="286" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#f87171" text-anchor="start" dominant-baseline="middle">忌：别手工改 slots</text><rect x="669.5999999999999" y="192" width="195.2" height="118" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="681.5999999999999" y="214" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="700" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">延迟突增</text><text x="681.5999999999999" y="238" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">P99 飙升、LATENCY 有记录</text><text x="681.5999999999999" y="262" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">先：看 SLOWLOG / fsync / fork</text><text x="681.5999999999999" y="286" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#f87171" text-anchor="start" dominant-baseline="middle">忌：别用 KEYS 排查</text><rect x="876.8" y="192" width="195.2" height="118" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="888.8" y="214" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="700" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">连接耗尽</text><text x="888.8" y="238" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">rejected_connections 增长</text><text x="888.8" y="262" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">先：先扩 maxclients 止血</text><text x="888.8" y="286" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="9.8" font-weight="500" fill="#f87171" text-anchor="start" dominant-baseline="middle">忌：别只扩不查泄漏</text><rect x="48" y="322" width="500" height="92" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="64" y="342" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">两个高频误操作</text><text x="64" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">重启从库 → 可能触发全量同步，打满带宽与磁盘</text><text x="64" y="398" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">KEYS * → O(N) 阻塞，给过载实例再补一刀</text><rect x="576" y="322" width="496" height="92" rx="10" fill="rgba(167,139,250,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="592" y="342" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">CLUSTERDOWN 的真实含义</text><text x="592" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">多数主节点判定「某些节点失联」，不是全挂了</text><text x="592" y="398" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">急着重启单个节点会扩大失联范围</text><rect x="48" y="426" width="1024" height="114" rx="10" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.5"/><text x="64" y="446" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">复盘要写成动作，不是结论</text><text x="64" y="474" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">参数：maxmemory 4GB→6GB，policy noeviction→allkeys-lru</text><text x="64" y="502" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">监控：80% 连续 2 次触发即电话；代码：给 20 个无 TTL 的 key 补过期</text><text x="64" y="530" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">值班：谁在什么时间看哪三个指标、按什么顺序处置</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Eviction（OOM 行为）/ Replication / Cluster spec（失联判定）</text></svg>