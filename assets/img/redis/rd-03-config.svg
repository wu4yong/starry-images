<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">redis.conf 全貌，以及 CONFIG SET 的真实边界</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">配置文件是「启动值」，CONFIG 是「运行值」，两者不等价</text><rect x="56" y="150" width="270" height="64" rx="10" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.3"/><text x="72" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">网络与连接</text><text x="72" y="196" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">bind / port / tcp-backlog</text><rect x="350" y="150" width="270" height="64" rx="10" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.3"/><text x="366" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">内存</text><text x="366" y="196" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">maxmemory / maxmemory-policy</text><rect x="56" y="226" width="270" height="64" rx="10" fill="rgba(56,189,248,0.05)" stroke="#fbbf24" stroke-width="1.3"/><text x="72" y="250" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">持久化</text><text x="72" y="272" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">save / appendonly / appendfsync</text><rect x="350" y="226" width="270" height="64" rx="10" fill="rgba(56,189,248,0.05)" stroke="#a78bfa" stroke-width="1.3"/><text x="366" y="250" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">复制与集群</text><text x="366" y="272" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">replicaof / cluster-enabled</text><rect x="56" y="302" width="270" height="64" rx="10" fill="rgba(56,189,248,0.05)" stroke="#f87171" stroke-width="1.3"/><text x="72" y="326" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">安全</text><text x="72" y="348" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">requirepass / ACL / tls-port</text><rect x="350" y="302" width="270" height="64" rx="10" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.3"/><text x="366" y="326" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">客户端与日志</text><text x="366" y="348" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">maxclients / logfile / daemonize</text><text x="56" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">这六组是运维评审必看的；其余参数查官方 redis.conf 自带的注释（官方自称 self-documenting）</text><rect x="660" y="150" width="564" height="74" rx="12" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.6"/><text x="942" y="175" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">CONFIG GET &lt;param&gt;</text><text x="942" y="202" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">读运行值（通配符 * 可批量）</text><line x1="942" y1="224" x2="942" y2="254" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="660" y="254" width="564" height="74" rx="12" fill="rgba(94,234,212,0.07)" stroke="#5eead4" stroke-width="1.6"/><text x="942" y="279" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">CONFIG SET &lt;param&gt; &lt;value&gt;</text><text x="942" y="306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">改内存中的运行值 · 立即生效</text><line x1="942" y1="328" x2="942" y2="358" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="660" y="358" width="564" height="74" rx="12" fill="rgba(251,191,36,0.07)" stroke="#fbbf24" stroke-width="1.6"/><text x="942" y="383" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">CONFIG REWRITE</text><text x="942" y="410" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">把运行值写回启动时用的 redis.conf</text><text x="56" y="452" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">边界（三条硬规则）：</text><text x="216" y="452" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">① CONFIG REWRITE 只有在「启动时带了配置文件」才可用，否则直接报错，且服务必须重启才丢失改动</text><text x="216" y="476" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">② 并非所有参数支持运行时修改，官方在 CONFIG SET 页面逐项标注；不支持的会返回错误，只能改文件重启</text><text x="216" y="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">③ appendonly 自 7.0 起可运行时开启（CONFIG SET appendonly yes），此前必须重启</text><rect x="56" y="512" width="1140" height="118" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(56,189,248,0.35)"/><text x="78" y="540" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">实践口径（官方推荐的顺序）</text><text x="78" y="570" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">先 CONFIG SET 验证效果 → 确认后再 CONFIG REWRITE 落盘 → 用 CONFIG GET 复核 → 最后 git 记录 redis.conf 的变更</text><text x="78" y="596" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">绝不手工改文件后不重启就以为生效；也不在没版本管理的情况下 REWRITE（它会重排文件、丢注释）</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 Documentation · Configuration / CONFIG GET｜SET｜REWRITE</text></svg>