e cx="927.0" cy="520.0" r="1.18" fill="#cfe4ff" opacity="0.49"/><circle cx="1222.0" cy="255.6" r="0.62" fill="#cfe4ff" opacity="0.35"/><circle cx="513.4" cy="163.7" r="1.34" fill="#cfe4ff" opacity="0.37"/><circle cx="728.6" cy="619.9" r="0.84" fill="#cfe4ff" opacity="0.36"/><circle cx="371.7" cy="616.3" r="0.83" fill="#cfe4ff" opacity="0.31"/><circle cx="626.5" cy="264.8" r="1.19" fill="#cfe4ff" opacity="0.55"/><circle cx="591.3" cy="249.3" r="1.10" fill="#cfe4ff" opacity="0.57"/><circle cx="774.1" cy="584.1" r="0.48" fill="#cfe4ff" opacity="0.56"/><circle cx="1188.7" cy="294.1" r="0.60" fill="#cfe4ff" opacity="0.32"/><circle cx="1198.9" cy="668.5" r="1.41" fill="#cfe4ff" opacity="0.50"/><circle cx="679.1" cy="495.6" r="0.93" fill="#cfe4ff" opacity="0.24"/><circle cx="21.3" cy="476.2" r="0.59" fill="#cfe4ff" opacity="0.20"/><circle cx="1142.0" cy="24.6" r="1.13" fill="#cfe4ff" opacity="0.17"/><circle cx="895.5" cy="75.8" r="0.68" fill="#cfe4ff" opacity="0.24"/><circle cx="316.1" cy="228.9" r="0.56" fill="#cfe4ff" opacity="0.20"/><circle cx="96.7" cy="352.6" r="1.25" fill="#cfe4ff" opacity="0.22"/><circle cx="1218.8" cy="519.0" r="1.00" fill="#cfe4ff" opacity="0.45"/><circle cx="956.0" cy="51.9" r="1.04" fill="#cfe4ff" opacity="0.16"/><circle cx="254.3" cy="416.0" r="0.64" fill="#cfe4ff" opacity="0.39"/><circle cx="858.1" cy="491.2" r="1.16" fill="#cfe4ff" opacity="0.23"/><circle cx="266.4" cy="570.2" r="1.24" fill="#cfe4ff" opacity="0.53"/><circle cx="1232.0" cy="686.8" r="0.65" fill="#cfe4ff" opacity="0.36"/><circle cx="1248.2" cy="370.6" r="1.07" fill="#cfe4ff" opacity="0.47"/><circle cx="202.4" cy="208.1" r="0.95" fill="#cfe4ff" opacity="0.23"/><circle cx="962.9" cy="103.0" r="1.39" fill="#cfe4ff" opacity="0.63"/><circle cx="943.0" cy="53.0" r="1.35" fill="#cfe4ff" opacity="0.18"/><circle cx="1272.2" cy="643.9" r="1.00" fill="#cfe4ff" opacity="0.36"/><circle cx="454.2" cy="454.0" r="0.70" fill="#cfe4ff" opacity="0.51"/><circle cx="1209.1" cy="119.8" r="1.25" fill