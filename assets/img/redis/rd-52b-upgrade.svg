<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">版本升级：先读变更，再升从库</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">升级的难点不是新功能，而是旧配置不再合法</text><rect x="48" y="108" width="247" height="74" rx="9" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.4"/><text x="60" y="128" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">① 读 Release Notes</text><text x="60" y="146" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">逐条核对 breaking change</text><text x="60" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">尤其「默认值变更」</text><line x1="295" y1="145" x2="305" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="307" y="108" width="247" height="74" rx="9" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.4"/><text x="319" y="128" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">② 从库先升</text><text x="319" y="146" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">主库保持旧版本</text><text x="319" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">风险限制在读请求</text><line x1="554" y1="145" x2="564" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="566" y="108" width="247" height="74" rx="9" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.4"/><text x="578" y="128" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">③ 主从切换</text><text x="578" y="146" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">新库升主、原主降级</text><text x="578" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">客户端切流量</text><line x1="813" y1="145" x2="823" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="825" y="108" width="247" height="74" rx="9" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.4"/><text x="837" y="128" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">④ 保留回滚</text><text x="837" y="146" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">旧二进制 + 旧配置</text><text x="837" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">外加数据回退路径</text><rect x="48" y="200" width="496" height="146" rx="12" fill="rgba(167,139,250,0.07)" stroke="#a78bfa" stroke-width="1.6"/><text x="64" y="226" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">6 → 7 的三处实质变化</text><text x="64" y="256" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">AOF 改为 appendonlydir（base + incr + history）</text><text x="64" y="284" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">Functions 随数据集持久化，FCALL 调用</text><text x="64" y="312" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">Sharded Pub/Sub：SSUBSCRIBE / SPUBLISH</text><rect x="576" y="200" width="496" height="146" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="592" y="226" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">回滚 ≠ 换回二进制</text><text x="592" y="256" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">7.x 的 appendonlydir，6.x 不认识</text><text x="592" y="284" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">新版本 RDB 版本号更高，旧版本拒绝加载</text><text x="592" y="312" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">新配置项会让旧版本直接启动失败</text><text x="48" y="362" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">升级前后必查的四项</text><rect x="48" y="372" width="245.5" height="80" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="60" y="394" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">AOF 路径</text><text x="60" y="418" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">备份/监控脚本按单文件写的会失效</text><rect x="307.5" y="372" width="245.5" height="80" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="319.5" y="394" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">编码返回值</text><text x="319.5" y="418" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">ziplist → listpack，容量脚本误判</text><rect x="567" y="372" width="245.5" height="80" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="579" y="394" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">客户端库</text><text x="579" y="418" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">老客户端不认新命令与新错误码</text><rect x="826.5" y="372" width="245.5" height="80" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="838.5" y="394" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">集群工具</text><text x="838.5" y="418" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">redis-cli --cluster 参数有变化</text><rect x="48" y="462" width="500" height="88" rx="10" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.5"/><text x="64" y="482" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">7 → 8 先法务，再技术</text><text x="64" y="510" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">8.0 起 AGPLv3 / SSPL 双许可，此前是 BSD</text><text x="64" y="538" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">打包进商业产品或对外提供服务，都必须评估</text><rect x="576" y="462" width="496" height="88" rx="10" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.5"/><text x="592" y="482" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">预发演练是唯一可靠验证</text><text x="592" y="510" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">用真实数据量验证 RDB/AOF 加载与槽状态</text><text x="592" y="538" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">升级后复查监控脚本，静默失效最危险</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Persistence（7.0 AOF 多文件）/ Functions / Pub-Sub / OBJECT ENCODING</text></svg>