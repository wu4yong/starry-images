<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">六件套配置、五个观测点与四类故障</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">排查顺序固定下来，故障才好分类</text><rect x="48" y="112" width="190.4" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="143.2" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">role</text><text x="143.2" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">本该主库却是 slave</text><line x1="238.4" y1="151" x2="254.39999999999998" y2="151" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="256.4" y="112" width="190.4" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="351.59999999999997" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">link_status</text><text x="351.59999999999997" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">down = 复制中断</text><line x1="446.79999999999995" y1="151" x2="462.79999999999995" y2="151" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="464.8" y="112" width="190.4" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="560" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">offset 差</text><text x="560" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">字节级延迟</text><line x1="655.2" y1="151" x2="671.2" y2="151" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="673.2" y="112" width="190.4" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="768.4000000000001" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">sync_full 增速</text><text x="768.4000000000001" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">涨得快 = 反复全量</text><line x1="863.6" y1="151" x2="879.6" y2="151" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="881.6" y="112" width="190.4" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="976.8000000000001" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">日志</text><text x="976.8000000000001" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">NOAUTH / 截断 / 超时</text><rect x="48" y="214" width="500" height="150" rx="12" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="64" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">配置里最常漏的三项</text><text x="64" y="270" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">masterauth：漏了就永远 NOAUTH / down</text><text x="64" y="300" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">repl-backlog-size：默认 1 MB，写入快必调</text><text x="64" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">min-replicas-to-write：默认 0，等于没保护</text><rect x="576" y="214" width="496" height="174" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="592" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">四类典型故障</text><text x="592" y="270" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">① 全量风暴：多个从库同时重连</text><text x="592" y="298" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">② 反复全量：backlog 太小或网络抖</text><text x="592" y="326" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">③ 从库写失败：READONLY 报错</text><text x="592" y="354" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">④ 数据漂移：淘汰策略 / 只读不一致</text><rect x="48" y="410" width="1024" height="116" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="64" y="436" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">两条运维边界</text><text x="64" y="466" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">lag 字段基于心跳、单位是秒，看延迟请用 offset 差；sync_full 是累计值，重启清零，要看单位时间增量</text><text x="64" y="492" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">min-replicas-to-write 生效后从库全掉会拒绝写：上线前必须有降级预案，否则「保护」变「全站不可写」</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Replication / INFO replication / redis.conf</text></svg>