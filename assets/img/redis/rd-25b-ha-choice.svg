ant-baseline="middle">数据装得进一台机器吗？（按峰值 + 副本 + 碎片 + fork 算）</text><text x="180" y="347" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">装得下 → 不必讨论 Cluster</text><rect x="48" y="358" width="1024" height="58" rx="10" fill="rgba(251,191,36,0.05)" stroke="#fbbf24" stroke-width="1.4"/><rect x="48" y="358" width="110" height="58" rx="10" fill="#fbbf24" opacity="0.10"/><text x="64" y="391" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">问题二</text><text x="180" y="382" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">写入是否超过单主能力？（QPS / 带宽打满）</text><text x="180" y="405" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">这才 Cluster 的唯一硬理由，不是「数据大」</text><rect x="48" y="416" width="1024" height="58" rx="10" fill="rgba(94,234,212,0.05)" stroke="#5eead4" stroke-width="1.4"/><rect x="48" y="416" width="110" height="58" rx="10" fill="#5eead4" opacity="0.10"/><text x="64" y="449" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">问题三</text><text x="180" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">能接受分钟级人工切换吗？</text><text x="180" y="463" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">不能 → 至少 Sentinel；连部分槽不可用都不行 → Cluster</text><rect x="48" y="474" width="1024" height="58" rx="10" fill="rgba(248,113,113,0.05)" stroke="#f87171" stroke-width="1.4"/><rect x="48" y="474" width="110" height="58" rx="10" fill="#f87171" opacity="0.10"/><text x="64" y="507" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">隐性成本</text><text x="180" y="498" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">写进方案再评审：多一套进程、客户端要支持协议、跨槽要改代码</text><text x="180" y="521" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">Sentinel 与 Cluster 是「要不要分片」，不是升级</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Sentinel / Scaling（两者定位不同，不是升级关系）</text></svg>