<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">Sentinel：监控、判定、选举、通知</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">它不是代理，而是一个「独立进程集群」</text><text x="56" y="142" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">① 拓扑：客户端问 Sentinel，Sentinel 管主从</text><rect x="56" y="164" width="300" height="84" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="206" y="194" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">客户端</text><text x="206" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">启动时向 Sentinel 要主库地址</text><line x1="360" y1="206" x2="400" y2="206" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="404" y="164" width="340" height="84" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="574" y="194" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">Sentinel 集群（3 个起）</text><text x="574" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">互相监控，多数决</text><line x1="748" y1="206" x2="788" y2="206" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="792" y="164" width="404" height="84" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="994" y="194" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">主库 + N 个从库</text><text x="994" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">被监控、被投票、被切换</text><text x="56" y="282" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">② 一次真故障的四个阶段</text><rect x="56" y="304" width="268.5" height="92" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="190.25" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">sdown 主观下线</text><text x="190.25" y="362" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">单个 Sentinel 超时未收到 PING</text><line x1="324.5" y1="350" x2="344.5" y2="350" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="346.5" y="304" width="268.5" height="92" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="480.75" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">odown 客观下线</text><text x="480.75" y="362" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">达到 quorum 个 Sentinel 认同</text><line x1="615" y1="350" x2="635" y2="350" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="637" y="304" width="268.5" height="92" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="771.25" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">选领导者</text><text x="771.25" y="362" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">多数票选出执行切换的 Sentinel</text><line x1="905.5" y1="350" x2="925.5" y2="350" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="927.5" y="304" width="268.5" height="92" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="1061.75" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">选新主并通知</text><text x="1061.75" y="362" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">按优先级/offset 选，发 switch-master</text><rect x="56" y="420" width="560" height="200" rx="12" fill="rgba(94,234,212,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="74" y="446" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">四个关键参数（官方语义）</text><text x="74" y="480" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">sentinel monitor mymaster &lt;ip&gt; &lt;port&gt; &lt;quorum&gt;</text><text x="74" y="506" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">  quorum 是「判定客观下线」所需票数，不等于选举多数</text><text x="74" y="532" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">down-after-milliseconds 30000：多久无响应算主观下线</text><text x="74" y="558" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">failover-timeout：切换与重试的总时限窗</text><text x="74" y="584" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">parallel-syncs：切换后同时向新主同步的从库数量</text><rect x="660" y="420" width="536" height="200" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="678" y="446" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">三条容易忽略的约束</text><text x="678" y="480" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">Sentinel 至少要 3 个且为奇数，否则「过半」形同虚设</text><text x="678" y="506" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">它不做数据转发：仍是客户端直连主库，Sentinel 只负责告诉你是谁</text><text x="678" y="532" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">Sentinel 配置是自动改写的：运行中手动改文件会被覆盖</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 Documentation · Sentinel / sentinel.conf</text></svg>