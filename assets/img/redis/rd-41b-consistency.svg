<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">两种删除顺序，两个不同的不一致窗口</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">先更库再删缓存：窗口小且会自然收敛</text><text x="48" y="118" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">先删缓存、再更库（最糟）</text><rect x="48" y="130" width="245.5" height="66" rx="9" fill="rgba(56,189,248,0.05)" stroke="#f87171" stroke-width="1.4"/><text x="60" y="150" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">T1 写者</text><text x="60" y="170" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">DEL cache</text><line x1="293.5" y1="163" x2="305.5" y2="163" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="307.5" y="130" width="245.5" height="66" rx="9" fill="rgba(56,189,248,0.05)" stroke="#f87171" stroke-width="1.4"/><text x="319.5" y="150" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">T2 读者</text><text x="319.5" y="170" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">GET 未命中</text><text x="319.5" y="186" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">查库得旧值</text><line x1="553" y1="163" x2="565" y2="163" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="567" y="130" width="245.5" height="66" rx="9" fill="rgba(248,113,113,0.10)" stroke="#f87171" stroke-width="1.4"/><text x="579" y="150" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">T3 读者</text><text x="579" y="170" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">SET cache 旧值</text><line x1="812.5" y1="163" x2="824.5" y2="163" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="826.5" y="130" width="245.5" height="66" rx="9" fill="rgba(56,189,248,0.05)" stroke="#f87171" stroke-width="1.4"/><text x="838.5" y="150" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">T4 写者</text><text x="838.5" y="170" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">UPDATE db 新值</text><rect x="48" y="214" width="1024" height="52" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="64" y="234" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">旧值被回填且再没有任何事件纠正它 —— 一直留到 TTL 到期，是「长期不一致」而不只是短暂</text><text x="48" y="292" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">先更库、再删缓存（主流）</text><rect x="48" y="304" width="245.5" height="66" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="60" y="324" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">T1 写者</text><text x="60" y="344" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">UPDATE db 新值</text><line x1="293.5" y1="337" x2="305.5" y2="337" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="307.5" y="304" width="245.5" height="66" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="319.5" y="324" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">T2 读者</text><text x="319.5" y="344" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">未命中则查库</text><text x="319.5" y="360" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">已能读到新值</text><line x1="553" y1="337" x2="565" y2="337" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="567" y="304" width="245.5" height="66" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="579" y="324" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">T3 写者</text><text x="579" y="344" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">DEL cache</text><line x1="812.5" y1="337" x2="824.5" y2="337" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="826.5" y="304" width="245.5" height="66" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="838.5" y="324" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">T4 下一次读</text><text x="838.5" y="344" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">回填新值</text><rect x="48" y="388" width="1024" height="50" rx="10" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.5"/><text x="64" y="408" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">残余风险只剩一种交错：读者在 T1 前查库、在 T3 后回填 —— 概率低、时长短，且 T3 之后自然收敛</text><rect x="48" y="444" width="247" height="100" rx="10" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.4"/><text x="62" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">延迟双删</text><text x="62" y="492" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">更库 → 删缓存 → sleep Δt → 再删一次</text><text x="62" y="526" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">Δt 要大于一次读的最大耗时</text><rect x="307" y="444" width="247" height="100" rx="10" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="321" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">删除重试</text><text x="321" y="492" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">删缓存失败丢进 MQ，异步重试到成功</text><text x="321" y="526" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">要设最大重试次数，别死循环</text><rect x="566" y="444" width="247" height="100" rx="10" fill="rgba(56,189,248,0.05)" stroke="#a78bfa" stroke-width="1.4"/><text x="580" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">订阅 binlog</text><text x="580" y="492" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">由库变更事件驱动删缓存</text><text x="580" y="526" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">覆盖手工 SQL，延迟百毫秒级</text><rect x="825" y="444" width="247" height="100" rx="10" fill="rgba(56,189,248,0.05)" stroke="#f87171" stroke-width="1.4"/><text x="839" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">关键读直读库</text><text x="839" y="492" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">支付结果这类查询不进缓存</text><text x="839" y="526" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">这是取舍，不是优化</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · 缓存一致性工程实践（延迟双删 / 删除重试 / binlog 订阅）</text></svg>