<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">GEO、签到与 UV：三个结构对着三个需求</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">结构选错，比参数调错更贵</text><rect x="48" y="106" width="330.6666666666667" height="164" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.6"/><text x="64" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.6" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">GEO</text><text x="64" y="166" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">经度在前，纬度在后</text><text x="64" y="196" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">GEOSEARCH 按半径/矩形查</text><text x="64" y="226" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">底层是 ZSet + 52 位 geohash</text><rect x="394.6666666666667" y="106" width="330.6666666666667" height="164" rx="12" fill="rgba(56,189,248,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="410.6666666666667" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.6" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">Bitmap</text><text x="410.6666666666667" y="166" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">一天一个 key，offset = uid</text><text x="410.6666666666667" y="196" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">BITCOUNT 数当日人数</text><text x="410.6666666666667" y="226" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">内存 = 最大 offset / 8</text><rect x="741.3333333333334" y="106" width="330.6666666666667" height="164" rx="12" fill="rgba(56,189,248,0.06)" stroke="#a78bfa" stroke-width="1.6"/><text x="757.3333333333334" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.6" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">HyperLogLog</text><text x="757.3333333333334" y="166" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">PFADD / PFCOUNT 只给数量</text><text x="757.3333333333334" y="196" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">12KB 固定内存，误差 0.81%</text><text x="757.3333333333334" y="226" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">PFMERGE 合并也只是近似</text><rect x="48" y="284" width="1024" height="84" rx="10" fill="rgba(94,234,212,0.06)" stroke="#5eead4" stroke-width="1.5"/><text x="64" y="304" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">按需求选，不按习惯选</text><text x="64" y="332" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">要按距离排序 → GEO；要精确名单 → Bitmap / Set；只要数量 → HyperLogLog</text><rect x="48" y="380" width="330.6666666666667" height="96" rx="10" fill="rgba(248,113,113,0.05)" stroke="rgba(248,113,113,0.55)" stroke-width="1.3"/><text x="62" y="402" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">经纬度写反</text><text x="62" y="430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.6" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">不报错，结果跑到地球另一端</text><rect x="394.6666666666667" y="380" width="330.6666666666667" height="96" rx="10" fill="rgba(248,113,113,0.05)" stroke="rgba(248,113,113,0.55)" stroke-width="1.3"/><text x="408.6666666666667" y="402" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">10 亿 offset</text><text x="408.6666666666667" y="430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.6" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">位图约 125 MB，稀疏且巨大</text><rect x="741.3333333333334" y="380" width="330.6666666666667" height="96" rx="10" fill="rgba(248,113,113,0.05)" stroke="rgba(248,113,113,0.55)" stroke-width="1.3"/><text x="755.3333333333334" y="402" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.4" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">HLL 不能列成员</text><text x="755.3333333333334" y="430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.6" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">0.81% 在百万级 ≈ 偏差八千</text><rect x="48" y="488" width="1024" height="68" rx="10" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="1.5"/><text x="64" y="508" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">清理策略一起设计</text><text x="64" y="536" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">日 key 一律 EXPIRE 30 天；周/月用 PFMERGE 汇总后删明细；统计用 SCAN，不用 KEYS</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · GEOADD / GEOSEARCH / SETBIT / PFADD（0.81% 误差与 12KB 上限）</text></svg>