<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">16384 个槽与 MOVED / ASK</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">槽是第一等公民，key 只是被算出来的</text><rect x="48" y="112" width="322" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="209" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">7000 · 槽 0-5460</text><text x="209" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">主节点 A</text><rect x="393" y="112" width="322" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="554" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">7001 · 5461-10922</text><text x="554" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">主节点 B</text><rect x="738" y="112" width="322" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="899" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">7002 · 10923-16383</text><text x="899" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">主节点 C</text><rect x="48" y="206" width="1024" height="46" rx="23" fill="#a78bfa" opacity="0.10" stroke="#a78bfa" stroke-width="1.4"/><text x="560" y="229" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">slot = CRC16(key) mod 16384   →   查本地槽表   →   直连负责该槽的节点</text><rect x="48" y="262" width="1024" height="70" rx="10" fill="rgba(251,191,36,0.05)" stroke="#fbbf24" stroke-width="1.4"/><rect x="48" y="262" width="150" height="70" rx="10" fill="#fbbf24" opacity="0.10"/><text x="64" y="295" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">MOVED</text><text x="220" y="286" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">槽已永久迁走：必须更新槽表，再重试到新节点</text><text x="220" y="309" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">当成 ASK 不更新 → 一直重定向，性能崩塌</text><rect x="48" y="338" width="1024" height="70" rx="10" fill="rgba(94,234,212,0.05)" stroke="#5eead4" stroke-width="1.4"/><rect x="48" y="338" width="150" height="70" rx="10" fill="#5eead4" opacity="0.10"/><text x="64" y="371" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">ASK</text><text x="220" y="362" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">槽正在迁移：只本次转发到目标，槽表不动</text><text x="220" y="385" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">当成 MOVED 写进槽表 → 槽表被写坏，重定向风暴</text><rect x="48" y="414" width="500" height="118" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="64" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">hash tag 的边界</text><text x="64" y="470" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">CRC16 只算 {} 内：{user:1000}:name / :age 同槽</text><text x="64" y="498" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">空 {} 等于没有 tag；不能嵌套；tag 太宽会全落一台</text><rect x="576" y="414" width="496" height="118" rx="12" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="1.6"/><text x="592" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">三张表定位一切</text><text x="592" y="470" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">CLUSTER SLOTS 查槽归属 · CLUSTER KEYSLOT 算单 key</text><text x="592" y="498" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">CLUSTER NODES 看拓扑；排障先算槽再查归属</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Cluster specification / Scaling（MOVED 与 ASK 语义）</text></svg>