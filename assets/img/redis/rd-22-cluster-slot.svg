<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">Cluster：16384 个 hash slot 与请求路由</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">key 落在哪个槽、哪个节点，全靠 CRC16 算</text><text x="56" y="142" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">① 定位公式</text><rect x="56" y="162" width="1140" height="92" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.5"/><text x="76" y="192" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="14" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">slot = CRC16(key) mod 16384</text><text x="76" y="224" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">hash tag：{user}:1 与 {user}:2 只取大括号内的 user 参与计算，从而保证同槽</text><text x="56" y="276" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">② 16384 个槽被分给 N 个主节点，每个主节点负责一段连续槽</text><rect x="56" y="296" width="360" height="70" rx="10" fill="rgba(94,234,212,0.08)" stroke="#5eead4" stroke-width="1.3"/><text x="236" y="320" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">master-1</text><text x="236" y="344" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">slots 0–5460</text><rect x="440" y="296" width="360" height="70" rx="10" fill="rgba(94,234,212,0.08)" stroke="#5eead4" stroke-width="1.3"/><text x="620" y="320" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">master-2</text><text x="620" y="344" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">slots 5461–10922</text><rect x="824" y="296" width="360" height="70" rx="10" fill="rgba(94,234,212,0.08)" stroke="#5eead4" stroke-width="1.3"/><text x="1004" y="320" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">master-3</text><text x="1004" y="344" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">slots 10923–16383</text><rect x="56" y="392" width="560" height="200" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="74" y="418" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">两种重定向：MOVED 与 ASK</text><text x="74" y="452" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">MOVED：这个 key 永久在别的节点 → 客户端应更新槽位表</text><text x="74" y="478" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">ASK：迁移进行中，这一次去那个节点问，不改槽位表</text><text x="74" y="504" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">客户端必须实现两者，只处理 MOVED 会在扩容期报错</text><text x="74" y="530" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">MOVED 是「你走错了」，ASK 是「这次先到那边」</text><rect x="660" y="392" width="536" height="200" rx="12" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="1.6"/><text x="678" y="418" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">通信与端口</text><text x="678" y="452" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">客户端端口：如 6379</text><text x="678" y="478" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">cluster bus 端口：客户端端口 + 10000 = 16379</text><text x="678" y="504" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">两个端口都要在防火墙放通，否则握手失败</text><text x="678" y="530" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">节点间用 gossip 交换槽位与状态</text><text x="56" y="620" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">容量提示：16384 是固定常量（2^14），槽数不随节点数变化；节点多了会把槽切得很碎，迁移成本随之上升。</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 Documentation · Cluster specification / hash tags / MOVED-ASK</text></svg>