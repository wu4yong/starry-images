cle cx="542.1" cy="313.1" r="1.33" fill="#cfe4ff" opacity="0.57"/><circle cx="168.8" cy="552.6" r="0.85" fill="#cfe4ff" opacity="0.22"/><circle cx="267.7" cy="326.0" r="0.72" fill="#cfe4ff" opacity="0.42"/><circle cx="43.3" cy="32.1" r="1.21" fill="#cfe4ff" opacity="0.33"/><circle cx="483.1" cy="266.1" r="1.32" fill="#cfe4ff" opacity="0.53"/>
<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">ACL：一条规则的四段结构</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">没有 ~ 与 + 的新用户，连一个 key 都碰不到</text><rect x="48" y="104" width="1024" height="96" rx="10" fill="rgba(56,189,248,0.06)" stroke="rgba(148,163,184,0.35)" stroke-width="1.2"/><text x="64" y="136" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="14" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">ACL SETUSER app_ro on &gt;pwd123 ~app:* ~cache:* +@read -@write</text><circle cx="68" cy="176" r="3.4" fill="#38bdf8"/><text x="78" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.4" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">用户 app_ro</text><circle cx="304" cy="176" r="3.4" fill="#fbbf24"/><text x="314" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.4" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">密码 + 启停 on &gt;pwd123</text><circle cx="578" cy="176" r="3.4" fill="#5eead4"/><text x="588" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.4" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">key 模式 ~app:* ~cache:*</text><circle cx="842" cy="176" r="3.4" fill="#a78bfa"/><text x="852" y="176" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.4" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">命令权限 +@read -@write</text><rect x="48" y="216" width="330.6666666666667" height="152" rx="12" fill="rgba(56,189,248,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="64" y="242" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">新用户是零权限</text><text x="64" y="274" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">没有 ~ 的 key 访问不了</text><text x="64" y="302" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">没有 + 的命令执行不了</text><text x="64" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">报错很含糊，先去 ACL LOG</text><rect x="394.6666666666667" y="216" width="330.6666666666667" height="152" rx="12" fill="rgba(56,189,248,0.06)" stroke="#fbbf24" stroke-width="1.5"/><text x="410.6666666666667" y="242" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">权限是覆盖不是交集</text><text x="410.6666666666667" y="274" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">后写的覆盖先写的</text><text x="410.6666666666667" y="302" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">最小权限从 -@all 起</text><text x="410.6666666666667" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">先全开再收紧容易漏项</text><rect x="741.3333333333334" y="216" width="330.6666666666667" height="152" rx="12" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.5"/><text x="757.3333333333334" y="242" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">key 模式 = 可见性</text><text x="757.3333333333334" y="274" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">~app:* 也限住 KEYS / SCAN</text><text x="757.3333333333334" y="302" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">MGET 含越权 key 整体报错</text><text x="757.3333333333334" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">~* 等于没做隔离</text><rect x="48" y="384" width="500" height="84" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="64" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">别再用 rename-command</text><text x="64" y="432" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">官方建议用 ACL 收缩危险命令</text><text x="64" y="460" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">改名会连集群工具、监控脚本一起废掉</text><rect x="576" y="384" width="496" height="84" rx="10" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.5"/><text x="592" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">改了规则记得落盘</text><text x="592" y="432" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">aclfile 模式下 ACL SETUSER 不写 ACL SAVE</text><text x="592" y="460" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">重启就恢复成旧规则，且很难察觉</text><rect x="48" y="480" width="1024" height="74" rx="10" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.5"/><text x="64" y="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">复制与哨兵也要 ACL：主从握手、Sentinel 探测是独立连接</text><text x="64" y="528" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">漏配 +psync 等权限，表现是主从一直同步失败、Sentinel 报不出状态；用 ACL GETUSER 与 ACL LOG 核对</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · ACL 文档（%R~ / %W~ 为 7.0 引入）/ ACL SETUSER·GETUSER·LOG</text></svg>