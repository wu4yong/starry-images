<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">穿透、击穿、雪崩：三种病因与解法边界</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">空值缓存治不了雪崩，TTL 抖动也治不了宕机</text><rect x="48" y="108" width="330.6666666666667" height="196" rx="12" fill="rgba(56,189,248,0.05)" stroke="#f87171" stroke-width="1.5"/><text x="64" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">穿透</text><text x="64" y="160" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">请求的 key 库里也不存在</text><text x="64" y="184" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">缓存无法缓存「不存在」</text><text x="64" y="208" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">爬虫遍历 ID、随机构造</text><line x1="64" y1="226" x2="362.6666666666667" y2="226" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="64" y="250" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#f87171" text-anchor="start" dominant-baseline="middle">· 空值缓存（短 TTL）</text><text x="64" y="274" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#f87171" text-anchor="start" dominant-baseline="middle">· 布隆过滤器前置拦截</text><rect x="394.6666666666667" y="108" width="330.6666666666667" height="196" rx="12" fill="rgba(56,189,248,0.05)" stroke="#fbbf24" stroke-width="1.5"/><text x="410.6666666666667" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">击穿</text><text x="410.6666666666667" y="160" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">单个热点 key 到期或删掉</text><text x="410.6666666666667" y="184" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">N 个并发同时回源查库</text><text x="410.6666666666667" y="208" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">只需 1 个去重建</text><line x1="410.6666666666667" y1="226" x2="709.3333333333334" y2="226" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="410.6666666666667" y="250" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">· 互斥重建 SET NX PX</text><text x="410.6666666666667" y="274" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">· 逻辑过期 + 异步刷新</text><rect x="741.3333333333334" y="108" width="330.6666666666667" height="196" rx="12" fill="rgba(56,189,248,0.05)" stroke="#a78bfa" stroke-width="1.5"/><text x="757.3333333333334" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">雪崩</text><text x="757.3333333333334" y="160" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">一批 key 同 TTL 同时过期</text><text x="757.3333333333334" y="184" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">或 Redis 整体宕机</text><text x="757.3333333333334" y="208" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">流量全压到数据库</text><line x1="757.3333333333334" y1="226" x2="1056" y2="226" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="757.3333333333334" y="250" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">· TTL 加随机抖动</text><text x="757.3333333333334" y="274" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">· 多级缓存 + 限流熔断</text><rect x="48" y="312" width="242.5" height="68" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="169.25" y="336" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">GET 未命中</text><text x="169.25" y="358" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">热点 key 刚过期</text><line x1="290.5" y1="346" x2="306.5" y2="346" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="308.5" y="312" width="242.5" height="68" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="429.75" y="336" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">SET lock NX PX</text><text x="429.75" y="358" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">锁 key 与被缓存 key 分开</text><line x1="551" y1="346" x2="567" y2="346" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="569" y="312" width="242.5" height="68" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="690.25" y="336" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">再查一次缓存</text><text x="690.25" y="358" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">抢锁期间可能已被回填</text><line x1="811.5" y1="346" x2="827.5" y2="346" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="829.5" y="312" width="242.5" height="68" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="950.75" y="336" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">查库 → 回填 → 释放</text><text x="950.75" y="358" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">其余请求等待或读旧值</text><rect x="48" y="384" width="500" height="90" rx="10" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.5"/><text x="64" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">少了「二次查缓存」会怎样</text><text x="64" y="430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">变成串行回源：每个等到锁的请求都查一次库</text><text x="64" y="456" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">热点 key 下延迟被放大 N 倍</text><rect x="576" y="384" width="496" height="90" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="592" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">容量性雪崩改不了代码</text><text x="592" y="430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">只能靠多级缓存 + 限流熔断 + 库连接池保护</text><text x="592" y="456" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">TTL 抖动对它完全无效</text><rect x="48" y="480" width="1024" height="74" rx="10" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.5"/><text x="64" y="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">30 秒兜底的三个动作</text><text x="64" y="528" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">① 读走本地 L1 或返回降级值　② 入口按 key 维度限流　③ 库侧连接池排队上限 + 熔断，宁快速失败不拖垮库</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · SET NX PX 语义 / 常见缓存三大问题与解法边界</text></svg>