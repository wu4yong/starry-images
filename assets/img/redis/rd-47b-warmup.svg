3334" y="254" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">关掉非核心功能</text><text x="757.3333333333334" y="280" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">大范围关停，代价最高</text><text x="48" y="318" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">演练要制造故障，不是压测接口 QPS</text><rect x="48" y="334" width="245.5" height="88" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(94,234,212,0.55)" stroke-width="1.3"/><text x="60" y="354" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">停掉 Redis</text><text x="60" y="378" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">业务只变慢？</text><text x="60" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">错误率、P99、库 QPS</text><rect x="307.5" y="334" width="245.5" height="88" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(94,234,212,0.55)" stroke-width="1.3"/><text x="319.5" y="354" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">删光缓存</text><text x="319.5" y="378" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="5