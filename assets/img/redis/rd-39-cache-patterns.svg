<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">四种缓存模式：读穿、旁路、写穿、写回</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">都是「先看缓存」，差别在谁负责加载与何时写回</text><rect x="56" y="148" width="560" height="190" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.6"/><text x="74" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">Cache-Aside（旁路缓存）</text><text x="74" y="208" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">读：查缓存 → 未命中查库 → 回填缓存</text><text x="74" y="234" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写：更新库 → 删除缓存（不是更新缓存）</text><text x="74" y="260" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">最常见、最容易实现，缓存故障不影响主流程</text><text x="74" y="286" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">缺点：首次访问必然穿透到库</text><rect x="660" y="148" width="536" height="190" rx="12" fill="rgba(94,234,212,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="678" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">Read-Through（读穿透）</text><text x="678" y="208" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">缓存层自己负责「未命中就查库并回填」</text><text x="678" y="234" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">业务只与缓存交互，代码更简单</text><text x="678" y="260" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">需要缓存组件支持 loader 或代理层实现</text><text x="678" y="286" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">缺点：首次读延迟高，且缓存层要能访问库</text><rect x="56" y="354" width="560" height="190" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="74" y="380" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">Write-Through（写穿）</text><text x="74" y="414" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写：同时写缓存与库，保持两者一致</text><text x="74" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写延迟变高（两次写），但读始终是热的</text><text x="74" y="466" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">适合「写少读多、要求读最新」的场景</text><text x="74" y="492" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">缺点：写路径上缓存故障会放大成写失败</text><rect x="660" y="354" width="536" height="190" rx="12" fill="rgba(167,139,250,0.07)" stroke="#a78bfa" stroke-width="1.6"/><text x="678" y="380" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">Write-Behind（写回）</text><text x="678" y="414" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写：只写缓存，异步批量刷库</text><text x="678" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写吞吐最高，适合计数、点击流</text><text x="678" y="466" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">缺点：缓存宕机会丢一批未落库的写</text><text x="678" y="492" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">需要能接受「最终一致 + 可能丢数据」</text><rect x="56" y="550" width="1140" height="98" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="74" y="576" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">选型的两个硬约束</text><text x="74" y="610" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">① 能不能接受「缓存里是旧值」决定选旁路还是写穿；能不能接受「丢写」决定要不要写回。② 任何模式都必须先想清楚「缓存整体不可用时」业务怎么活</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Client-side caching / 缓存模式为通用工程约定，非 Redis 特有规范</text></svg>