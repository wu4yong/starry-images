" cy="122.9" r="0.68" fill="#cfe4ff" opacity="0.49"/><circle cx="233.1" cy="416.9" r="1.16" fill="#cfe4ff" opacity="0.33"/><circle cx="710.6" cy="90.7" r="1.30" fill="#cfe4ff" opacity="0.57"/><circle cx="451.7" cy="65.0" r="0.86" fill="#cfe4ff" opacity="0.16"/><circle cx="760.8" cy="12.9" r="0.67" fill="#cfe4ff" opacity="0.12"/>
<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">事务四阶段与两种失败的后果</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">入队错误整批作废，运行时错误部分生效</text><rect x="48" y="108" width="242.5" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="169.25" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">MULTI</text><text x="169.25" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">进入事务状态，返回 OK</text><line x1="290.5" y1="146" x2="306.5" y2="146" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="308.5" y="108" width="242.5" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="429.75" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">命令 1..N</text><text x="429.75" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">只入队，返回 QUEUED</text><line x1="551" y1="146" x2="567" y2="146" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="569" y="108" width="242.5" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="690.25" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">EXEC</text><text x="690.25" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">一次性按序执行</text><line x1="811.5" y1="146" x2="827.5" y2="146" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="829.5" y="108" width="242.5" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="950.75" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">结果数组</text><text x="950.75" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">每条一个回复，无回滚</text><rect x="48" y="210" width="496" height="150" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="64" y="236" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">入队错误 → EXECABORT</text><text x="64" y="266" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">时机：语法错误、命令不存在</text><text x="64" y="296" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">后果：整批不执行，代价很小</text><text x="64" y="326" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">处理：客户端解析错误后重试即可</text><rect x="576" y="210" width="496" height="150" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="592" y="236" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">运行时错误 → 部分生效</text><text x="592" y="266" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">时机：WRONGTYPE、INCR 非数字</text><text x="592" y="296" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">后果：该条报错，前后写操作都已生效</text><text x="592" y="326" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">处理：必须业务侧补偿，Redis 不撤销</text><rect x="48" y="380" width="1024" height="66" rx="10" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.5"/><text x="64" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">WATCH 乐观锁：不阻塞、不加锁，只记录「key 的版本」</text><text x="64" y="426" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">EXEC 时发现被改过 → 返回 nil，整批不执行；被写成本身（哪怕写成同样的值）也算失效</text><rect x="48" y="458" width="1024" height="66" rx="10" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="1.5"/><text x="64" y="478" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">为什么不算「隔离级别」：单线程执行期间确实没有命令插入，效果类似串行化</text><text x="64" y="504" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">但 MULTI 里读到的值不受保护，别人随时能改；防「读后写被覆盖」只能靠 WATCH 或 Lua</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Transactions 文档（EXECABORT / 运行时错误不回滚 / WATCH 语义）</text></svg>