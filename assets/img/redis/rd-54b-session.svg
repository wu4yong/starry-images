<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">会话存储：一个 HASH 加一个 TTL</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">sid 不可猜、续期不写放大、撤销要能立刻生效</text><rect x="48" y="108" width="496" height="174" rx="12" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.5"/><text x="64" y="128" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">会话对象</text><text x="72" y="152" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12.4" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">session:{sid}  →  HASH</text><text x="72" y="174" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12.4" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">  uid      1001</text><text x="72" y="196" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12.4" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">  role     admin</text><text x="72" y="218" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12.4" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">  login_at 1700000000</text><text x="72" y="240" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12.4" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">  ip       10.0.1.20</text><text x="72" y="262" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12.4" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle"></text><text x="72" y="264" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11.6" font-weight="500" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">EXPIRE session:{sid} 1800   # 30 分钟无操作失效</text><rect x="576" y="108" width="496" height="174" rx="12" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="592" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">三个设计要点</text><text x="592" y="164" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">sid 32 字节以上随机串，不用自增 ID 或手机号</text><text x="592" y="192" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">字段少而小，比整块 JSON 省内存、便于局部更新</text><text x="592" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">TTL 是业务语义（如 30 分钟无操作），不是随手数字</text><text x="592" y="248" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">存 role 而非只存 uid，避免每请求都查库</text><text x="48" y="322" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">每次请求的顺序</text><rect x="48" y="332" width="244" height="68" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="170" y="356" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">HGETALL sid</text><text x="170" y="378" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">不存在 → 跳登录</text><line x1="292" y1="366" x2="306" y2="366" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="308" y="332" width="244" height="68" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="430" y="356" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">TTL 还剩多少</text><text x="430" y="378" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">只读一次，不做写</text><line x1="552" y1="366" x2="566" y2="366" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="568" y="332" width="244" height="68" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="690" y="356" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">小于 1/3 才续期</text><text x="690" y="378" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">EXPIRE 1800 重置</text><line x1="812" y1="366" x2="826" y2="366" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="828" y="332" width="244" height="68" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="950" y="356" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">局部更新</text><text x="950" y="378" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">HSET 改 role 等字段</text><text x="48" y="426" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">Redis 故障时的三种降级（必须提前定）</text><rect x="48" y="436" width="330.6666666666667" height="92" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="62" y="458" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">全部跳登录</text><text x="62" y="482" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">立刻重新认证</text><text x="62" y="506" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#f87171" text-anchor="start" dominant-baseline="middle">代价：体验断崖，可能压垮登录接口</text><rect x="394.6666666666667" y="436" width="330.6666666666667" height="92" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="408.6666666666667" y="458" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">只读接口放行</text><text x="408.6666666666667" y="482" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">降级为匿名访问</text><text x="408.6666666666667" y="506" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#f87171" text-anchor="start" dominant-baseline="middle">代价：权限判断必须另有兜底</text><rect x="741.3333333333334" y="436" width="330.6666666666667" height="92" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="755.3333333333334" y="458" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">本地短期缓存</text><text x="755.3333333333334" y="482" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">进程内保留最近会话</text><text x="755.3333333333334" y="506" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#f87171" text-anchor="start" dominant-baseline="middle">代价：多实例不一致，只顶几分钟</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · HSET / EXPIRE 与惰性删除机制 / DEL / INFO keyspace</text></svg>