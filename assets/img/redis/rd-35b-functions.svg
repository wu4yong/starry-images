dth="496" height="202" rx="12" fill="rgba(94,234,212,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="592" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">Functions（7.0+）</text><text x="592" y="164" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">标识：库名 + 函数名（可读、可版本化）</text><text x="592" y="192" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">生命周期：随 RDB/AOF 持久化，重启仍在</text><text x="592" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">复制：调用名与参数，更省更确定</text><text x="592" y="248" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">管理：FUNCTION LIST / DELETE / FLUSH</text><text x="592" y="276" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">约束：必须带 #!lua name= 库声明头</text><rect x="48" y="334" width="120" height="44" rx="22" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-width="1.4"/><text x="108" y="356" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">FCALL</text><rect x="180" y="334" width="160" height="44" rx="22" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-width="1.4"/><text x="260" y="356" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">myfunc</text><rect x="352" y="334" width="130" height="44" rx="22" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-width="1.4"/><text x="417" y="356" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">numkeys</text><rect x="494" y="334" width="300" height="44" rx="22" fill="#5eead4" opacity="0.10" stroke="#5eead4" stroke-width="1.4"/><text x="644" y="356" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">KEYS[1..n]</text><rect x="806" y="334" width="266" height="44" rx="22" fill="#a78bfa" opacity="0.10" stroke="#a78bfa" stroke-width="1.4"/><text x="939" y="356" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">ARGV[...]</text><text x="48" y="398" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">函数名 → numkeys → 前 numkeys 个是 KEYS，其余是 ARGV；key 必须走这里，Cluster 才能校验同槽</text><rect x="48" y="418" width="162" height="38" rx="19" fill="#38bdf8" opacity="0.10" stroke="#38bdf8" stroke-width="1.4"/><text x="129" y="437" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">FUNCTION LIST</text><rect x="222" y="418" width="162" height="38" rx="19" fill="#38bdf8" opacity="0.10" stroke="#38bdf8" stroke-width="1.4"/><text x="303" y="437" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">FUNCTION DUMP</text><rect x="396" y="418" width="162" height="38" rx="19" fill="#38bdf8" opacity="0.10" stroke="#38bdf8" stroke-width="1.4"/><text x="477" y="437" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">FUNCTION RESTORE</text><rect x="570" y="418" width="162" height="38" rx="19" fill="#38bdf8" opacity="0.10" stroke="#38bdf8" stroke-width="1.4"/><text x="651" y="437" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">FUNCTION DELETE</text><rect x="744" y="418" width="162" height="38" rx="19" fill="#38bdf8" opacity="0.10" stroke="#38bdf8" stroke-width="1.4"/><text x="825" y="437" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">FUNCTION STATS</text><rect x="918" y="418" width="162" height="38" rx="19" fill="#f87171" opacity="0.10" stroke="#f87171" stroke-width="1.4"/><text x="999" y="437" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle" dominant-baseline="middle">FUNCTION FLUSH</text><rect x="48" y="472" width="500" height="66" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="64" y="492" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">FUNCTION FLUSH 没有确认机制</text><text x="64" y="518" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">一执行所有库消失，在线调用立刻 ERR unknown function</text><rect x="576" y="472" width="496" height="66" rx="10" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="1.5"/><text x="592" y="492" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">随数据集持久化的副作用</text><text x="592" y="518" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">拷一份 RDB 到别的环境，函数库会一起过来，迁移前先 FUNCTION LIST 核对</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Functions 文档（FUNCTION LOAD / FCALL / FUNCTION LIST|DUMP|RESTORE）</text></svg>