<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">Cluster 搭建、扩容与 reshard</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">从 cluster-enabled 到槽位搬家，全程都有可观测命令</text><text x="56" y="142" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">① 建集群的四个前提</text><rect x="56" y="160" width="560" height="168" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.6"/><text x="74" y="186" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">配置文件必须写对</text><text x="74" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">cluster-enabled yes</text><text x="74" y="246" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">cluster-config-file nodes.conf（自动维护，别手改）</text><text x="74" y="272" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">cluster-node-timeout 15000（毫秒，判活阈值）</text><text x="74" y="298" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">每个节点必须有独立目录，nodes.conf 不能共享</text><rect x="660" y="160" width="536" height="168" rx="12" fill="rgba(94,234,212,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="678" y="186" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">建集群的两条路径</text><text x="678" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">① redis-cli --cluster create ip:port … --cluster-replicas 1</text><text x="678" y="246" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">② 手工 MEET + CLUSTER ADDSLOTS + CLUSTER REPLICATE</text><text x="678" y="272" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">前者最省事，生产上多用它再加节点</text><text x="56" y="352" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">② 扩容：加节点 → 迁槽 → 迁 key</text><rect x="56" y="374" width="268.5" height="92" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="190.25" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">CLUSTER MEET</text><text x="190.25" y="432" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">新节点加入集群</text><line x1="324.5" y1="420" x2="344.5" y2="420" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="346.5" y="374" width="268.5" height="92" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="480.75" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">ADDSLOTS 或 reshard</text><text x="480.75" y="432" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">给它分配槽位</text><line x1="615" y1="420" x2="635" y2="420" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="637" y="374" width="268.5" height="92" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="771.25" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">搬 key</text><text x="771.25" y="432" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">MIGRATE 逐 key 搬运</text><line x1="905.5" y1="420" x2="925.5" y2="420" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="927.5" y="374" width="268.5" height="92" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="1061.75" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">改槽归属</text><text x="1061.75" y="432" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">SETSLOT 完成，ASK 消失</text><rect x="56" y="496" width="560" height="150" rx="12" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="1.6"/><text x="74" y="522" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">观测命令</text><text x="74" y="556" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">CLUSTER INFO：cluster_state ok 才是健康</text><text x="74" y="581" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">CLUSTER NODES：看槽位分布与主从关系</text><text x="74" y="606" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">CLUSTER COUNTKEYSINSLOT：单槽 key 数</text><text x="74" y="631" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">CLUSTER GETKEYSINSLOT：取一批 key 用于迁移</text><rect x="660" y="496" width="536" height="150" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="678" y="522" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">扩容期的三个代价</text><text x="678" y="556" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">迁移期间该槽的 key 会被 ASK 重定向，客户端要多一跳</text><text x="678" y="581" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">大 key 迁移是同步阻塞，百万成员的对象能卡住整批</text><text x="678" y="606" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">reshard 期间不要做全量备份，IO 叠加会拖垮节点</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 Documentation · Cluster tutorial / CLUSTER commands</text></svg>