<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">故障转移与客户端接入</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">切换是 Sentinel 干的，接住流量是客户端的事</text><text x="56" y="142" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">① 切换的六个动作（按官方流程）</text><rect x="56" y="164" width="360" height="80" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="236" y="194" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">1. 确认 odown</text><text x="236" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">quorum 达成</text><rect x="440" y="164" width="360" height="80" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="620" y="194" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">2. 选领导者</text><text x="620" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">多数 Sentinel 投票</text><rect x="824" y="164" width="360" height="80" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="1004" y="194" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">3. 挑新主</text><text x="1004" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">优先级 → offset</text><rect x="56" y="260" width="360" height="80" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="236" y="290" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">4. 改配置</text><text x="236" y="318" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">其余从库 REPLICAOF 新主</text><rect x="440" y="260" width="360" height="80" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="620" y="290" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">5. 发通知</text><text x="620" y="318" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">+switch-master 广播</text><rect x="824" y="260" width="360" height="80" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="1004" y="290" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">6. 旧主归队</text><text x="1004" y="318" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">恢复后降级为从库</text><rect x="56" y="380" width="560" height="210" rx="12" fill="rgba(94,234,212,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="74" y="406" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">客户端要做的三件事</text><text x="74" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">① 启动/重连时向 Sentinel 询问主库地址</text><text x="74" y="466" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">    SENTINEL get-master-addr-by-name mymaster</text><text x="74" y="492" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">② 订阅 +switch-master 频道，收到就切换连接</text><text x="74" y="518" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">③ 切换窗口内写失败要重试（此时旧主已不可写）</text><text x="74" y="544" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">只写死 IP 的客户端 = 切换后整片报错</text><rect x="660" y="380" width="536" height="210" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="678" y="406" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">切换期间的真实风险</text><text x="678" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">异步复制 → 新主可能缺最后一段写入（数据丢失窗口）</text><text x="678" y="466" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">旧主恢复后以从库身份归队，会丢掉它没同步出去的数据</text><text x="678" y="492" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">切换瞬间连接全断，必须靠客户端重连与业务重试兜住</text><text x="678" y="518" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">脑裂：旧主未死但网络分区，可能仍被写（需 min-replicas 保护）</text><text x="56" y="626" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">演练口径：真拔一次主库网线，量出「从故障发生到客户端恢复写入」的总时长，这才是可用的 RTO。</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 Documentation · Sentinel failover / client-side handling</text></svg>