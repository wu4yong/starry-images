 cx="701.1" cy="69.7" r="1.22" fill="#cfe4ff" opacity="0.36"/><circle cx="881.3" cy="591.9" r="0.97" fill="#cfe4ff" opacity="0.43"/><circle cx="873.1" cy="458.4" r="1.41" fill="#cfe4ff" opacity="0.62"/><circle cx="677.8" cy="719.2" r="1.26" fill="#cfe4ff" opacity="0.41"/><circle cx="64.8" cy="376.1" r="1.17" fill="#cfe4ff" opacity="0.64"/><circle cx="862.5" cy="406.3" r="1.35" fill="#cfe4ff" opacity="0.22"/><circle cx="418.7" cy="228.1" r="1.16" fill="#cfe4ff" opacity="0.24"/><circle cx="254.5" cy="441.1" r="0.60" fill="#cfe4ff" opacity="0.35"/><circle cx="661.4" cy="12.6" r="0.69" fill="#cfe4ff" opacity="0.29"/><circle cx="190.2" cy="546.7" r="0.78" fill="#cfe4ff" opacity="0.54"/><circle cx="249.9" cy="111.9" r="0.97" fill="#cfe4ff" opacity="0.44"/><circle cx="1111.0" cy="347.7" r="1.47" fill="#cfe4ff" opacity="0.32"/><circle cx="19.1" cy="71.8" r="0.54" fill="#cfe4ff" opacity="0.51"/><circle cx="999.8" cy="275.4" r="1.03" fill="#cfe4ff" opacity="0.40"/><circle cx="1184.1" cy="508.9" r="0.95" fill="#cfe4ff" opacity="0.62"/><circle cx="907.1" cy="460.9" r="1.37" fill="#cfe4ff" opacity="0.49"/><circle cx="798.1" cy="19.8" r="0.52" fill="#cfe4ff" opacity="0.64"/><circle cx="390.1" cy="246.0" r="1.33" fill="#cfe4ff" opacity="0.64"/><circle cx="447.0" cy="144.6" r="1.24" fill="#cfe4ff" opacity="0.53"/><circle cx="512.9" cy="32.2" r="0.49" fill="#cfe4ff" opacity="0.26"/><circle cx="78.1" cy="425.3" r="0.80" fill="#cfe4ff" opacity="0.64"/><circle cx="587.9" cy="278.3" r="0.95" fill="#cfe4ff" opacity="0.30"/><circle cx="881.0" cy="206.8" r="1.12" fill="#cfe4ff" opacity="0.23"/><circle cx="733.7" cy="20.7" r="0.68" fill="#cfe4ff" opacity="0.58"/><circle cx="244.4" cy="695.8" r="0.48" fill="#cfe4ff" opacity="0.62"/><circle cx="741.2" cy="257.5" r="0.45" fill="#cfe4ff" opacity="0.26"/><circle cx="46.7" cy="26.4" r="0.84" fill="#cfe4ff" opacity="0.35"/><circle cx="616.5" cy="683.5" r="0.70" fill="#cfe4ff" opacity="0.26"/><circle cx="880.4" cy="93.9" r="1.41" fill="#cfe4ff" opa