<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">消费组四步与 PEL 的四个字段</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">至少一次 = 写 PEL 之后消息不会消失</text><rect x="48" y="108" width="242.5" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="169.25" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">XADD</text><text x="169.25" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">返回 ms-seq 消息 ID</text><line x1="290.5" y1="146" x2="306.5" y2="146" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="308.5" y="108" width="242.5" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="429.75" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">XGROUP CREATE</text><text x="429.75" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">MKSTREAM 才能建在不存在的流</text><line x1="551" y1="146" x2="567" y2="146" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="569" y="108" width="242.5" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="690.25" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">XREADGROUP &gt;</text><text x="690.25" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">读新消息并写入 PEL</text><line x1="811.5" y1="146" x2="827.5" y2="146" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="829.5" y="108" width="242.5" height="76" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="950.75" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">XACK</text><text x="950.75" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">从 PEL 移除＝处理完成</text><rect x="48" y="200" width="496" height="168" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="64" y="226" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">PEL 的四个字段</text><text x="64" y="256" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">消息 ID：ms-seq，定位与确认</text><text x="64" y="282" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">消费者名：谁领走了，判断接管</text><text x="64" y="308" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">投递时间：卡了多久</text><text x="64" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">投递次数：是否反复失败</text><rect x="576" y="200" width="496" height="168" rx="12" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="592" y="226" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">至少一次的窗口</text><text x="592" y="256" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">投递即写 PEL，消息不会消失</text><text x="592" y="282" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">处理成功 → XACK 移除</text><text x="592" y="308" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">XACK 前崩溃 → 仍在 PEL，可被接管</text><text x="592" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">代价：可能重复投递，业务要幂等</text><rect x="48" y="390" width="246" height="40" rx="20" fill="#38bdf8" opacity="0.10" stroke="#38bdf8" stroke-width="1.4"/><text x="171" y="410" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">XADD MAXLEN ~ 100000</text><rect x="306" y="390" width="246" height="40" rx="20" fill="#38bdf8" opacity="0.10" stroke="#38bdf8" stroke-width="1.4"/><text x="429" y="410" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">XTRIM</text><rect x="564" y="390" width="246" height="40" rx="20" fill="#38bdf8" opacity="0.10" stroke="#38bdf8" stroke-width="1.4"/><text x="687" y="410" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">XDEL</text><rect x="822" y="390" width="246" height="40" rx="20" fill="#a78bfa" opacity="0.10" stroke="#a78bfa" stroke-width="1.4"/><text x="945" y="410" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">XAUTOCLAIM 6.2+</text><rect x="48" y="444" width="500" height="92" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="64" y="464" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">裁剪的三个坑</text><text x="64" y="490" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">MAXLEN ~ 是按节点近似裁剪，不是精确条数</text><text x="64" y="516" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">XDEL 只删消息，PEL 里的 ID 还在 → 幽灵条目，用 XAUTOCLAIM 清</text><rect x="576" y="444" width="496" height="92" rx="10" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="1.5"/><text x="592" y="464" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">接管用 XAUTOCLAIM，不要手写遍历</text><text x="592" y="490" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">min-idle-time 是「别人已经占了多久」才接管：设 0 会把正在处理的消息抢走</text><text x="592" y="516" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">经验值：≥ 单条处理 P99 的 2～3 倍（如 30s / 60s）</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Streams 文档（XREADGROUP 的 &gt; 与 0 / XPENDING / XAUTOCLAIM / MAXLEN ~）</text></svg>