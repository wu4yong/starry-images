<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">sdown → odown → 选主 → 换主</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">quorum 只判下线，动手还要过半票</text><rect x="48" y="106" width="1024" height="86" rx="12" fill="rgba(56,189,248,0.04)" stroke="rgba(148,163,184,0.28)" stroke-width="1.2"/><rect x="66" y="118" width="200" height="64" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="166" y="144" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">客户端</text><text x="166" y="168" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">不转发：只问地址 + 订阅</text><rect x="292" y="118" width="250" height="64" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="417" y="144" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">Sentinel 集群 ×3</text><text x="417" y="168" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">互相 PING，投票判定</text><rect x="568" y="118" width="240" height="64" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="688" y="144" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">1 主 + 2 从</text><text x="688" y="168" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">被监控、被投票、被切换</text><rect x="834" y="118" width="220" height="64" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="944" y="144" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">结果</text><text x="944" y="168" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">写 +switch-master 广播</text><rect x="48" y="210" width="242.5" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="169.25" y="236" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">sdown</text><text x="169.25" y="260" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">单个 Sentinel 判定</text><line x1="290.5" y1="249" x2="306.5" y2="249" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="308.5" y="210" width="242.5" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="429.75" y="236" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">odown</text><text x="429.75" y="260" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">sdown 票数 ≥ quorum</text><line x1="551" y1="249" x2="567" y2="249" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="569" y="210" width="242.5" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="690.25" y="236" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">选领导者</text><text x="690.25" y="260" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">过半多数投票</text><line x1="811.5" y1="249" x2="827.5" y2="249" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="829.5" y="210" width="242.5" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="950.75" y="236" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">换主</text><text x="950.75" y="260" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">priority → offset → runid</text><rect x="48" y="304" width="500" height="150" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="64" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">quorum 与多数票是两件事</text><text x="64" y="360" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">quorum 2 → 2 票就能判 odown</text><text x="64" y="390" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">执行切换需要 ceil(N/2)+1 票</text><text x="64" y="420" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">5 个 Sentinel 配 quorum 5 基本切不动</text><rect x="576" y="304" width="496" height="150" rx="12" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="592" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">四个参数各管什么</text><text x="592" y="360" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">down-after-milliseconds 30000：多快算 sdown</text><text x="592" y="390" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">failover-timeout 180000：整场切换的时限</text><text x="592" y="420" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">parallel-syncs 1：切换后同时全量的从库数</text><rect x="48" y="474" width="1024" height="90" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="64" y="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">两条底线</text><text x="64" y="530" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">1 个没有多数、2 个会脑裂：生产至少 3 个且奇数，配置会被自动重写，运行期手改无效</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Sentinel / SENTINEL master / get-master-addr-by-name</text></svg>