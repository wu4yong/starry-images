<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">RESP 协议与客户端选型：一条命令长什么样</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">协议决定了客户端能不能复用连接、能不能 pipeline</text><rect x="56" y="140" width="640" height="330" rx="10" fill="rgba(2,6,23,0.72)" stroke="rgba(56,189,248,0.35)" stroke-width="1.2"/><text x="78" y="168" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">请求（客户端 → 服务端）：SET name redis7</text><text x="78" y="200" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="14.5" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">*3\r\n        # 3 个元素</text><text x="78" y="228" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="14.5" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">$3\r\nSET\r\n  # 第一个是长度 3 的 bulk</text><text x="78" y="256" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="14.5" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">$4\r\nname\r\n # 长度 4</text><text x="78" y="284" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="14.5" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">$6\r\nredis7\r\n# 长度 6</text><text x="78" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">响应的五种基本类型（RESP2）</text><text x="78" y="360" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="500" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">+OK</text><text x="320" y="360" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">简单字符串 simple string</text><text x="78" y="384" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="500" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">-ERR unknown command</text><text x="320" y="384" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">错误 error</text><text x="78" y="408" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="500" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">:1000</text><text x="320" y="408" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">整数 integer</text><text x="78" y="432" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="500" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">$6\r\nredis7\r\n</text><text x="320" y="432" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">批量字符串 bulk string</text><text x="78" y="456" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="500" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">*2\r\n...</text><text x="320" y="456" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">数组 array</text><rect x="724" y="140" width="500" height="100" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.6"/><text x="744" y="170" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="18" font-weight="600" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">Jedis</text><text x="744" y="192" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">阻塞式同步 · 连接不线程安全</text><text x="744" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">必须配连接池，每线程借还连接</text><rect x="724" y="256" width="500" height="100" rx="12" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="744" y="286" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="18" font-weight="600" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">Lettuce</text><text x="744" y="308" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">基于 Netty · 连接线程安全</text><text x="744" y="336" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">天然支持异步 / 响应式，共享连接</text><rect x="724" y="372" width="500" height="100" rx="12" fill="rgba(56,189,248,0.06)" stroke="#a78bfa" stroke-width="1.6"/><text x="744" y="402" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="18" font-weight="600" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">redis-cli / RESP3</text><text x="744" y="424" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">HELLO 3 切换协议版本</text><text x="744" y="452" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">RESP3 支持 push 与 map，7.x 默认仍是 RESP2</text><text x="56" y="502" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="700" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">连接池要显式设定的五个参数（不设就是赌运气）</text><rect x="56" y="524" width="210" height="44" rx="8" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.6)" stroke-width="1.3"/><text x="161" y="546" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">maxTotal</text><rect x="288" y="524" width="210" height="44" rx="8" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.6)" stroke-width="1.3"/><text x="393" y="546" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">maxIdle</text><rect x="520" y="524" width="210" height="44" rx="8" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.6)" stroke-width="1.3"/><text x="625" y="546" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">minIdle</text><rect x="752" y="524" width="210" height="44" rx="8" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.6)" stroke-width="1.3"/><text x="857" y="546" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">maxWaitMillis</text><rect x="984" y="524" width="210" height="44" rx="8" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.6)" stroke-width="1.3"/><text x="1089" y="546" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">timeout</text><text x="56" y="604" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">结论：一条命令 = 一次往返；能复用连接、能 pipeline 的封装，决定同一条命令的实测吞吐。RESP 是文本协议，所以你能用 nc/telnet 直接手工发一条命令调试。</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 Documentation · Redis serialization protocol (RESP) / Clients</text></svg>