<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">三个口径、四个来源与 activedefrag</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">ratio &gt; 1 是碎片，ratio &lt; 1 是 swap</text><rect x="48" y="108" width="330.6666666666667" height="70" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="213.33333333333334" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">used_memory</text><text x="213.33333333333334" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">Redis 自报：我申请了多少</text><rect x="394.6666666666667" y="108" width="330.6666666666667" height="70" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="560" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">used_memory_rss</text><text x="560" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">操作系统：进程占了多少页</text><rect x="741.3333333333334" y="108" width="330.6666666666667" height="70" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="906.6666666666667" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">mem_fragmentation_ratio</text><text x="906.6666666666667" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">rss / used，算出来的</text><rect x="48" y="194" width="300" height="38" rx="19" fill="#a78bfa" opacity="0.10" stroke="#a78bfa" stroke-width="1.4"/><text x="198" y="213" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">ratio &gt; 1  →  有碎片</text><rect x="364" y="194" width="300" height="38" rx="19" fill="#f87171" opacity="0.10" stroke="#f87171" stroke-width="1.4"/><text x="514" y="213" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle" dominant-baseline="middle">ratio &lt; 1  →  部分被 swap 出去了</text><rect x="680" y="194" width="392" height="38" rx="19" fill="#64748b" opacity="0.10" stroke="#64748b" stroke-width="1.4"/><text x="876" y="213" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle" dominant-baseline="middle">ratio &gt; 1.5 值得整理</text><rect x="48" y="240" width="247" height="88" rx="10" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.4"/><text x="62" y="264" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">① size class</text><text x="62" y="292" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">jemalloc 按 8/16/32</text><text x="62" y="312" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">/48/64… 分配，申请 100 拿 112</text><rect x="307" y="240" width="247" height="88" rx="10" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.4"/><text x="321" y="264" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">② 空洞散落</text><text x="321" y="292" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">反复增删后空闲块散在各 page，拼</text><text x="321" y="312" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">不回大块</text><rect x="566" y="240" width="247" height="88" rx="10" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.4"/><text x="580" y="264" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">③ 大小混布</text><text x="580" y="292" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">小对象与 MB 级大 value 同</text><text x="580" y="312" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">进程，page 被切碎</text><rect x="825" y="240" width="247" height="88" rx="10" fill="rgba(56,189,248,0.06)" stroke="#a78bfa" stroke-width="1.4"/><text x="839" y="264" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">④ 惰性释放与 CoW</text><text x="839" y="292" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">SDS 缩容不释放 + fork 写</text><text x="839" y="312" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">时复制产生的页</text><rect x="48" y="344" width="496" height="168" rx="12" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="64" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">activedefrag 四组参数</text><text x="64" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.3" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">ignore-bytes 100mb + threshold-lower 10：要不要做</text><text x="64" y="426" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.3" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">threshold-upper 100 + cycle-max 100：做多狠</text><text x="64" y="452" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.3" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">cycle-min 25：至少做多少</text><text x="64" y="478" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.3" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">max-scan-fields 1000：单对象扫描上限</text><rect x="576" y="344" width="496" height="142" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="592" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">该重启（切主）而不是整理</text><text x="592" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">碎片来自单个超大对象，搬不动</text><text x="592" y="426" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">ratio 长期 &gt; 2，开了也不降</text><text x="592" y="452" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">已贴近 maxmemory，整理会触发淘汰</text><rect x="48" y="518" width="1024" height="44" rx="10" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.5"/><text x="64" y="538" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">默认 activedefrag no：要花 CPU，且与 fork、AOF 重写抢资源；打开后先看 INFO memory 的 active_defrag_hits</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · INFO memory / redis.conf activedefrag 参数 / MEMORY DOCTOR</text></svg>