<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">从零到 PONG：安装、启动、验证的最小闭环</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">每一步都能对应到官方文档中的名词，别只记命令</text><rect x="56" y="148" width="206" height="96" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.6"/><text x="159" y="184" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">① 取得</text><text x="159" y="211" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">apt / yum / 源码 tar.gz</text><line x1="262" y1="196" x2="286" y2="196" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" marker-end="url(#arrow)"/><rect x="288" y="148" width="206" height="96" rx="12" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="391" y="184" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">② 编译安装</text><text x="391" y="211" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">make &amp;&amp; make install</text><line x1="494" y1="196" x2="518" y2="196" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" marker-end="url(#arrow)"/><rect x="520" y="148" width="206" height="96" rx="12" fill="rgba(56,189,248,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="623" y="184" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">③ 启动</text><text x="623" y="211" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">redis-server redis.conf</text><line x1="726" y1="196" x2="750" y2="196" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" marker-end="url(#arrow)"/><rect x="752" y="148" width="206" height="96" rx="12" fill="rgba(56,189,248,0.06)" stroke="#a78bfa" stroke-width="1.6"/><text x="855" y="184" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">④ 连接</text><text x="855" y="211" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">redis-cli -p 6379</text><line x1="958" y1="196" x2="982" y2="196" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" marker-end="url(#arrow)"/><rect x="984" y="148" width="206" height="96" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.6"/><text x="1087" y="184" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">⑤ 验证</text><text x="1087" y="211" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">PING → PONG</text><rect x="56" y="272" width="1140" height="196" rx="10" fill="rgba(2,6,23,0.72)" stroke="rgba(56,189,248,0.35)" stroke-width="1.2"/><text x="78" y="300" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">最小可跑通的一条命令流（官方 quick start 同款路径）</text><text x="78" y="332" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="15" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">tar xzf redis-7.4.x.tar.gz &amp;&amp; cd redis-7.4.x</text><text x="78" y="364" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="15" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">make &amp;&amp; sudo make install PREFIX=/usr/local/redis</text><text x="78" y="396" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="15" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">/usr/local/redis/bin/redis-server ./redis.conf</text><text x="78" y="428" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="15" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">/usr/local/redis/bin/redis-cli -h 127.0.0.1 -p 6379</text><text x="78" y="460" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="15" font-weight="500" fill="#5eead4" text-anchor="start" dominant-baseline="middle">127.0.0.1:6379&gt; PING      →  PONG      # 通了说明 server + 协议 + 网络都没问题</text><text x="56" y="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="700" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">三种启动方式（生产只推荐第三种）</text><rect x="56" y="520" width="350" height="44" rx="8" fill="rgba(94,234,212,0.09)" stroke="rgba(94,234,212,0.7)" stroke-width="1.3"/><text x="231" y="542" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">前台调试：直接 redis-server</text><rect x="430" y="520" width="350" height="44" rx="8" fill="rgba(94,234,212,0.09)" stroke="rgba(94,234,212,0.7)" stroke-width="1.3"/><text x="605" y="542" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">daemonize yes（会脱离终端）</text><rect x="804" y="520" width="392" height="44" rx="8" fill="rgba(94,234,212,0.09)" stroke="rgba(94,234,212,0.7)" stroke-width="1.3"/><text x="1000" y="542" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">systemd 托管：开机自启 + 日志</text><text x="56" y="600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">两个常见误区：① 只跑 redis-server 不带配置文件 → 用默认内置配置，改 conf 不生效；② 客户端连不上先看 bind 与 protected-mode，而不是先怀疑密码。</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 Documentation · Install Redis / Getting started / redis-cli</text></svg>