<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">三级缓存的读路径与失效传播</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">L1 最快也最旧，靠短 TTL 兜底</text><rect x="48" y="108" width="242.5" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="169.25" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">请求</text><text x="169.25" y="154" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">GET key</text><line x1="290.5" y1="145" x2="306.5" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="308.5" y="108" width="242.5" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="429.75" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">L1 进程内</text><text x="429.75" y="154" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">命中即返回，零网络 IO</text><line x1="551" y1="145" x2="567" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="569" y="108" width="242.5" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="690.25" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">L2 Redis</text><text x="690.25" y="154" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">命中则回填 L1</text><line x1="811.5" y1="145" x2="827.5" y2="145" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="829.5" y="108" width="242.5" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="950.75" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">DB</text><text x="950.75" y="154" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">回填 L2 与 L1</text><path d="M 300 190 L 300 200 L 210 200 L 210 190" fill="none" stroke="#5eead4" stroke-width="1.2" opacity="0.8" marker-end="url(#arrow)"/><text x="320" y="200" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">命中后逐层回填：同一时刻要限住「允许穿透到下一层」的并发数</text><rect x="48" y="216" width="330.6666666666667" height="104" rx="10" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.4"/><text x="62" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">容量硬上限</text><text x="62" y="268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">Caffeine maximumSize</text><text x="62" y="288" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle"> / LRU 容量</text><text x="62" y="308" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">没有上限的进程内 map 就是内存泄漏</text><rect x="394.6666666666667" y="216" width="330.6666666666667" height="104" rx="10" fill="rgba(56,189,248,0.05)" stroke="#fbbf24" stroke-width="1.4"/><text x="408.6666666666667" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">TTL 必须短</text><text x="408.6666666666667" y="268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">秒级，如 1～5 秒</text><text x="408.6666666666667" y="288" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle"></text><text x="408.6666666666667" y="308" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">L1 的正确性完全依赖 TTL 兜底</text><rect x="741.3333333333334" y="216" width="330.6666666666667" height="104" rx="10" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="755.3333333333334" y="240" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">只放可重建数据</text><text x="755.3333333333334" y="268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">重启即清空</text><text x="755.3333333333334" y="288" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.8" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle"></text><text x="755.3333333333334" y="308" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">绝不能存「只有这一份」的数据</text><text x="48" y="348" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">失效传播：写库成功之后</text><rect x="48" y="360" width="245.5" height="60" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="60" y="380" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">① 写库</text><text x="60" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">UPDATE db 成功</text><line x1="293.5" y1="390" x2="305.5" y2="390" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="307.5" y="360" width="245.5" height="60" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="319.5" y="380" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">② 删 L2</text><text x="319.5" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">DEL Redis 中的 key</text><line x1="553" y1="390" x2="565" y2="390" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="567" y="360" width="245.5" height="60" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="579" y="380" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">③ 广播失效</text><text x="579" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">Pub/Sub 或 tracking 推送</text><line x1="812.5" y1="390" x2="824.5" y2="390" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="826.5" y="360" width="245.5" height="60" rx="9" fill="rgba(56,189,248,0.05)" stroke="#5eead4" stroke-width="1.4"/><text x="838.5" y="380" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">④ 各实例删 L1</text><text x="838.5" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">本地缓存清掉</text><rect x="48" y="436" width="500" height="88" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="64" y="456" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">必须假设广播会丢</text><text x="64" y="480" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">断线期间的消息不会补发（Pub/Sub 至多一次）</text><text x="64" y="504" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">所以 L1 的短 TTL 是最后兜底；想靠广播做到强一致，代价吃掉全部收益</text><rect x="576" y="436" width="496" height="88" rx="10" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.5"/><text x="592" y="456" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">什么时候只用 L2 更划算</text><text x="592" y="480" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">QPS 不高、热点不集中 → 多级只增加传播复杂度</text><text x="592" y="504" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">判据：单 key QPS × 0.3ms 的 RTT 是否已构成带宽与连接压力</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Client-side caching（tracking 失效推送）/ Pub/Sub 语义 / Caffeine 容量上限</text></svg>