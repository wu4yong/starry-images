" cy="447.8" r="1.11" fill="#cfe4ff" opacity="0.43"/><circle cx="1069.3" cy="220.1" r="0.60" fill="#cfe4ff" opacity="0.30"/><circle cx="449.2" cy="141.0" r="1.25" fill="#cfe4ff" opacity="0.31"/><circle cx="637.5" cy="533.8" r="0.80" fill="#cfe4ff" opacity="0.31"/><circle cx="325.2" cy="530.7" r="0.79" fill="#cfe4ff" opacity="0.26"/>
<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">一个 value，四种用法</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">文本、整数、位图、存在性，都是同一份 String 存储</text><rect x="48" y="118" width="500" height="212" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.6"/><text x="66" y="144" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">SET 的选项各管一件事</text><text x="66" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">EX / PX：相对过期，缓存最常用</text><text x="66" y="204" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">EXAT / PXAT：绝对时间点，统一点失效</text><text x="66" y="234" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">NX / XX：写不写得进去，表达互斥与覆盖</text><text x="66" y="264" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">KEEPTTL：换值但保留原 TTL（默认会清掉）</text><text x="66" y="294" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">GET：写入同时返回旧值，替代废弃的 GETSET</text><rect x="576" y="118" width="496" height="212" rx="12" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="594" y="144" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">同一份存储，四种用法</text><text x="594" y="174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">文本：GET / APPEND / STRLEN，二进制安全</text><text x="594" y="204" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">整数：INCR / INCRBY，读改写一步完成</text><text x="594" y="234" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">位图：SETBIT / BITCOUNT，value 当 bit 数组</text><text x="594" y="264" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">存在性：SET NX 成功=抢到，失败=nil</text><text x="594" y="294" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">关键：位图不是新类型，仍受 512 MB 约束</text><rect x="48" y="354" width="500" height="182" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="66" y="380" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">位图的空间账</text><text x="66" y="410" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">空间 ≈ 最大 offset / 8：1000 人签到约 125 字节</text><text x="66" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">雪花 ID 直接当 offset，一个 key 立刻几百 KB</text><text x="66" y="470" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">offset 必须从 0 连续，否则中间全部补 0</text><text x="66" y="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">一次误传大 offset，等于当场吃进一块内存</text><rect x="576" y="354" width="496" height="182" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="594" y="380" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">四条硬边界（官方定义）</text><text x="594" y="410" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">单 value 上限 512 MB；offset 上限 2^32-1</text><text x="594" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">INCR 溢出返回 error，不回绕成负数</text><text x="594" y="470" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">key 存的是非数字时 INCR 报错，不会当成 0</text><text x="594" y="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">MSET 原子，但没有 NX：全有或全无靠 MSETNX / Lua</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Data types / Strings / SET / INCR / SETBIT</text></svg>