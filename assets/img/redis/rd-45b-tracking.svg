cle cx="542.1" cy="313.1" r="1.33" fill="#cfe4ff" opacity="0.57"/><circle cx="168.8" cy="552.6" r="0.85" fill="#cfe4ff" opacity="0.22"/><circle cx="267.7" cy="326.0" r="0.72" fill="#cfe4ff" opacity="0.42"/><circle cx="43.3" cy="32.1" r="1.21" fill="#cfe4ff" opacity="0.33"/><circle cx="483.1" cy="266.1" r="1.32" fill="#cfe4ff" opacity="0.53"/>
<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">客户端缓存的两条路径：默认追踪与广播订阅</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">CLIENT TRACKING 只负责「通知」，不承担「送达」</text><rect x="48" y="108" width="496" height="174" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.6"/><text x="64" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">默认模式 · 记录读过什么</text><text x="64" y="164" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">每个连接一张追踪表，记下 GET 过的 key</text><text x="64" y="192" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写方改这个 key → 只推给读过它的连接</text><text x="64" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">内存 ∝ 被追踪 key 数，消息最精准</text><text x="64" y="248" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">适合读多写少：配置、商品详情</text><rect x="576" y="108" width="496" height="174" rx="12" fill="rgba(56,189,248,0.06)" stroke="#a78bfa" stroke-width="1.6"/><text x="592" y="134" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">广播模式 · 按前缀订阅</text><text x="592" y="164" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">CLIENT TRACKING ON BCAST PREFIX user:</text><text x="592" y="192" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">不记录谁读过，只按前缀匹配变更</text><text x="592" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">内存小，但没读过的 key 变更也推你</text><text x="592" y="248" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">适合 key 空间大、读得分散</text><rect x="48" y="288" width="193.6" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="144.8" y="312" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">GET user:1001</text><text x="144.8" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">默认模式下被记入追踪表</text><line x1="241.6" y1="325" x2="253.6" y2="325" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="255.6" y="288" width="193.6" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="352.4" y="312" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">SET user:1001</text><text x="352.4" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">写方改了这个 key</text><line x1="449.2" y1="325" x2="461.2" y2="325" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="463.2" y="288" width="193.6" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="560" y="312" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">RESP3 push</text><text x="560" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">__redis__:invalidate</text><line x1="656.8" y1="325" x2="668.8" y2="325" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="670.8" y="288" width="193.6" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="767.5999999999999" y="312" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">删本地副本</text><text x="767.5999999999999" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">收到就失效，不等 TTL</text><line x1="864.4" y1="325" x2="876.4" y2="325" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="878.4" y="288" width="193.6" height="74" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="975.1999999999999" y="312" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">下次读回源</text><text x="975.1999999999999" y="334" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">重新 GET 拿到新值</text><rect x="48" y="384" width="500" height="84" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="64" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">断线期间不补发</text><text x="64" y="432" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">官方明示：失效消息不保证送达</text><text x="64" y="460" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">漏掉的那条，只能靠 TTL 兜</text><rect x="576" y="384" width="496" height="84" rx="10" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.5"/><text x="592" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">连接池要配 REDIRECT</text><text x="592" y="432" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">GET 的连接和收 push 的连接常常不是同一条</text><text x="592" y="460" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">不配 = 开了 tracking 却收不到失效</text><rect x="48" y="480" width="1024" height="74" rx="10" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.5"/><text x="64" y="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">工程结论：本地缓存必须有 1～5 秒 TTL，重连后主动清空</text><text x="64" y="528" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">tracking 让「发现变化」更快，它不是一致性协议；绝不能旧的数据不要放本地</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Client-side caching / CLIENT TRACKING / HELLO 文档</text></svg>