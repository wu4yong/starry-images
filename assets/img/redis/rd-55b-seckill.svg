C','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">2 重复：幂等命中，返回上次结果</text><rect x="576" y="194" width="496" height="146" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="592" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">GET + DECR 的超卖时间线</text><text x="592" y="250" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">A 读到 100，B 也读到 100（同一件商品）</text><text x="592" y="278" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">A 减到 99，B 也减到 99：卖了两次</text><text x="592" y="306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">两步之间可插入任意命令，只能靠脚本</text><rect x="48" y="358" width="330.6666666666667" height="70" rx="9" fill="rgba(56,189,248,0.05)" stroke="#fbbf24" stroke-width="1.4"/><text x="60" y="378" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">入口限流</text><text x="60" y="396" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">99% 请求挡在 Redis 之外</text><text x="60" y="412" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">挡的是无效流量</text><line x1="378.6666666666667" y1="393" x2="392.6666666666667" y2="393" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="394.6666666666667" y="358" width="330.6666666666667" height="70" rx="9" fill="rgba(56,189,248,0.05)" stroke="#fbbf24" stroke-width="1.4"/><text x="406.6666666666667" y="378" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">幂等</text><text x="406.6666666666667" y="396" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">同一用户只成功一次</text><text x="406.6666666666667" y="412" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">靠 SADD 标记</text><line x1="725.3333333333334" y1="393" x2="739.3333333333334" y2="393" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="741.3333333333334" y="358" width="330.6666666666667" height="70" rx="9" fill="rgba(56,189,248,0.05)" stroke="#fbbf24" stroke-width="1.4"/><text x="753.3333333333334" y="378" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">对账</text><text x="753.3333333333334" y="396" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">Redis 卖出数 vs 库中订单</text><text x="753.3333333333334" y="412" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">差额必须有人发现</text><rect x="48" y="448" width="500" height="92" rx="10" fill="rgba(94,234,212,0.06)" stroke="#5eead4" stroke-width="1.5"/><text x="64" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">扣减成功但落库失败，要能还库存</text><text x="64" y="496" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">INCRBY stock:{act1} 1 并 SREM order:{act1} uid</text><text x="64" y="524" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">没有归还机制 = 一件库存永久丢失</text><rect x="576" y="448" width="496" height="92" rx="10" fill="rgba(167,139,250,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="592" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">集群里多 key 必须同槽</text><text x="592" y="496" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">stock:{act1} 与 order:{act1} 都带同一个 tag</text><text x="592" y="524" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">不带 tag 报 CROSSSLOT，秒杀直接不可用</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · EVAL 原子性 / Cluster spec（hash tag）/ Streams（XADD、XREADGROUP）</text></svg>