<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">一次请求的路径：从 ssfd 到 sendReplyToClient</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">连接由 acceptTcpHandler 接，命令由 readQueryFromClient 读，回复由 beforeSleep 写</text><rect x="48" y="104" width="245.5" height="72" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="170.75" y="128" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">① listen + ssfd</text><text x="170.75" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">aeApiAddEvent 注册 EPOLLIN</text><line x1="293.5" y1="140" x2="305.5" y2="140" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="307.5" y="104" width="245.5" height="72" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="430.25" y="128" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">② acceptTcpHandler</text><text x="430.25" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">accept 得到客户端 fd</text><line x1="553" y1="140" x2="565" y2="140" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="567" y="104" width="245.5" height="72" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="689.75" y="128" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">③ epoll_ctl 注册</text><text x="689.75" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">客户端 fd 监听读事件</text><line x1="812.5" y1="140" x2="824.5" y2="140" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="826.5" y="104" width="245.5" height="72" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="949.25" y="128" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">④ readQueryFromClient</text><text x="949.25" y="150" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">从 fd 读进 querybuf</text><rect x="48" y="196" width="245.5" height="72" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="170.75" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">⑤ 解析成 argv</text><text x="170.75" y="242" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">字节 → 命令 + 参数</text><line x1="293.5" y1="232" x2="305.5" y2="232" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="307.5" y="196" width="245.5" height="72" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="430.25" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">⑥ 查表执行命令</text><text x="430.25" y="242" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">set → setCommand</text><line x1="553" y1="232" x2="565" y2="232" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="567" y="196" width="245.5" height="72" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="689.75" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">⑦ 写 buf / reply</text><text x="689.75" y="242" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">回复进输出缓冲</text><line x1="812.5" y1="232" x2="824.5" y2="232" stroke="#38bdf8" stroke-width="2" opacity="0.9" marker-end="url(#arrow)"/><rect x="826.5" y="196" width="245.5" height="72" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="949.25" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">⑧ 入 pending_write</text><text x="949.25" y="242" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.3" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">等下一次 beforeSleep</text><rect x="48" y="292" width="1024" height="86" rx="10" fill="rgba(94,234,212,0.06)" stroke="#5eead4" stroke-width="1.5"/><text x="64" y="312" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">为什么不在命令里直接把回复写回 socket</text><text x="64" y="340" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写 socket 可能阻塞（对端接收窗口满），会把整条单线程卡住</text><text x="64" y="368" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">于是统一丢进 clients_pending_write，由 beforeSleep 的 sendReplyToClient 批量写</text><rect x="48" y="392" width="500" height="100" rx="10" fill="rgba(167,139,250,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="64" y="412" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">io-threads 只插手三处</text><text x="64" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">读 socket（④）、解析 RESP（⑤）、写回复（⑦）</text><text x="64" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">但 ⑥ 执行命令永远在主线程，线程再多也不并行</text><rect x="576" y="392" width="496" height="100" rx="10" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.5"/><text x="592" y="412" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">一圈里还有别的事</text><text x="592" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">serverCron：过期清理、rehash、统计（hz=10）</text><text x="592" y="468" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">AOF everysec 的刷盘也在 beforeSleep 里发生</text><rect x="48" y="504" width="1024" height="50" rx="10" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.5"/><text x="64" y="524" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">ssfd 与客户端 fd 挂在同一个 epoll 实例里，全靠返回的事件区分 —— 所以一个线程能同时接连接和处理命令</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 源码 server.c（initServer、acceptTcpHandler）/ networking.c（readQueryFromClient）/ ae.c</text></svg>