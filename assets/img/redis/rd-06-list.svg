<text x="56" y="62" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">List：两端进出的线性表，阻塞语义才是重点</text><text x="56" y="100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">LPUSH/RPUSH 入队，LPOP/RPOP 出队，BLPOP 等待</text><rect x="56" y="150" width="1140" height="120" rx="12" fill="rgba(56,189,248,0.05)" stroke="rgba(56,189,248,0.75)" stroke-width="1.6"/><text x="76" y="182" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="16" font-weight="600" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">list:queue   [ 5 | 4 | 3 | 2 | 1 ]   （头部在左）</text><text x="76" y="216" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">LPUSH 从头部进、RPUSH 从尾部进；LPOP 从头出，RPOP 从尾出</text><text x="76" y="244" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">同一份数据：LPUSH + RPOP 是队列，LPUSH + LPOP 是栈</text><rect x="56" y="320" width="350" height="96" rx="12" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.6"/><text x="231" y="356" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">队列（FIFO）</text><text x="231" y="383" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">LPUSH 进 · RPOP 出</text><rect x="428" y="320" width="350" height="96" rx="12" fill="rgba(94,234,212,0.07)" stroke="#5eead4" stroke-width="1.6"/><text x="603" y="356" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="600" fill="#e8f0ff" text-anchor="middle" dominant-baseline="middle">栈（LIFO）</text><text x="603" y="383" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">LPUSH 进 · LPOP 出</text><rect x="800" y="320" width="396" height="96" rx="12" fill="rgba(251,191,36,0.07)" stroke="#fbbf24" stroke-width="1.6"/><text x="998" y="356" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="600" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">阻塞队列</text><text x="998" y="383" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">BLPOP key 0 = 无限等待</text><rect x="56" y="440" width="560" height="176" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="76" y="466" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">BLPOP / BRPOP 的三条官方约束</text><text x="76" y="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">① 超时单位是秒，0 表示永久阻塞；超时返回 nil</text><text x="76" y="526" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">② 在 MULTI/EXEC 事务里不阻塞，直接返回 nil</text><text x="76" y="552" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">③ 多个客户端阻塞同一 key 时，先到先被服务</text><rect x="660" y="440" width="536" height="176" rx="12" fill="rgba(167,139,250,0.07)" stroke="#a78bfa" stroke-width="1.6"/><text x="680" y="466" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">容量与底层结构</text><text x="680" y="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">单个 List 最多 2^32 - 1 个元素</text><text x="680" y="526" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">底层是 quicklist：listpack 组成的双向链表</text><text x="680" y="552" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">删大 List 用 UNLINK，避免主线程卡在释放内存</text><line x1="56" y1="664" x2="1224" y2="664" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="56" y="690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 Documentation · Lists / BLPOP / UNLINK</text></svg>