<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">一次往返省掉的是什么</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">Pipeline 的收益与 RTT 成正比、与命令数成正比</text><text x="48" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">逐条发送</text><rect x="200" y="112" width="50.86666666666667" height="40" rx="5" fill="rgba(248,113,113,0.20)" stroke="#f87171" stroke-width="1"/><text x="225.43333333333334" y="132" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="9.5" font-weight="500" fill="#f87171" text-anchor="middle" dominant-baseline="middle">RTT</text><rect x="250.86666666666667" y="112" width="36.333333333333336" height="40" rx="5" fill="rgba(56,189,248,0.18)" stroke="#38bdf8" stroke-width="1"/><text x="269.03333333333336" y="132" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="9.5" font-weight="500" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">E</text><rect x="290.83333333333337" y="112" width="50.86666666666667" height="40" rx="5" fill="rgba(248,113,113,0.20)" stroke="#f87171" stroke-width="1"/><text x="316.2666666666667" y="132" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="9.5" font-weight="500" fill="#f87171" text-anchor="middle" dominant-baseline="middle">RTT</text><rect x="341.70000000000005" y="112" width="36.333333333333336" height="40" rx="5" fill="rgba(56,189,248,0.18)" stroke="#38bdf8" stroke-width="1"/><text x="359.86666666666673" y="132" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="9.5" font-weight="500" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">E</text><rect x="381.66666666666674" y="112" width="50.86666666666667" height="40" rx="5" fill="rgba(248,113,113,0.20)" stroke="#f87171" stroke-width="1"/><text x="407.1000000000001" y="132" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="9.5" font-weight="500" fill="#f87171" text-anchor="middle" dominant-baseline="middle">RTT</text><rect x="432.5333333333334" y="112" width="36.333333333333336" height="40" rx="5" fill="rgba(56,189,248,0.18)" stroke="#38bdf8" stroke-width="1"/><text x="450.7000000000001" y="132" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="9.5" font-weight="500" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">E</text><rect x="472.5000000000001" y="112" width="50.86666666666667" height="40" rx="5" fill="rgba(248,113,113,0.20)" stroke="#f87171" stroke-width="1"/><text x="497.93333333333345" y="132" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="9.5" font-weight="500" fill="#f87171" text-anchor="middle" dominant-baseline="middle">RTT</text><rect x="523.3666666666668" y="112" width="36.333333333333336" height="40" rx="5" fill="rgba(56,189,248,0.18)" stroke="#38bdf8" stroke-width="1"/><text x="541.5333333333334" y="132" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="9.5" font-weight="500" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">E</text><rect x="563.3333333333335" y="112" width="50.86666666666667" height="40" rx="5" fill="rgba(248,113,113,0.20)" stroke="#f87171" stroke-width="1"/><text x="588.7666666666668" y="132" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="9.5" font-weight="500" fill="#f87171" text-anchor="middle" dominant-baseline="middle">RTT</text><rect x="614.2000000000002" y="112" width="36.333333333333336" height="40" rx="5" fill="rgba(56,189,248,0.18)" stroke="#38bdf8" stroke-width="1"/><text x="632.3666666666668" y="132" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="9.5" font-weight="500" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">E</text><rect x="654.1666666666669" y="112" width="50.86666666666667" height="40" rx="5" fill="rgba(248,113,113,0.20)" stroke="#f87171" stroke-width="1"/><text x="679.6000000000001" y="132" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="9.5" font-weight="500" fill="#f87171" text-anchor="middle" dominant-baseline="middle">RTT</text><rect x="705.0333333333335" y="112" width="36.333333333333336" height="40" rx="5" fill="rgba(56,189,248,0.18)" stroke="#38bdf8" stroke-width="1"/><text x="723.2000000000002" y="132" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="9.5" font-weight="500" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">E</text><text x="753.0000000000002" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">… N × (RTT + T_exec)</text><text x="48" y="196" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">Pipeline</text><rect x="200" y="176" width="50.86666666666667" height="40" rx="5" fill="rgba(248,113,113,0.20)" stroke="#f87171" stroke-width="1"/><text x="225.43333333333334" y="196" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="9.5" font-weight="500" fill="#f87171" text-anchor="middle" dominant-baseline="middle">RTT</text><rect x="254.5" y="176" width="817.5" height="40" rx="5" fill="rgba(94,234,212,0.16)" stroke="#5eead4" stroke-width="1"/><text x="663.25" y="196" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">N 条命令串行执行 + 一次性解析回复</text><rect x="200" y="234" width="380" height="38" rx="19" fill="#f87171" opacity="0.10" stroke="#f87171" stroke-width="1.4"/><text x="390" y="253" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle" dominant-baseline="middle">T = N × (RTT + T_exec)</text><rect x="594" y="234" width="478" height="38" rx="19" fill="#5eead4" opacity="0.10" stroke="#5eead4" stroke-width="1.4"/><text x="833" y="253" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">T = RTT + N × T_exec + T_parse</text><rect x="48" y="288" width="330.6666666666667" height="150" rx="12" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="64" y="314" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">MGET / MSET</text><text x="64" y="344" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">原子性：单条命令，服务端一次遍历</text><text x="64" y="374" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">适用：同类型、同结构的批量读写</text><text x="64" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">最省：省的是命令调度与协议解析</text><rect x="394.6666666666667" y="288" width="330.6666666666667" height="150" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.6"/><text x="410.6666666666667" y="314" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">Pipeline</text><text x="410.6666666666667" y="344" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">原子性：无，只是打包发送</text><text x="410.6666666666667" y="374" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">适用：异构命令、混合读写</text><text x="410.6666666666667" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">省的是 RTT，不省执行时间</text><rect x="741.3333333333334" y="288" width="330.6666666666667" height="150" rx="12" fill="rgba(56,189,248,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="757.3333333333334" y="314" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">MULTI + Pipeline</text><text x="757.3333333333334" y="344" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">原子性：有，事务包裹</text><text x="757.3333333333334" y="374" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">适用：要不被打断的批量写</text><text x="757.3333333333334" y="404" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">注意：运行时错误仍不回滚</text><rect x="48" y="444" width="1024" height="52" rx="10" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="1.5"/><text x="64" y="464" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">选择顺序：能批量命令就用 MGET/MSET → 异构命令用 Pipeline → 要原子性用 MULTI+管道</text><text x="64" y="490" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">别把 10 万条塞进一个管道：服务端要一次读完大请求再逐条执行，主线程会被占更久</text><rect x="48" y="502" width="1024" height="60" rx="10" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.5"/><text x="64" y="522" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">分批三个约束（官方无上限，工程值）</text><text x="64" y="548" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">按条数 500–1000 条／批　·　按字节单批不超过几 MB　·　按耗时一批执行别超几十毫秒</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Pipelining 文档 / MGET 与 MULTI 命令页 / CLIENT 输出缓冲限制</text></svg>