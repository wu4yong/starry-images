<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">扩容四步与迁移中的双向 ASK</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">扩容不停服，但迁大 key 会卡住</text><rect x="48" y="112" width="242.5" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/><text x="169.25" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">① add-node</text><text x="169.25" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">新节点，零槽</text><line x1="290.5" y1="151" x2="306.5" y2="151" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="308.5" y="112" width="242.5" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#5eead4" stroke-width="1.5"/><text x="429.75" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" dominant-baseline="middle">② reshard</text><text x="429.75" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">SETSLOT + 逐 key MIGRATE</text><line x1="551" y1="151" x2="567" y2="151" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="569" y="112" width="242.5" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#fbbf24" stroke-width="1.5"/><text x="690.25" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">③ rebalance</text><text x="690.25" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">按 key 数自动均摊</text><line x1="811.5" y1="151" x2="827.5" y2="151" stroke="#38bdf8" stroke-width="2" opacity="0.95" marker-end="url(#arrow)"/><rect x="829.5" y="112" width="242.5" height="78" rx="10" fill="rgba(56,189,248,0.07)" stroke="#a78bfa" stroke-width="1.5"/><text x="950.75" y="138" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle" dominant-baseline="middle">④ check</text><text x="950.75" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="500" fill="#9fb3d1" text-anchor="middle" dominant-baseline="middle">16384 槽全覆盖才算 ok</text><rect x="48" y="200" width="1024" height="70" rx="10" fill="rgba(94,234,212,0.05)" stroke="#5eead4" stroke-width="1.4"/><rect x="48" y="200" width="150" height="70" rx="10" fill="#5eead4" opacity="0.10"/><text x="64" y="233" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">源节点 · key 还在</text><text x="220" y="224" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">正常执行，客户端无感</text><text x="220" y="247" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">迁移只影响被搬的那部分槽</text><rect x="48" y="274" width="1024" height="72" rx="10" fill="rgba(251,191,36,0.05)" stroke="#fbbf24" stroke-width="1.4"/><rect x="48" y="274" width="170" height="72" rx="10" fill="#fbbf24" opacity="0.10"/><text x="64" y="307" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">源节点 · key 已搬走</text><text x="240" y="298" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">回 ASK，指向目标节点</text><text x="240" y="321" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">客户端本次转发，槽表不动</text><rect x="48" y="348" width="1024" height="72" rx="10" fill="rgba(167,139,250,0.05)" stroke="#a78bfa" stroke-width="1.4"/><rect x="48" y="348" width="170" height="72" rx="10" fill="#a78bfa" opacity="0.10"/><text x="64" y="381" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">目标节点 · 槽未归属</text><text x="240" y="372" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">也回 ASK，指回源节点</text><text x="240" y="395" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">ASK 是双向的，别只处理一个方向</text><rect x="48" y="428" width="500" height="118" rx="12" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.6"/><text x="64" y="454" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">三个前提</text><text x="64" y="484" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">至少 3 主；数据端口 + 10000 都要放行</text><text x="64" y="512" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">nodes-&lt;port&gt;.conf 每节点唯一，不能复用</text><rect x="576" y="428" width="496" height="118" rx="12" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="1.6"/><text x="592" y="454" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">两个红线</text><text x="592" y="484" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">MIGRATE 同步阻塞：大 key 先治理再迁</text><text x="592" y="512" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">del-node 前必须迁空，否则 cluster_state:fail</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Scaling（add-node / reshard / rebalance）/ CLUSTER SETSLOT / MIGRATE</text></svg>