<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">慢查询的三层观测：SLOWLOG / LATENCY / MONITOR</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">慢日志干净，不代表真的不慢</text><rect x="48" y="108" width="330.6666666666667" height="212" rx="12" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.5"/><text x="64" y="136" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">SLOWLOG</text><text x="64" y="172" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">记什么</text><text x="64" y="194" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">单条命令的执行耗时（微秒）</text><text x="64" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">盲区</text><text x="64" y="242" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">网络往返、连接池排队、fork、AOF 写盘都不在里面</text><text x="64" y="268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">配置</text><text x="64" y="290" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">slowlog-log-slower-than 10000（10ms）；max-len </text><text x="64" y="308" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">128 是环形</text><rect x="394.6666666666667" y="108" width="330.6666666666667" height="212" rx="12" fill="rgba(56,189,248,0.05)" stroke="#fbbf24" stroke-width="1.5"/><text x="410.6666666666667" y="136" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">LATENCY</text><text x="410.6666666666667" y="172" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">记什么</text><text x="410.6666666666667" y="194" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">事件级：command、fork、aof-write、expire-cycle、</text><text x="410.6666666666667" y="212" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">loading</text><text x="410.6666666666667" y="238" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">盲区</text><text x="410.6666666666667" y="260" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">单条命令内部细节、客户端侧耗时</text><text x="410.6666666666667" y="286" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">配置</text><text x="410.6666666666667" y="308" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">latency-monitor-threshold 单位毫秒，默认 0 关闭</text><rect x="741.3333333333334" y="108" width="330.6666666666667" height="212" rx="12" fill="rgba(56,189,248,0.05)" stroke="#f87171" stroke-width="1.5"/><text x="757.3333333333334" y="136" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="15" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">MONITOR</text><text x="757.3333333333334" y="172" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">记什么</text><text x="757.3333333333334" y="194" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">每条被执行的命令实时推送给监控端</text><text x="757.3333333333334" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">代价</text><text x="757.3333333333334" y="242" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">服务端格式化 + 客户端消费 + 可能泄露敏感参数</text><text x="757.3333333333334" y="268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">用法</text><text x="757.3333333333334" y="290" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">只在定位到时间窗口后抓 10–30 秒</text><rect x="48" y="340" width="1024" height="54" rx="10" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1.4"/><rect x="48" y="340" width="130" height="54" rx="10" fill="#38bdf8" opacity="0.10"/><text x="64" y="364" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">慢日志干净</text><text x="200" y="364" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">客户端仍报 200ms → 问题在网络、连接池、客户端排队</text><text x="200" y="387" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">下一步：CLIENT LIST 看连接数、抓包看 RTT</text><rect x="48" y="402" width="1024" height="54" rx="10" fill="rgba(251,191,36,0.05)" stroke="#fbbf24" stroke-width="1.4"/><rect x="48" y="402" width="130" height="54" rx="10" fill="#fbbf24" opacity="0.10"/><text x="64" y="426" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">周期性卡顿</text><text x="200" y="426" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">慢日志里只有 3ms 的记录，但每隔几分钟卡一下</text><text x="200" y="449" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">答案在 LATENCY：fork（BGSAVE/重写）与 aof-write（fsync）</text><rect x="48" y="464" width="1024" height="54" rx="10" fill="rgba(248,113,113,0.05)" stroke="#f87171" stroke-width="1.4"/><rect x="48" y="464" width="130" height="54" rx="10" fill="#f87171" opacity="0.10"/><text x="64" y="488" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="start" dominant-baseline="middle">要看具体命令</text><text x="200" y="488" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#e8f0ff" text-anchor="start" dominant-baseline="middle">MONITOR 必须限窗口：已定位时段后抓 10–30 秒</text><text x="200" y="511" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">长时间开着等于自造一次故障，还可能泄露敏感参数</text><rect x="48" y="526" width="1024" height="34" rx="10" fill="rgba(56,189,248,0.06)" stroke="#5eead4" stroke-width="1.5"/><text x="64" y="546" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">LATENCY DOCTOR 把事件翻译成人话，是排障最省时间的一条命令</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · SLOWLOG / LATENCY / MONITOR 文档与 redis.conf 参数</text></svg>