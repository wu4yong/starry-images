"825.3" cy="150.4" r="1.21" fill="#cfe4ff" opacity="0.45"/><circle cx="512.6" cy="615.9" r="1.30" fill="#cfe4ff" opacity="0.24"/><circle cx="446.1" cy="11.7" r="0.94" fill="#cfe4ff" opacity="0.52"/><circle cx="184.0" cy="208.1" r="0.61" fill="#cfe4ff" opacity="0.34"/><circle cx="544.1" cy="277.5" r="1.39" fill="#cfe4ff" opacity="0.47"/>
<text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#f1f6ff" text-anchor="start" dominant-baseline="middle">Feed：写扩散还是读扩散</text><text x="48" y="86" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13.5" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">比的是「写的时候多做」和「读的时候多做」谁更贵</text><rect x="48" y="106" width="496" height="174" rx="12" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="1.6"/><text x="64" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="start" dominant-baseline="middle">推模式（写扩散）</text><text x="64" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">发布：给每个粉丝 ZADD inbox:{fan}</text><text x="64" y="190" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">读：ZREVRANGE inbox:{me} 0 19，一次搞定</text><text x="64" y="218" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写：粉丝数 × 1 次写，10 万粉 = 10 万 ZADD</text><text x="64" y="246" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">读极快、写极贵，大 V 在推模式下不可行</text><rect x="576" y="106" width="496" height="174" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.6"/><text x="592" y="132" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">拉模式（读扩散）</text><text x="592" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">发布：只 ZADD outbox:{author} 一条</text><text x="592" y="190" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">读：取关注列表 → 每个作者取最新 N 条</text><text x="592" y="218" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">关注 500 人 = 500 次命令 + 归并排序</text><text x="592" y="246" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">写极便宜、读极贵，关注数一多就顶不住</text><rect x="48" y="294" width="1024" height="90" rx="10" fill="rgba(94,234,212,0.06)" stroke="#5eead4" stroke-width="1.5"/><text x="64" y="314" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="700" fill="#5eead4" text-anchor="start" dominant-baseline="middle">混合：按粉丝规模分流（微博类通行做法）</text><text x="64" y="342" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">粉丝数 &lt; 阈值（如 10 万）→ 逐粉丝 ZADD；超过 → 只写 outbox，由读方合并</text><text x="64" y="370" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">读时：inbox 取 20 条 + 少数大 V 各取 20 条 → 归并、去重、按时间排序</text><rect x="48" y="396" width="330.6666666666667" height="96" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="62" y="418" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">裁剪</text><text x="62" y="442" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">ZREMRANGEBYRANK 0 -1001</text><text x="62" y="464" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">只留最新 1000 条，防内存线性增长</text><rect x="394.6666666666667" y="396" width="330.6666666666667" height="96" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="408.6666666666667" y="418" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">复合 score</text><text x="408.6666666666667" y="442" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">时间戳 × 1000 + 序号</text><text x="408.6666666666667" y="464" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">同毫秒发布也有稳定顺序</text><rect x="741.3333333333334" y="396" width="330.6666666666667" height="96" rx="10" fill="rgba(56,189,248,0.05)" stroke="rgba(148,163,184,0.5)" stroke-width="1.2"/><text x="755.3333333333334" y="418" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start" dominant-baseline="middle">已读另存</text><text x="755.3333333333334" y="442" font-family="'Cascadia Mono','Consolas','JetBrains Mono',monospace" font-size="10.4" font-weight="500" fill="#9fb3d1" text-anchor="start" dominant-baseline="middle">HASH / Set 单独记</text><text x="755.3333333333334" y="464" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="10.4" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">塞进 ZSet 会破坏时间序语义</text><rect x="48" y="504" width="1024" height="52" rx="10" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="1.5"/><text x="64" y="524" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12.2" font-weight="500" fill="#a78bfa" text-anchor="start" dominant-baseline="middle">收件箱只存 contentId 引用：内容被删后读时要容错，深翻历史要回源内容库</text><line x1="48" y1="566" x2="1072" y2="566" stroke="rgba(148,163,184,0.25)" stroke-width="1"/><text x="48" y="590" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" dominant-baseline="middle">官方依据：Redis 7.4 · Sorted sets / ZADD / ZREMRANGEBYRANK / OBJECT ENCODING</text></svg>