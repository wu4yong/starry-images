<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">DEEP AGENTS · 03 TOOLS &amp; MCP</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="124" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">工具四路来源，汇成同一张工具表</text><text x="56" y="158" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">模型的「能做什么」全在这张表里；表越长，选错率越高</text><rect x="56" y="190" width="420" height="82" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="190" width="4" height="82" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="76" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">普通函数</text><text x="76" y="246" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">def search(q: str) -&gt; str</text><rect x="56" y="286" width="420" height="82" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="286" width="4" height="82" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="76" y="316" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">BaseTool</text><text x="76" y="342" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">@tool 装饰过的对象</text><rect x="56" y="382" width="420" height="82" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="382" width="4" height="82" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="76" y="412" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">provider 内置</text><text x="76" y="438" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">{"type": "web_search"}</text><rect x="56" y="478" width="420" height="82" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="478" width="4" height="82" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="76" y="508" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">MCP server</text><text x="76" y="534" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">MCPAdapter.list_tools()</text><path d="M486 384 L516 384 M510 379 L516 384 L510 389" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="530" y="190" width="300" height="372" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="530" y="190" width="4" height="372" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="550" y="220" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="1" xml:space="preserve">TOOLS = [...]</text><text x="550" y="248" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">一张表，四条来源都进这里</text><rect x="550" y="268" width="260" height="32" rx="6" fill="rgba(255,200,97,0.07)" stroke="#ffc861" stroke-opacity="0.28"/><text x="562" y="289" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">search</text><rect x="550" y="312" width="260" height="32" rx="6" fill="rgba(255,200,97,0.07)" stroke="#ffc861" stroke-opacity="0.28"/><text x="562" y="333" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">fetch_page</text><rect x="550" y="356" width="260" height="32" rx="6" fill="rgba(255,200,97,0.07)" stroke="#ffc861" stroke-opacity="0.28"/><text x="562" y="377" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">query_db</text><rect x="550" y="400" width="260" height="32" rx="6" fill="rgba(255,200,97,0.07)" stroke="#ffc861" stroke-opacity="0.28"/><text x="562" y="421" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">read_file</text><rect x="550" y="444" width="260" height="32" rx="6" fill="rgba(255,200,97,0.07)" stroke="#ffc861" stroke-opacity="0.28"/><text x="562" y="465" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">write_file</text><rect x="550" y="488" width="260" height="32" rx="6" fill="rgba(255,200,97,0.07)" stroke="#ffc861" stroke-opacity="0.28"/><text x="562" y="509" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">task</text><text x="550" y="540" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">名字不能和内置工具撞：read_file 就撞了</text><path d="M846 384 L876 384 M870 379 L876 384 L870 389" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="890" y="190" width="334" height="372" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="890" y="190" width="4" height="372" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="910" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">工具表越大越糟</text><text x="910" y="250" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">≤ 8</text><text x="910" y="270" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">单 agent 的手感上限</text><text x="910" y="312" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">按阶段分组</text><text x="910" y="332" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">检索 / 处理 / 交付 分开</text><text x="910" y="374" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">子代理隔离</text><text x="910" y="394" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">只给它需要的 2–3 个</text><text x="910" y="436" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">允许清单</text><text x="910" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">FilesystemMiddleware(tools=)</text><text x="910" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">read_file 必留在白名单，否则创建即报错</text><text x="56" y="596" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">MCP 的连接要在 async with 里，退出即断开；provider 内置搜索不用另装包</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">工具不是越多越好：给模型的每一个工具，都要能说清「什么时候用它」</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">DA 03 / 16</text></svg>