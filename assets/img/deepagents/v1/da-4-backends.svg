ze="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">取决于子后端</text><text x="956" y="372" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">跨线程</text><text x="956" y="394" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">混合</text><text x="956" y="428" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">用途</text><text x="956" y="450" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">/memories 进 store</text><text x="56" y="528" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">同一段 write_file，换后端就换命运</text><rect x="56" y="546" width="700" height="122" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="546" width="4" height="122" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="76" y="574" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">test_backends.py</text><text x="76" y="600" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">agent = create_deep_agent(model=M, backend=StateBackend())</text><text x="76" y="622" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">agent.invoke({"messages": [...]}, {"configurable": {"thread_id": "A"}})</text><text x="76" y="644" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve"># 换 thread B 再读 /workspace/out.md → 文件不存在</text><rect x="786" y="546" width="438" height="122" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="786" y="546" width="4" height="122" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="806" y="574" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">CompositeBackend</text><text x="806" y="600" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">routes={"/memories": StoreBackend(...)}</text><text x="806" y="622" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">其余路径仍走 default（内存）</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">选后端只需要回答一个问题：这份文件要活过这个 thread 吗</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">DA 04 / 16</text></svg>