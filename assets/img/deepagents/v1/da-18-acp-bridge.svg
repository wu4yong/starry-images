<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">DEEP AGENTS · 系统课 · 交付入口</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="120" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">ACP：编辑器与 agent 的三段结构</text><text x="56" y="154" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">JSON-RPC over stdio：编辑器拉起子进程，agent 回事件；审批弹窗走协议自己的权限请求</text><rect x="56" y="196" width="296" height="176" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="196" width="4" height="176" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="78" y="226" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">CLIENT</text><text x="78" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">编辑器 / IDE</text><text x="78" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">· Zed / JetBrains</text><text x="78" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">· VS Code（vscode-acp）</text><text x="78" y="330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">· Neovim 插件 / Toad</text><text x="78" y="356" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">提供 cwd、打开的文件与选区</text><rect x="640" y="196" width="272" height="176" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="640" y="196" width="4" height="176" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="662" y="226" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">SERVER</text><text x="662" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">AgentServerACP</text><text x="662" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">· run_agent(server) → stdio</text><text x="662" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">· session/new → sessionId</text><text x="662" y="330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">· prompt → astream(subgraphs)</text><text x="662" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">· __interrupt__ → 权限弹窗</text><rect x="1004" y="196" width="220" height="176" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="1004" y="196" width="4" height="176" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="1026" y="226" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">AGENT</text><text x="1026" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">deep agent</text><text x="1026" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">· LangGraph 图</text><text x="1026" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">· checkpointer 必备</text><text x="1026" y="330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">· cwd 钉后端根</text><text x="1026" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">· interrupt_on 审批</text><rect x="376" y="240" width="248" height="56" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="500" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#4a9dff" font-weight="700" text-anchor="middle" letter-spacing="0" xml:space="preserve">JSON-RPC 2.0 · stdio</text><text x="500" y="284" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">行分隔 · 子进程生命周期</text><path d="M354 268 L374 268 M368 263 L374 268 L368 273" stroke="#8ba3c7" stroke-width="2" fill="none" /><path d="M626 268 L638 268 M632 263 L638 268 L632 273" stroke="#8ba3c7" stroke-width="2" fill="none" /><text x="500" y="322" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#8ba3c7" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">↑ session/update    ↓ request_permission</text><text x="56" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">一条 prompt 的四次翻译</text><rect x="56" y="448" width="280" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="448" width="4" height="96" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="72" y="474" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">messages</text><text x="72" y="500" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">→ agent_message_chunk</text><text x="72" y="524" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">气泡 / 思考块</text><rect x="352" y="448" width="280" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="352" y="448" width="4" height="96" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="368" y="474" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">tool_call_chunks</text><text x="368" y="500" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">→ tool_call + update</text><text x="368" y="524" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">工具卡片与状态</text><rect x="648" y="448" width="280" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="648" y="448" width="4" height="96" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="664" y="474" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">write_todos</text><text x="664" y="500" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">→ plan</text><text x="664" y="524" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">计划面板</text><rect x="944" y="448" width="280" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="944" y="448" width="4" height="96" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="960" y="474" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">__interrupt__</text><text x="960" y="500" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">→ request_permission</text><text x="960" y="524" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">审批弹窗</text><text x="56" y="592" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">协议限制：只支持固定决策（approve / reject / 会话内 always）；自由格式 interrupt() 会被 -32600 拒掉</text><text x="56" y="616" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">握手实测：initialize → protocolVersion 1、loadSession false、promptCapabilities.image true</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">换壳不改能力：审批仍在 interrupt_on，编辑器只负责把它画成弹窗</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">DA 18 / 18</text></svg>