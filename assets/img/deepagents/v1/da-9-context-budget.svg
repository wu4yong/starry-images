<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">DEEP AGENTS · 系统课 · M2</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="124" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">上下文预算：先卸载，再压缩，最后才是摘要</text><text x="56" y="158" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">20k token 的工具结果先落盘 → 到 85% 窗口才摘要 → 原文另存文件</text><rect x="56" y="200" width="1168" height="70" rx="10" fill="rgba(14,24,44,0.92)" stroke="rgba(120,170,255,0.22)"/><rect x="56" y="200" width="260" height="70" fill="#3ddcff" fill-opacity="0.18"/><text x="68" y="230" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">系统提示 + 记忆</text><text x="68" y="254" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">22%</text><rect x="316" y="200" width="160" height="70" fill="#3ee6a2" fill-opacity="0.18"/><text x="328" y="230" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">技能元数据</text><text x="328" y="254" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">14%</text><rect x="476" y="200" width="380" height="70" fill="#4a9dff" fill-opacity="0.18"/><text x="488" y="230" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">对话消息</text><text x="488" y="254" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">33%</text><rect x="856" y="200" width="368" height="70" fill="#ffc861" fill-opacity="0.18"/><text x="868" y="230" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">工具结果</text><text x="868" y="254" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">32%</text><text x="1216" y="292" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">窗口上限 100%</text><rect x="56" y="316" width="560" height="250" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="316" width="4" height="250" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="78" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">卸载 Offloading（默认 20,000 token）</text><text x="78" y="380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">① 结果超 20k → 写后端，回「路径 + 前 10 行预览」</text><text x="78" y="408" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">② 上下文过 85% → 旧的 write/edit 调用截成指针</text><text x="78" y="436" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">③ 模型需要细节时自己 read_file / grep 续读</text><text x="78" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">write_file 的全文本来就在磁盘上，</text><text x="78" y="498" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">留在历史里是纯冗余 —— 所以先截它</text><text x="78" y="540" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">阈值：tool_token_limit_before_evict=20000</text><rect x="640" y="316" width="584" height="250" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="640" y="316" width="4" height="250" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="662" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">摘要 Summarization（85% 触发）</text><text x="662" y="380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">① 生成结构化摘要：意图 / 结论 / 产物 / 下一步</text><text x="662" y="408" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">② 摘要以 HumanMessage 进上下文（带 notification）</text><text x="662" y="436" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">③ 原文另存文件，可 grep 找回细节</text><text x="662" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">保留最近 10% token；模型 profile 缺失时</text><text x="662" y="498" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">退回 170k 触发 / 保留 6 条消息</text><text x="662" y="540" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">工具：compact_conversation（可选开）</text><rect x="56" y="590" width="560" height="52" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="336" y="621" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">压缩改的是发给模型的请求，不是持久化的 state</text><rect x="640" y="590" width="584" height="52" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ee6a2" stroke-opacity="0.6" stroke-width="1.3"/><text x="932" y="621" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">还嫌大：excluded_tools 收工具面 / 子代理隔离</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">省上下文的顺序：落盘 &gt; 摘要 &gt; 截短；先做前面两步，摘要才是兜底</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">DA 09 / 16</text></svg>