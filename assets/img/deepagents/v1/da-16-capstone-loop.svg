<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">实战：给 LG16 工单 Agent 逐层加装</text><text x="56" y="140" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">底座不变，六层能力按「先能跑、再能管、最后能观测」的顺序往上贴</text><rect x="56" y="176" width="250" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#8ba3c7" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="176" width="4" height="300" rx="2" fill="#8ba3c7" fill-opacity="0.85"/><text x="76" y="208" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">LG16 原图</text><text x="76" y="236" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">classify → investigate</text><text x="76" y="258" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">→ approve → execute</text><text x="76" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">状态字段：</text><text x="76" y="322" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">ticket_id / risk / steps</text><text x="76" y="364" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">这一步不改：</text><text x="76" y="386" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">业务规则与工具都留用</text><text x="76" y="424" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">只把「编排」交给 harness</text><rect x="346" y="176" width="470" height="50" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6"/><text x="362" y="198" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">① write_todos</text><text x="362" y="218" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">流程可见、漏步可查</text><rect x="346" y="238" width="470" height="50" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ee6a2" stroke-opacity="0.6"/><text x="362" y="260" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">② 子代理：查单员</text><text x="362" y="280" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">只给查询工具，隔离上下文</text><rect x="346" y="300" width="470" height="50" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ee6a2" stroke-opacity="0.6"/><text x="362" y="322" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">③ 子代理：回复员</text><text x="362" y="342" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">只给读写与话术，不碰账号</text><rect x="346" y="362" width="470" height="50" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ffc861" stroke-opacity="0.6"/><text x="362" y="384" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#ffc861" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">④ skill：回复口径</text><text x="362" y="404" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">按需加载，不进系统提示</text><rect x="346" y="424" width="470" height="50" rx="9" fill="rgba(18,30,54,0.95)" stroke="#b388ff" stroke-opacity="0.6"/><text x="362" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#b388ff" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">⑤ AGENTS.md 记忆</text><text x="362" y="466" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">客户偏好跨会话保留</text><rect x="346" y="486" width="470" height="50" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ff6b8a" stroke-opacity="0.6"/><text x="362" y="508" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#ff6b8a" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">⑥ interrupt_on 关单</text><text x="362" y="528" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">不可逆动作必须人点头</text><path d="M824 356 L858 356" stroke="#3ddcff" stroke-width="2.4"/><path d="M852 350 L860 356 L852 362" stroke="#3ddcff" stroke-width="2.4" fill="none"/><rect x="868" y="176" width="356" height="190" 