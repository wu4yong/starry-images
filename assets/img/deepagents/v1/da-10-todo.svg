<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">DEEP AGENTS · 系统课 · M3</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="124" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">任务规划：write_todos 是账本，不是答案</text><text x="56" y="158" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">0.7 起要显式开 TodoListMiddleware；模型自己决定要不要建清单</text><rect x="56" y="200" width="280" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#8ba3c7" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="200" width="4" height="118" rx="2" fill="#8ba3c7" fill-opacity="0.85"/><text x="76" y="236" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#8ba3c7" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">pending</text><text x="76" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">还没开始</text><path d="M342 259 L352 259 M346 254 L352 259 L346 264" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="356" y="200" width="280" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="356" y="200" width="4" height="118" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="376" y="236" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">in_progress</text><text x="376" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">正在做（可多个并行）</text><path d="M642 259 L652 259 M646 254 L652 259 L646 264" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="656" y="200" width="280" height="118" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="656" y="200" width="4" height="118" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="676" y="236" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">completed</text><text x="676" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">真正做完才标</text><rect x="56" y="344" width="700" height="250" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="344" width="4" height="250" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="78" y="376" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">官方写进工具描述的四条硬规矩</text><text x="78" y="410" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">1. 开工前把第一个任务标 in_progress</text><text x="78" y="440" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">2. 没全部完成时，永远至少留一个 in_progress</text><text x="78" y="470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">3. 有错误 / 阻塞就保持 in_progress，另建一条「解决什么」</text><text x="78" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">4. 只对 3 步以上的任务用；寒暄与一问一答不要用</text><text x="78" y="548" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">不是全部任务都标 completed 就能交差：</text><text x="78" y="572" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">答案必须是 final write_todos 之后的一条正文消息</text><rect x="792" y="344" width="432" height="250" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="792" y="344" width="4" height="250" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="812" y="376" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">打开方式</text><text x="812" y="412" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">from langchain.agents.middleware</text><text x="812" y="434" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">    import TodoListMiddleware</text><text x="812" y="456" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve"></text><text x="812" y="478" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">create_deep_agent(</text><text x="812" y="500" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">    model=...,</text><text x="812" y="522" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">    middleware=[TodoListMiddleware()],</text><text x="812" y="544" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">)</text><text x="812" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">自带 write_todos；system_prompt 可覆盖</text><rect x="56" y="616" width="1168" height="44" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="616" width="4" height="44" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="78" y="643" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">清单存在 state 里，换线程就丢；要跨轮保留 → 配 checkpointer</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">先把「要做几步」写下来，再谈做得快不快</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">DA 10 / 16</text></svg>