<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="124" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">三层关系：框架 → 运行时 → harness</text><text x="56" y="158" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">harness 不替你做推理，它把「长任务需要的五件事」提前装好</text><rect x="56" y="186" width="1168" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="186" width="4" height="96" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="220" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">HARNESS</text><text x="80" y="250" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">deepagents</text><text x="250" y="224" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">这一讲的主角：一个 loop 之上多出五件能力</text><rect x="636" y="220" width="68.64" height="25" rx="12.5" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="647" y="234" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">任务规划</text><rect x="716.64" y="220" width="91.96000000000001" height="25" rx="12.5" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="727.64" y="234" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">虚拟文件系统</text><rect x="820.6" y="220" width="56.980000000000004" height="25" rx="12.5" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="831.6" y="234" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">子代理</text><rect x="889.58" y="220" width="196.9" height="25" rx="12.5" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="900.58" y="234" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">Skills / Memory</text><rect x="1098.48" y="220" width="68.64" height="25" rx="12.5" fill="#3ddcff" fill-opacity="0.13" stroke="#3ddcff" stroke-opacity="0.45"/><text x="1109.48" y="234" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">人工审批</text><rect x="56" y="306" width="1168" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="306" width="4" height="96" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="80" y="340" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">RUNTIME</text><text x="80" y="370" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">langgraph</text><text x="250" y="344" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">底下的执行器：状态、断点、恢复、流式都在这层</text><rect x="636" y="340" width="68.64" height="25" rx="12.5" fill="#4a9dff" fill-opacity="0.13" stroke="#4a9dff" stroke-opacity="0.45"/><text x="647" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">图与状态</text><rect x="716.64" y="340" width="161.92000000000002" height="25" rx="12.5" fill="#4a9dff" fill-opacity="0.13" stroke="#4a9dff" stroke-opacity="0.45"/><text x="727.64" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">checkpointer</text><rect x="890.56" y="340" width="126.94" height="25" rx="12.5" fill="#4a9dff" fill-opacity="0.13" stroke="#4a9dff" stroke-opacity="0.45"/><text x="901.56" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">interrupt</text><rect x="1029.5" y="340" width="56.980000000000004" height="25" rx="12.5" fill="#4a9dff" fill-opacity="0.13" stroke="#4a9dff" stroke-opacity="0.45"/><text x="1040.5" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">事件流</text><rect x="1098.48" y="340" width="80.3" height="25" rx="12.5" fill="#4a9dff" fill-opacity="0.13" stroke="#4a9dff" stroke-opacity="0.45"/><text x="1109.48" y="354" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">store</text><rect x="56" y="426" width="1168" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="426" width="4" height="96" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="80" y="460" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">FRAMEWORK</text><text x="80" y="490" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">langchain</text><text x="250" y="464" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">零件层：消息、工具协议、中间件、单 agent</text><rect x="636" y="460" width="45.32" height="25" rx="12.5" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="647" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">消息</text><rect x="693.32" y="460" width="68.64" height="25" rx="12.5" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="704.32" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">工具协议</text><rect x="773.96" y="460" width="138.6" height="25" rx="12.5" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="784.96" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">middleware</text><rect x="924.5600000000001" y="460" width="161.92000000000002" height="25" rx="12.5" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="935.5600000000001" y="474" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">create_agent</text><text x="56" y="566" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">三选一：别用 harness 解决一句话就能解决的问题</text><rect x="56" y="584" width="376" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="584" width="4" height="92" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="74" y="612" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">create_agent</text><text x="74" y="638" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">单 agent、工具少、一轮就完</text><rect x="452" y="584" width="376" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="452" y="584" width="4" height="92" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="470" y="612" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">LangGraph 自绘图</text><text x="470" y="638" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">流程固定、要精确控制分支与重试</text><rect x="848" y="584" width="376" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="848" y="584" width="4" height="92" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="866" y="612" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">create_deep_agent</text><text x="866" y="638" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">步数不定、要读写文件、要拆活</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">harness 是你的同事，不是你的替代品：它负责「跑得长」，你负责「跑得对」</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">DA 01 / 16</text></svg>