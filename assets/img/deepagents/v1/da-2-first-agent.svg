<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="124" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">第一条：一条请求穿过整个 harness</text><text x="56" y="158" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">模型决定下一步，文件系统负责「记住」，子代理负责「分担」</text><rect x="56" y="190" width="200" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="190" width="4" height="96" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="72" y="226" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">你的脚本</text><text x="72" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">invoke / stream</text><path d="M260 238 L284 238 M278 233 L284 238 L278 243" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="288" y="190" width="200" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="288" y="190" width="4" height="96" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="304" y="226" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">create_deep_agent</text><text x="304" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">model + tools</text><path d="M492 238 L516 238 M510 233 L516 238 L510 243" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="520" y="190" width="200" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="520" y="190" width="4" height="96" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="536" y="226" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">model 循环</text><text x="536" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">tool calling</text><path d="M724 238 L748 238 M742 233 L748 238 L742 243" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="752" y="190" width="200" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="752" y="190" width="4" height="96" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="768" y="226" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">6 个文件工具</text><text x="768" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">ls / read / write …</text><path d="M956 238 L980 238 M974 233 L980 238 L974 243" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="984" y="190" width="200" height="96" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="984" y="190" width="4" height="96" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="1000" y="226" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">task 工具</text><text x="1000" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">派给子代理</text><text x="56" y="336" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">结果回到脚本：消息、文件、trace 三处都能看</text><rect x="56" y="356" width="560" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="356" width="4" height="300" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="76" y="384" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">hello_da.py</text><text x="76" y="418" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">from deepagents import create_deep_agent</text><text x="76" y="462" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">agent = create_deep_agent(</text><text x="76" y="484" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">    model="openai:gpt-6.1-sol",</text><text x="76" y="506" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">    tools=[search],</text><text x="76" y="528" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">    system_prompt="你是研究员，长材料先落盘",</text><text x="76" y="550" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">)</text><text x="76" y="594" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">out = agent.invoke({"messages": [{"role": "user",</text><text x="76" y="616" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">    "content": "把三份 md 合成一份摘要"}]})</text><rect x="644" y="356" width="580" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="644" y="356" width="4" height="300" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="664" y="384" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="1" xml:space="preserve">跑完先看三处</text><text x="664" y="426" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">回复</text><text x="712" y="426" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">它说了什么</text><rect x="664" y="436" width="536" height="26" rx="6" fill="rgba(46,90,150,0.16)"/><text x="676" y="454" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">out["messages"][-1].content</text><text x="664" y="502" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">文件</text><text x="712" y="502" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">它把什么落了盘</text><rect x="664" y="512" width="536" height="26" rx="6" fill="rgba(46,90,150,0.16)"/><text x="676" y="530" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">ls / read_file 的结果</text><text x="664" y="578" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">链路</text><text x="712" y="578" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">每一步谁调了谁</text><rect x="664" y="588" width="536" height="26" rx="6" fill="rgba(46,90,150,0.16)"/><text x="676" y="606" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">LangSmith 里的 trace</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">先看 trace 再改 prompt：链路不对，改 prompt 只是让错得更顺</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">DA 02 / 16</text></svg>