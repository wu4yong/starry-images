<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">DEEP AGENTS · 系统课 · M3</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="124" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">异步子代理：启动就返回，主代理继续聊</text><text x="56" y="158" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">跑在 Agent Protocol 服务器上的独立线程；五个工具管生命周期</text><text x="56" y="200" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">SUPERVISOR 线程</text><line x1="56" y1="230" x2="720" y2="230" stroke="rgba(120,170,255,0.22)"/><rect x="56" y="250" width="640" height="58" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="250" width="4" height="58" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="76" y="276" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">start_async_task</text><text x="76" y="296" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">立刻拿 task_id</text><rect x="56" y="320" width="640" height="58" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="320" width="4" height="58" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="76" y="346" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">继续和用户聊</text><text x="76" y="366" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">不阻塞</text><rect x="56" y="390" width="640" height="58" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="390" width="4" height="58" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="76" y="416" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">notification</text><text x="76" y="436" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">完成 / 失败 / 要输入</text><rect x="56" y="460" width="640" height="58" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="460" width="4" height="58" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="76" y="486" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#b388ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">check / update / cancel / list</text><text x="76" y="506" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">按需看进度或改指令</text><rect x="748" y="200" width="476" height="318" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="748" y="200" width="4" height="318" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="768" y="232" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">子代理线程（服务端独立 run）</text><text x="768" y="262" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">AsyncSubAgent(name, description,</text><text x="768" y="284" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">              graph_id, url?, headers?)</text><text x="768" y="314" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">url 省略 = ASGI 进程内；给定 = HTTP 远程</text><text x="768" y="344" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">每个任务 = 一个 thread，可续可停</text><text x="768" y="378" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">五个工具</text><text x="768" y="402" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">start / check / update / cancel / list</text><text x="768" y="434" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">状态：pending · running · waiting</text><text x="768" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">success · error · timeout · cancelled</text><text x="768" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">task_id 存 async_tasks 独立通道，</text><text x="768" y="506" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">摘要压缩后仍能 list 回来</text><rect x="56" y="540" width="1168" height="112" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="540" width="4" height="112" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="78" y="570" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">两个上线前必须知道的事</text><text x="78" y="598" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">① 每个活跃 run 占一个 worker slot：1 主管 + 3 异步 = 4 槽，不足就排队（--n-jobs-per-worker）</text><text x="78" y="624" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">② 启动后别立刻 check：Agent Server 会自动通知；轮询会把异步变回同步</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">异步解决「等」，不解决「乱」：任务状态要有单独通道</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">DA 12 / 16</text></svg>