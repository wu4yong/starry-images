<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">DEEP AGENTS · 系统课 · M3</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="124" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">子代理：把重活挪到另一个上下文里</text><text x="56" y="158" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">主代理只留 task 工具与结果；子代理的中间调用不回流主上下文</text><rect x="56" y="196" width="380" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="196" width="4" height="300" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="78" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">主代理</text><text x="78" y="260" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">tools: [交付工具…]</text><text x="78" y="284" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">+ 8 内置 + task</text><rect x="78" y="316" width="330" height="50" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="243" y="346" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">task(subagent_type, description)</text><text x="78" y="398" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">只回一份报告</text><text x="78" y="424" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">中间 20 次工具调用</text><text x="78" y="448" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">留在子代理自己的上下文</text><text x="78" y="480" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">报告不进用户视野，主代理要转述</text><path d="M440 240 L480 240 M474 235 L480 240 L474 245" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="486" y="196" width="300" height="68" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="486" y="196" width="4" height="68" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="504" y="224" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">researcher</text><text x="504" y="246" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">检索 + 抓页，落盘 /notes</text><path d="M440 312 L480 312 M474 307 L480 312 L474 317" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="486" y="268" width="300" height="68" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="486" y="268" width="4" height="68" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="504" y="296" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">coder</text><text x="504" y="318" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">改代码 + 跑测试</text><path d="M440 384 L480 384 M474 379 L480 384 L474 389" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="486" y="340" width="300" height="68" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="486" y="340" width="4" height="68" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="504" y="368" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">reviewer</text><text x="504" y="390" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">只读审查，permissions 全禁写</text><rect x="486" y="412" width="300" height="84" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="486" y="412" width="4" height="84" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="504" y="440" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#4a9dff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">general-purpose</text><text x="504" y="462" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">永远存在：同工具同模型，</text><text x="504" y="482" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">同名子代理可整体替换它</text><rect x="818" y="196" width="406" height="300" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="818" y="196" width="4" height="300" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="838" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">isolated vs fork</text><text x="838" y="258" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">isolated（默认）</text><text x="838" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">只看到你写的那段任务描述</text><text x="838" y="306" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">不继承主代理的对话与中间件</text><text x="838" y="340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">fork（0.7.13+，beta）</text><text x="838" y="364" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">继承父对话历史 + 系统提示</text><text x="838" y="388" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">指令随任务消息追加，保缓存前缀</text><text x="838" y="412" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">fork 不能再调 task；不许传 skills</text><text x="838" y="452" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">选型：新活 → isolated</text><text x="838" y="476" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">接着干父代理已查清的事 → fork</text><rect x="56" y="528" width="1168" height="124" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="528" width="4" height="124" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="78" y="558" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">SubAgent 的字段（官方）</text><text x="78" y="586" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">必填：name / description / system_prompt（isolated）    选填：tools / model / middleware / interrupt_on / skills / permissions / response_format</text><text x="78" y="614" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">tools 一旦指定就是整体替换，不是追加；skills 不继承（只有 general-purpose 继承主代理技能）</text><text x="78" y="638" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">description 写成「什么时候交给它」，模型靠这句话决定要不要委派</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">子代理不是为了并行，是为了让主上下文只装结论</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">DA 11 / 16</text></svg>