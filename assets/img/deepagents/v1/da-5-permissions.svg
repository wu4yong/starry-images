<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#111c38"/></linearGradient>
<radialGradient id="glow" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="rgba(61,220,255,0.18)"/><stop offset="1" stop-color="rgba(61,220,255,0)"/></radialGradient>
<radialGradient id="glow2" cx="92%" cy="88%" r="60%"><stop offset="0" stop-color="rgba(179,136,255,0.14)"/><stop offset="1" stop-color="rgba(179,136,255,0)"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40V40" fill="none" stroke="rgba(90,140,220,0.10)" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/><rect width="1280" height="720" fill="url(#grid)"/>
<rect width="1280" height="720" fill="url(#glow)"/><rect width="1280" height="720" fill="url(#glow2)"/>
<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">DEEP AGENTS · 05 PERMISSIONS</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="124" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">权限是规则表，不是开关</text><text x="56" y="158" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">按声明顺序 first-match-wins；一条都不命中就放行</text><rect x="56" y="190" width="470" height="372" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="190" width="4" height="372" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="76" y="220" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">PERMISSIONS</text><text x="76" y="248" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">三条典型规则</text><rect x="76" y="274" width="430" height="52" rx="8" fill="rgba(255,200,97,0.06)" stroke="#ffc861" stroke-opacity="0.28"/><text x="90" y="294" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">1</text><text x="90" y="316" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">allow  read/write  /workspace/**</text><rect x="76" y="342" width="430" height="52" rx="8" fill="rgba(255,200,97,0.06)" stroke="#ffc861" stroke-opacity="0.28"/><text x="90" y="362" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">2</text><text x="90" y="384" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">deny   read        **/.env</text><rect x="76" y="410" width="430" height="52" rx="8" fill="rgba(255,200,97,0.06)" stroke="#ffc861" stroke-opacity="0.28"/><text x="90" y="430" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">3</text><text x="90" y="452" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">deny   write       /etc/**</text><text x="76" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">mode 还有第三种：interrupt（命中即停下来等人</text><text x="76" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">声明顺序就是优先级，宽规则放前面会把窄规则吃掉</text><path d="M542 376 L570 376 M564 371 L570 376 L564 381" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="586" y="190" width="300" height="372" rx="12" fill="rgba(14,24,44,0.92)" stroke="#4a9dff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="586" y="190" width="4" height="372" rx="2" fill="#4a9dff" fill-opacity="0.85"/><text x="606" y="220" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#4a9dff" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">JUDGE</text><text x="606" y="250" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">逐条比对路径 → 第一条命中即定</text><rect x="606" y="286" width="260" height="46" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="620" y="314" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">operations 是否包含本次动作</text><rect x="606" y="352" width="260" height="46" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="620" y="380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">paths 的 glob 是否匹配</text><rect x="606" y="418" width="260" height="46" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="620" y="446" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">命中 → 用这条的 mode</text><rect x="606" y="484" width="260" height="46" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="620" y="512" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">无命中 → 放行</text><text x="606" y="552" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">判定发生在工具调用前，模型看不到被拒的过程</text><path d="M902 376 L930 376 M924 371 L930 376 L924 381" stroke="#8ba3c7" stroke-width="2" fill="none" /><rect x="946" y="190" width="278" height="372" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="946" y="190" width="4" height="372" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="966" y="220" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">四个动作</text><text x="966" y="252" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">读 /workspace/a.md</text><rect x="966" y="264" width="80.3" height="25" rx="12.5" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="977" y="278" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">allow</text><text x="966" y="326" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">读 .env</text><rect x="966" y="338" width="68.64" height="25" rx="12.5" fill="#ff6b8a" fill-opacity="0.13" stroke="#ff6b8a" stroke-opacity="0.45"/><text x="977" y="352" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">deny</text><text x="966" y="400" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">写 /etc/x</text><rect x="966" y="412" width="68.64" height="25" rx="12.5" fill="#ff6b8a" fill-opacity="0.13" stroke="#ff6b8a" stroke-opacity="0.45"/><text x="977" y="426" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">deny</text><text x="966" y="474" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">写 /workspace/out</text><rect x="966" y="486" width="80.3" height="25" rx="12.5" fill="#3ee6a2" fill-opacity="0.13" stroke="#3ee6a2" stroke-opacity="0.45"/><text x="977" y="500" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">allow</text><text x="56" y="596" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">最容易被忽略的一句：permissions 不管沙箱里的 execute —— 开了沙箱，cat .env 照样能读</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">只拦内置文件工具；要拦命令，只能靠沙箱本身的隔离</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">DA 05 / 16</text></svg>