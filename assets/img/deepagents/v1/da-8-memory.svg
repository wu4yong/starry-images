<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="124" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">记忆：启动就进系统提示的那部分</text><text x="56" y="158" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">AGENTS.md 走 &lt;agent_memory&gt; 注入；技能按需读，记忆每次都在</text><rect x="56" y="196" width="560" height="310" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="196" width="4" height="310" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="78" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">注入形态（实测）</text><text x="78" y="262" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">&lt;agent_memory&gt;</text><text x="78" y="286" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">/memories/AGENTS.md</text><text x="78" y="310" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve"></text><text x="78" y="334" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">## 团队约定</text><text x="78" y="358" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">- 交付前先跑测试</text><text x="78" y="382" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">- 回复用中文</text><text x="78" y="406" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">&lt;/agent_memory&gt;</text><text x="78" y="430" font-family="Consolas,'Courier New',monospace" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">&lt;memory_guidelines&gt; … 何时该 edit_file 更新 …</text><rect x="640" y="196" width="584" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="640" y="196" width="4" height="92" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="660" y="226" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">agent 级</text><text x="660" y="252" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ee6a2" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">(assistant_id,)</text><text x="660" y="274" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">所有用户共享一个「人格」</text><rect x="640" y="304" width="584" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="640" y="304" width="4" height="92" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="660" y="334" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">user 级</text><text x="660" y="360" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#3ddcff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">(user_id,)</text><text x="660" y="382" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">每个用户一份，互不串味</text><rect x="640" y="412" width="584" height="92" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="640" y="412" width="4" height="92" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="660" y="442" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">org 级</text><text x="660" y="468" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#ffc861" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">(org_id,)</text><text x="660" y="490" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">政策 / 合规，通常只读</text><rect x="56" y="532" width="1168" height="128" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="532" width="4" height="128" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="78" y="562" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">三件常被混起来的事</text><text x="78" y="592" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">技能 = 按需读的流程（省上下文）    ·    记忆 = 启动就加载的事实（常相关）    ·    工具 = 每轮都能调的动作</text><text x="78" y="620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ff6b8a" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">共享记忆可被写 = 提示注入入口；政策类走权限 deny 写，或只由应用代码写入</text><text x="78" y="644" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">并发写同一文件 = 后写覆盖；按主题拆文件，或用后台整合串行化</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">该常驻的进记忆，该按需的进技能，别把两样都塞进提示词</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">DA 08 / 16</text></svg>