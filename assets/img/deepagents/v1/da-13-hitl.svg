<text x="56" y="52" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ba3c7" letter-spacing="2">DEEP AGENTS · 系统课</text>
<line x1="56" y1="66" x2="1224" y2="66" stroke="rgba(120,170,255,0.22)" stroke-width="1"/><text x="56" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#e8f1ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">审批：在工具真正执行之前插一道门</text><text x="56" y="140" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">interrupt_on 把「模型想做的动作」变成「等人点头的动作」；四种决策，一条恢复路径</text><rect x="56" y="164" width="300" height="468" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ddcff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="56" y="164" width="4" height="468" rx="2" fill="#3ddcff" fill-opacity="0.85"/><text x="80" y="196" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ddcff" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">一次被拦下的调用</text><rect x="76" y="214" width="260" height="66" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="92" y="241" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">1  模型提出调用</text><text x="92" y="264" font-family="Consolas,'Courier New',monospace" font-size="9.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">write_file(path, content)</text><rect x="76" y="298" width="260" height="66" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="92" y="325" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">2  中间件拦截</text><text x="92" y="348" font-family="Consolas,'Courier New',monospace" font-size="9.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">HumanInTheLoopMiddleware</text><rect x="76" y="382" width="260" height="66" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="92" y="409" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">3  返回中断载荷</text><text x="92" y="432" font-family="Consolas,'Courier New',monospace" font-size="9.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">__interrupt__[0].value</text><rect x="76" y="466" width="260" height="66" rx="9" fill="rgba(18,30,54,0.95)" stroke="#ffc861" stroke-opacity="0.6" stroke-width="1.3"/><text x="92" y="493" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">4  前端等人决策</text><text x="92" y="516" font-family="Consolas,'Courier New',monospace" font-size="9.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">approve / edit / reject</text><rect x="76" y="550" width="260" height="66" rx="9" fill="rgba(18,30,54,0.95)" stroke="#4a9dff" stroke-opacity="0.6" stroke-width="1.3"/><text x="92" y="577" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">5  恢复执行</text><text x="92" y="600" font-family="Consolas,'Courier New',monospace" font-size="9.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">Command(resume=…)</text><text x="386" y="196" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3ee6a2" font-weight="600" text-anchor="start" letter-spacing="0" xml:space="preserve">四种决策（默认全开）</text><rect x="386" y="214" width="404" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#3ee6a2" stroke-width="1.4" stroke-opacity="0.55"/><rect x="386" y="214" width="4" height="156" rx="2" fill="#3ee6a2" fill-opacity="0.85"/><text x="406" y="248" font-family="Consolas,'Courier New',monospace" font-size="20" fill="#3ee6a2" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">approve</text><text x="406" y="276" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">原样执行</text><text x="406" y="310" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">结果长这样：</text><text x="406" y="336" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">ToolMessage: Updated file …</text><rect x="810" y="214" width="404" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ffc861" stroke-width="1.4" stroke-opacity="0.55"/><rect x="810" y="214" width="4" height="156" rx="2" fill="#ffc861" fill-opacity="0.85"/><text x="830" y="248" font-family="Consolas,'Courier New',monospace" font-size="20" fill="#ffc861" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">edit</text><text x="830" y="276" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">改参数再执行</text><text x="830" y="310" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">结果长这样：</text><text x="830" y="336" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">edited_action{name,args} 必填</text><rect x="386" y="390" width="404" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="386" y="390" width="4" height="156" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="406" y="424" font-family="Consolas,'Courier New',monospace" font-size="20" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">reject</text><text x="406" y="452" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">跳过并回话</text><text x="406" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">结果长这样：</text><text x="406" y="512" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">User rejected … (带 reason)</text><rect x="810" y="390" width="404" height="156" rx="12" fill="rgba(14,24,44,0.92)" stroke="#b388ff" stroke-width="1.4" stroke-opacity="0.55"/><rect x="810" y="390" width="4" height="156" rx="2" fill="#b388ff" fill-opacity="0.85"/><text x="830" y="424" font-family="Consolas,'Courier New',monospace" font-size="20" fill="#b388ff" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">respond</text><text x="830" y="452" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">人直接当工具回答</text><text x="830" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">结果长这样：</text><text x="830" y="512" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">内容即工具结果，不执行</text><rect x="386" y="586" width="828" height="62" rx="12" fill="rgba(14,24,44,0.92)" stroke="#ff6b8a" stroke-width="1.4" stroke-opacity="0.55"/><rect x="386" y="586" width="4" height="62" rx="2" fill="#ff6b8a" fill-opacity="0.85"/><text x="404" y="614" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ff6b8a" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">两条硬要求</text><text x="404" y="636" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#e8f1ff" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">checkpointer 必须由你传入（checkpointer=True 对根图无效）；resume 必须用同一个 thread_id</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">被拦的是工具调用，不是整轮对话｜依据官方 human-in-the-loop 页自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">deepagents 0.7.42</text></svg>