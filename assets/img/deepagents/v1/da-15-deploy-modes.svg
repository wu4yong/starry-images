">Managed 目前在 LangSmith Cloud 与 BYOC 上公测；BYOC 需 CLI / SDK v0.10+。上线前先跑通本地 mda dev，再用 mda deploy。</text><line x1="56" y1="674" x2="1224" y2="674" stroke="rgba(120,170,255,0.22)"/><text x="56" y="698" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">换跑法不换 harness：同一份 agent 定义，差别只在「谁提供运行时」｜依据官方 going-to-production / managed quickstart 自绘</text><text x="1224" y="698" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ba3c7" font-weight="400" text-anchor="end" letter-spacing="0" xml:space="preserve">deepagents 0.7.42</text></svg>