)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="585" y="389" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">你配 Postgres / SQLite</text><rect x="806" y="358" width="398" height="52" rx="9" fill="rgba(18,30,54,0.95)" stroke="#b388ff" stroke-opacity="0.6" stroke-width="1.3"/><text x="1005" y="389" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">平台自带 threads + runs</text><rect x="56" y="424" width="300" height="52" rx="8" fill="rgba(18,30,54,0.9)" stroke="rgba(120,170,255,0.22)"/><text x="72" y="456" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">执行环境</text><rect x="386" y="424" width="398" height="52" rx="9" fill="rgba(18,30,54,0.95)" stroke="#3ddcff" stroke-opacity="0.6" stroke-width="1.3"/><text x="585" y="455" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">FilesystemBackend 禁用，换沙箱</text><rect x="806" y="424" width="398" height="52" rx="9" fill="rgba(18,30,54,0.95)" stroke="#b388ff" stroke-opacity="0.6" stroke-width="1.3"/><text x="1005" y="455" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#e8f1ff" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">沙箱 + store 由平台供给</text><rect x="56" y="490" width="300" height="52" rx="8" fill="rgba(18,30,54,0.9)" stroke="rgba(120,170,255,0.22)"/><text x="72" y="522" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#8ba3c7" font-weight="400" text-anchor="start" letter-spacing="0" xml:space=